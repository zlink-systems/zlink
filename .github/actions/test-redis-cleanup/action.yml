name: Collect test Redis diagnostics and stop Redis
description: Uploads Redis diagnostics on job failure and removes the test container.
inputs:
  job-status:
    description: Current job status
    required: true
runs:
  using: composite
  steps:
    - name: Collect Redis diagnostics
      if: inputs.job-status == 'failure'
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/redis-diagnostics/${ZLINK_TEST_REDIS_CONTAINER}"
        dir="${RUNNER_TEMP}/redis-diagnostics/${ZLINK_TEST_REDIS_CONTAINER}"
        docker logs "${ZLINK_TEST_REDIS_CONTAINER}" > "${dir}/docker-logs.txt" 2>&1 || true
        docker inspect "${ZLINK_TEST_REDIS_CONTAINER}" > "${dir}/docker-inspect.json" 2> "${dir}/docker-inspect.err" || true
    - name: Upload Redis diagnostics
      if: inputs.job-status == 'failure'
      uses: actions/upload-artifact@v6
      with:
        name: redis-diagnostics-${{ env.ZLINK_TEST_REDIS_CONTAINER }}
        path: ${{ runner.temp }}/redis-diagnostics/${{ env.ZLINK_TEST_REDIS_CONTAINER }}/
        if-no-files-found: warn
    - name: Remove Redis container
      if: always()
      shell: bash
      run: docker rm -f "${ZLINK_TEST_REDIS_CONTAINER}"
