name: Package the checkout Node binding
description: Build a platform prebuild with the verified Core runtime before packing.
inputs:
  core-prefix:
    description: Verified Core release install prefix
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CORE_PREFIX: ${{ inputs.core-prefix }}
      run: |
        prefix="${CORE_PREFIX}"
        if [ "${RUNNER_OS}" = "Windows" ]; then
          prefix=$(cygpath -u "${prefix}")
        fi
        mkdir -p .artifacts/wsl/npm
        (
          cd bindings/node
          npm ci --ignore-scripts
          npm run build
          npm rebuild --foreground-scripts
          platform=$(node -p '`${process.platform}-${process.arch}`')
          prebuild_dir="prebuilds/${platform}"
          mkdir -p "${prebuild_dir}" provenance
          cp build/Release/zlink.node "${prebuild_dir}/"
          case "${RUNNER_OS}" in
            Windows) cp "${prefix}"/bin/*.dll "${prebuild_dir}/" ;;
            macOS) cp "${prefix}"/lib/*.dylib "${prebuild_dir}/" ;;
            Linux) cp -P "${prefix}"/lib/libzlink.so* "${prebuild_dir}/" ;;
          esac
          cp "${prefix}/share/zlink/core-package-provenance.json" provenance/
          npm pack --silent --pack-destination ../../.artifacts/wsl/npm
        )
