name: Prepare the Node binding package
description: Reuse the published package or build a platform prebuild with verified Core.
inputs:
  core-prefix:
    description: Verified Core release install prefix
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CORE_PREFIX: ${{ inputs.core-prefix }}
      run: |
        interpreter=python3
        if [[ "${RUNNER_OS}" == Windows ]]; then interpreter=python; fi
        "${interpreter}" scripts/ci/framework-binding-package.py node .artifacts/wsl \
          -- bash scripts/ci/framework-node-pack-binding.sh
