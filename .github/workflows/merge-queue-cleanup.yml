name: Merge queue cleanup

# Mergify closes a queue batch draft PR and deletes its branch when the batch
# merges, is dequeued, or is split to find a failing pull request. GitHub keeps
# the runs already started on that branch, and those runs hold runners the live
# batches wait for. When a Mergify branch (main or release queue batch, or
# backport) closes its pull request or is deleted, cancel its unfinished runs.
on:
  pull_request:
    types:
      - closed
  delete:

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel unfinished runs of the closed Mergify branch
    if: >-
      (github.event_name == 'pull_request'
       && github.event.pull_request.head.repo.full_name == github.repository
       && startsWith(github.event.pull_request.head.ref, 'mergify/'))
      || (github.event_name == 'delete'
          && github.event.ref_type == 'branch'
          && startsWith(github.event.ref, 'mergify/'))
    runs-on: ${{ vars.ZLINK_LINUX_RUNNER && fromJSON(vars.ZLINK_LINUX_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - name: Cancel unfinished runs of the branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh run list --branch "$BRANCH" --limit 1000 --json databaseId,status \
            --jq '.[] | select(.status != "completed") | .databaseId' |
          while read -r run_id; do
            gh run cancel "$run_id" || echo "run $run_id already finished"
          done
