name: Release Framework

on:
  push:
    tags:
      - 'framework/v*'
      - 'framework-cpp/v*'
      - 'framework-java/v*'
      - 'framework-node/v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Framework language (dotnet uses release-dotnet.yml)'
        required: true
        default: all
        type: choice
        options: [cpp, java, node, all]
      version:
        description: 'Target version; omitted uses framework/languages/<target>/VERSION'
        required: false
        type: string
      publish_registry:
        description: 'Publish Node and Java packages to public registries'
        required: true
        default: false
        type: boolean
      cpp_platform:
        description: 'C++ prebuilt platform (single-platform release retry)'
        required: true
        default: all
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, windows-x64]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve framework version
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.version.outputs.target }}
      node_version: ${{ steps.version.outputs.node_version }}
      java_version: ${{ steps.version.outputs.java_version }}
      cpp_version: ${{ steps.version.outputs.cpp_version }}
      cpp_platforms: ${{ steps.version.outputs.cpp_platforms }}
      publish_registry: ${{ steps.version.outputs.publish_registry }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish_registry }}
          REQUESTED_CPP_PLATFORM: ${{ inputs.cpp_platform }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME##*/v}"
            case "${GITHUB_REF_NAME}" in
              framework/v*) target=all ;;
              framework-cpp/v*) target=cpp ;;
              framework-java/v*) target=java ;;
              framework-node/v*) target=node ;;
              *) echo "Unsupported framework tag" >&2; exit 1 ;;
            esac
            publish_registry=true
            cpp_platform=all
          else
            target="${REQUESTED_TARGET:-all}"
            version="${REQUESTED_VERSION}"
            publish_registry="${REQUESTED_PUBLISH}"
            cpp_platform="${REQUESTED_CPP_PLATFORM:-all}"
          fi
          case "${target}" in cpp|java|node|all) ;; *) echo "Invalid target: ${target}" >&2; exit 1 ;; esac
          case "${cpp_platform}" in
            all)
              cpp_platforms='{"include":[{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"linux-arm64","runner":"ubuntu-22.04-arm"},{"platform":"macos-arm64","runner":"macos-15"},{"platform":"windows-x64","runner":"windows-2022"}]}'
              ;;
            linux-x64|linux-arm64|macos-arm64|windows-x64)
              [ "${target}" = cpp ] || { echo "A single cpp_platform requires target=cpp" >&2; exit 1; }
              case "${cpp_platform}" in
                linux-x64) runner=ubuntu-24.04 ;;
                linux-arm64) runner=ubuntu-22.04-arm ;;
                macos-arm64) runner=macos-15 ;;
                windows-x64) runner=windows-2022 ;;
              esac
              cpp_platforms="{\"include\":[{\"platform\":\"${cpp_platform}\",\"runner\":\"${runner}\"}]}"
              ;;
            *) echo "Invalid C++ platform: ${cpp_platform}" >&2; exit 1 ;;
          esac
          for language in cpp java node; do
            if [ "${target}" != "${language}" ] && [ "${target}" != "all" ]; then
              continue
            fi
            version_file="framework/languages/${language}/VERSION"
            declared=$(sed -n 's/^ZLINK_FRAMEWORK_VERSION=//p' "${version_file}")
            if ! [[ "${declared}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid framework version in ${version_file}" >&2; exit 1
            fi
            if [ -n "${version}" ] && [ "${declared}" != "${version}" ]; then
              echo "Framework version mismatch: requested=${version}, ${version_file}=${declared}" >&2; exit 1
            fi
            case "${language}" in
              node) manifest=$(node -p "require('./framework/languages/node/packages/framework/package.json').version") ;;
              cpp) manifest=$(node -p "require('./framework/languages/cpp/vcpkg.json')['version-string']") ;;
              java) manifest="${declared}" ;;
            esac
            if [ "${manifest}" != "${declared}" ]; then
              echo "Framework manifest mismatch for ${language}" >&2; exit 1
            fi
            echo "${language}_version=${declared}" >> "${GITHUB_OUTPUT}"
          done
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          echo "cpp_platforms=${cpp_platforms}" >> "${GITHUB_OUTPUT}"
          echo "publish_registry=${publish_registry}" >> "${GITHUB_OUTPUT}"

  release-node:
    if: needs.resolve.outputs.target == 'node' || needs.resolve.outputs.target == 'all'
    name: Build and publish Node framework packages
    runs-on: ubuntu-24.04
    needs: resolve
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # No registry-url here: it would write an empty _authToken into .npmrc and
      # npm would then use token auth (404) instead of OIDC trusted publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install npm with Trusted Publishing support
        run: npm install -g npm@latest

      # A framework release usually follows a binding release by minutes; the
      # registry's metadata appears before its tarball is served (up to ~30 min).
      - name: Wait for the binding package on npm
        shell: bash
        run: |
          version=$(node -p "require('./framework/languages/node/packages/framework/package.json').dependencies['@zlink-systems/zlink']")
          url="https://registry.npmjs.org/@zlink-systems/zlink/-/zlink-${version}.tgz"
          for attempt in $(seq 1 45); do
            if curl -sfIL -o /dev/null "${url}"; then
              echo "@zlink-systems/zlink@${version} is available"
              exit 0
            fi
            echo "attempt ${attempt}: ${url} not served yet; waiting 60s"
            sleep 60
          done
          echo "::error::@zlink-systems/zlink@${version} tarball is not available on npm after 45 minutes" >&2
          exit 1

      - name: Materialize the local-package pin of @zlink-systems/http-client used by the workspace manifest
        shell: bash
        run: |
          # The workspace manifest pins http-client to a local tarball. Read the
          # destination out of that pin instead of repeating it here — the two
          # drifted apart once already (#187 moved the pin to .artifacts/node-install
          # and this step kept packing into .artifacts/wsl, which broke the Node and
          # Java releases at 0.12.0).
          pin="$(node -p "require('./framework/languages/node/package.json').dependencies['@zlink-systems/http-client']")"
          case "${pin}" in
            file:*) ;;
            *) echo "::error::http-client pin is not a local tarball: ${pin}" >&2; exit 1 ;;
          esac
          dest="$(cd framework/languages/node && mkdir -p "$(dirname "${pin#file:}")" \
            && cd "$(dirname "${pin#file:}")" && pwd -P)"
          npm pack framework/languages/node/packages/http-client --pack-destination "${dest}"
          test -f "${dest}/$(basename "${pin#file:}")"

      - name: Build and pack
        working-directory: framework/languages/node
        run: |
          npm ci
          npm run build
          mkdir -p ../../../dist/framework-node
          for package_dir in \
            stream-wire \
            stream-connector \
            framework \
            framework-codec-protobuf \
            framework-codec-msgpack \
            framework-locations-redis \
            http-client \
            nestjs; do
            npm pack "./packages/${package_dir}" \
              --pack-destination ../../../dist/framework-node
          done

      - name: Publish with npm provenance
        if: needs.resolve.outputs.publish_registry == 'true'
        working-directory: framework/languages/node
        run: |
          for package_dir in \
            stream-wire \
            stream-connector \
            framework \
            framework-codec-protobuf \
            framework-codec-msgpack \
            framework-locations-redis \
            http-client \
            nestjs; do
            name=$(node -p "require('./packages/${package_dir}/package.json').name")
            version=$(node -p "require('./packages/${package_dir}/package.json').version")
            # The first release of each package is published manually (npm Trusted
            # Publishing needs an existing package); re-running the tag must not fail
            # on versions that are already on the registry.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping"
              continue
            fi
            npm publish "./packages/${package_dir}" --provenance --access public
          done

      # UPM cannot install from npm and never runs a Node build, so the Unity
      # adapter ships off the same tag: `git URL ...#framework-node/vX.Y.Z` is the
      # documented install and this tarball serves offline or vendored projects.
      # Both serve the committed bundle, so the release must refuse to publish a
      # tag whose committed bundle does not match the source it was built from.
      # release-unity attaches the tarball; this job only produces it, because it
      # holds the npm publishing credential and must not also hold repo write.
      - name: Pack the Unity WebGL UPM package
        working-directory: framework/languages/node
        run: |
          node scripts/sync-unity-webgl-package.mjs --check
          npm pack ../unity/com.zlink.stream-connector.webgl \
            --pack-destination ../../../dist/framework-node

      - uses: actions/upload-artifact@v6
        with:
          name: framework-node-${{ needs.resolve.outputs.node_version }}
          path: dist/framework-node/*.tgz
          if-no-files-found: error

  wait-tutorial-node:
    if: needs.resolve.outputs.publish_registry == 'true' && needs.release-node.result == 'success'
    name: Wait for the published Node framework package
    runs-on: ubuntu-24.04
    needs: [resolve, release-node]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # The tutorial installs every published package, and the registry serves
      # metadata minutes before the tarball (doc/building/release-pipeline.ko.md §5),
      # so wait for each tarball to answer 200 (external propagation, not a publish retry).
      - name: Wait for every published tarball
        env:
          VERSION: ${{ needs.resolve.outputs.node_version }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 45 * 60 ))
          for package_dir in             stream-wire             stream-connector             framework             framework-codec-protobuf             framework-codec-msgpack             framework-locations-redis             http-client             nestjs; do
            name=$(node -p "require('./framework/languages/node/packages/${package_dir}/package.json').name")
            url="https://registry.npmjs.org/${name}/-/${name#*/}-${VERSION}.tgz"
            until curl -sfI -o /dev/null "${url}"; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "::error::${url} is not served after 45 minutes" >&2
                exit 1
              fi
              echo "${name}@${VERSION} tarball is not served yet; waiting 30s"
              sleep 30
            done
            echo "${name}@${VERSION} tarball is served"
          done

  tutorial-node:
    if: needs.wait-tutorial-node.result == 'success'
    name: Verify the published Node framework package with the tutorial
    needs: wait-tutorial-node
    uses: ./.github/workflows/framework-tutorial.yml
    with:
      language: node

  # The public examples mirror follows the verified release (#884): the trees
  # pin the packages this run published, so the mirror runs only after they
  # are served and the tutorial passed against them.
  mirror-node:
    if: needs.tutorial-node.result == 'success'
    name: Mirror zlink-node-examples
    needs: [resolve, tutorial-node]
    uses: ./.github/workflows/examples-mirror.yml
    secrets: inherit
    with:
      ref: ${{ github.event_name == 'push' && github.ref_name || format('framework-node/v{0}', needs.resolve.outputs.node_version) }}
      language: node

  # Separate from release-node on purpose. That job carries the npm Trusted
  # Publishing credential (id-token: write); adding contents: write there would put
  # repository write access in the same context as the publishing credential for
  # the sake of one secondary asset. This job only downloads an artifact and
  # attaches it, so contents: write is all it needs and it holds no npm credential.
  release-unity:
    if: github.event_name == 'push' && (needs.resolve.outputs.target == 'node' || needs.resolve.outputs.target == 'all')
    name: Attach the Unity WebGL UPM package to the release
    runs-on: ubuntu-24.04
    needs:
      - resolve
      - release-node
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: framework-node-${{ needs.resolve.outputs.node_version }}
          path: dist/framework-node

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/framework-node/com.zlink.stream-connector.webgl-*.tgz

  release-java:
    if: needs.resolve.outputs.target == 'java' || needs.resolve.outputs.target == 'all'
    name: Build and stage Java framework packages
    runs-on: ubuntu-24.04
    needs: resolve
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # zlink-stream-connector's JavaNodeStreamInteropTest drives the Node
      # stream-connector (packages/stream-connector/dist) with `node`, so the
      # Node workspace is built here the same way the Node job builds it.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # A framework release usually follows a binding release by minutes; the
      # registry's metadata appears before its tarball is served (up to ~30 min).
      - name: Wait for the binding package on npm
        shell: bash
        run: |
          version=$(node -p "require('./framework/languages/node/packages/framework/package.json').dependencies['@zlink-systems/zlink']")
          url="https://registry.npmjs.org/@zlink-systems/zlink/-/zlink-${version}.tgz"
          for attempt in $(seq 1 45); do
            if curl -sfIL -o /dev/null "${url}"; then
              echo "@zlink-systems/zlink@${version} is available"
              exit 0
            fi
            echo "attempt ${attempt}: ${url} not served yet; waiting 60s"
            sleep 60
          done
          echo "::error::@zlink-systems/zlink@${version} tarball is not available on npm after 45 minutes" >&2
          exit 1

      - name: Build the Node workspace for the Java/Node interop tests
        shell: bash
        run: |
          # The workspace manifest pins http-client to a local tarball. Read the
          # destination out of that pin instead of repeating it here — the two
          # drifted apart once already (#187 moved the pin to .artifacts/node-install
          # and this step kept packing into .artifacts/wsl, which broke the Node and
          # Java releases at 0.12.0).
          pin="$(node -p "require('./framework/languages/node/package.json').dependencies['@zlink-systems/http-client']")"
          case "${pin}" in
            file:*) ;;
            *) echo "::error::http-client pin is not a local tarball: ${pin}" >&2; exit 1 ;;
          esac
          dest="$(cd framework/languages/node && mkdir -p "$(dirname "${pin#file:}")" \
            && cd "$(dirname "${pin#file:}")" && pwd -P)"
          npm pack framework/languages/node/packages/http-client --pack-destination "${dest}"
          test -f "${dest}/$(basename "${pin#file:}")"
          cd framework/languages/node
          npm ci
          npm run build

      # The Java/Kotlin test suites are load-sensitive (turn-ordering and timing
      # assertions) and each run on the shared 4-vCPU runner failed a different
      # test that passes on the local framework gate (D-BP51). The release job
      # therefore builds what the local gate validated; tests run in the gate.
      - name: Build
        working-directory: framework/languages/java
        run: ./gradlew --no-daemon --max-workers=1 assemble -Pzlink.includeSamples=false

      - name: Sign and upload a Maven Central bundle
        if: needs.resolve.outputs.publish_registry == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          MAVEN_CENTRAL_BUNDLE_DIR: ${{ runner.temp }}/zlink-framework-java-central-staging
          MAVEN_CENTRAL_BUNDLE_PATH: ${{ github.workspace }}/dist/framework-java/zlink-framework-java-${{ needs.resolve.outputs.java_version }}-central-bundle.zip
        working-directory: framework/languages/java
        run: |
          ./gradlew --no-daemon publishAllPublicationsToCentralStagingRepository -Pzlink.includeSamples=false
          bash scripts/upload-central-bundle.sh

      - name: Build unsigned Maven artifacts for review
        if: needs.resolve.outputs.publish_registry != 'true'
        working-directory: framework/languages/java
        run: ./gradlew --no-daemon publish -Pzlink.includeSamples=false

      - uses: actions/upload-artifact@v6
        with:
          name: framework-java-${{ needs.resolve.outputs.java_version }}
          path: |
            framework/languages/java/*/build/libs/*.jar
            framework/languages/java/*/build/repo/**
            dist/framework-java/*.zip
          if-no-files-found: error

  wait-tutorial-java:
    if: needs.resolve.outputs.publish_registry == 'true' && needs.release-java.result == 'success'
    name: Wait for the published Java framework package
    runs-on: ubuntu-24.04
    needs: [resolve, release-java]
    steps:
      - name: Wait for the Maven Central index (external propagation, not a publish retry)
        env:
          VERSION: ${{ needs.resolve.outputs.java_version }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/systems/zlink/zlink-framework-core/${VERSION}/zlink-framework-core-${VERSION}.pom"
          for attempt in $(seq 1 60); do
            if curl -sfL -o /dev/null "${url}"; then
              echo "zlink-framework-core:${VERSION} is available on Maven Central"
              exit 0
            fi
            echo "attempt ${attempt}: ${url} is not indexed yet; waiting 30s"
            [ "${attempt}" -lt 60 ] && sleep 30
          done
          echo "::error::zlink-framework-core:${VERSION} is not indexed on Maven Central after 30 minutes" >&2
          exit 1

  tutorial-java:
    if: needs.wait-tutorial-java.result == 'success'
    name: Verify the published Java framework package with the tutorial
    needs: wait-tutorial-java
    uses: ./.github/workflows/framework-tutorial.yml
    with:
      language: java

  mirror-java:
    if: needs.tutorial-java.result == 'success'
    name: Mirror zlink-java-examples
    needs: [resolve, tutorial-java]
    uses: ./.github/workflows/examples-mirror.yml
    secrets: inherit
    with:
      ref: ${{ github.event_name == 'push' && github.ref_name || format('framework-java/v{0}', needs.resolve.outputs.java_version) }}
      language: java

  release-cpp:
    if: needs.resolve.outputs.target == 'cpp' || needs.resolve.outputs.target == 'all'
    name: Package C++ framework sources
    runs-on: ubuntu-24.04
    needs: resolve
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Create source archive and checksum
        # prepare-source-archive.cmake verifies the generated protocol headers
        # (--check) and stages framework/languages/cpp, framework/runtime (as
        # runtime/) and framework/LICENSE. The archive keeps one top-level
        # directory, the same layout as the C++ binding archive.
        shell: bash
        run: |
          mkdir -p dist/framework-cpp
          stage="${RUNNER_TEMP}/zlink-framework-cpp-${{ needs.resolve.outputs.cpp_version }}"
          cmake -DZLINK_SOURCE_DIR="${PWD}" -DZLINK_STAGE_DIR="${stage}" \
            -P framework/languages/cpp/cmake/prepare-source-archive.cmake
          for required in CMakeLists.txt runtime/protocol/generated/cpp/service_wire_constants.hpp runtime/protocol/generated/cpp/service_wire_pilot_codec.hpp LICENSE; do
            test -f "${stage}/${required}" || { echo "missing ${required} in the framework C++ source archive" >&2; exit 1; }
          done
          archive="dist/framework-cpp/zlink-framework-cpp-${{ needs.resolve.outputs.cpp_version }}.tar.gz"
          tar -C "${RUNNER_TEMP}" -czf "${archive}" \
            "zlink-framework-cpp-${{ needs.resolve.outputs.cpp_version }}"
          sha256sum "${archive}" >"${archive}.sha256"
          sha512sum "${archive}"

      - uses: actions/upload-artifact@v6
        with:
          name: framework-cpp-${{ needs.resolve.outputs.cpp_version }}
          path: dist/framework-cpp/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ZLink Framework v${{ needs.resolve.outputs.cpp_version }}
          files: dist/framework-cpp/*

  prebuilt-cpp:
    if: needs.resolve.outputs.target == 'cpp' || needs.resolve.outputs.target == 'all'
    name: Prebuilt C++ framework (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [resolve, release-cpp]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.resolve.outputs.cpp_platforms) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: framework-cpp/v${{ needs.resolve.outputs.cpp_version }}
          fetch-depth: 0

      - name: Verify the checkout is the release tag commit
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.cpp_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "framework-cpp/v${VERSION}^{commit}")"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Conan
        shell: bash
        run: python -m pip install conan==2.32.0

      - name: Set up MSVC
        if: matrix.platform == 'windows-x64'
        uses: ./.github/actions/msvc-env
        with:
          arch: x64

      - name: Install Linux build tools
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.platform }}" = linux-x64 ]; then
            sudo apt-get install -y gcc-13 g++-13 ninja-build
          else
            sudo apt-get install -y build-essential ninja-build
          fi

      - name: Install macOS build tools
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: brew install ninja gnu-tar

      - name: Fetch Core and build the C++ binding
        id: inputs
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RUNNER_TEMP_NATIVE: ${{ runner.temp }}
        run: |
          set -euo pipefail
          runner_temp="${RUNNER_TEMP_NATIVE}"
          if command -v cygpath >/dev/null 2>&1; then
            runner_temp="$(cygpath -u "${runner_temp}")"
          fi
          core_prefix="$(bash scripts/local-package/core/fetch-release.sh \
            --platform "${PLATFORM}" --cache-dir "${runner_temp}/core")"
          binding_version="$(sed -n 's/^ZLINK_BINDING_VERSION=//p' bindings/cpp/VERSION)"
          binding_build="${runner_temp}/zlink-cpp-build"
          binding_prefix="${runner_temp}/zlink-cpp-${binding_version}"
          cmake -S bindings/cpp -B "${binding_build}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${binding_prefix}" \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL \
            -DZLINK_CPP_CORE_PACKAGE_PREFIX="${core_prefix}" \
            -DZLINK_CPP_BUILD_TESTS=OFF \
            -DZLINK_CPP_BUILD_SAMPLES=OFF
          cmake --build "${binding_build}" --parallel 8
          cmake --install "${binding_build}"
          echo "core_prefix=${core_prefix}" >>"${GITHUB_OUTPUT}"
          echo "binding_prefix=${binding_prefix}" >>"${GITHUB_OUTPUT}"

      - name: Build and verify the prebuilt archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ZLINK_FRAMEWORK_CPP_LOCAL_ZLINK_CORE_PREFIX: ${{ steps.inputs.outputs.core_prefix }}
          ZLINK_FRAMEWORK_CPP_LOCAL_ZLINK_CPP_PREFIX: ${{ steps.inputs.outputs.binding_prefix }}
        run: |
          set -euo pipefail
          mkdir -p dist/framework-cpp-prebuilt
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          bash framework/languages/cpp/scripts/package-prebuilt.sh \
            --platform "${PLATFORM}" dist/framework-cpp-prebuilt

      - uses: actions/upload-artifact@v6
        with:
          name: framework-cpp-${{ needs.resolve.outputs.cpp_version }}-${{ matrix.platform }}
          path: dist/framework-cpp-prebuilt/*
          if-no-files-found: error

  publish-prebuilt-cpp:
    if: needs.resolve.outputs.target == 'cpp' || needs.resolve.outputs.target == 'all'
    name: Attach prebuilt C++ framework archives
    runs-on: ubuntu-24.04
    needs: [resolve, prebuilt-cpp]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: framework-cpp-${{ needs.resolve.outputs.cpp_version }}-*
          path: dist/framework-cpp-prebuilt
          merge-multiple: true

      - name: Attach archives and checksums to the C++ framework release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: framework-cpp/v${{ needs.resolve.outputs.cpp_version }}
          files: dist/framework-cpp-prebuilt/*
          overwrite_files: true

  wait-tutorial-cpp:
    if: github.event_name == 'push' && needs.release-cpp.result == 'success'
    name: Wait for the published C++ framework release asset
    runs-on: ubuntu-24.04
    needs: [resolve, release-cpp]
    permissions:
      contents: read
    steps:
      - name: Wait for the GitHub Release asset (external propagation, not a publish retry)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.cpp_version }}
        shell: bash
        run: |
          set -euo pipefail
          asset="zlink-framework-cpp-${VERSION}.tar.gz"
          for attempt in $(seq 1 60); do
            assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if printf '%s\n' "${assets}" | grep -Fxq "${asset}"; then
              echo "${asset} is available on the GitHub Release"
              exit 0
            fi
            echo "attempt ${attempt}: ${asset} is not attached yet; waiting 30s"
            [ "${attempt}" -lt 60 ] && sleep 30
          done
          echo "::error::${asset} is not attached to ${GITHUB_REF_NAME} after 30 minutes" >&2
          exit 1

  tutorial-cpp:
    if: needs.wait-tutorial-cpp.result == 'success'
    name: Verify the published C++ framework package with the tutorial
    needs: wait-tutorial-cpp
    uses: ./.github/workflows/framework-tutorial.yml
    with:
      language: cpp

  mirror-cpp:
    if: needs.tutorial-cpp.result == 'success'
    name: Mirror zlink-cpp-examples
    needs: [resolve, tutorial-cpp]
    uses: ./.github/workflows/examples-mirror.yml
    secrets: inherit
    with:
      ref: ${{ github.event_name == 'push' && github.ref_name || format('framework-cpp/v{0}', needs.resolve.outputs.cpp_version) }}
      language: cpp

  sync-recipes:
    name: Sync vcpkg/Conan recipes (cpp framework)
    runs-on: ubuntu-24.04
    needs:
      - resolve
      - release-cpp
    # Only the cpp framework ships a vcpkg port/Conan recipe, and release-cpp
    # only creates the GitHub Release (the release asset the recipe hashes)
    # on a tag push, never on a manual dispatch.
    if: needs.resolve.outputs.target == 'cpp' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # release-check.sh --write reuses validate_cpp()'s own target table
      # (scripts/dev/release-check.sh), so this can never drift from what
      # `release-check.sh framework cpp <version>` checks.
      - name: Write vcpkg port and Conan recipe metadata
        run: |
          bash scripts/dev/release-check.sh --write framework cpp "${{ needs.resolve.outputs.cpp_version }}"

      - name: Open a PR to main if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.cpp_version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- vcpkg/ports/zlink-framework framework/languages/cpp/packaging/conan; then
            echo "No recipe changes for framework/cpp ${VERSION}; nothing to open a PR for."
            exit 0
          fi
          branch="release-recipes/framework-cpp-v${VERSION}"
          title="release: framework/cpp ${VERSION} 레시피 갱신"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add vcpkg/ports/zlink-framework framework/languages/cpp/packaging/conan
          git commit -m "${title}"
          git push --force origin "HEAD:${branch}"
          if gh pr view "${branch}" --json state -q .state >/dev/null 2>&1; then
            echo "A PR for ${branch} already exists; the branch was updated instead."
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${title}" \
              --body "framework-cpp/v${VERSION} 릴리스 태그·자산에 맞춰 vcpkg port와 Conan recipe(버전·SHA512·sha256)를 scripts/dev/release-check.sh --write로 갱신했다."
          fi

# The .NET framework packages are intentionally not pushed here. nuget.org's
# zlink-dotnet-release Trusted Publishing policy is bound to release-dotnet.yml.
