name: Core macOS ctest (diagnostic)

on:
  workflow_dispatch:
    inputs:
      ctest_regex:
        description: 'ctest -R regex (default: all tests)'
        required: false
        default: '.'
      ctest_exclude:
        description: 'ctest -E regex (default: the release job exclusions)'
        required: false
        default: '^(test_multi_dealer_dealer_benchmark_process|test_multi_pubsub_benchmark_process|test_multi_spot_benchmark_process|test_multi_stream_benchmark_process|test_single_pair_benchmark_process|test_single_spot_benchmark_process|test_reconnect_options|test_zmp_request_reply|test_stream_send_blocking_wakeup|test_stream_socket_recv_multiclient_ready_regression|test_stream_threadsafe_callback_queue_load|test_stream_threadsafe_recv_queue_load|test_stream_threadsafe_recv_queue_timed_window)$'
      repeat:
        description: 'ctest --repeat mode, e.g. until-fail:3 (empty = single run)'
        required: false
        default: ''

jobs:
  macos-ctest:
    name: macOS ARM64 ctest
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake pkg-config openssl@3

      - name: Configure
        run: |
          set -e
          export OPENSSL_ROOT_DIR=$(/opt/homebrew/bin/brew --prefix openssl@3)
          echo "Using OpenSSL from $OPENSSL_ROOT_DIR"
          cmake -S core -B core/build-macos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_TESTS=ON \
            -DWITH_TLS=ON \
            -DZLINK_CXX_STANDARD=17 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_MACOSX_RPATH=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_ROOT_DIR/include" \
            "-DOPENSSL_LIBRARIES=$OPENSSL_ROOT_DIR/lib/libssl.dylib;$OPENSSL_ROOT_DIR/lib/libcrypto.dylib"

      - name: Build
        run: cmake --build core/build-macos --parallel $(sysctl -n hw.ncpu)

      - name: ctest (serial label, -j1)
        id: serial
        continue-on-error: true
        run: |
          set -o pipefail
          REPEAT=""
          [ -n "${{ inputs.repeat }}" ] && REPEAT="--repeat ${{ inputs.repeat }}"
          ctest --test-dir core/build-macos --output-on-failure \
            -L serial -j1 $REPEAT \
            -R '${{ inputs.ctest_regex }}' -E '${{ inputs.ctest_exclude }}' \
            2>&1 | tee ctest-serial.log

      - name: ctest (non-serial, -j3)
        id: parallel
        continue-on-error: true
        run: |
          set -o pipefail
          REPEAT=""
          [ -n "${{ inputs.repeat }}" ] && REPEAT="--repeat ${{ inputs.repeat }}"
          ctest --test-dir core/build-macos --output-on-failure \
            -LE serial -j3 $REPEAT \
            -R '${{ inputs.ctest_regex }}' -E '${{ inputs.ctest_exclude }}' \
            2>&1 | tee ctest-parallel.log

      - name: Summary
        run: |
          echo "=== serial outcome: ${{ steps.serial.outcome }}"
          echo "=== parallel outcome: ${{ steps.parallel.outcome }}"
          for f in core/build-macos/Testing/Temporary/LastTestsFailed*.log; do
            [ -f "$f" ] && { echo "--- $f"; cat "$f"; }
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: |
            ctest-serial.log
            ctest-parallel.log
            core/build-macos/Testing/Temporary/
          retention-days: 7

      - name: Fail if any ctest failed
        run: |
          [ "${{ steps.serial.outcome }}" = "success" ] || exit 1
          [ "${{ steps.parallel.outcome }}" = "success" ] || exit 1
