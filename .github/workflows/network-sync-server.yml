name: Network sync server

# network-sync 서버 플러그인과 시뮬레이션 코어를 빌드하고 시험한다(#3774).
on:
  # 사용자 결정(11-27): Actions는 C++ 빌드 검증과 릴리스·데일리만. PR 검증은 로컬 실행.
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Check format
        run: |
          dotnet format plugins/network-sync/server/Simulation/Zlink.NetworkSync.Simulation.csproj --verify-no-changes
          dotnet format plugins/network-sync/server/Simulation.Tests/Zlink.NetworkSync.Simulation.Tests.csproj --verify-no-changes
      - name: Test simulation core
        run: dotnet test plugins/network-sync/server/Simulation.Tests/Zlink.NetworkSync.Simulation.Tests.csproj --nologo

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: plugins/network-sync/server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      # Restore Zlink.Framework from this checkout: the plugin depends on the repository VERSION,
      # which is published only by the release (same source as release-dotnet.yml).
      - name: Prepare local packages
        run: |
          source_dir=$(bash ../../../scripts/local-package/dotnet/build-framework-wsl.sh)
          echo "RestoreAdditionalProjectSources=$source_dir" >> "$GITHUB_ENV"
      - name: Build server plugin
        run: dotnet build Server --nologo
      - name: Check format
        run: |
          dotnet format Server --verify-no-changes
          dotnet format Server.Tests --verify-no-changes
      - name: Test server plugin
        run: dotnet test Server.Tests --nologo
