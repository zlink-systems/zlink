name: Network sync server

# network-sync 서버 플러그인과 시뮬레이션 코어를 빌드하고 시험한다(#3774).
on:
  push:
    branches:
      - main
    paths:
      - "plugins/network-sync/server/**"
      - "plugins/network-sync/protocol/**"
      - ".github/workflows/network-sync-server.yml"
  pull_request:
    branches:
      - main
    paths:
      - "plugins/network-sync/server/**"
      - "plugins/network-sync/protocol/**"
      - ".github/workflows/network-sync-server.yml"

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Check format
        run: |
          dotnet format plugins/network-sync/server/Simulation/Zlink.NetworkSync.Simulation.csproj --verify-no-changes
          dotnet format plugins/network-sync/server/Simulation.Tests/Zlink.NetworkSync.Simulation.Tests.csproj --verify-no-changes
      - name: Test simulation core
        run: dotnet test plugins/network-sync/server/Simulation.Tests/Zlink.NetworkSync.Simulation.Tests.csproj --nologo

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: plugins/network-sync/server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build server plugin
        run: dotnet build Server --nologo
      - name: Check format
        run: |
          dotnet format Server --verify-no-changes
          dotnet format Server.Tests --verify-no-changes
      - name: Test server plugin
        run: dotnet test Server.Tests --nologo
