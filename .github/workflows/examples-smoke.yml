name: Examples smoke

# #655 — 0.18.0의 tutorial/samples 배포물이 배포된 그대로는 저장소 없이 빌드·실행되지
# 않았다(C++·Node 0/7, .NET Windows 0/7, Java 실행 미완). 원인은 배포물 안 script가 저장소
# 배치를 전제한 것이었고, 이를 잡아낼 CI가 없었다 — framework-tutorial.yml은 저장소를
# checkout해 그 tree에서 빌드하므로 배포물 전용 결함을 통과시킨다. 이 워크플로는 그 구멍을
# 메운다: `scripts/tutorial/export_examples.py`로 실제로 내보낸 언어별 examples tree(#831,
# 미러 저장소 `zlink-<lang>-examples`에 push되는 것과 같은 tree)를 **checkout이 전혀 없는**
# 새 job에서 artifact로 받아, 문서가 적은 명령만으로 quickstart를 빌드하고 tutorial을
# 빌드·기동하고 샘플 하나를 끝까지 돌린다. `ZLINK_*` 환경변수는 어디에도 주지 않는다 —
# 저장소 모드로 새는지 확인하는 것 자체가 목적이다.
#
# ## 트리거 규칙
#
# - `workflow_call` (기본 경로) — `examples-mirror.yml`이 미러 저장소에 push하기 **전에**
#   같은 실행에서 이 워크플로를 부른다. `inputs.ref`가 검증할 framework 태그다. 패키지
#   레지스트리(NuGet·npm·Maven·vcpkg 등)에 그 태그가 고정한 버전이 이미 게시돼 있다고
#   전제한다 — 태그는 패키지 게시 뒤에 만든다(doc/building/release-pipeline.ko.md).
# - `workflow_dispatch` (`inputs.ref`, 기본값 `main`) — 수동 실행. **release가 아닌 ref는
#   package pin이 아직 게시되지 않았을 수 있다** — 이 경우 레지스트리 조회 단계에서 실패하는
#   것이 정상이며 tree 자체의 결함이 아니다.
# - `schedule` (매일 UTC 02:30) — 가장 최근 framework 태그를 다시 검증한다(미러 `main`이
#   가리키는 tree와 같다). Maven Central 동기화 지연(release 직후 30분 이상) 같은 레지스트리
#   쪽 일시적 문제를 다음 날 다시 잡아낸다 — 이 워크플로 자체에는 재시도 루프를 두지 않는다
#   (AGENTS.md §3, 실패 지점 우회 금지).

on:
  workflow_call:
    inputs:
      ref:
        description: 'examples-mirror.yml이 미러에 push하려는 framework 태그'
        required: true
        type: string
      languages:
        description: 'JSON 배열. 이 언어의 lane만 돈다(미러가 push하는 언어; 다른 언어의 패키지는 아직 없을 수 있다)'
        required: false
        default: '["cpp","dotnet","java","kotlin","node"]'
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'tree를 내보낼 git ref (branch/tag/sha). release가 아니면 package pin이 아직 없을 수 있다'
        required: true
        default: main
        type: string
      languages:
        description: 'JSON 배열. 돌릴 언어의 lane'
        required: false
        default: '["cpp","dotnet","java","kotlin","node"]'
        type: string
  schedule:
    - cron: '30 2 * * *'

# Named explicitly: in a called workflow `github.workflow` is the caller's
# name, so `${{ github.workflow }}-${{ inputs.ref }}` here equalled
# examples-mirror.yml's own group on a workflow_dispatch (both see the same
# `inputs.ref`) and the call could not be scheduled.
concurrency:
  group: examples-smoke-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the ref to export
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      # The JVM lanes are one matrix job; a job-level `if` cannot see `matrix`,
      # so the matrix itself is the requested subset of java/kotlin.
      jvm_languages: ${{ steps.jvm.outputs.languages }}
    steps:
      - name: Pick the JVM lanes to run
        id: jvm
        env:
          LANGUAGES: ${{ inputs.languages || '["cpp","dotnet","java","kotlin","node"]' }}
        run: |
          set -euo pipefail
          jvm="$(printf '%s' "${LANGUAGES}" | python3 -c 'import json,sys; print(json.dumps([l for l in json.load(sys.stdin) if l in ("java","kotlin")]))')"
          echo "languages=${jvm}" >> "$GITHUB_OUTPUT"
          echo "jvm lanes: ${jvm}"

      - name: Pick the ref for this trigger
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # In a called workflow github.event_name is the caller's event (push for a
          # tag, …), never "workflow_call" — so a non-empty input decides first.
          if [ -n "${INPUT_REF}" ]; then
            ref="${INPUT_REF}"
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            # The newest framework tag: what the mirrors' `main` holds. The tags API
            # lists newest first.
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
              --jq '[.[] | select(.name | startswith("framework")) | .name][0]')"
          else
            echo "::error::unsupported trigger ${EVENT_NAME}"
            exit 1
          fi
          if [ -z "${ref}" ]; then
            echo "::error::could not resolve a ref to export for trigger ${EVENT_NAME}"
            exit 1
          fi
          echo "resolved ref: ${ref} (trigger: ${EVENT_NAME})"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

  export:
    name: Export examples trees
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout at the resolved ref
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Export the examples trees at this ref
        run: python3 scripts/tutorial/export_examples.py .artifacts/examples "${{ needs.resolve.outputs.ref }}"

      - name: Verify language and engine trees and no repo-only file leaked in
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, "scripts/tutorial")
          from export_examples import ENGINE_EXPORTS, EXCLUDED_ENTRIES, LANGUAGES, SECTIONS

          out = pathlib.Path(".artifacts/examples")
          bad = []
          for lang in LANGUAGES:
              root = out / f"zlink-{lang}-examples"
              for name in ("README.md", "README.ko.md", ".gitignore", ".gitattributes"):
                  if not (root / name).is_file():
                      bad.append(f"{root.name}: missing {name}")
              for section in SECTIONS:
                  if not (root / section / "README.md").is_file():
                      bad.append(f"{root.name}: missing {section}/README.md")
              for section, entry_lang, entry in EXCLUDED_ENTRIES:
                  if entry_lang == lang and (root / section / entry).exists():
                      bad.append(f"{root.name}: {section}/{entry} should have been excluded")

          for source_name, mirror_name in ENGINE_EXPORTS.items():
              source = pathlib.Path("framework/languages/engines") / source_name
              if not source.is_dir():
                  continue
              root = out / mirror_name
              for name in ("README.md", "README.ko.md", ".gitignore", ".gitattributes"):
                  if not (root / name).is_file():
                      bad.append(f"{root.name}: missing {name}")

          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          print("verified language and engine trees; no excluded repo-only file leaked in")
          PY

      # The consumer jobs below never checkout the repository, so the README
      # extraction helper has to travel with the trees as its own artifact
      # entries -- copy it next to them before uploading.
      - name: Stage the README-extraction helper alongside the trees
        run: cp scripts/tutorial/extract_readme_step.py scripts/tutorial/run_readme_step.sh .artifacts/examples/

      # upload-artifact stores no file modes, and the READMEs run `./run_sample.sh`
      # and `./gradlew` directly — exactly what a reader's `git clone` gets, since
      # git keeps the 755 the export set. A tar carries the modes across.
      - name: Pack the trees as a tar (keeps the executable bits)
        run: tar -C .artifacts -cf examples-trees.tar examples

      - name: Upload the trees and the README-extraction helper
        uses: actions/upload-artifact@v4
        with:
          name: examples-trees
          path: examples-trees.tar
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 아래 job은 어느 것도 저장소를 checkout하지 않는다. `export`가 만든 tree를 artifact로
  # 받고, 그 tree의 README가 적은 명령만 그대로 실행한다. artifact는 tar라 export가 준
  # 실행 비트(gradlew·*.sh)가 그대로 온다 — 독자의 `git clone`과 같은 상태다. 로컬 action
  # (`uses: ./...`)도 checkout이 있어야 참조할 수 있으므로 쓰지 않고 전부 inline이다.
  #
  # #655를 신고한 네 언어 worker(framework-{cpp,dotnet,node,java}/655-standalone-zips)는
  # 모두 병합됐다. 현재 남은 `continue-on-error: true`의 사유는 Windows
  # Redis(Memurai) 설치·실행이 아직 실제 Actions에서 검증되지 않은 하나뿐이다.
  # ---------------------------------------------------------------------------

  engine-server-linux:
    name: engine server / ubuntu-24.04 (no checkout)
    needs: export
    if: contains(fromJSON(inputs.languages || '[]'), 'engine-server')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: examples-trees

      - name: Unpack the trees
        run: tar -xf examples-trees.tar

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-engine-server
        run: bash ../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Build (README's own 빌드/linux block)
        working-directory: examples/zlink-engine-server
        run: bash ../run_readme_step.sh README.ko.md 빌드 linux

      - name: Run (README's own 실행/linux block)
        working-directory: examples/zlink-engine-server
        run: bash ../run_readme_step.sh README.ko.md 실행 linux

      - name: Verify (README's own 검증/linux block)
        working-directory: examples/zlink-engine-server
        run: bash ../run_readme_step.sh README.ko.md 검증 linux

      - name: Logs (on failure)
        if: failure()
        working-directory: examples/zlink-engine-server
        run: |
          for file in .run/server.log .run/server.err.log; do
            if [ -f "${file}" ]; then
              echo "::group::${file}"; tail -n 200 "${file}"; echo "::endgroup::"
            fi
          done

      - name: Stop server and Redis
        if: always()
        working-directory: examples/zlink-engine-server
        run: bash ../run_readme_step.sh README.ko.md 종료 linux

  engine-server-windows:
    name: engine server build / windows-2022 (no checkout)
    needs: export
    if: contains(fromJSON(inputs.languages || '[]'), 'engine-server')
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: examples-trees

      - name: Unpack the trees
        shell: pwsh
        run: tar -xf examples-trees.tar

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.git') { throw '.git present -- this job checked out the repository' }
          $leaked = Get-ChildItem Env: | Where-Object { $_.Name -like 'ZLINK_*' }
          if ($leaked) { throw "ZLINK_* leaked into the environment: $($leaked.Name -join ', ')" }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install (README's own 내려받기와 설치/windows block)
        working-directory: examples/zlink-engine-server
        shell: bash
        run: bash ../run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Build (README's own 빌드/windows block)
        working-directory: examples/zlink-engine-server
        shell: bash
        run: bash ../run_readme_step.sh README.ko.md 빌드 windows
      # Windows owns the build lane; Linux owns the Redis-backed run and verify lane.

  dotnet-linux:
    name: dotnet / ubuntu-24.04 (no checkout)
    needs: export
    if: contains(fromJSON(inputs.languages || '["cpp","dotnet","java","node"]'), 'dotnet')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: examples-trees

      - name: Unpack the trees
        run: tar -xf examples-trees.tar

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Quickstart: the page's own §5 command. Build only — the two processes
      # need no Redis, but the tutorial run below already proves the runtime.
      - name: Quickstart build (quickstart.ko.md §5)
        working-directory: examples/zlink-dotnet-examples/quickstart
        run: dotnet build

      - name: Tutorial install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-dotnet-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Tutorial build (README's own 빌드/linux block)
        working-directory: examples/zlink-dotnet-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      - name: Start Redis for the tutorial (README — docker run -p 6379:6379 redis)
        run: |
          set -euo pipefail
          redis_name="zlink-redis-$$"
          docker run -d --rm --name "${redis_name}" -p 6379:6379 redis:7
          printf '%s\n' "${redis_name}" > examples/zlink-dotnet-examples/tutorial/redis.container

      - name: Tutorial run (README's own 실행/linux block)
        working-directory: examples/zlink-dotnet-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Tutorial verify (README's own 검증/linux block)
        working-directory: examples/zlink-dotnet-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux

      - name: Tutorial logs (on failure)
        if: failure()
        working-directory: examples/zlink-dotnet-examples/tutorial
        run: |
          for f in server.log server.err.log client.log client.err.log; do
            if [ -f "$f" ]; then echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; fi
          done

      - name: Stop tutorial processes and Redis
        if: always()
        working-directory: examples/zlink-dotnet-examples/tutorial
        run: |
          bash ../../run_readme_step.sh README.ko.md 종료 linux
          if [ -f redis.container ]; then
            redis_name="$(cat redis.container)"
            case "${redis_name}" in
              zlink-redis-[0-9]*) docker rm -f "${redis_name}" 2>/dev/null || true ;;
            esac
          fi
      - name: Samples root solution build (Samples.sln)
        working-directory: examples/zlink-dotnet-examples/samples
        run: dotnet build Samples.sln

      - name: Sample install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-dotnet-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Sample build (README's own 빌드/linux block)
        working-directory: examples/zlink-dotnet-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      - name: Sample run (README's own 실행/linux block)
        working-directory: examples/zlink-dotnet-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Sample verify (README's own 검증/linux block)
        working-directory: examples/zlink-dotnet-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux

  dotnet-windows:
    name: dotnet / windows-2022 (no checkout)
    needs: export
    if: contains(fromJSON(inputs.languages || '["cpp","dotnet","java","node"]'), 'dotnet')
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: examples-trees

      - name: Unpack the trees
        shell: pwsh
        run: tar -xf examples-trees.tar

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath ".git") { throw ".git present -- this job checked out the repository" }
          $leaked = Get-ChildItem Env: | Where-Object { $_.Name -like 'ZLINK_*' }
          if ($leaked) { throw "ZLINK_* leaked into the environment: $($leaked.Name -join ', ')" }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # windows-2022 has no python3 on PATH by default; run_readme_step.sh needs it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Tutorial install (README's own 내려받기와 설치/windows block)
        working-directory: examples/zlink-dotnet-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Tutorial build (README's own 빌드/windows block)
        working-directory: examples/zlink-dotnet-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 빌드 windows

      - name: Samples root solution build (Samples.sln)
        working-directory: examples/zlink-dotnet-examples/samples
        run: dotnet build Samples.sln

      # GitHub-hosted windows-2022 runners cannot run Linux Docker containers
      # (Docker there is Windows-container-only; switching to Linux containers
      # needs a reboot, which a running job cannot do — see PR description for
      # citations). The tutorial and every dotnet sample's run_sample.ps1 need
      # a real Redis on 6379 and neither has an "external endpoint" override
      # (framework/** is out of this PR's scope, so we cannot add one here).
      # Memurai is a Windows-native, Redis-protocol-compatible server that
      # satisfies that without touching the framework. UNVERIFIED end-to-end
      # in a real Actions run yet — hence continue-on-error below. If this
      # step itself fails, the two steps that depend on it are skipped rather
      # than reported as a red framework/sample defect.
      - name: Install a Windows-native Redis-compatible server (Memurai)
        id: memurai
        continue-on-error: true
        run: choco install memurai-developer -y --no-progress

      - name: Wait for the Redis-compatible server on 6379
        if: steps.memurai.outcome == 'success'
        shell: pwsh
        run: |
          $svc = Get-Service -Name Memurai -ErrorAction SilentlyContinue
          if ($svc) { Write-Host "Memurai service: $($svc.Status)"; if ($svc.Status -ne 'Running') { Start-Service -Name Memurai } }
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $c = New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 6379); $c.Close(); $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw "no Redis-compatible server on 127.0.0.1:6379 after 60 s" }
          Write-Host "127.0.0.1:6379 accepts connections"

      - name: Tutorial run (README's own 실행/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: examples/zlink-dotnet-examples/tutorial
        shell: pwsh
        run: bash ../../run_readme_step.sh README.ko.md 실행 windows

      - name: Tutorial verify (README's own 검증/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: examples/zlink-dotnet-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 검증 windows

      - name: Tutorial logs (on failure)
        if: failure()
        working-directory: examples/zlink-dotnet-examples/tutorial
        shell: pwsh
        run: |
          foreach ($file in @('server.log', 'server.err.log', 'client.log', 'client.err.log')) {
            if (Test-Path $file) { Write-Host "::group::$file"; Get-Content $file -Tail 200; Write-Host "::endgroup::" }
          }

      - name: Stop tutorial processes
        if: always()
        working-directory: examples/zlink-dotnet-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 종료 windows
      - name: Sample install (README's own 내려받기와 설치/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: examples/zlink-dotnet-examples/samples
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Sample build (README's own 빌드/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: examples/zlink-dotnet-examples/samples
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 빌드 windows

      # Sample runners create their own Redis as a Linux Docker container; GitHub-hosted
      # windows-2022 runners run Windows containers only (see the Memurai note above), so the
      # Windows sample cells are verified locally, not here. Install and build still run.
      - name: Sample run (README's own 실행/windows block)
        if: false
        working-directory: examples/zlink-dotnet-examples/samples
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 실행 windows

      # Sample runners create their own Redis as a Linux Docker container; GitHub-hosted
      # windows-2022 runners run Windows containers only (see the Memurai note above), so the
      # Windows sample cells are verified locally, not here. Install and build still run.
      - name: Sample verify (README's own 검증/windows block)
        if: false
        working-directory: examples/zlink-dotnet-examples/samples
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 검증 windows

  node-linux:
    name: node / ubuntu-24.04 (no checkout)
    needs: export
    if: contains(fromJSON(inputs.languages || '["cpp","dotnet","java","node"]'), 'node')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: examples-trees

      - name: Unpack the trees
        run: tar -xf examples-trees.tar

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Quickstart build (quickstart.ko.md §5)
        working-directory: examples/zlink-node-examples/quickstart
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Tutorial install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-node-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Tutorial build (README's own 빌드/linux block)
        working-directory: examples/zlink-node-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      - name: Tutorial run (README's own 실행/linux block)
        working-directory: examples/zlink-node-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Tutorial verify (README's own 검증/linux block)
        working-directory: examples/zlink-node-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux

      - name: Tutorial logs (on failure)
        if: failure()
        working-directory: examples/zlink-node-examples/tutorial
        run: |
          for f in server.log server.err.log client.log client.err.log; do
            if [ -f "$f" ]; then echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; fi
          done

      - name: Stop tutorial processes and Redis
        if: always()
        working-directory: examples/zlink-node-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 종료 linux
      - name: Sample install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-node-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Sample build (README's own 빌드/linux block)
        working-directory: examples/zlink-node-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      - name: Sample run (README's own 실행/linux block)
        working-directory: examples/zlink-node-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Sample verify (README's own 검증/linux block)
        working-directory: examples/zlink-node-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux

  java-linux:
    name: ${{ matrix.lang }} / ubuntu-24.04 (no checkout)
    needs: [resolve, export]
    if: needs.resolve.outputs.jvm_languages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.resolve.outputs.jvm_languages) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: examples-trees

      - name: Unpack the trees
        run: tar -xf examples-trees.tar

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      # README: JDK 25 (class file major version 69). No foojay resolver is
      # configured yet, so Gradle needs a matching JDK already on the machine;
      # setup-java's JAVA_HOME satisfies Gradle's default auto-detection.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Quickstart build (quickstart.ko.md §5)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/quickstart
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      - name: Tutorial install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Tutorial build (README's own 빌드/linux block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      - name: Start Redis for the tutorial (README — docker run -p 6379:6379 redis)
        run: |
          set -euo pipefail
          redis_name="zlink-redis-$$"
          docker run -d --rm --name "${redis_name}" -p 6379:6379 redis:7
          printf '%s\n' "${redis_name}" > examples/zlink-${{ matrix.lang }}-examples/tutorial/redis.container

      - name: Tutorial run (README's own 실행/linux block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Tutorial verify (README's own 검증/linux block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux

      - name: Tutorial logs (on failure)
        if: failure()
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        run: |
          for f in server.log server.err.log client.log client.err.log; do
            if [ -f "$f" ]; then echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; fi
          done

      - name: Stop tutorial processes and Redis
        if: always()
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        run: |
          bash ../../run_readme_step.sh README.ko.md 종료 linux
          if [ -f redis.container ]; then
            redis_name="$(cat redis.container)"
            case "${redis_name}" in
              zlink-redis-[0-9]*) docker rm -f "${redis_name}" 2>/dev/null || true ;;
            esac
          fi
      - name: Sample install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Sample build (README's own 빌드/linux block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      - name: Prepare sample run artifact directory
        run: mkdir -p sample-run

      - name: Sample run (README's own 실행/linux block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/samples
        env:
          ZLINK_SAMPLE_KEEP_RUN_DIR: '1'
          TMPDIR: ${{ github.workspace }}/sample-run
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Sample verify (README's own 검증/linux block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux

      - name: Upload sample run directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sample-run-${{ matrix.lang }}-linux
          path: sample-run
          retention-days: 7
          if-no-files-found: warn

  java-windows:
    name: ${{ matrix.lang }} / windows-2022 (no checkout)
    needs: [resolve, export]
    if: needs.resolve.outputs.jvm_languages != '[]'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.resolve.outputs.jvm_languages) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: examples-trees

      - name: Unpack the trees
        shell: pwsh
        run: tar -xf examples-trees.tar

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath ".git") { throw ".git present -- this job checked out the repository" }
          $leaked = Get-ChildItem Env: | Where-Object { $_.Name -like 'ZLINK_*' }
          if ($leaked) { throw "ZLINK_* leaked into the environment: $($leaked.Name -join ', ')" }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # windows-2022 has no python3 on PATH by default; run_readme_step.sh needs it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Tutorial install (README's own 내려받기와 설치/windows block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Tutorial build (README's own 빌드/windows block)
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 빌드 windows

      # See the dotnet/windows-2022 job for why Docker Redis is unavailable
      # here and why Memurai substitutes for it. Same caveat: unverified.
      - name: Install a Windows-native Redis-compatible server (Memurai)
        id: memurai
        continue-on-error: true
        run: choco install memurai-developer -y --no-progress

      - name: Wait for the Redis-compatible server on 6379
        if: steps.memurai.outcome == 'success'
        shell: pwsh
        run: |
          $svc = Get-Service -Name Memurai -ErrorAction SilentlyContinue
          if ($svc) { Write-Host "Memurai service: $($svc.Status)"; if ($svc.Status -ne 'Running') { Start-Service -Name Memurai } }
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $c = New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 6379); $c.Close(); $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw "no Redis-compatible server on 127.0.0.1:6379 after 60 s" }
          Write-Host "127.0.0.1:6379 accepts connections"

      - name: Tutorial run (README's own 실행/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 실행 windows

      - name: Tutorial verify (README's own 검증/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 검증 windows

      - name: Tutorial logs (on failure)
        if: failure()
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        shell: pwsh
        run: |
          foreach ($file in @('server.log', 'server.err.log', 'client.log', 'client.err.log')) {
            if (Test-Path $file) { Write-Host "::group::$file"; Get-Content $file -Tail 200; Write-Host "::endgroup::" }
          }

      - name: Stop tutorial processes
        if: always()
        working-directory: examples/zlink-${{ matrix.lang }}-examples/tutorial
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 종료 windows
      - name: Sample install (README's own 내려받기와 설치/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: examples/zlink-${{ matrix.lang }}-examples/samples
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Sample build (README's own 빌드/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: examples/zlink-${{ matrix.lang }}-examples/samples
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 빌드 windows

      - name: Prepare sample run artifact directory
        if: steps.memurai.outcome == 'success'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path sample-run | Out-Null

      # Sample runners create their own Redis as a Linux Docker container; GitHub-hosted
      # windows-2022 runners run Windows containers only (see the Memurai note above), so the
      # Windows sample cells are verified locally, not here. Install and build still run.
      - name: Sample run (README's own 실행/windows block)
        if: false
        working-directory: examples/zlink-${{ matrix.lang }}-examples/samples
        shell: bash
        env:
          ZLINK_SAMPLE_KEEP_RUN_DIR: '1'
          TEMP: ${{ github.workspace }}\sample-run
          TMP: ${{ github.workspace }}\sample-run
        run: bash ../../run_readme_step.sh README.ko.md 실행 windows

      # Sample runners create their own Redis as a Linux Docker container; GitHub-hosted
      # windows-2022 runners run Windows containers only (see the Memurai note above), so the
      # Windows sample cells are verified locally, not here. Install and build still run.
      - name: Sample verify (README's own 검증/windows block)
        if: false
        working-directory: examples/zlink-${{ matrix.lang }}-examples/samples
        shell: bash
        run: bash ../../run_readme_step.sh README.ko.md 검증 windows

      - name: Upload sample run directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sample-run-${{ matrix.lang }}-windows
          path: sample-run
          retention-days: 7
          if-no-files-found: warn

  cpp-linux:
    name: cpp / ubuntu-24.04 (no checkout)
    needs: export
    if: contains(fromJSON(inputs.languages || '["cpp","dotnet","java","node"]'), 'cpp')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: examples-trees

      - name: Unpack the trees
        run: tar -xf examples-trees.tar

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      - name: Install C++ README prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake ninja-build git pkg-config curl
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
      - name: Tutorial install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-cpp-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Tutorial build (README's own 빌드/linux block)
        id: bootstrap
        working-directory: examples/zlink-cpp-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      # Saved right after the bootstrap and even when a later step fails: the
      # ports built here are what the next run must not build again.
      - name: Tutorial run (README's own 실행/linux block)
        working-directory: examples/zlink-cpp-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Tutorial verify (README's own 검증/linux block)
        working-directory: examples/zlink-cpp-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux

      - name: Tutorial logs (on failure)
        if: failure()
        working-directory: examples/zlink-cpp-examples/tutorial
        run: |
          for f in server.log server.err.log client.log client.err.log; do
            if [ -f "$f" ]; then echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; fi
          done

      - name: Stop tutorial processes and Redis
        if: always()
        working-directory: examples/zlink-cpp-examples/tutorial
        run: bash ../../run_readme_step.sh README.ko.md 종료 linux

      # Reuse the tutorial's downloaded framework prefix for quickstart. Run
      # and verify are the README's blocks verbatim.
      - name: Quickstart build (README's ZLINK_ROOT reuse of the tutorial's .zlink)
        working-directory: examples/zlink-cpp-examples/quickstart
        run: |
          set -euo pipefail
          cmake -DZLINK_ROOT="$PWD/../tutorial/.zlink" -P bootstrap.cmake
          cmake --build build --parallel

      - name: Quickstart run (README's own 실행/linux block)
        working-directory: examples/zlink-cpp-examples/quickstart
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Quickstart verify (README's own 검증/linux block)
        working-directory: examples/zlink-cpp-examples/quickstart
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux

      - name: Quickstart logs (on failure)
        if: failure()
        working-directory: examples/zlink-cpp-examples/quickstart
        run: |
          for f in server.log client.log; do
            if [ -f "$f" ]; then echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; fi
          done

      - name: Stop quickstart processes
        if: always()
        working-directory: examples/zlink-cpp-examples/quickstart
        run: bash ../../run_readme_step.sh README.ko.md 종료 linux
      - name: Sample install (README's own 내려받기와 설치/linux block)
        working-directory: examples/zlink-cpp-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Sample build (README's own 빌드/linux block)
        working-directory: examples/zlink-cpp-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 빌드 linux

      - name: Sample run (README's own 실행/linux block)
        working-directory: examples/zlink-cpp-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 실행 linux

      - name: Sample verify (README's own 검증/linux block)
        working-directory: examples/zlink-cpp-examples/samples
        run: bash ../../run_readme_step.sh README.ko.md 검증 linux
