#     # Docs, plans, bench, perf, samples and scenario e2e never start this workflow (user decision 2026-09-09).
#     paths:
#       - ".github/workflows/framework-dotnet.yml"
#       - "scripts/ci/**"
#       - "framework/languages/dotnet/VERSION"
#       - "bindings/dotnet/VERSION"
#       - "framework/runtime/**"
#       - "framework/languages/dotnet/Directory.Build.props"
#       - "framework/languages/dotnet/Directory.Build.targets"
#       - "framework/languages/dotnet/Directory.Packages.props"
#       - "framework/languages/dotnet/nuget.config"
#       - "framework/languages/dotnet/Zlink.Framework.ci.slnf"
#       - "framework/languages/dotnet/src/**"
#       - "framework/languages/dotnet/tests/**"
#       - "framework/languages/dotnet/cross-language/**"
#       - "bindings/dotnet/src/Zlink/**"
#       - "bindings/dotnet/native/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_tests:
        description: Succeed without running tests when this language has no changed paths.
        required: false
        type: boolean
        default: false
      single_worker:
        description: Run tests with one worker for the nightly stress workflow.
        required: false
        type: boolean
        default: false
      queue_checks_only:
        description: Run the checks used to admit a pull request to the merge queue.
        required: false
        type: boolean
        default: false
      concurrency_key:
        description: Unique concurrency key supplied by the calling workflow.
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 18 * * *"
  # Mergify queue batches and backports run CI on their own mergify/ branches only;
  # main dependency pushes use the companion cache workflow.
  push:
    branches:
      - "mergify/**"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # CI builds the solution filter: src, tests, testapps and cross-language only.
  # Zlink.Framework.sln also carries the seven samples for developers (never built in CI).
  FRAMEWORK_SOLUTION: framework/languages/dotnet/Zlink.Framework.ci.slnf
  FRAMEWORK_UNIT_TESTS: framework/languages/dotnet/tests/Zlink.Framework.UnitTests/Zlink.Framework.UnitTests.csproj
  FRAMEWORK_CONTRACT_TESTS: framework/languages/dotnet/tests/Zlink.Framework.ContractTests/Zlink.Framework.ContractTests.csproj
  STREAM_CONNECTOR_TESTS: framework/languages/dotnet/tests/Systems.Zlink.Stream.Connector.Tests/Systems.Zlink.Stream.Connector.Tests.csproj
  REDIS_LOCATION_TESTS: framework/languages/dotnet/tests/Zlink.Framework.Locations.Redis.Tests/Zlink.Framework.Locations.Redis.Tests.csproj
  ETCD_LOCATION_TESTS: framework/languages/dotnet/tests/Zlink.Framework.Locations.Etcd.Tests/Zlink.Framework.Locations.Etcd.Tests.csproj
  ZLinkFrameworkTargetFrameworks: net8.0;net10.0

# One run per ref: a newer push to the same branch/PR cancels the run still in
# progress, so consecutive pushes do not pile up matrix jobs and starve the
# release workflows of runners.
concurrency:
  group: ${{ inputs.concurrency_key || github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-dotnet-binding:
    if: ${{ !inputs.skip_tests }}
    name: prepare-dotnet-binding
    runs-on: ${{ vars.ZLINK_LINUX_RUNNER && fromJSON(vars.ZLINK_LINUX_RUNNER) || 'ubuntu-24.04' }}
    outputs:
      binding_version: ${{ steps.versions.outputs.binding_version }}
      artifact_name: ${{ steps.versions.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Pack the public .NET binding contract
        id: versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/framework-dotnet-pack-binding.sh

      - name: Upload the binding package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.versions.outputs.artifact_name }}
          path: ${{ runner.temp }}/zlink-dotnet-binding/Zlink.*.nupkg
          if-no-files-found: error

  framework-dotnet:
    if: ${{ !inputs.skip_tests }}
    name: ${{ matrix.target.name }}
    # ZLINK_LINUX_RUNNER/ZLINK_WINDOWS_RUNNER (JSON label lists) move the x64 Linux/Windows
    # jobs to self-hosted runners; arm64 and macOS stay hosted. Queue, manual
    # and main cache runs do not execute fork PR code.
    runs-on: ${{ inputs.single_worker && matrix.target.name == 'linux-x64' && 'ubuntu-24.04' || (matrix.target.runner == 'ubuntu-24.04' && vars.ZLINK_LINUX_RUNNER && fromJSON(vars.ZLINK_LINUX_RUNNER)) || (matrix.target.runner == 'windows-latest' && vars.ZLINK_WINDOWS_RUNNER && fromJSON(vars.ZLINK_WINDOWS_RUNNER)) || matrix.target.runner }}
    needs:
      - prepare-dotnet-binding
    strategy:
      fail-fast: false
      matrix:
        # PR-stage queue checks and main queue batches run linux-x64 only: batches share
        # 20 hosted-runner slots and arm64 left 10+ batch jobs waiting (2026-11-21). Hosted macOS arm64 capacity runs out often enough
        # to fail whole batches, so macOS runs in schedule, manual and release runs.
        target: ${{ fromJSON(inputs.single_worker && '[{"name":"linux-x64","runner":"ubuntu-24.04","rid":"linux-x64","core_platform":"linux-x64"}]' || inputs.queue_checks_only && '[{"name":"linux-x64","runner":"ubuntu-24.04","rid":"linux-x64","core_platform":"linux-x64"}]' || startsWith(github.ref_name, 'mergify/merge-queue/') && '[{"name":"linux-x64","runner":"ubuntu-24.04","rid":"linux-x64","core_platform":"linux-x64"}]' || '[{"name":"linux-x64","runner":"ubuntu-24.04","rid":"linux-x64","core_platform":"linux-x64"},{"name":"linux-arm64","runner":"ubuntu-24.04-arm","rid":"linux-arm64","core_platform":"linux-arm64"},{"name":"osx-arm64","runner":"macos-15","rid":"osx-arm64","core_platform":"macos-arm64"}]') }}
        # Windows runs on schedule, manual and release runs; queue batches and queue checks omit Windows.
        include: ${{ fromJSON((inputs.single_worker || inputs.queue_checks_only || startsWith(github.ref_name, 'mergify/merge-queue/')) && '[]' || '[{"target":{"name":"win-x64","runner":"windows-latest","rid":"win-x64","core_platform":"windows-x64"}}]') }}
    env:
      ZLINK_SINGLE_WORKER: ${{ inputs.single_worker }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Reject private reflection in .NET tests
        run: python3 scripts/ci/check-dotnet-test-private-access.py

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: 20

      - name: Download the prepared .NET binding package
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare-dotnet-binding.outputs.artifact_name }}
          path: ${{ runner.temp }}/zlink-local-packages/nuget

      - name: Prepare local dependency packages
        shell: bash
        run: bash scripts/ci/framework-dotnet-prepare-packages.sh "${{ needs.prepare-dotnet-binding.outputs.artifact_name }}"
        id: packages

      - name: Prepare the Core release runtime for this platform
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/framework-dotnet-core-runtime.sh "${{ matrix.target.core_platform }}"

      - name: Verify the packaged public contract
        if: ${{ matrix.target.name == 'linux-x64' }}
        # release-dotnet.yml packs with the Directory.Build.props default target
        # framework; check the same package that is published.
        env:
          ZLinkFrameworkTargetFrameworks: net8.0
        run: bash framework/languages/dotnet/scripts/verify_packaged_contract.sh

      - name: Restore framework solution
        run: bash scripts/ci/framework-dotnet-solution.sh restore

      - name: Build framework solution (Debug)
        run: bash scripts/ci/framework-dotnet-solution.sh Debug

      - name: Build framework solution (Release)
        run: bash scripts/ci/framework-dotnet-solution.sh Release

      # Redis-backed tests fail instead of skipping once the job provides Redis (#4542).
      - name: Start Redis for Redis-backed tests
        if: ${{ startsWith(matrix.target.name, 'linux-') }}
        uses: ./.github/actions/test-redis

      - name: Run framework unit tests (Debug, net8.0)
        run: bash scripts/ci/dotnet-test.sh ${{ env.FRAMEWORK_UNIT_TESTS }} Debug net8.0

      - name: Run framework contract tests (Debug, net8.0)
        run: bash scripts/ci/dotnet-test.sh ${{ env.FRAMEWORK_CONTRACT_TESTS }} Debug net8.0

      - name: Run stream connector tests (Debug, net8.0)
        run: bash scripts/ci/dotnet-test.sh ${{ env.STREAM_CONNECTOR_TESTS }} Debug net8.0

      - name: Run Redis Location Store tests (Debug, net8.0)
        if: ${{ startsWith(matrix.target.name, 'linux-') }}
        run: bash scripts/ci/dotnet-test.sh ${{ env.REDIS_LOCATION_TESTS }} Debug net8.0

      # etcd provider tests use an in-process fake gRPC server; the live-etcd test skips
      # without ZLINK_ETCD_ENDPOINTS (#4077).
      - name: Run etcd Location Store tests (Debug, net8.0)
        run: bash scripts/ci/dotnet-test.sh ${{ env.ETCD_LOCATION_TESTS }} Debug net8.0

      - name: Run framework unit tests (Release, net10.0)
        run: bash scripts/ci/dotnet-test.sh ${{ env.FRAMEWORK_UNIT_TESTS }} Release net10.0

      - name: Run framework contract tests (Release, net10.0)
        run: bash scripts/ci/dotnet-test.sh ${{ env.FRAMEWORK_CONTRACT_TESTS }} Release net10.0

      - name: Run stream connector tests (Release, net10.0)
        run: bash scripts/ci/dotnet-test.sh ${{ env.STREAM_CONNECTOR_TESTS }} Release net10.0

      - name: Run etcd Location Store tests (Release, net10.0)
        run: bash scripts/ci/dotnet-test.sh ${{ env.ETCD_LOCATION_TESTS }} Release net10.0

      # macOS·Windows 실패는 이 기계에서 재현되지 않는다(#17, 0.19.0). TRX에는 테스트별
      # stdout과 stack이 들어 있어 raw 로그보다 원인을 좁히기 쉽다. 실패했을 때만 올린다.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-test-results-${{ matrix.target.name }}
          path: ${{ runner.temp }}/zlink-test-results/**
          retention-days: 14
          if-no-files-found: warn

      - name: Collect diagnostics and stop Redis
        if: always() && env.ZLINK_TEST_REDIS_CONTAINER != ''
        uses: ./.github/actions/test-redis-cleanup
        with:
          job-status: ${{ job.status }}

  framework-dotnet-gate:
    if: ${{ always() && !cancelled() && (inputs.skip_tests || needs.framework-dotnet.result == 'success') }}
    name: dotnet-release-gate
    runs-on: ${{ inputs.skip_tests && (vars.ZLINK_LINUX_RUNNER && fromJSON(vars.ZLINK_LINUX_RUNNER) || 'ubuntu-24.04') || vars.ZLINK_LINUX_RUNNER && fromJSON(vars.ZLINK_LINUX_RUNNER) || 'ubuntu-24.04' }}
    needs:
      - framework-dotnet
    steps:
      - name: Confirm unchanged language
        if: ${{ inputs.skip_tests }}
        run: echo "No changed dotnet paths; tests are not required."

      - name: Checkout repository for conformance validation
        if: ${{ !inputs.skip_tests }}
        uses: actions/checkout@v5

      - name: Setup Node.js for conformance validation
        if: ${{ !inputs.skip_tests }}
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: 22

      - name: Verify framework relocation conformance inventory
        if: ${{ !inputs.skip_tests }}
        run: bash scripts/ci/verify-framework-relocation-conformance.sh

      - name: Confirm matrix completed
        if: ${{ !inputs.skip_tests }}
        run: |
          echo "Framework .NET release gate passed."
          echo "RID matrix: win-x64, linux-x64, linux-arm64, osx-arm64 (Core ships no macOS Intel release)"
          echo "Test matrix: framework unit, contract, and stream connector tests on net8.0 Debug and net10.0 Release"
