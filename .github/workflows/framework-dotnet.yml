name: Framework .NET

on:
  push:
    branches:
      - main
    # Production code only: runtime sources, unit/contract tests and the cross-language host.
    # Docs, plans, bench, perf, samples and scenario e2e never start this workflow (user decision 2026-09-09).
    paths:
      - ".github/workflows/framework-dotnet.yml"
      - "scripts/ci/**"
      - "framework/languages/dotnet/VERSION"
      - "bindings/dotnet/VERSION"
      - "framework/runtime/**"
      - "framework/languages/dotnet/Directory.Build.props"
      - "framework/languages/dotnet/Directory.Build.targets"
      - "framework/languages/dotnet/Directory.Packages.props"
      - "framework/languages/dotnet/nuget.config"
      - "framework/languages/dotnet/Zlink.Framework.ci.slnf"
      - "framework/languages/dotnet/src/**"
      - "framework/languages/dotnet/tests/**"
      - "framework/languages/dotnet/cross-language/**"
      - "bindings/dotnet/src/Zlink/**"
      - "bindings/dotnet/native/**"
  pull_request:
    branches:
      - main
    # Production code only: runtime sources, unit/contract tests and the cross-language host.
    # Docs, plans, bench, perf, samples and scenario e2e never start this workflow (user decision 2026-09-09).
    paths:
      - ".github/workflows/framework-dotnet.yml"
      - "scripts/ci/**"
      - "framework/languages/dotnet/VERSION"
      - "bindings/dotnet/VERSION"
      - "framework/runtime/**"
      - "framework/languages/dotnet/Directory.Build.props"
      - "framework/languages/dotnet/Directory.Build.targets"
      - "framework/languages/dotnet/Directory.Packages.props"
      - "framework/languages/dotnet/nuget.config"
      - "framework/languages/dotnet/Zlink.Framework.ci.slnf"
      - "framework/languages/dotnet/src/**"
      - "framework/languages/dotnet/tests/**"
      - "framework/languages/dotnet/cross-language/**"
      - "bindings/dotnet/src/Zlink/**"
      - "bindings/dotnet/native/**"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # CI builds the solution filter: src, tests, testapps and cross-language only.
  # Zlink.Framework.sln also carries the seven samples for developers (never built in CI).
  FRAMEWORK_SOLUTION: framework/languages/dotnet/Zlink.Framework.ci.slnf
  FRAMEWORK_UNIT_TESTS: framework/languages/dotnet/tests/Zlink.Framework.UnitTests/Zlink.Framework.UnitTests.csproj
  FRAMEWORK_CONTRACT_TESTS: framework/languages/dotnet/tests/Zlink.Framework.ContractTests/Zlink.Framework.ContractTests.csproj
  STREAM_CONNECTOR_TESTS: framework/languages/dotnet/tests/Systems.Zlink.Stream.Connector.Tests/Systems.Zlink.Stream.Connector.Tests.csproj
  ZLinkFrameworkTargetFrameworks: net8.0;net10.0

# One run per ref: a newer push to the same branch/PR cancels the run still in
# progress, so consecutive pushes do not pile up matrix jobs and starve the
# release workflows of runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-dotnet-binding:
    name: prepare-dotnet-binding
    runs-on: ubuntu-24.04
    outputs:
      binding_version: ${{ steps.versions.outputs.binding_version }}
      artifact_name: ${{ steps.versions.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Pack the public .NET binding contract
        id: versions
        shell: bash
        run: |
          binding_version=$(sed -n 's/^ZLINK_BINDING_VERSION=//p' bindings/dotnet/VERSION)
          core_version=$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)
          test -n "${binding_version}" || { echo "::error::binding version is missing" >&2; exit 1; }
          test -n "${core_version}" || { echo "::error::Core version is missing" >&2; exit 1; }
          core_prefix=$(bash scripts/local-package/core/fetch-release.sh \
            --version "${core_version}" \
            --platform linux-x64 \
            --cache-dir .artifacts/core-release)
          package_root="${RUNNER_TEMP}/zlink-dotnet-binding"
          mkdir -p "${package_root}"
          dotnet pack bindings/dotnet/src/Zlink/Zlink.csproj \
            -c Release \
            -o "${package_root}" \
            "-p:ZLinkCoreVersion=${core_version}" \
            "-p:ZLinkCoreSource=local" \
            "-p:ZLinkLinuxX64NativeRoot=${core_prefix}/lib" \
            "-p:ZLinkCoreProvenancePath=${core_prefix}/share/zlink/core-package-provenance.json"
          test -s "${package_root}/Zlink.${binding_version}.nupkg" || {
            echo "::error::binding package was not created" >&2
            exit 1
          }
          artifact_name="zlink-dotnet-binding-${binding_version}"
          echo "binding_version=${binding_version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload the binding package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.versions.outputs.artifact_name }}
          path: ${{ runner.temp }}/zlink-dotnet-binding/Zlink.*.nupkg
          if-no-files-found: error

  framework-dotnet:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    needs:
      - prepare-dotnet-binding
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: win-x64
            runner: windows-latest
            rid: win-x64
            core_platform: windows-x64
          - name: win-arm64
            runner: windows-11-arm
            rid: win-arm64
            core_platform: windows-arm64
          - name: linux-x64
            runner: ubuntu-24.04
            rid: linux-x64
            core_platform: linux-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            core_platform: linux-arm64
          - name: osx-arm64
            runner: macos-15
            rid: osx-arm64
            core_platform: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Download the prepared .NET binding package
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare-dotnet-binding.outputs.artifact_name }}
          path: ${{ runner.temp }}/zlink-local-packages/nuget

      - name: Prepare local dependency packages
        shell: bash
        run: |
          # The framework consumes the public binding package contract. During
          # pre-release CI the package is packed from this checkout against the
          # verified Core release instead of waiting for nuget.org publication.
          package_root="${RUNNER_TEMP}/zlink-local-packages"
          nuget_source="${package_root}/nuget"
          mkdir -p "${nuget_source}"
          binding_version=$(sed -n 's/^ZLINK_BINDING_VERSION=//p' bindings/dotnet/VERSION)
          if [ -z "${binding_version}" ]; then
            echo "::error::Zlink binding version not found in bindings/dotnet/VERSION" >&2
            exit 1
          fi
          binding_artifact="${{ needs.prepare-dotnet-binding.outputs.artifact_name }}"
          test -n "${binding_artifact}" || {
            echo "::error::binding artifact name is missing" >&2
            exit 1
          }
          test -s "${nuget_source}/Zlink.${binding_version}.nupkg" \
            || { echo "::error::Downloaded Zlink ${binding_version} package is missing" >&2; exit 1; }
          dotnet pack framework/languages/dotnet/src/Zlink.HttpClient/Zlink.HttpClient.csproj -c Release -o "${nuget_source}"
          echo "ZLINK_LOCAL_PACKAGE_ROOT=${package_root}" >> "${GITHUB_ENV}"
          echo "ZLinkLocalPackageRoot=${package_root}" >> "${GITHUB_ENV}"
          echo "binding_version=${binding_version}" >> "${GITHUB_OUTPUT}"
        id: packages

      - name: Prepare the Core release runtime for this platform
        shell: bash
        run: |
          # The released binding package carries the linux-x64 runtime only; the
          # other RIDs run the tests against the verified Core release archive.
          # The binding package version and the Core release it embeds differ; VERSION owns Core.
          core_version=$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)
          core_prefix=$(bash scripts/local-package/core/fetch-release.sh \
            --version "${core_version}" \
            --platform "${{ matrix.target.core_platform }}" \
            --cache-dir .artifacts/core-release)
          case "${{ matrix.target.core_platform }}" in
            windows-*) library="${core_prefix}/bin/zlink.dll" ;;
            macos-*) library="${core_prefix}/lib/libzlink.dylib" ;;
            *) library="${core_prefix}/lib/libzlink.so.${core_version}" ;;
          esac
          test -f "${library}" || { echo "::error::Core runtime not found at ${library}" >&2; ls -R "${core_prefix}" >&2; exit 1; }
          if [ "${RUNNER_OS}" = "Windows" ]; then
            library=$(cygpath -w "${library}")
          fi
          echo "ZLINK_LIBRARY_PATH=${library}" >> "${GITHUB_ENV}"

      - name: Restore framework solution
        run: dotnet restore ${{ env.FRAMEWORK_SOLUTION }}

      - name: Build framework solution (Debug)
        run: dotnet build ${{ env.FRAMEWORK_SOLUTION }} -c Debug --no-restore

      - name: Build framework solution (Release)
        run: dotnet build ${{ env.FRAMEWORK_SOLUTION }} -c Release --no-restore

      - name: Run framework unit tests (Debug, net8.0)
        run: bash scripts/ci/dotnet-test-retry.sh ${{ env.FRAMEWORK_UNIT_TESTS }} Debug net8.0

      - name: Run framework contract tests (Debug, net8.0)
        run: bash scripts/ci/dotnet-test-retry.sh ${{ env.FRAMEWORK_CONTRACT_TESTS }} Debug net8.0

      - name: Run stream connector tests (Debug, net8.0)
        run: bash scripts/ci/dotnet-test-retry.sh ${{ env.STREAM_CONNECTOR_TESTS }} Debug net8.0

      - name: Run framework unit tests (Release, net10.0)
        run: bash scripts/ci/dotnet-test-retry.sh ${{ env.FRAMEWORK_UNIT_TESTS }} Release net10.0

      - name: Run framework contract tests (Release, net10.0)
        run: bash scripts/ci/dotnet-test-retry.sh ${{ env.FRAMEWORK_CONTRACT_TESTS }} Release net10.0

      - name: Run stream connector tests (Release, net10.0)
        run: bash scripts/ci/dotnet-test-retry.sh ${{ env.STREAM_CONNECTOR_TESTS }} Release net10.0

      # macOS·Windows 실패는 이 기계에서 재현되지 않는다(#17, 0.19.0). TRX에는 테스트별
      # stdout과 stack이 들어 있어 raw 로그보다 원인을 좁히기 쉽다. 실패했을 때만 올린다.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-test-results-${{ matrix.target.name }}
          path: ${{ runner.temp }}/zlink-test-results/**
          retention-days: 14
          if-no-files-found: warn

  framework-dotnet-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    needs:
      - framework-dotnet
    steps:
      - name: Confirm matrix completed
        run: |
          echo "Framework .NET release gate passed."
          echo "RID matrix: win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64 (Core ships no macOS Intel release)"
          echo "Test matrix: framework unit, contract, and stream connector tests on net8.0 Debug and net10.0 Release"
