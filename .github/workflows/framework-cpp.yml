name: Framework C++ Verify

# Framework C++ has a heavier bootstrap than the checks in pr-verify.yml, so it
# is kept separate. The workflow-level filter prevents unrelated PRs from
# allocating a runner at all.
on:
# Verification moved to local unit tests before merge; CI runs on request
# (user decision 2026-09-17). Uncomment the blocks below to restore the
# automatic triggers.
#  push:
#    branches:
#      - main
#    paths:
#      - ".github/workflows/framework-cpp.yml"
#      - ".github/workflows/framework-cpp-system-toolchain.cmake"
#      - ".github/actions/msvc-env/**"
#      - "VERSION"
#      - "core/**"
#      - "bindings/cpp/**"
#      - "framework/languages/cpp/**"
#      - "framework/runtime/**"
#      - "scripts/local-package/build-windows.ps1"
#      - "scripts/local-package/core/**"
#      - "scripts/local-package/cpp/**"
#      - "scripts/local-package/sync-version.py"
#  pull_request:
#    branches:
#      - main
#    paths:
#      - ".github/workflows/framework-cpp.yml"
#      - ".github/workflows/framework-cpp-system-toolchain.cmake"
#      - ".github/actions/msvc-env/**"
#      - "VERSION"
#      - "core/**"
#      - "bindings/cpp/**"
#      - "framework/languages/cpp/**"
#      - "framework/runtime/**"
#      - "scripts/local-package/build-windows.ps1"
#      - "scripts/local-package/core/**"
#      - "scripts/local-package/cpp/**"
#      - "scripts/local-package/sync-version.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HIREDIS_VERSION: "1.2.0"
  REDIS_PLUS_PLUS_VERSION: "1.3.13"
  APT_CACHE_DIR: ${{ github.workspace }}/.cache/framework-cpp/apt
  THIRD_PARTY_STAGE: ${{ github.workspace }}/.cache/framework-cpp/deps
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.cache/framework-cpp/vcpkg-installed
  ZLINK_LOCAL_PACKAGE_ROOT: ${{ github.workspace }}/.artifacts/framework-cpp-ci

jobs:
  framework-cpp:
    name: Framework C++ unit and contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: framework-cpp-apt-${{ runner.os }}-24.04-${{ runner.arch }}-v1

      - name: Install system dependencies
        run: |
          set -euo pipefail
          mkdir -p "${APT_CACHE_DIR}"
          sudo install -d -o _apt -g root -m 0755 "${APT_CACHE_DIR}/partial"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="${APT_CACHE_DIR}" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Binary::apt::APT::Keep-Downloaded-Packages=true \
            install -y \
              build-essential cmake ninja-build git pkg-config curl \
              libboost-all-dev libgtest-dev libgmock-dev liblz4-dev \
              libuv1-dev nlohmann-json3-dev libssl-dev \
              protobuf-compiler libprotobuf-dev \
              ripgrep

      - name: Cache hiredis and redis-plus-plus
        id: redis-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THIRD_PARTY_STAGE }}
          key: framework-cpp-redis-${{ runner.os }}-24.04-${{ runner.arch }}-hiredis-${{ env.HIREDIS_VERSION }}-redis-plus-plus-${{ env.REDIS_PLUS_PLUS_VERSION }}-v1

      - name: Build hiredis and redis-plus-plus
        if: steps.redis-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/framework-cpp-deps-source"
          mkdir -p "${source_root}" "${THIRD_PARTY_STAGE}"

          git clone --depth 1 --branch "v${HIREDIS_VERSION}" \
            https://github.com/redis/hiredis.git "${source_root}/hiredis"
          cmake -S "${source_root}/hiredis" -B "${source_root}/hiredis-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DDISABLE_TESTS=ON
          cmake --build "${source_root}/hiredis-build" --parallel 2
          DESTDIR="${THIRD_PARTY_STAGE}" \
            cmake --install "${source_root}/hiredis-build"

          # redis++ configure must see hiredis-config.cmake at its final prefix.
          sudo cp -a "${THIRD_PARTY_STAGE}/usr/local/." /usr/local/
          sudo ldconfig

          git clone --depth 1 --branch "${REDIS_PLUS_PLUS_VERSION}" \
            https://github.com/sewenew/redis-plus-plus.git \
            "${source_root}/redis-plus-plus"
          cmake -S "${source_root}/redis-plus-plus" \
            -B "${source_root}/redis-plus-plus-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DREDIS_PLUS_PLUS_BUILD_ASYNC=libuv \
            -DREDIS_PLUS_PLUS_CXX_STANDARD=17 \
            -DREDIS_PLUS_PLUS_BUILD_TEST=OFF
          cmake --build "${source_root}/redis-plus-plus-build" --parallel 2
          DESTDIR="${THIRD_PARTY_STAGE}" \
            cmake --install "${source_root}/redis-plus-plus-build"

      - name: Install cached hiredis and redis-plus-plus
        run: |
          set -euo pipefail
          sudo cp -a "${THIRD_PARTY_STAGE}/usr/local/." /usr/local/
          sudo ldconfig
          test -f /usr/local/lib/cmake/hiredis/hiredis-config.cmake
          test -f /usr/local/share/cmake/redis++/redis++-config.cmake

      # Ubuntu 24.04 does not package opentelemetry-cpp. Install only that port;
      # allowing the project manifest to run would rebuild all system packages.
      - name: Resolve the runner vcpkg
        id: vcpkg
        run: |
          set -euo pipefail
          vcpkg_root="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
          test -x "${vcpkg_root}/vcpkg"
          test -f "${vcpkg_root}/scripts/buildsystems/vcpkg.cmake"
          revision="$(git -C "${vcpkg_root}" rev-parse HEAD 2>/dev/null \
            || "${vcpkg_root}/vcpkg" version | head -n 1 | sha256sum | cut -d' ' -f1)"
          echo "VCPKG_ROOT=${vcpkg_root}" >> "${GITHUB_ENV}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Cache OpenTelemetry C++
        id: opentelemetry-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: framework-cpp-opentelemetry-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.revision }}-v1

      - name: Install OpenTelemetry C++
        if: steps.opentelemetry-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          "${VCPKG_ROOT}/vcpkg" install opentelemetry-cpp:x64-linux \
            --x-install-root="${VCPKG_INSTALLED_DIR}" \
            --clean-after-build

      - name: Build the checkout Core package
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)"
          core_prefix="${ZLINK_LOCAL_PACKAGE_ROOT}/install/zlink-core/${core_version}"
          cmake -S core -B "${RUNNER_TEMP}/framework-cpp-core-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${core_prefix}" \
            -DENABLE_LTO=OFF \
            -DZLINK_BUILD_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DWITH_DOCS=OFF
          cmake --build "${RUNNER_TEMP}/framework-cpp-core-build" \
            --parallel 2 --target install

      - name: Build the checkout C++ binding package
        env:
          ZLINK_BINDING_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)"
          bash scripts/local-package/cpp/build-wsl.sh \
            --core-prefix \
            "${ZLINK_LOCAL_PACKAGE_ROOT}/install/zlink-core/${core_version}"

      - name: Configure and build Framework C++ tests
        working-directory: framework/languages/cpp
        run: |
          set -euo pipefail
          cmake --preset linux-ninja-release \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/.github/workflows/framework-cpp-system-toolchain.cmake" \
            -DZLINK_FRAMEWORK_CPP_BUILD_SAMPLES=OFF \
            -DZLINK_FRAMEWORK_CPP_BUILD_E2E=OFF \
            -DZLINK_FRAMEWORK_CPP_BUILD_CROSS_LANGUAGE=OFF
          cmake --build --preset linux-ninja-release --parallel 2

      - name: Run Framework C++ unit and contract tests
        working-directory: framework/languages/cpp
        run: |
          # No test is excluded. sample_parity, layout_contract and
          # common_e2e_inventory were once believed to fail on main; they pass,
          # and all three read only the source tree, so BUILD_SAMPLES=OFF and
          # BUILD_E2E=OFF above do not change their result. common_e2e_inventory
          # shells out to rg, which is why ripgrep is installed above.
          ctest --preset linux-ninja-release \
            -L 'framework-unit|framework-contract'

  framework-cpp-windows:
    name: win-x64 / Framework C++ unit and contract tests
    runs-on: windows-latest
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\.cache\framework-cpp\vcpkg-installed
      ZLINK_LOCAL_PACKAGE_ROOT: ${{ github.workspace }}\.artifacts\windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup MSVC environment
        uses: ./.github/actions/msvc-env
        with:
          arch: x64

      - name: Resolve the runner vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgCommand = Get-Command vcpkg.exe -ErrorAction Stop
            $vcpkgRoot = Split-Path -Parent $vcpkgCommand.Source
          }
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          $toolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path -LiteralPath $vcpkg -PathType Leaf)) {
            throw "vcpkg.exe was not found at $vcpkg"
          }
          if (-not (Test-Path -LiteralPath $toolchain -PathType Leaf)) {
            throw "vcpkg toolchain was not found at $toolchain"
          }
          $revision = (& git -C $vcpkgRoot rev-parse HEAD 2>$null)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($revision)) {
            $revision = (Get-FileHash -LiteralPath $vcpkg -Algorithm SHA256).Hash.ToLowerInvariant()
          } else {
            $revision = $revision.Trim()
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VCPKG_ROOT=$vcpkgRoot"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "revision=$revision"

      - name: Cache Framework C++ dependencies
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: framework-cpp-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('framework/languages/cpp/vcpkg.json') }}-v1

      - name: Install Framework C++ dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") install `
            --x-manifest-root="framework/languages/cpp" `
            --x-install-root="$env:VCPKG_INSTALLED_DIR" `
            --triplet=x64-windows `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }

      - name: Ensure ripgrep is available
        shell: pwsh
        run: |
          if (-not (Get-Command rg.exe -ErrorAction SilentlyContinue)) {
            choco install ripgrep --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "ripgrep installation failed with exit code $LASTEXITCODE"
            }
          }

      - name: Fetch the Core release package
        id: core
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath "VERSION" `
            -Pattern "^LIBZLINK_VERSION=(.+)$").Matches.Groups[1].Value
          $cacheDir = Join-Path $env:RUNNER_TEMP "zlink-core-release"
          $corePrefix = (& .\scripts\local-package\core\fetch-release.ps1 `
            -Version $version `
            -Platform windows-x64 `
            -CacheDir $cacheDir | Select-Object -Last 1).Trim()
          if (-not (Test-Path -LiteralPath $corePrefix -PathType Container)) {
            throw "Core release prefix was not created: $corePrefix"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ZLINK_CORE_PACKAGE_PREFIX=$corePrefix"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $corePrefix "bin")
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "prefix=$corePrefix"

      - name: Build the checkout C++ binding package
        shell: pwsh
        run: |
          .\scripts\local-package\cpp\build-windows.ps1 `
            -CorePrefix "${{ steps.core.outputs.prefix }}"

      - name: Configure and build Framework C++ tests
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "framework-cpp-windows-build"
          .\framework\languages\cpp\build-windows.ps1 `
            -BuildDir $buildDir `
            -LocalPackageRoot $env:ZLINK_LOCAL_PACKAGE_ROOT `
            -CorePackagePrefix "${{ steps.core.outputs.prefix }}" `
            -VcpkgInstalledDir $env:VCPKG_INSTALLED_DIR `
            -Configuration Release `
            -Parallel 2 `
            -IncludeTests
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "FRAMEWORK_CPP_BUILD_DIR=$buildDir"

      - name: Verify Framework C++ tests are registered
        shell: pwsh
        run: |
          $listing = @(& ctest `
            --test-dir $env:FRAMEWORK_CPP_BUILD_DIR `
            -C Release `
            -N `
            -L "framework-unit|framework-contract")
          $exitCode = $LASTEXITCODE
          $listing | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "ctest discovery failed with exit code $exitCode"
          }
          $summary = $listing | Select-String -Pattern "Total Tests:\s*(\d+)" | Select-Object -Last 1
          if ($null -eq $summary) {
            throw "ctest discovery did not report a test count"
          }
          $testCount = [int]$summary.Matches[0].Groups[1].Value
          if ($testCount -lt 1) {
            throw "ctest discovered no Framework C++ unit or contract tests"
          }
          Write-Host "Registered Framework C++ unit/contract tests: $testCount"

      - name: Assert gtest binaries register their cases
        shell: pwsh
        run: |
          # ctest counts registered tests, not the cases a binary runs. A
          # gtest binary can link, register nothing, exit 0 and be scored as
          # a pass (#422), so ask each one what it actually holds.
          $targets = @(
            "test_cpp_framework_opaque_store_providers",
            "test_cpp_framework_store_location_resolvers",
            "test_cpp_framework_in_memory_location_store",
            "test_cpp_framework_location_lifecycle",
            "test_cpp_framework_location_runtime",
            "test_cpp_framework_location_key_codec")
          foreach ($target in $targets) {
            $exe = Join-Path $env:FRAMEWORK_CPP_BUILD_DIR "Release/$target.exe"
            if (-not (Test-Path $exe)) { throw "missing gtest binary: $exe" }
            $cases = (& $exe --gtest_list_tests 2>&1 |
              Select-String -Pattern "^  S").Count
            if ($cases -lt 1) {
              throw "$target registered no gtest case; the binary links a " +
                    "GoogleTest instance its registrations do not reach"
            }
            Write-Host "$target : $cases cases"
          }

      - name: Run Framework C++ unit and contract tests
        shell: pwsh
        run: |
          ctest `
            --test-dir $env:FRAMEWORK_CPP_BUILD_DIR `
            -C Release `
            --output-on-failure `
            -L "framework-unit|framework-contract"
          if ($LASTEXITCODE -ne 0) {
            throw "Framework C++ tests failed with exit code $LASTEXITCODE"
          }

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: framework-cpp-test-results-win-x64
          path: |
            ${{ runner.temp }}/framework-cpp-windows-build/Testing/**
            ${{ github.workspace }}/.artifacts/windows/logs/**
          retention-days: 14
          if-no-files-found: warn
