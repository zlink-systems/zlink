name: Mirror examples repositories

# Owns one rule (#831): each language's public, read-only examples
# repository (zlink-systems/zlink-<lang>-examples) holds the
# quickstart/tutorial/samples tree of the *released* framework version —
# `main` is that release plus every fix merged on top of it, and `vA.B.C`
# tags mark the releases. Readers `git clone` that repository instead of
# downloading release zips; the monorepo stays the only place the code is
# edited (the guides read it with `--8<--`, sync-version.py moves its pins,
# framework-tutorial.yml builds it against the runtime in the same PR).
#
# Two triggers, one rule:
# - a framework release calls this workflow (workflow_call from
#   framework-release.yml / release-dotnet.yml) for one language after that
#   language's packages are published and its tutorial verified; the run
#   mirrors that tree and tags it `vA.B.C`. A tag push itself does not run
#   this workflow: at tag time the packages are not on the registry yet, so
#   the smoke would fail for every language and nothing would be pushed (#884);
# - a push to `main` that touches an examples path mirrors the tree as a plain
#   commit — but only for a language whose `framework/languages/<lang>/VERSION`
#   is already tagged. Between the version-bump PR and the tag, main's pins
#   name unpublished packages, so that language is skipped (the release run
#   mirrors it). The trees reference published packages only, so anything
#   else on main builds for a reader today.
#
# The tree is built by scripts/tutorial/export_examples.py at the tag and
# verified first by examples-smoke.yml in jobs that never checkout the
# repository: nothing reaches a public mirror that does not build from its
# own README. A failed smoke leaves the mirror at the previous release —
# re-run this workflow (workflow_dispatch with the tag) after the fix ships.
#
# Push credentials are one write-only deploy key per mirror repository
# (EXAMPLES_MIRROR_KEY_<LANG> secrets, doc/building/release-accounts.ko.md).
# GITHUB_TOKEN cannot push to another repository.
on:
  workflow_call:
    inputs:
      ref:
        description: 'The framework tag to mirror (framework/vA.B.C or framework-<lang>/vA.B.C)'
        required: true
        type: string
      language:
        description: 'The one language whose packages the caller has published and verified'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'framework/languages/*/quickstart/**'
      - 'framework/languages/*/tutorial/**'
      - 'framework/languages/*/samples/**'
      - 'framework/languages/engines/**'
      - 'scripts/tutorial/export_examples.py'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/examples-mirror.yml'
      - '.github/workflows/examples-smoke.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'What to mirror: a framework tag (framework/vA.B.C or framework-<lang>/vA.B.C, also tagged on the mirror) or main'
        required: true
        default: main
        type: string

# One run per ref and language. A single group for the whole workflow kept
# only one *pending* run — GitHub cancels the older pending run in a group
# when a newer one queues — so the four framework-<lang>/v0.20.0 tags pushed
# back to back lost three of their runs. Per-language runs push to different
# mirrors, so they never race; `main` runs touch the same mirrors but arrive
# far apart. (In a called workflow `github.workflow` is the caller's name.)
concurrency:
  group: examples-mirror-${{ inputs.ref || github.ref }}-${{ inputs.language || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve ref to languages
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      # Empty on a main push; the mirror gets a `v<version>` tag only for a tag run.
      version: ${{ steps.pick.outputs.version }}
      languages: ${{ steps.pick.outputs.languages }}
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-tags: true
          fetch-depth: 0

      - id: pick
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          CALL_LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          ref="${DISPATCH_REF:-${GITHUB_REF_NAME}}"
          version=""
          released() {
            local lang="$1"
            local declared="$2"
            git rev-parse -q --verify "refs/tags/framework-${lang}/v${declared}" >/dev/null \
              || git rev-parse -q --verify "refs/tags/framework/v${declared}" >/dev/null
          }
          append_target() {
            if [ "${languages}" = '[]' ]; then
              languages="[\"$1\"]"
            else
              languages="${languages%]},\"$1\"]"
            fi
          }
          case "${ref}" in
            framework/v*) languages='["cpp","dotnet","java","node"]' ;;
            framework-cpp/v*) languages='["cpp"]' ;;
            framework-dotnet/v*) languages='["dotnet"]' ;;
            framework-java/v*) languages='["java"]' ;;
            framework-node/v*) languages='["node"]' ;;
            main)
              # A language is mirrored from main only when the version its
              # VERSION file names is already released (tagged).
              languages="["
              for lang in cpp dotnet java node; do
                declared="$(sed -n 's/^ZLINK_FRAMEWORK_VERSION=//p' "framework/languages/${lang}/VERSION")"
                if released "${lang}" "${declared}"; then
                  languages="${languages}\"${lang}\","
                else
                  echo "::notice::${lang}: VERSION ${declared} is not tagged yet; skipped until the release tag mirrors it"
                fi
              done
              languages="${languages%,}]"
              ;;
            *) echo "::error::not a framework tag or main: ${ref}"; exit 1 ;;
          esac
          if [[ "${ref}" == main || "${ref}" == framework/v* ]]; then
            dotnet_version="$(sed -n 's/^ZLINK_FRAMEWORK_VERSION=//p' framework/languages/dotnet/VERSION)"
            node_version="$(sed -n 's/^ZLINK_FRAMEWORK_VERSION=//p' framework/languages/node/VERSION)"
            if [ -d framework/languages/engines/Server ] \
               && released dotnet "${dotnet_version}"; then
              append_target engine-server
            fi
            if [ -d framework/languages/engines/Unity ] \
               && released dotnet "${dotnet_version}" \
               && released node "${node_version}"; then
              append_target unity
            fi
          fi
          # A release call mirrors the one language the caller published; the
          # other languages' packages for the same version may not exist yet.
          if [ -n "${CALL_LANGUAGE}" ]; then
            case "${languages}" in
              *"\"${CALL_LANGUAGE}\""*) languages="[\"${CALL_LANGUAGE}\"]" ;;
              *) echo "::error::${ref} does not release ${CALL_LANGUAGE}"; exit 1 ;;
            esac
          fi
          if [ "${ref}" != main ]; then
            version="${ref##*/v}"
            if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag ${ref} does not end in /vA.B.C"; exit 1
            fi
          fi
          targets="$(jq -cn --argjson enabled "${languages}" '
            [
              {id:"cpp", mirror:"zlink-systems/zlink-cpp-examples",
               tree:".artifacts/examples/zlink-cpp-examples", source_path:"framework/languages/cpp",
               secret:"EXAMPLES_MIRROR_KEY_CPP"},
              {id:"dotnet", mirror:"zlink-systems/zlink-dotnet-examples",
               tree:".artifacts/examples/zlink-dotnet-examples", source_path:"framework/languages/dotnet",
               secret:"EXAMPLES_MIRROR_KEY_DOTNET"},
              {id:"java", mirror:"zlink-systems/zlink-java-examples",
               tree:".artifacts/examples/zlink-java-examples", source_path:"framework/languages/java",
               secret:"EXAMPLES_MIRROR_KEY_JAVA"},
              {id:"node", mirror:"zlink-systems/zlink-node-examples",
               tree:".artifacts/examples/zlink-node-examples", source_path:"framework/languages/node",
               secret:"EXAMPLES_MIRROR_KEY_NODE"},
              {id:"engine-server", mirror:"zlink-systems/zlink-engine-server",
               tree:".artifacts/examples/zlink-engine-server",
               source_path:"framework/languages/engines/Server",
               secret:"EXAMPLES_MIRROR_KEY_ENGINE_SERVER"},
              {id:"unity", mirror:"zlink-systems/zlink-unity-examples",
               tree:".artifacts/examples/zlink-unity-examples",
               source_path:"framework/languages/engines/Unity",
               secret:"EXAMPLES_MIRROR_KEY_UNITY"}
            ] | map(select(.id as $id | $enabled | index($id)))
          ')"
          echo "ref=${ref}, version=${version:-none}, languages=${languages}, targets=${targets}"
          {
            echo "ref=${ref}"
            echo "version=${version}"
            echo "languages=${languages}"
            echo "targets=${targets}"
          } >> "$GITHUB_OUTPUT"

  # Same trees, built and run from their READMEs in jobs without a checkout.
  # Only the languages this run mirrors are smoked: a mirror is pushed on its
  # own language's proof, so another language's unpublished packages cannot
  # block it.
  smoke:
    name: Smoke the exported trees
    needs: resolve
    if: needs.resolve.outputs.languages != '[]'
    uses: ./.github/workflows/examples-smoke.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      languages: ${{ needs.resolve.outputs.languages }}

  push:
    name: Push ${{ matrix.target.id }} mirror
    needs: [resolve, smoke]
    if: needs.resolve.outputs.languages != '[]'
    runs-on: ubuntu-24.04
    env:
      MIRROR: ${{ matrix.target.mirror }}
      TREE: ${{ matrix.target.tree }}
      SOURCE_PATH: ${{ matrix.target.source_path }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Export the tree at the ref
        run: python3 scripts/tutorial/export_examples.py .artifacts/examples HEAD

      # One write-only deploy key per configured mirror target.
      - name: Load the mirror's deploy key
        env:
          EXAMPLES_MIRROR_KEY_CPP: ${{ secrets.EXAMPLES_MIRROR_KEY_CPP }}
          EXAMPLES_MIRROR_KEY_DOTNET: ${{ secrets.EXAMPLES_MIRROR_KEY_DOTNET }}
          EXAMPLES_MIRROR_KEY_JAVA: ${{ secrets.EXAMPLES_MIRROR_KEY_JAVA }}
          EXAMPLES_MIRROR_KEY_NODE: ${{ secrets.EXAMPLES_MIRROR_KEY_NODE }}
          EXAMPLES_MIRROR_KEY_ENGINE_SERVER: ${{ secrets.EXAMPLES_MIRROR_KEY_ENGINE_SERVER }}
          EXAMPLES_MIRROR_KEY_UNITY: ${{ secrets.EXAMPLES_MIRROR_KEY_UNITY }}
        run: |
          set -euo pipefail
          name="${{ matrix.target.secret }}"
          DEPLOY_KEY="${!name:-}"
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::secret ${name} is empty"; exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/mirror
          chmod 600 ~/.ssh/mirror
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Clone the mirror
        run: git clone "git@github.com:${MIRROR}.git" mirror

      # Replace the working tree wholesale: files the release dropped
      # disappear, files it added appear, and `main` always equals one
      # export. `--ignored` guards the copied .gitignore — a file the export
      # wrote that the mirror would ignore is a rule mismatch, not something
      # to force-add.
      - name: Replace the mirror's tree with the export
        working-directory: mirror
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "../${TREE}/." .
          git add -A
          ignored="$(git status --porcelain --ignored | grep '^!!' || true)"
          if [ -n "${ignored}" ]; then
            echo "::error::exported files the mirror's .gitignore would drop:"; echo "${ignored}"; exit 1
          fi

      - name: Commit, and tag on a release
        working-directory: mirror
        env:
          REF: ${{ needs.resolve.outputs.ref }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source="$(git -C .. rev-parse --short=12 HEAD)"
          if git diff --cached --quiet && git rev-parse -q --verify HEAD >/dev/null; then
            echo "tree unchanged since $(git rev-parse --short HEAD)"
          else
            git commit -q -m "${REF} — zlink@${source}" \
              -m "Exported from https://github.com/${GITHUB_REPOSITORY}/tree/${source}/${SOURCE_PATH}"
          fi
          if [ -n "${VERSION}" ]; then
            git tag -f "v${VERSION}"
          fi
          git log --oneline -1

      - name: Push main, and the tag on a release
        working-directory: mirror
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          if [ -n "${VERSION}" ]; then
            git push -f origin "refs/tags/v${VERSION}"
          fi
