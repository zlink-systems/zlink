name: Standalone zip smoke

# #655 — 0.18.0의 8개 tutorial/samples zip이 배포된 그대로는 저장소 없이 빌드·실행되지
# 않았다(C++·Node 0/7, .NET Windows 0/7, Java 실행 미완). 원인은 zip 안 script가 저장소
# 배치를 전제한 것이었고, 이를 잡아낼 CI가 없었다 — framework-tutorial.yml은 저장소를
# checkout해 그 tree에서 빌드하므로 zip 전용 결함을 통과시킨다. 이 워크플로는 그 구멍을
# 메운다: `scripts/tutorial/pack_tutorials.py`로 실제로 묶은 zip을 **checkout이 전혀 없는**
# 새 job에서 내려받아, 압축을 풀고, 문서가 적은 명령만으로 tutorial을 빌드·기동하고 샘플
# 하나를 끝까지 돌린다. `ZLINK_*` 환경변수는 어디에도 주지 않는다 — 저장소 모드로 새는지
# 확인하는 것 자체가 목적이다.
#
# ## 트리거 규칙
#
# - `workflow_call` (기본 경로) — `release-assets.yml`이 태그에 8개 zip을 붙인 **직후**
#   같은 실행에서 이 워크플로를 부른다. `inputs.tag`가 검증할 release tag다. 패키지
#   레지스트리(NuGet·npm·Maven·vcpkg 등)에 그 태그가 고정한 버전이 이미 게시돼 있다고
#   전제한다 — release-assets.yml은 언제나 이미 존재하는 release에만 붙이므로 게시는
#   그보다 먼저 끝나 있다.
# - `workflow_dispatch` (`inputs.ref`, 기본값 `main`) — 수동 실행. **release가 아닌 ref는
#   package pin이 아직 게시되지 않았을 수 있다** — 이 경우 레지스트리 조회 단계에서 실패하는
#   것이 정상이며 zip 자체의 결함이 아니다.
# - `schedule` (매일 UTC 02:30) — GitHub가 "latest"로 보는 release tag를 다시 조회해
#   재검증한다(`releases/latest/download/...`가 실제로 가리키는 tree와 같다). Maven Central
#   동기화 지연(release 직후 30분 이상) 같은 레지스트리 쪽 일시적 문제를 다음 날 다시 잡아낸다
#   — 이 워크플로 자체에는 재시도 루프를 두지 않는다(AGENTS.md §3, 실패 지점 우회 금지).
# - `release: published` — GitHub UI나 PAT로 사람이 직접 release를 게시한 경우의 예비
#   경로. **이 저장소가 만드는 release는 대부분 `GITHUB_TOKEN`으로 게시되고, GitHub는
#   `GITHUB_TOKEN`이 만든 이벤트로 다른 workflow를 트리거하지 않는다** — 즉 정상적인
#   릴리스 파이프라인에서는 이 트리거가 사실상 발화하지 않는다. 실질적인 release 경로는
#   위 `workflow_call`이다.

on:
  workflow_call:
    inputs:
      tag:
        description: 'release-assets.yml이 zip을 붙인, 이미 존재하는 release tag'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'zip을 묶을 git ref (branch/tag/sha). release가 아니면 package pin이 아직 없을 수 있다'
        required: true
        default: main
        type: string
  schedule:
    - cron: '30 2 * * *'
  release:
    types: [published]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.ref || inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the ref to pack
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: Pick the ref for this trigger
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ inputs.ref }}
          CALL_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            workflow_dispatch)
              ref="${DISPATCH_REF}"
              ;;
            workflow_call)
              ref="${CALL_TAG}"
              ;;
            release)
              ref="${RELEASE_TAG}"
              ;;
            schedule)
              # releases/latest/download가 실제로 내려주는 tree. #655가 재현된 경로 그대로다.
              ref="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)"
              ;;
            *)
              echo "::error::unsupported trigger ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if [ -z "${ref}" ]; then
            echo "::error::could not resolve a ref to pack for trigger ${EVENT_NAME}"
            exit 1
          fi
          echo "resolved ref: ${ref} (trigger: ${EVENT_NAME})"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

  pack:
    name: Pack the eight zips
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout at the resolved ref
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Pack tutorial and samples zips at this ref
        run: python3 scripts/tutorial/pack_tutorials.py .artifacts/tutorials "${{ needs.resolve.outputs.ref }}"

      - name: Verify eight zips exist and no repo-only file leaked in
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import zipfile

          sys.path.insert(0, "scripts/tutorial")
          from pack_tutorials import EXCLUDED_ENTRIES  # same list pack() itself excludes by

          zips = sorted(pathlib.Path(".artifacts/tutorials").glob("*.zip"))
          if len(zips) != 8:
              print(f"::error::expected 8 zips, found {len(zips)}: {[z.name for z in zips]}")
              sys.exit(1)

          bad = []
          for zpath in zips:
              stem = zpath.stem  # zlink-<section>-<lang>
              with zipfile.ZipFile(zpath) as zf:
                  # zf entries are "zlink-<section>-<lang>/<relative path>"; drop the prefix
                  # to compare against EXCLUDED_ENTRIES, which is prefix-relative.
                  relative = {
                      "/".join(pathlib.PurePosixPath(n).parts[1:])
                      for n in zf.namelist()
                  }
                  for section, lang, entry in EXCLUDED_ENTRIES:
                      if stem == f"zlink-{section}-{lang}" and entry in relative:
                          bad.append(f"{zpath.name}: {entry} should have been excluded")

          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          print(f"verified {len(zips)} zips; no excluded repo-only file leaked in")
          PY

      # The consumer jobs below never checkout the repository, so the README
      # extraction helper has to travel with the zips as its own artifact
      # entries -- copy it next to them before uploading.
      - name: Stage the README-extraction helper alongside the zips
        run: cp scripts/tutorial/extract_readme_step.py scripts/tutorial/run_readme_step.sh .artifacts/tutorials/

      - name: Upload the eight zips and the README-extraction helper
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-zips
          path: .artifacts/tutorials/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 아래 job은 어느 것도 저장소를 checkout하지 않는다. `pack`이 만든 zip을 artifact로
  # 받아 빈 디렉터리에 풀고, 그 zip의 README가 적은 명령만 그대로 실행한다. 로컬 action
  # (`uses: ./...`)도 checkout이 있어야 참조할 수 있으므로 쓰지 않고 전부 inline이다.
  #
  # #655를 신고한 네 언어 worker(framework-{cpp,dotnet,node,java}/655-standalone-zips)는
  # 모두 병합됐다. 현재 남은 `continue-on-error: true`의 사유는 Windows
  # Redis(Memurai) 설치·실행이 아직 실제 Actions에서 검증되지 않은 하나뿐이다.
  # ---------------------------------------------------------------------------

  zip-dotnet-linux:
    name: dotnet / ubuntu-24.04 (zip only)
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tutorial-zips
          path: zips

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      - name: Unzip tutorial and Bingo sample
        run: |
          set -euo pipefail
          unzip -q zips/zlink-tutorial-dotnet.zip
          unzip -q zips/zlink-samples-dotnet.zip

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Tutorial install (README's own 내려받기와 설치/linux block)
        working-directory: zlink-tutorial-dotnet
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Tutorial build (README's own 빌드/linux block)
        working-directory: zlink-tutorial-dotnet
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 linux

      - name: Start Redis for the tutorial (README — docker run -p 6379:6379 redis)
        run: |
          set -euo pipefail
          redis_name="zlink-redis-$$"
          docker run -d --rm --name "${redis_name}" -p 6379:6379 redis:7
          printf '%s\n' "${redis_name}" > zlink-tutorial-dotnet/redis.container

      - name: Tutorial run (README's own 실행/linux block)
        working-directory: zlink-tutorial-dotnet
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 linux

      - name: Tutorial verify (README's own 검증/linux block)
        working-directory: zlink-tutorial-dotnet
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 linux

      - name: Stop tutorial processes and Redis
        if: always()
        working-directory: zlink-tutorial-dotnet
        run: |
          if [ -f .readme-step.pgids ]; then
            while read -r pgid; do
              case "${pgid}" in
                ''|*[!0-9]*) continue ;;
              esac
              kill -TERM -- "-${pgid}" 2>/dev/null || true
            done < .readme-step.pgids
          fi
          if [ -f redis.container ]; then
            redis_name="$(cat redis.container)"
            case "${redis_name}" in
              zlink-redis-[0-9]*) docker rm -f "${redis_name}" 2>/dev/null || true ;;
            esac
          fi

      - name: Sample install (README's own 내려받기와 설치/linux block)
        working-directory: zlink-samples-dotnet
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Sample build (README's own 빌드/linux block)
        working-directory: zlink-samples-dotnet
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 linux

      - name: Sample run (README's own 실행/linux block)
        working-directory: zlink-samples-dotnet
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 linux

      - name: Sample verify (README's own 검증/linux block)
        working-directory: zlink-samples-dotnet
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 linux

  zip-dotnet-windows:
    name: dotnet / windows-2022 (zip only)
    needs: pack
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tutorial-zips
          path: zips

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath ".git") { throw ".git present -- this job checked out the repository" }
          $leaked = Get-ChildItem Env: | Where-Object { $_.Name -like 'ZLINK_*' }
          if ($leaked) { throw "ZLINK_* leaked into the environment: $($leaked.Name -join ', ')" }

      - name: Unzip tutorial and Bingo sample
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath zips/zlink-tutorial-dotnet.zip -DestinationPath .
          Expand-Archive -LiteralPath zips/zlink-samples-dotnet.zip -DestinationPath .

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # windows-2022 has no python3 on PATH by default; run_readme_step.sh needs it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Tutorial install (README's own 내려받기와 설치/windows block)
        working-directory: zlink-tutorial-dotnet
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Tutorial build (README's own 빌드/windows block)
        working-directory: zlink-tutorial-dotnet
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 windows

      # GitHub-hosted windows-2022 runners cannot run Linux Docker containers
      # (Docker there is Windows-container-only; switching to Linux containers
      # needs a reboot, which a running job cannot do — see PR description for
      # citations). The tutorial and every dotnet sample's run_sample.ps1 need
      # a real Redis on 6379 and neither has an "external endpoint" override
      # (framework/** is out of this PR's scope, so we cannot add one here).
      # Memurai is a Windows-native, Redis-protocol-compatible server that
      # satisfies that without touching the framework. UNVERIFIED end-to-end
      # in a real Actions run yet — hence continue-on-error below. If this
      # step itself fails, the two steps that depend on it are skipped rather
      # than reported as a red framework/sample defect.
      - name: Install a Windows-native Redis-compatible server (Memurai)
        id: memurai
        continue-on-error: true
        run: choco install memurai-developer -y --no-progress

      - name: Tutorial run (README's own 실행/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-tutorial-dotnet
        shell: pwsh
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 windows

      - name: Tutorial verify (README's own 검증/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-tutorial-dotnet
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 windows

      - name: Stop tutorial processes
        if: always()
        working-directory: zlink-tutorial-dotnet
        shell: pwsh
        run: |
          foreach ($file in @('server.pid', 'client.pid')) {
            if (Test-Path $file) {
              foreach ($pid_ in Get-Content $file) {
                if ($pid_ -match '^\d+$') { taskkill /PID $pid_ /T /F 2>$null }
              }
            }
          }

      - name: Sample install (README's own 내려받기와 설치/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-samples-dotnet
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Sample build (README's own 빌드/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-samples-dotnet
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 windows

      - name: Sample run (README's own 실행/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-samples-dotnet
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 windows

      - name: Sample verify (README's own 검증/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-samples-dotnet
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 windows

  zip-node-linux:
    name: node / ubuntu-24.04 (zip only)
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tutorial-zips
          path: zips

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      - name: Unzip tutorial and Bingo.Ts sample
        run: |
          set -euo pipefail
          unzip -q zips/zlink-tutorial-node.zip
          unzip -q zips/zlink-samples-node.zip

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Tutorial install (README's own 내려받기와 설치/linux block)
        working-directory: zlink-tutorial-node
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Tutorial build (README's own 빌드/linux block)
        working-directory: zlink-tutorial-node
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 linux

      - name: Tutorial run (README's own 실행/linux block)
        working-directory: zlink-tutorial-node
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 linux

      - name: Tutorial verify (README's own 검증/linux block)
        working-directory: zlink-tutorial-node
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 linux

      - name: Stop tutorial processes and Redis
        if: always()
        working-directory: zlink-tutorial-node
        run: |
          if [ -f .readme-step.pgids ]; then
            while read -r pgid; do
              case "${pgid}" in
                ''|*[!0-9]*) continue ;;
              esac
              kill -TERM -- "-${pgid}" 2>/dev/null || true
            done < .readme-step.pgids
          fi

      - name: Sample install (README's own 내려받기와 설치/linux block)
        working-directory: zlink-samples-node
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Sample build (README's own 빌드/linux block)
        working-directory: zlink-samples-node
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 linux

      - name: Sample run (README's own 실행/linux block)
        working-directory: zlink-samples-node
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 linux

      - name: Sample verify (README's own 검증/linux block)
        working-directory: zlink-samples-node
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 linux

  zip-java-linux:
    name: java / ubuntu-24.04 (zip only)
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tutorial-zips
          path: zips

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      - name: Unzip tutorial and TicTacToe sample
        run: |
          set -euo pipefail
          unzip -q zips/zlink-tutorial-java.zip
          unzip -q zips/zlink-samples-java.zip

      # README: JDK 25 (class file major version 69). No foojay resolver is
      # configured yet, so Gradle needs a matching JDK already on the machine;
      # setup-java's JAVA_HOME satisfies Gradle's default auto-detection.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Tutorial install (README's own 내려받기와 설치/linux block)
        working-directory: zlink-tutorial-java
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Tutorial build (README's own 빌드/linux block)
        working-directory: zlink-tutorial-java
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 linux

      - name: Tutorial run (README's own 실행/linux block)
        working-directory: zlink-tutorial-java
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 linux

      - name: Tutorial verify (README's own 검증/linux block)
        working-directory: zlink-tutorial-java
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 linux

      - name: Stop tutorial processes and Redis
        if: always()
        working-directory: zlink-tutorial-java
        run: |
          if [ -f .readme-step.pgids ]; then
            while read -r pgid; do
              case "${pgid}" in
                ''|*[!0-9]*) continue ;;
              esac
              kill -TERM -- "-${pgid}" 2>/dev/null || true
            done < .readme-step.pgids
          fi

      - name: Sample install (README's own 내려받기와 설치/linux block)
        working-directory: zlink-samples-java
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Sample build (README's own 빌드/linux block)
        working-directory: zlink-samples-java
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 linux

      - name: Sample run (README's own 실행/linux block)
        working-directory: zlink-samples-java
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 linux

      - name: Sample verify (README's own 검증/linux block)
        working-directory: zlink-samples-java
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 linux

  zip-java-windows:
    name: java / windows-2022 (zip only)
    needs: pack
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tutorial-zips
          path: zips

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath ".git") { throw ".git present -- this job checked out the repository" }
          $leaked = Get-ChildItem Env: | Where-Object { $_.Name -like 'ZLINK_*' }
          if ($leaked) { throw "ZLINK_* leaked into the environment: $($leaked.Name -join ', ')" }

      - name: Unzip tutorial and TicTacToe sample
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath zips/zlink-tutorial-java.zip -DestinationPath .
          Expand-Archive -LiteralPath zips/zlink-samples-java.zip -DestinationPath .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # windows-2022 has no python3 on PATH by default; run_readme_step.sh needs it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Tutorial install (README's own 내려받기와 설치/windows block)
        working-directory: zlink-tutorial-java
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Tutorial build (README's own 빌드/windows block)
        working-directory: zlink-tutorial-java
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 windows

      # See the dotnet/windows-2022 job for why Docker Redis is unavailable
      # here and why Memurai substitutes for it. Same caveat: unverified.
      - name: Install a Windows-native Redis-compatible server (Memurai)
        id: memurai
        continue-on-error: true
        run: choco install memurai-developer -y --no-progress

      - name: Tutorial run (README's own 실행/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-tutorial-java
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 windows

      - name: Tutorial verify (README's own 검증/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-tutorial-java
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 windows

      - name: Stop tutorial processes
        if: always()
        working-directory: zlink-tutorial-java
        shell: pwsh
        run: |
          foreach ($file in @('server.pid', 'client.pid')) {
            if (Test-Path $file) {
              foreach ($pid_ in Get-Content $file) {
                if ($pid_ -match '^\d+$') { taskkill /PID $pid_ /T /F 2>$null }
              }
            }
          }

      - name: Sample install (README's own 내려받기와 설치/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-samples-java
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" windows

      - name: Sample build (README's own 빌드/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-samples-java
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 windows

      - name: Sample run (README's own 실행/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-samples-java
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 windows

      - name: Sample verify (README's own 검증/windows block)
        if: steps.memurai.outcome == 'success'
        working-directory: zlink-samples-java
        shell: bash
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 windows

  zip-cpp-linux:
    name: cpp / ubuntu-24.04 (zip only)
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tutorial-zips
          path: zips

      - name: Confirm this job never checked out the repository and ZLINK_* is unset
        run: |
          set -euo pipefail
          test ! -e .git
          if env | grep -q '^ZLINK_'; then
            echo "::error::ZLINK_* leaked into the environment"; env | grep '^ZLINK_'; exit 1
          fi

      - name: Install C++ README prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake ninja-build git pkg-config curl
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
          vcpkg_root="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
          test -x "${vcpkg_root}/vcpkg"
          test -f "${vcpkg_root}/scripts/buildsystems/vcpkg.cmake"
          echo "VCPKG_ROOT=${vcpkg_root}" >> "$GITHUB_ENV"

      - name: Unzip tutorial and TicTacToe sample
        run: |
          set -euo pipefail
          unzip -q zips/zlink-tutorial-cpp.zip
          unzip -q zips/zlink-samples-cpp.zip

      - name: Tutorial install (README's own 내려받기와 설치/linux block)
        working-directory: zlink-tutorial-cpp
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Tutorial build (README's own 빌드/linux block)
        working-directory: zlink-tutorial-cpp
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 linux

      - name: Tutorial run (README's own 실행/linux block)
        working-directory: zlink-tutorial-cpp
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 linux

      - name: Tutorial verify (README's own 검증/linux block)
        working-directory: zlink-tutorial-cpp
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 linux

      - name: Stop tutorial processes and Redis
        if: always()
        working-directory: zlink-tutorial-cpp
        run: |
          if [ -f .readme-step.pgids ]; then
            while read -r pgid; do
              case "${pgid}" in
                ''|*[!0-9]*) continue ;;
              esac
              kill -TERM -- "-${pgid}" 2>/dev/null || true
            done < .readme-step.pgids
          fi

      - name: Sample install (README's own 내려받기와 설치/linux block)
        working-directory: zlink-samples-cpp
        run: bash ../zips/run_readme_step.sh README.ko.md "내려받기와 설치" linux

      - name: Sample build (README's own 빌드/linux block)
        working-directory: zlink-samples-cpp
        run: bash ../zips/run_readme_step.sh README.ko.md 빌드 linux

      - name: Sample run (README's own 실행/linux block)
        working-directory: zlink-samples-cpp
        run: bash ../zips/run_readme_step.sh README.ko.md 실행 linux

      - name: Sample verify (README's own 검증/linux block)
        working-directory: zlink-samples-cpp
        run: bash ../zips/run_readme_step.sh README.ko.md 검증 linux
