name: Nightly stress

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-cpp:
    name: Framework C++ one-worker tests
    uses: ./.github/workflows/framework-cpp.yml
    with:
      concurrency_key: nightly-stress-framework-cpp
      single_worker: true

  framework-dotnet:
    name: Framework .NET one-worker tests
    uses: ./.github/workflows/framework-dotnet.yml
    with:
      concurrency_key: nightly-stress-framework-dotnet
      single_worker: true

  framework-java:
    name: Framework Java one-worker tests
    uses: ./.github/workflows/framework-java.yml
    with:
      concurrency_key: nightly-stress-framework-java
      single_worker: true

  framework-node:
    name: Framework Node one-worker tests
    uses: ./.github/workflows/framework-node.yml
    with:
      concurrency_key: nightly-stress-framework-node
      single_worker: true

  cpp-sanitizers:
    name: C++ Core and Framework ASan plus UBSan
    # Same runner selection as framework-cpp.yml: the hosted image needed over
    # 100 minutes for 355 of the 556 Framework sanitizer build steps.
    runs-on: ${{ vars.ZLINK_CPP_LINUX_RUNNER && fromJSON(vars.ZLINK_CPP_LINUX_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 300
    env:
      BUILD_PARALLEL: ${{ vars.ZLINK_CPP_BUILD_PARALLEL || '2' }}
      APT_CACHE_DIR: ${{ github.workspace }}/.cache/framework-cpp/apt
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.cache/framework-cpp/vcpkg-installed
      ZLINK_LOCAL_PACKAGE_ROOT: ${{ github.workspace }}/.artifacts/nightly-stress
    steps:
      - uses: actions/checkout@v5

      - name: Report initial sanitizer disk usage
        run: df -h / "${GITHUB_WORKSPACE}"

      - name: Free unused hosted runner tools
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          echo 'DISK before hosted cleanup'
          df -h / "${GITHUB_WORKSPACE}"
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo 'DISK after hosted cleanup'
          df -h / "${GITHUB_WORKSPACE}"

      - name: Cache apt packages
        uses: ./.github/actions/main-cache
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: nightly-stress-cpp-apt-${{ runner.os }}-24.04-${{ runner.arch }}-v1

      - name: Install system dependencies
        run: |
          set -euo pipefail
          mkdir -p "${APT_CACHE_DIR}"
          sudo install -d -o _apt -g root -m 0755 "${APT_CACHE_DIR}/partial"
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 \
            -o Dir::Cache::archives="${APT_CACHE_DIR}" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Binary::apt::APT::Keep-Downloaded-Packages=true \
            install -y \
              build-essential cmake ninja-build git pkg-config curl \
              libboost-all-dev libgtest-dev libgmock-dev liblz4-dev \
              nlohmann-json3-dev libssl-dev protobuf-compiler libprotobuf-dev

      - name: Resolve the runner vcpkg
        id: vcpkg
        run: |
          set -euo pipefail
          vcpkg_root="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
          test -x "${vcpkg_root}/vcpkg"
          test -f "${vcpkg_root}/scripts/buildsystems/vcpkg.cmake"
          revision="$(git -C "${vcpkg_root}" rev-parse HEAD 2>/dev/null \
            || "${vcpkg_root}/vcpkg" version | head -n 1 | sha256sum | cut -d' ' -f1)"
          echo "VCPKG_ROOT=${vcpkg_root}" >> "${GITHUB_ENV}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Cache Framework C++ vcpkg dependencies
        id: vcpkg-cache
        uses: ./.github/actions/main-cache
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: nightly-stress-cpp-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('framework/languages/cpp/vcpkg.json') }}-v1

      - name: Install Framework C++ vcpkg dependencies
        if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          "${VCPKG_ROOT}/vcpkg" install \
            opentelemetry-cpp:x64-linux \
            'redis-plus-plus[async-std]:x64-linux' \
            --x-install-root="${VCPKG_INSTALLED_DIR}" \
            --clean-after-build

      # gcc's UBSan null check flags thread_local accesses (allocation counters,
      # the current lane pointer) as null loads and stores while the tests pass;
      # -fno-sanitize=null drops that noise and ASan still faults real null
      # dereferences.
      - name: Build ASan and UBSan Core
        env:
          CC: gcc
          CXX: g++
          # Core's ENABLE_UBSAN adds clang-only checks; take UBSan from the shared flags.
          CFLAGS: -fsanitize=undefined -fno-sanitize=null -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=undefined -fno-sanitize=null -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=undefined -fno-sanitize=null
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)"
          core_prefix="${ZLINK_LOCAL_PACKAGE_ROOT}/install/zlink-core/${core_version}"
          core_build="${GITHUB_WORKSPACE}/.artifacts/nightly-stress/core-asan-ubsan"
          cmake -S core -B "${core_build}" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="${core_prefix}" \
            -DENABLE_LTO=OFF \
            -DENABLE_ASAN=ON \
            -DENABLE_UBSAN=OFF \
            -DZLINK_BUILD_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DWITH_DOCS=OFF
          cmake --build "${core_build}" --parallel "${BUILD_PARALLEL}"
          cmake --install "${core_build}"
          echo 'DISK after Core build and install'
          df -h / "${GITHUB_WORKSPACE}"
          du -sh "${core_build}" "${core_build}/bin"

      # Core has small test translation units and shares libzlink. Measure its
      # tree and binaries above; release the tree before Framework starts.
      - name: Run Core sanitizer tests and release the Core build tree
        continue-on-error: true
        run: |
          set -euo pipefail
          status=0
          core_build="${GITHUB_WORKSPACE}/.artifacts/nightly-stress/core-asan-ubsan"
          python3 scripts/ci/sanitizer-summary.py \
            --suite core "${core_build}" \
            --output "${RUNNER_TEMP}/sanitizer-logs/core.results.json" \
            --log-dir "${RUNNER_TEMP}/sanitizer-logs" || status=$?
          rm -rf "${core_build}"
          echo 'DISK after Core tests and cleanup'
          df -h / "${GITHUB_WORKSPACE}"
          exit "${status}"

      - name: Build the checkout C++ binding with sanitizers
        env:
          CC: gcc
          CXX: g++
          CFLAGS: -fsanitize=address,undefined -fno-sanitize=null -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-sanitize=null -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined -fno-sanitize=null
          ZLINK_BINDING_BUILD_JOBS: ${{ vars.ZLINK_CPP_BUILD_PARALLEL || '2' }}
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)"
          mkdir -p "${ZLINK_LOCAL_PACKAGE_ROOT}/build"
          CONFIGURATION=Debug bash scripts/local-package/cpp/build-wsl.sh \
            --core-prefix \
            "${ZLINK_LOCAL_PACKAGE_ROOT}/install/zlink-core/${core_version}"
          echo 'DISK after binding build'
          df -h / "${GITHUB_WORKSPACE}"

      - name: Configure Framework C++ with sanitizers
        working-directory: framework/languages/cpp
        env:
          CC: gcc
          CXX: g++
          CFLAGS: -fsanitize=address,undefined -fno-sanitize=null -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-sanitize=null -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined -fno-sanitize=null
        run: |
          set -euo pipefail
          mkdir -p build/linux-ninja-release/.cmake/api/v1/query
          touch build/linux-ninja-release/.cmake/api/v1/query/codemodel-v2
          cmake --preset linux-ninja-release \
            -DZLINK_FRAMEWORK_CPP_TEST_PROBES=ON \
            -DZLINK_FRAMEWORK_CPP_INSTALL_FRAMEWORK=OFF \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/.github/workflows/framework-cpp-system-toolchain.cmake" \
            -DZLINK_FRAMEWORK_CPP_BUILD_SAMPLES=OFF \
            -DZLINK_FRAMEWORK_CPP_BUILD_CROSS_LANGUAGE=OFF
          echo 'DISK after Framework configure'
          df -h / "${GITHUB_WORKSPACE}"

      - name: Build and test Framework sanitizer shards
        continue-on-error: true
        run: |
          python3 scripts/ci/sanitizer-shards.py \
            --suite framework \
            --build-dir "${GITHUB_WORKSPACE}/framework/languages/cpp/build/linux-ninja-release" \
            --label '^(unit|contract)$' --shard-size 10 --parallel "${BUILD_PARALLEL}" \
            --output "${RUNNER_TEMP}/sanitizer-logs/framework.results.json" \
            --log-dir "${RUNNER_TEMP}/sanitizer-logs"

      - name: Create combined sanitizer summary
        if: always()
        run: |
          python3 scripts/ci/sanitizer-summary.py \
            --results "${RUNNER_TEMP}/sanitizer-logs/core.results.json" \
            --results "${RUNNER_TEMP}/sanitizer-logs/framework.results.json" \
            --output "${RUNNER_TEMP}/sanitizer-summary.json" \
            --log-dir "${RUNNER_TEMP}/sanitizer-logs"

      - name: Upload sanitizer summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-stress-sanitizer-summary
          path: ${{ runner.temp }}/sanitizer-summary.json
          if-no-files-found: ignore

      # The summary names failing tests only; the CTest log and JUnit file carry
      # each test's first sanitizer stack.
      - name: Upload sanitizer test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-stress-sanitizer-logs
          path: ${{ runner.temp }}/sanitizer-logs
          if-no-files-found: ignore
          retention-days: 14

      # A self-hosted runner keeps its workspace between jobs. The previous
      # unsharded sanitizer trees occupied about 140 GB.
      - name: Remove sanitizer build trees
        if: always()
        run: |
          rm -rf \
            "${GITHUB_WORKSPACE}/.artifacts/nightly-stress" \
            "${GITHUB_WORKSPACE}/framework/languages/cpp/build/linux-ninja-release"
          echo 'DISK after sanitizer build tree cleanup'
          df -h / "${GITHUB_WORKSPACE}"
