name: Release .NET Binding

on:
  push:
    tags:
      - 'dotnet/v*'
      - 'framework/v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'binding: Systems.Zlink from dotnet/v*; framework: the framework .NET packages from framework/v*'
        required: true
        default: 'binding'
        type: choice
        options:
          - binding
          - framework
      version:
        description: 'Version to release (binding 0.17.3 or framework 0.10.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-dotnet:
    # nuget.org's zlink-dotnet-release Trusted Publishing policy is bound to this
    # workflow file name, so both the binding and the framework .NET packages
    # are pushed from here (one job each).
    if: startsWith(github.ref_name, 'dotnet/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'binding')
    name: Build and publish .NET binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate versions
        id: versions
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#dotnet/v}"
          else
            version="${REQUESTED_VERSION}"
          fi

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid binding version: ${version:-<missing>}" >&2
            exit 1
          fi

          repository_binding_version=$(sed -n 's/^ZLINK_BINDINGS_VERSION=//p' BINDINGS_VERSION)
          if [ "${version}" != "${repository_binding_version}" ]; then
            echo "Binding version mismatch: requested=${version}, BINDINGS_VERSION=${repository_binding_version}" >&2
            exit 1
          fi

          project_version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' bindings/dotnet/src/Zlink/Zlink.csproj | head -n1)
          if [ "${version}" != "${project_version}" ]; then
            echo "Binding version mismatch: requested=${version}, Zlink.csproj=${project_version}" >&2
            exit 1
          fi

          core_version=$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)
          if ! [[ "${core_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Core version in VERSION: ${core_version:-<missing>}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "core_version=${core_version}" >> "${GITHUB_OUTPUT}"
          echo "core_tag=core/v${core_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate exact Core release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TAG: ${{ steps.versions.outputs.core_tag }}
        run: |
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${CORE_TAG}"
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}")
          if [ "${status}" != "200" ]; then
            echo "Core release tag not found: ${CORE_TAG}" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/${CORE_TAG}:refs/tags/${CORE_TAG}"
          if ! git diff --quiet "${CORE_TAG}" -- VERSION core/src core/include core/CMakeLists.txt core/cmake; then
            echo "Checked-out VERSION/core runtime sources differ from ${CORE_TAG}" >&2
            echo "Binding releases must use the exact tagged Core source." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare verified Linux x64 Core release
        id: dotnet-core
        shell: bash
        env:
          ZLINK_CORE_RELEASE_VERSION: ${{ steps.versions.outputs.core_version }}
          ZLINK_CORE_CACHE_DIR: ${{ runner.temp }}/zlink-core
        run: |
          core_prefix=$(bash scripts/local-package/core/fetch-release.sh \
            --version "${ZLINK_CORE_RELEASE_VERSION}" \
            --platform linux-x64 \
            --cache-dir "${ZLINK_CORE_CACHE_DIR}")
          echo "prefix=${core_prefix}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build, test, and pack
        env:
          CI: true
          ZLINK_LIBRARY_PATH: ${{ steps.dotnet-core.outputs.prefix }}/lib/libzlink.so.${{ steps.versions.outputs.core_version }}
          LD_LIBRARY_PATH: ${{ steps.dotnet-core.outputs.prefix }}/lib
        run: |
          dotnet build bindings/dotnet/src/Zlink/Zlink.csproj -c Release
          dotnet test bindings/dotnet/tests/Zlink.Tests/Zlink.Tests.csproj -c Release
          mkdir -p dist/dotnet
          dotnet pack bindings/dotnet/src/Zlink/Zlink.csproj -c Release \
            -p:PackageOutputPath="${GITHUB_WORKSPACE}/dist/dotnet" \
            -p:ZLinkLinuxX64NativeRoot="${{ steps.dotnet-core.outputs.prefix }}/lib" \
            -p:ZLinkCoreVersion="${{ steps.versions.outputs.core_version }}" \
            -p:ZLinkCoreProvenancePath="${{ steps.dotnet-core.outputs.prefix }}/share/zlink/core-package-provenance.json"

      - uses: actions/upload-artifact@v4
        with:
          name: binding-dotnet-${{ steps.versions.outputs.version }}
          path: |
            dist/dotnet/*.nupkg
            dist/dotnet/*.snupkg
          if-no-files-found: error

      - name: Log in to NuGet with trusted publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: zlink

      - name: Publish packages to nuget.org
        shell: bash
        run: |
          dotnet nuget push dist/dotnet/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push dist/dotnet/*.snupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  release-framework-dotnet:
    if: startsWith(github.ref_name, 'framework/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'framework')
    name: Build and publish .NET framework packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate framework version
        id: versions
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#framework/v}"
          else
            version="${REQUESTED_VERSION}"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid framework version: ${version:-<missing>}" >&2
            exit 1
          fi
          declared=$(sed -n 's/.*<Version Condition="[^"]*">\(.*\)<\/Version>.*/\1/p' framework/languages/dotnet/Directory.Build.props | head -n1)
          if [ "${version}" != "${declared}" ]; then
            echo "Framework version mismatch: requested=${version}, Directory.Build.props=${declared}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Every packable framework project is published together: the public
      # packages (Systems.Zlink.HttpClient, Systems.Zlink.Framework.AspNetCore,
      # Systems.Zlink.Stream.Connector) depend on Zlink.Framework and
      # Zlink.Framework.Contracts, so a partial push would leave consumers
      # unable to restore. The binding Systems.Zlink is restored from nuget.org,
      # which is why the binding release precedes the framework release.
      - name: Build and pack framework packages
        env:
          CI: true
        shell: bash
        run: |
          mkdir -p dist/framework-dotnet
          for project in framework/languages/dotnet/src/*/*.csproj; do
            if grep -q '<IsPackable>true</IsPackable>' "${project}"; then
              dotnet pack "${project}" -c Release \
                -p:PackageOutputPath="${GITHUB_WORKSPACE}/dist/framework-dotnet"
            fi
          done
          ls dist/framework-dotnet

      - uses: actions/upload-artifact@v4
        with:
          name: framework-dotnet-${{ steps.versions.outputs.version }}
          path: |
            dist/framework-dotnet/*.nupkg
            dist/framework-dotnet/*.snupkg
          if-no-files-found: error

      - name: Log in to NuGet with trusted publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: zlink

      - name: Publish framework packages to nuget.org
        shell: bash
        run: |
          dotnet nuget push 'dist/framework-dotnet/*.nupkg' \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push 'dist/framework-dotnet/*.snupkg' \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
