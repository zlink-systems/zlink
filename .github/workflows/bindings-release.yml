name: Release Bindings (Language-specific)

on:
  push:
    tags:
      - 'go/v*'
      - 'rust/v*'
      - 'node/v*'
      - 'python/v*'
      - 'java/v*'
      - 'cpp/v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target binding: go|rust|node|python|java|cpp|all'
        required: true
        default: 'node'
        type: string
      version:
        description: 'Binding version to release (e.g. 0.9.1). Required for workflow_dispatch.'
        required: false
        type: string
      core_version:
        description: 'Core native version (e.g. 0.9.0). Defaults to the checked-out VERSION and must match it exactly.'
        required: false
        type: string
      create_release:
        description: 'Create GitHub release for selected binding'
        required: true
        default: false
        type: boolean
      publish_registry:
        description: 'Publish to external registry (npm/PyPI/NuGet/Maven)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve Target/Version
    runs-on: ubuntu-22.04
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      version: ${{ steps.resolve.outputs.version }}
      create_release: ${{ steps.resolve.outputs.create_release }}
      publish_registry: ${{ steps.resolve.outputs.publish_registry }}
      core_version: ${{ steps.resolve.outputs.core_version }}
      core_tag: ${{ steps.resolve.outputs.core_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            TARGET="${TAG_NAME%%/*}"
            VERSION="${TAG_NAME#*/v}"
            CREATE_RELEASE="true"
            PUBLISH_REGISTRY="true"
          else
            TARGET="${{ github.event.inputs.target }}"
            VERSION="${{ github.event.inputs.version }}"
            CREATE_RELEASE="${{ github.event.inputs.create_release }}"
            PUBLISH_REGISTRY="${{ github.event.inputs.publish_registry }}"
          fi

          case "${TARGET}" in
            go|rust|node|python|java|cpp|all) ;;
            *)
              echo "Unsupported target: ${TARGET}" >&2
              exit 1
              ;;
          esac

          if [ -z "${VERSION}" ]; then
            echo "version input is required for workflow_dispatch" >&2
            exit 1
          fi

          REPOSITORY_BINDING_VERSION=$(sed -n 's/^ZLINK_BINDINGS_VERSION=//p' BINDINGS_VERSION)
          if ! [[ "${REPOSITORY_BINDING_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid or missing ZLINK_BINDINGS_VERSION in BINDINGS_VERSION: ${REPOSITORY_BINDING_VERSION}" >&2
            exit 1
          fi
          if [ "${VERSION}" != "${REPOSITORY_BINDING_VERSION}" ]; then
            echo "Binding version mismatch: input/tag=${VERSION}, BINDINGS_VERSION=${REPOSITORY_BINDING_VERSION}" >&2
            exit 1
          fi

          if [ "${TARGET}" = "all" ] && [ "${CREATE_RELEASE}" = "true" ]; then
            echo "'all' target with create_release=true is not allowed. Release each language separately." >&2
            exit 1
          fi
          if [ "${TARGET}" = "all" ] && [ "${PUBLISH_REGISTRY}" = "true" ]; then
            echo "'all' target with publish_registry=true is not allowed. Publish each language separately." >&2
            exit 1
          fi

          if [ "${TARGET}" = "go" ]; then
            PUBLISH_REGISTRY="false"
          fi

          REPOSITORY_CORE_VERSION=$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)
          if ! [[ "${REPOSITORY_CORE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid or missing LIBZLINK_VERSION in VERSION: ${REPOSITORY_CORE_VERSION}" >&2
            exit 1
          fi
          CORE_VERSION="${{ github.event.inputs.core_version }}"
          if [ -z "${CORE_VERSION}" ]; then
            CORE_VERSION="${REPOSITORY_CORE_VERSION}"
          elif [ "${CORE_VERSION}" != "${REPOSITORY_CORE_VERSION}" ]; then
            echo "Core version mismatch: input=${CORE_VERSION}, VERSION=${REPOSITORY_CORE_VERSION}" >&2
            exit 1
          fi
          CORE_TAG="core/v${CORE_VERSION}"

          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "create_release=${CREATE_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "publish_registry=${PUBLISH_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "core_version=${CORE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "core_tag=${CORE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate exact Core release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api_url="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.resolve.outputs.core_tag }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}")
          if [ "${status}" != "200" ]; then
            echo "Core release tag not found: ${{ steps.resolve.outputs.core_tag }}" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/tags/${{ steps.resolve.outputs.core_tag }}:refs/tags/${{ steps.resolve.outputs.core_tag }}"
          if ! git diff --quiet "${{ steps.resolve.outputs.core_tag }}" -- VERSION core; then
            echo "Checked-out VERSION/core differs from ${{ steps.resolve.outputs.core_tag }}" >&2
            echo "Binding releases must build the exact tagged Core source." >&2
            git diff --stat "${{ steps.resolve.outputs.core_tag }}" -- VERSION core >&2
            exit 1
          fi

  release-node:
    name: Release Node Binding
    runs-on: ubuntu-22.04
    needs: resolve
    if: needs.resolve.outputs.target == 'node' || needs.resolve.outputs.target == 'all'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with Trusted Publishing support
        run: npm install -g npm@latest

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev

      - name: Prepare verified Linux x64 Core release
        id: node-core
        shell: bash
        env:
          ZLINK_CORE_RELEASE_VERSION: ${{ needs.resolve.outputs.core_version }}
          ZLINK_CORE_CACHE_DIR: ${{ runner.temp }}/zlink-core
        run: |
          core_prefix=$(bash scripts/local-package/core/fetch-release.sh \
            --version "${ZLINK_CORE_RELEASE_VERSION}" \
            --platform linux-x64 \
            --cache-dir "${ZLINK_CORE_CACHE_DIR}")
          mkdir -p bindings/node/prebuilds/linux-x64
          install -m755 \
            "${core_prefix}/lib/libzlink.so.${ZLINK_CORE_RELEASE_VERSION}" \
            bindings/node/prebuilds/linux-x64/libzlink.so.${{ needs.resolve.outputs.core_version }}
          major="${{ needs.resolve.outputs.core_version }}"
          major="${major%%.*}"
          ln -sfn libzlink.so.${{ needs.resolve.outputs.core_version }} "bindings/node/prebuilds/linux-x64/libzlink.so.${major}"
          ln -sfn "libzlink.so.${major}" bindings/node/prebuilds/linux-x64/libzlink.so
          cp "${core_prefix}/share/zlink/core-package-provenance.json" \
            bindings/node/provenance/core-package-provenance.json
          echo "prefix=${core_prefix}" >> "${GITHUB_OUTPUT}"

      - name: Validate version
        shell: bash
        run: |
          file_version=$(node -p "require('./bindings/node/package.json').version")
          if [ "${file_version}" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "Version mismatch: package.json=${file_version}, requested=${{ needs.resolve.outputs.version }}" >&2
            exit 1
          fi

      - name: Build and test
        env:
          ZLINK_CORE_PACKAGE_PREFIX: ${{ steps.node-core.outputs.prefix }}
          ZLINK_CORE_VERSION: ${{ needs.resolve.outputs.core_version }}
        run: |
          cd bindings/node
          npm ci
          cp prebuilds/linux-x64/libzlink.so build/Release/libzlink.so
          major="${{ needs.resolve.outputs.core_version }}"
          major="${major%%.*}"
          cp "prebuilds/linux-x64/libzlink.so.${major}" "build/Release/libzlink.so.${major}"
          npm test
          cp build/Release/zlink.node prebuilds/linux-x64/zlink.node
          npm run verify:prebuilds

      - name: Package
        run: |
          mkdir -p dist/node
          cd bindings/node
          npm pack --pack-destination ../../dist/node

      - name: Publish to npm
        if: needs.resolve.outputs.publish_registry == 'true'
        run: |
          cd bindings/node
          npm publish --provenance --access public

      - uses: actions/upload-artifact@v4
        with:
          name: binding-node-${{ needs.resolve.outputs.version }}
          path: dist/node/*.tgz

      - name: Create GitHub Release
        if: needs.resolve.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: node/v${{ needs.resolve.outputs.version }}
          name: node binding v${{ needs.resolve.outputs.version }}
          files: dist/node/*.tgz

  release-go:
    name: Release Go Binding
    runs-on: ubuntu-22.04
    needs: resolve
    if: needs.resolve.outputs.target == 'go' || needs.resolve.outputs.target == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev

      - name: Build Linux x64 core runtime
        run: |
          cmake -S core -B core/build_bindings_release \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=ON \
            -DBUILD_STATIC=OFF \
            -DBUILD_TESTS=OFF \
            -DENABLE_LTO=OFF \
            -DZLINK_CXX_STANDARD=17
          cmake --build core/build_bindings_release --parallel 2
          mkdir -p bindings/go/native/linux-x86_64
          install -m755 \
            core/build_bindings_release/lib/libzlink.so.${{ needs.resolve.outputs.core_version }} \
            bindings/go/native/linux-x86_64/libzlink.so.${{ needs.resolve.outputs.core_version }}
          major="${{ needs.resolve.outputs.core_version }}"
          major="${major%%.*}"
          ln -sfn libzlink.so.${{ needs.resolve.outputs.core_version }} "bindings/go/native/linux-x86_64/libzlink.so.${major}"
          ln -sfn "libzlink.so.${major}" bindings/go/native/linux-x86_64/libzlink.so

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'

      - name: Build and test
        run: |
          cd bindings/go
          go test ./...

      - name: Package source archive
        run: |
          mkdir -p dist/go
          tar -C bindings -czf dist/go/zlink-go-${{ needs.resolve.outputs.version }}.tar.gz go

      - uses: actions/upload-artifact@v4
        with:
          name: binding-go-${{ needs.resolve.outputs.version }}
          path: dist/go/zlink-go-${{ needs.resolve.outputs.version }}.tar.gz

      - name: Create GitHub Release
        if: needs.resolve.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: go/v${{ needs.resolve.outputs.version }}
          name: go binding v${{ needs.resolve.outputs.version }}
          files: dist/go/zlink-go-${{ needs.resolve.outputs.version }}.tar.gz

  release-python:
    name: Release Python Binding
    runs-on: ubuntu-22.04
    needs: resolve
    if: needs.resolve.outputs.target == 'python' || needs.resolve.outputs.target == 'all'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare verified Linux x64 Core release
        id: python-core
        shell: bash
        env:
          ZLINK_CORE_RELEASE_VERSION: ${{ needs.resolve.outputs.core_version }}
          ZLINK_CORE_CACHE_DIR: ${{ runner.temp }}/zlink-core
        run: |
          core_prefix=$(bash scripts/local-package/core/fetch-release.sh \
            --version "${ZLINK_CORE_RELEASE_VERSION}" \
            --platform linux-x64 \
            --cache-dir "${ZLINK_CORE_CACHE_DIR}")
          ZLINK_CORE_PACKAGE_PREFIX="${core_prefix}" \
            ZLINK_CORE_VERSION="${ZLINK_CORE_RELEASE_VERSION}" \
            bash scripts/local-package/native/sync-local-core-libs.sh python
          echo "prefix=${core_prefix}" >> "${GITHUB_OUTPUT}"

      - name: Validate version
        shell: bash
        run: |
          file_version=$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/pyproject.toml | head -n1)
          if [ "${file_version}" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "Version mismatch: pyproject.toml=${file_version}, requested=${{ needs.resolve.outputs.version }}" >&2
            exit 1
          fi

      - name: Build and test
        env:
          ZLINK_CORE_SOURCE: release
          ZLINK_CORE_PREFIX: ${{ steps.python-core.outputs.prefix }}
          ZLINK_CORE_PACKAGE_PREFIX: ${{ steps.python-core.outputs.prefix }}
          ZLINK_CORE_VERSION: ${{ needs.resolve.outputs.core_version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine
          cd bindings/python
          pip install -e .
          python -m pytest -q tests/test_version.py tests/test_enums.py
          python -m build

      - name: Publish to PyPI
        if: needs.resolve.outputs.publish_registry == 'true'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "Skipping PyPI publish because PYPI_API_TOKEN is not configured."
            exit 0
          fi
          cd bindings/python
          python -m twine upload \
            --non-interactive \
            -u __token__ \
            -p "${PYPI_API_TOKEN}" \
            dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: binding-python-${{ needs.resolve.outputs.version }}
          path: |
            bindings/python/dist/*.whl
            bindings/python/dist/*.tar.gz

      - name: Create GitHub Release
        if: needs.resolve.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python/v${{ needs.resolve.outputs.version }}
          name: python binding v${{ needs.resolve.outputs.version }}
          files: |
            bindings/python/dist/*.whl
            bindings/python/dist/*.tar.gz

  release-java:
    name: Release Java Binding
    runs-on: ubuntu-22.04
    needs: resolve
    if: needs.resolve.outputs.target == 'java' || needs.resolve.outputs.target == 'all'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare verified Linux x64 Core release
        id: java-core
        shell: bash
        env:
          ZLINK_CORE_RELEASE_VERSION: ${{ needs.resolve.outputs.core_version }}
          ZLINK_CORE_CACHE_DIR: ${{ runner.temp }}/zlink-core
        run: |
          core_prefix=$(bash scripts/local-package/core/fetch-release.sh \
            --version "${ZLINK_CORE_RELEASE_VERSION}" \
            --platform linux-x64 \
            --cache-dir "${ZLINK_CORE_CACHE_DIR}")
          manifest="${core_prefix}/share/zlink/core-package-provenance.json"
          manifest_sha=$(sha256sum "${manifest}" | awk '{print $1}')
          runtime_sha=$(sha256sum \
            "${core_prefix}/lib/libzlink.so.${ZLINK_CORE_RELEASE_VERSION}" \
            | awk '{print $1}')
          summary=$(jq -cn \
            --arg version "${ZLINK_CORE_RELEASE_VERSION}" \
            --arg prefix "${core_prefix}" \
            --arg provenanceSha256 "${manifest_sha}" \
            --arg runtimeSha256 "${runtime_sha}" \
            '{version: $version, prefix: $prefix,
              provenanceSha256: $provenanceSha256,
              runtime: {sha256: $runtimeSha256, soname: "libzlink.so.0"}}')
          echo "prefix=${core_prefix}" >> "${GITHUB_OUTPUT}"
          echo "summary=${summary}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Validate version
        shell: bash
        run: |
          file_version=$(sed -n "s/^version = '\(.*\)'/\1/p" bindings/java/build.gradle | head -n1)
          if [ "${file_version}" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "Version mismatch: build.gradle=${file_version}, requested=${{ needs.resolve.outputs.version }}" >&2
            exit 1
          fi

      - name: Build and test
        env:
          ZLINK_CORE_PACKAGE_PREFIX: ${{ steps.java-core.outputs.prefix }}
          ZLINK_CORE_PACKAGE_SUMMARY: ${{ steps.java-core.outputs.summary }}
        run: |
          cd bindings/java
          chmod +x gradlew
          ./gradlew test integrationTest jar

      - name: Publish to Maven repository
        if: needs.resolve.outputs.publish_registry == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZLINK_CORE_PACKAGE_PREFIX: ${{ steps.java-core.outputs.prefix }}
          ZLINK_CORE_PACKAGE_SUMMARY: ${{ steps.java-core.outputs.summary }}
        run: |
          cd bindings/java
          ./gradlew publish

      - name: Upload to Maven Central Portal
        if: needs.resolve.outputs.publish_registry == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          MAVEN_CENTRAL_BUNDLE_DIR: ${{ runner.temp }}/zlink-java-central-staging
          MAVEN_CENTRAL_BUNDLE_PATH: ${{ runner.temp }}/zlink-java-central-bundle.zip
          ZLINK_CORE_PACKAGE_PREFIX: ${{ steps.java-core.outputs.prefix }}
          ZLINK_CORE_PACKAGE_SUMMARY: ${{ steps.java-core.outputs.summary }}
        run: |
          cd bindings/java
          ./gradlew publishAllPublicationsToCentralStagingRepository
          bash scripts/upload-central-bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: binding-java-${{ needs.resolve.outputs.version }}
          path: bindings/java/build/libs/*.jar

      - name: Create GitHub Release
        if: needs.resolve.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: java/v${{ needs.resolve.outputs.version }}
          name: java binding v${{ needs.resolve.outputs.version }}
          files: bindings/java/build/libs/*.jar

  release-cpp:
    name: Release C++ Binding
    runs-on: ubuntu-22.04
    needs: resolve
    if: needs.resolve.outputs.target == 'cpp' || needs.resolve.outputs.target == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libboost-dev

      - name: Build Linux x64 core runtime
        run: |
          cmake -S core -B core/build_bindings_release \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=ON \
            -DBUILD_STATIC=OFF \
            -DBUILD_TESTS=OFF \
            -DENABLE_LTO=OFF \
            -DZLINK_CXX_STANDARD=17
          cmake --build core/build_bindings_release --parallel 2
          mkdir -p bindings/cpp/native/linux-x86_64
          install -m755 \
            core/build_bindings_release/lib/libzlink.so.${{ needs.resolve.outputs.core_version }} \
            bindings/cpp/native/linux-x86_64/libzlink.so.${{ needs.resolve.outputs.core_version }}
          major="${{ needs.resolve.outputs.core_version }}"
          major="${major%%.*}"
          ln -sfn libzlink.so.${{ needs.resolve.outputs.core_version }} "bindings/cpp/native/linux-x86_64/libzlink.so.${major}"
          ln -sfn "libzlink.so.${major}" bindings/cpp/native/linux-x86_64/libzlink.so

      - name: Build and test
        run: |
          cmake -S bindings/cpp -B build_cpp_release \
            -DZLINK_CPP_CORE_BUILD_DIR="${{ github.workspace }}/core/build_bindings_release" \
            -DZLINK_CPP_BUILD_TESTS=ON
          cmake --build build_cpp_release --parallel
          ctest --test-dir build_cpp_release --output-on-failure -R test_cpp_

      - name: Package
        run: |
          mkdir -p dist/cpp/zlink-cpp-${{ needs.resolve.outputs.version }}/include
          cp -r bindings/cpp/include/* dist/cpp/zlink-cpp-${{ needs.resolve.outputs.version }}/include/
          tar -C dist/cpp -czf dist/cpp/zlink-cpp-${{ needs.resolve.outputs.version }}.tar.gz zlink-cpp-${{ needs.resolve.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: binding-cpp-${{ needs.resolve.outputs.version }}
          path: dist/cpp/zlink-cpp-${{ needs.resolve.outputs.version }}.tar.gz

      - name: Create GitHub Release
        if: needs.resolve.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cpp/v${{ needs.resolve.outputs.version }}
          name: cpp binding v${{ needs.resolve.outputs.version }}
          files: dist/cpp/zlink-cpp-${{ needs.resolve.outputs.version }}.tar.gz

  release-rust:
    name: Release Rust Binding
    runs-on: ubuntu-22.04
    needs: resolve
    if: needs.resolve.outputs.target == 'rust' || needs.resolve.outputs.target == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev

      - name: Build Linux x64 core runtime
        run: |
          cmake -S core -B core/build_bindings_release \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=ON \
            -DBUILD_STATIC=OFF \
            -DBUILD_TESTS=OFF \
            -DENABLE_LTO=OFF \
            -DZLINK_CXX_STANDARD=17
          cmake --build core/build_bindings_release --parallel 2
          mkdir -p bindings/rust/native/linux-x86_64
          install -m755 \
            core/build_bindings_release/lib/libzlink.so.${{ needs.resolve.outputs.core_version }} \
            bindings/rust/native/linux-x86_64/libzlink.so.${{ needs.resolve.outputs.core_version }}
          major="${{ needs.resolve.outputs.core_version }}"
          major="${major%%.*}"
          ln -sfn libzlink.so.${{ needs.resolve.outputs.core_version }} "bindings/rust/native/linux-x86_64/libzlink.so.${major}"
          ln -sfn "libzlink.so.${major}" bindings/rust/native/linux-x86_64/libzlink.so

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate version
        shell: bash
        run: |
          file_version=$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/rust/Cargo.toml | head -n1)
          if [ "${file_version}" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "Version mismatch: Cargo.toml=${file_version}, requested=${{ needs.resolve.outputs.version }}" >&2
            exit 1
          fi

      - name: Build and test
        run: |
          cd bindings/rust
          cargo test

      - name: Package source archive
        run: |
          mkdir -p dist/rust
          git archive \
            --format=tar.gz \
            --prefix=zlink-rust-${{ needs.resolve.outputs.version }}/ \
            -o dist/rust/zlink-rust-${{ needs.resolve.outputs.version }}.tar.gz \
            HEAD:bindings/rust

      - name: Publish to crates.io
        if: needs.resolve.outputs.publish_registry == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Skipping crates.io publish because CRATES_IO_TOKEN is not configured."
            exit 0
          fi
          cd bindings/rust
          cargo publish -p zlink --token "${CARGO_REGISTRY_TOKEN}"
          sleep 30
          cargo publish -p zlink-codec-json --token "${CARGO_REGISTRY_TOKEN}"
          cargo publish -p zlink-codec-messagepack --token "${CARGO_REGISTRY_TOKEN}"
          cargo publish -p zlink-codec-protobuf --token "${CARGO_REGISTRY_TOKEN}"

      - uses: actions/upload-artifact@v4
        with:
          name: binding-rust-${{ needs.resolve.outputs.version }}
          path: dist/rust/zlink-rust-${{ needs.resolve.outputs.version }}.tar.gz

      - name: Create GitHub Release
        if: needs.resolve.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rust/v${{ needs.resolve.outputs.version }}
          name: rust binding v${{ needs.resolve.outputs.version }}
          files: dist/rust/zlink-rust-${{ needs.resolve.outputs.version }}.tar.gz
