name: Framework Tutorial

# 기능별 가이드는 코드를 손으로 옮겨 적지 않고 tutorial 프로그램에서 구간을 읽는다.
# 그래서 이 프로그램이 빌드되고 실제로 동작하지 않으면 문서가 검증되지 않은 코드를 싣게
# 된다. 빌드만으로는 부족하다 — 설정 오류는 대부분 startup에서야 드러난다.
#
# tutorial은 저장소 소스가 아니라 nuget.org에 배포된 패키지를 참조하므로 Core를 받거나
# binding을 pack할 필요가 없다. framework-dotnet.yml과 달리 SDK 하나로 끝난다.
#
# quickstart(설치부터 첫 응답까지의 최소 project)도 같은 이유로 여기서 빌드한다(#831). C++은
# tutorial의 bootstrap이 만든 `.zlink/`를 `ZLINK_ROOT`로 재사용해 framework를 두 번 짓지 않는다.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/framework-tutorial.yml"
      - "framework/languages/dotnet/tutorial/**"
      - "framework/languages/java/tutorial/**"
      - "framework/languages/node/tutorial/**"
      - "framework/languages/cpp/tutorial/**"
      - "framework/languages/dotnet/quickstart/**"
      - "framework/languages/java/quickstart/**"
      - "framework/languages/node/quickstart/**"
      - "framework/languages/cpp/quickstart/**"
      - "!framework/languages/dotnet/tutorial/Directory.Packages.props"
      - "!framework/languages/dotnet/quickstart/Directory.Packages.props"
      - "!framework/languages/java/tutorial/gradle/libs.versions.toml"
      - "!framework/languages/java/quickstart/gradle/libs.versions.toml"
      - "!framework/languages/node/tutorial/package.json"
      - "!framework/languages/node/tutorial/package-lock.json"
      - "!framework/languages/node/tutorial/HttpClient/package.json"
      - "!framework/languages/node/tutorial/HttpClient/package-lock.json"
      - "!framework/languages/node/tutorial/StreamClient/package.json"
      - "!framework/languages/node/tutorial/StreamClient/package-lock.json"
      - "!framework/languages/node/quickstart/package.json"
      - "!framework/languages/node/quickstart/package-lock.json"
      - "!framework/languages/cpp/tutorial/bootstrap.cmake"
      - "!framework/languages/cpp/quickstart/bootstrap.cmake"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/framework-tutorial.yml"
      - "framework/languages/dotnet/tutorial/**"
      - "framework/languages/java/tutorial/**"
      - "framework/languages/node/tutorial/**"
      - "framework/languages/cpp/tutorial/**"
      - "framework/languages/dotnet/quickstart/**"
      - "framework/languages/java/quickstart/**"
      - "framework/languages/node/quickstart/**"
      - "framework/languages/cpp/quickstart/**"
      - "!framework/languages/dotnet/tutorial/Directory.Packages.props"
      - "!framework/languages/dotnet/quickstart/Directory.Packages.props"
      - "!framework/languages/java/tutorial/gradle/libs.versions.toml"
      - "!framework/languages/java/quickstart/gradle/libs.versions.toml"
      - "!framework/languages/node/tutorial/package.json"
      - "!framework/languages/node/tutorial/package-lock.json"
      - "!framework/languages/node/tutorial/HttpClient/package.json"
      - "!framework/languages/node/tutorial/HttpClient/package-lock.json"
      - "!framework/languages/node/tutorial/StreamClient/package.json"
      - "!framework/languages/node/tutorial/StreamClient/package-lock.json"
      - "!framework/languages/node/quickstart/package.json"
      - "!framework/languages/node/quickstart/package-lock.json"
      - "!framework/languages/cpp/tutorial/bootstrap.cmake"
      - "!framework/languages/cpp/quickstart/bootstrap.cmake"
  workflow_dispatch:
  workflow_call:
    inputs:
      language:
        description: 'Tutorial lane to run: cpp, dotnet, java, node, or all'
        required: false
        default: all
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorial-dotnet:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'dotnet'
    name: dotnet
    runs-on: ubuntu-24.04

    # Spot과 Actor는 Location Store 없이는 startup에서 거부된다.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build the quickstart against the published packages
        working-directory: framework/languages/dotnet/quickstart
        run: dotnet build

      - name: Build the tutorial against the published packages
        working-directory: framework/languages/dotnet/tutorial
        run: dotnet build Tutorial.sln -c Release

      - name: Check that the documented snippet markers exist
        shell: bash
        run: |
          set -euo pipefail
          root=framework/languages/dotnet/tutorial
          # README가 적어 둔 마커와 소스의 마커가 어긋나면 문서가 빈 코드 블록을 낸다.
          missing=0
          while read -r marker; do
            grep -rq -- "--8<-- \[start:${marker}\]" "${root}" || {
              echo "::error::snippet marker not found in sources: ${marker}"
              missing=1
            }
          done < <(grep -oE '^[|] `[a-z-]+` [|] `[^`]+` [|]$' "${root}/README.md" | cut -d'`' -f2)
          test "${missing}" -eq 0

      - name: Run every documented step
        shell: bash
        working-directory: framework/languages/dotnet/tutorial
        run: |
          set -euo pipefail

          dotnet run --project Server/Server.csproj -c Release --no-build > server.log 2>&1 &
          dotnet run --project Client/Client.csproj -c Release --no-build > client.log 2>&1 &

          fail() { echo "::error::$1"; echo '--- server.log ---'; cat server.log; echo '--- client.log ---'; cat client.log; exit 1; }

          # Wait until the two processes have found each other. The channel path
          # and the object path come up at different times, and during startup one
          # can answer while the other still refuses, so require both to succeed
          # three times in a row. Every step after this runs exactly once.
          # A fresh queue id each run, so a probe never reuses one whose
          # earlier outcome is still cached.
          warmup="warmup-$$-${RANDOM}"
          streak=0
          for _ in $(seq 1 90); do
            if curl -sf --max-time 10 http://127.0.0.1:5080/players/warmup/profile > /dev/null \
               && curl -sf --max-time 10 -X POST "http://127.0.0.1:5080/match-queues/${warmup}" \
                    -H 'Content-Type: application/json' -d '{"playerId":"warmup"}' > /dev/null; then
              streak=$((streak + 1))
              [ "${streak}" -ge 3 ] && break
            else
              streak=0
              sleep 1
            fi
          done
          [ "${streak}" -ge 3 ] || fail "the two processes never connected"

          # RouteMesh channel
          profile=$(curl -sf http://127.0.0.1:5080/players/p1/profile)
          echo "${profile}" | grep -q '"playerId":"p1"' || fail "channel request/reply: ${profile}"
          curl -sf -X POST http://127.0.0.1:5080/players/p1/logins > /dev/null
          # The send completes at admission (202); the handler runs afterwards, so the log line lands a moment later.
          for _ in $(seq 1 40); do grep -q 'login recorded: p1' server.log && break; sleep 0.25; done
          grep -q 'login recorded: p1' server.log || fail "one-way channel send did not arrive"

          # RouteMesh node direct — the caller names one node instead of a channel.
          status=$(curl -sf http://127.0.0.1:5080/ops/nodes/game-server-1/status)
          echo "${status}" | grep -q '"meshName":"game"' || fail "node direct: ${status}"
          echo "${status}" | grep -q '"channelName":"(none)"' || fail "no channel name expected: ${status}"
          # An id nobody claims must fail rather than pick a substitute.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/ops/nodes/no-such-node/status)
          [ "${code}" = "404" ] || fail "unknown node id should fail, got ${code}"

          # Handler filter — runs around every handler this node receives.
          grep -q 'dispatch start' server.log || fail "filter did not run before the handler"
          grep -q 'dispatch done' server.log || fail "filter did not run after the handler"

          # Weight is the one value a running node can change.
          weight=$(curl -sf -u ops:tutorial-admin -X POST "http://127.0.0.1:5081/admin/channels/profile/weight?value=0")
          echo "${weight}" | grep -q '"weight":0' || fail "weight change: ${weight}"
          curl -sf -u ops:tutorial-admin -X POST "http://127.0.0.1:5081/admin/channels/profile/weight?value=100" > /dev/null

          # ClientServer channel — the caller's connection decides who answers.
          ticket=$(curl -sf -X POST http://127.0.0.1:5080/players/p1/tickets)
          [ "${ticket}" = '"ticket-p1"' ] || fail "client-server channel: ${ticket}"

          # Fanout channel — every subscriber receives it.
          fanout_ready=0
          for _ in $(seq 1 90); do
            if curl -sf --max-time 10 http://127.0.0.1:5081/fanout/broadcast/ready > /dev/null; then
              fanout_ready=1
              break
            fi
            sleep 1
          done
          [ "${fanout_ready}" -eq 1 ] || fail "fanout subscriber never became ready"
          curl -sf -X POST http://127.0.0.1:5080/notices \
            -H 'Content-Type: application/json' -d '{"message":"ci-broadcast"}' > /dev/null
          for _ in $(seq 1 15); do
            grep -q 'maintenance notice: ci-broadcast' server.log && break
            sleep 1
          done
          grep -q 'maintenance notice: ci-broadcast' server.log || fail "fanout subscriber did not receive"

          # User Spot — state must survive between two separate calls.
          room=$(curl -sf -X POST http://127.0.0.1:5080/rooms \
            -H 'Content-Type: application/json' -d '{"title":"ci-room"}' | tr -d '"')
          curl -sf -X POST "http://127.0.0.1:5080/rooms/${room}/chat" \
            -H 'Content-Type: application/json' -d '{"playerId":"p1","text":"hello"}' > /dev/null
          state=$(curl -sf "http://127.0.0.1:5080/rooms/${room}")
          echo "${state}" | grep -q 'p1: hello' || fail "room state: ${state}"

          # Instance Spot - no create call; the first message makes it. The id is
          # fresh per run because a queue keeps whatever earlier runs put in it.
          mode="ranked-$$-${RANDOM}"
          queue=$(curl -sf -X POST "http://127.0.0.1:5080/match-queues/${mode}" \
            -H 'Content-Type: application/json' -d '{"playerId":"p1"}')
          echo "${queue}" | grep -q '"waiting":1' || fail "match queue: ${queue}"
          queue=$(curl -sf -X POST "http://127.0.0.1:5080/match-queues/${mode}" \
            -H 'Content-Type: application/json' -d '{"playerId":"p2"}')
          echo "${queue}" | grep -q '"waiting":2' || fail "match queue state: ${queue}"

          # Actor
          curl -sf -X POST http://127.0.0.1:5080/players/p1 \
            -H 'Content-Type: application/json' -d '{"nickname":"rookie"}' > /dev/null
          curl -sf -X POST http://127.0.0.1:5080/players/p1/nickname \
            -H 'Content-Type: application/json' -d '{"nickname":"rocket"}' > /dev/null
          info=$(curl -sf http://127.0.0.1:5080/players/p1)
          echo "${info}" | grep -q '"nickname":"rocket"' || fail "player state: ${info}"

          # STREAM and session-to-player binding
          stream=$(dotnet run --project StreamClient/StreamClient.csproj -c Release --no-build 2>&1)
          echo "${stream}"
          echo "${stream}" | grep -q 'round trip:' || fail "stream request/reply"
          echo "${stream}" | grep -q 'bound player: p1' || fail "session to player binding"
          echo "${stream}" | grep -q 'pushed: speedy' || fail "player push to bound session"

          # HTTP client surface and operational routes
          http_client=$(dotnet run --project HttpClient/HttpClient.csproj -c Release --no-build 2>&1)
          echo "${http_client}"
          echo "${http_client}" | grep -q '^first request: p1 rookie$' || fail "http client first request"
          echo "${http_client}" | grep -q '^request shaping: status 200 weight 2$' || fail "http client request shaping"
          echo "${http_client}" | grep -q '^json body: player 200 room .* chat 202$' || fail "http client JSON body"
          echo "${http_client}" | grep -q '^response kinds: typed 200 raw application/json; charset=utf-8 fetch anonymous$' || fail "http client response kinds"
          echo "${http_client}" | grep -q '^compressed response: 200 encoding-removed True$' || fail "http client compression"
          echo "${http_client}" | grep -q '^redirect: 200 p1$' || fail "http client redirect"
          echo "${http_client}" | grep -q '^basic auth: without 401 with 200$' || fail "http client basic auth"
          echo "${http_client}" | grep -q '^download stream: chunks [1-9][0-9]* bytes [1-9][0-9]*$' || fail "http client download"
          echo "${http_client}" | grep -q '^upload stream: imported 3$' || fail "http client upload"
          echo "${http_client}" | grep -q '^error kinds: bad request InternalFailure connection refused Unavailable$' || fail "http client errors"

          # Runtime status
          status=$(curl -sf http://127.0.0.1:5080/status)
          echo "${status}" | grep -q '"ready":true' || fail "runtime status: ${status}"

          echo "all tutorial steps passed"

  tutorial-java-kotlin:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'java'
    name: java-kotlin
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build Java and Kotlin quickstarts against the published packages
        working-directory: framework/languages/java/quickstart
        run: >-
          bash ./gradlew --no-daemon
          :java:Server:installDist :java:Client:installDist
          :kotlin:Server:installDist :kotlin:Client:installDist

      - name: Build Java and Kotlin tutorials against the published packages
        working-directory: framework/languages/java/tutorial
        run: >-
          bash ./gradlew --no-daemon build
          :java:Server:installDist :java:Client:installDist
          :java:StreamClient:installDist :java:HttpClient:installDist
          :kotlin:Server:installDist :kotlin:Client:installDist
          :kotlin:StreamClient:installDist :kotlin:HttpClient:installDist

      - name: Check that the documented HTTP snippet markers exist
        shell: bash
        run: |
          set -euo pipefail
          root=framework/languages/java/tutorial
          for language in java kotlin; do
            while read -r marker; do
              grep -Frq -- "--8<-- [start:${marker}]" "${root}" || {
                echo "::error::snippet marker not found in sources: ${marker}"
                exit 1
              }
            done < <(grep -oE '^[|] `[a-z-]+` [|] `[^`]+` [|]$' "${root}/${language}/README.md" | cut -d'`' -f2)
          done

      - name: Run Java and Kotlin documented tutorial steps
        working-directory: framework/languages/java/tutorial
        shell: bash
        run: |
          set -euo pipefail

          run_language() {
            local language="$1"
            local client_port="$2"
            local admin_port="$3"
            local server_bin="$4"
            local client_bin="$5"
            local stream_bin="$6"
            local http_client_bin="$7"
            local log_dir="run-${language}-ci"

            mkdir -p "${log_dir}"
            "${server_bin}" > "${log_dir}/server.log" 2>&1 &
            local server_pid=$!
            "${client_bin}" > "${log_dir}/client.log" 2>&1 &
            local client_pid=$!

            cleanup() {
              kill "${client_pid}" "${server_pid}" 2>/dev/null || true
              wait "${client_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            }
            trap cleanup EXIT

            fail() {
              echo "::error::${language}: $1"
              tail -n 120 "${log_dir}/server.log"
              tail -n 120 "${log_dir}/client.log"
              exit 1
            }

            local ready=0
            for _ in $(seq 1 90); do
              if curl -sf --max-time 5 "http://127.0.0.1:${client_port}/players/warmup/profile" > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            [ "${ready}" -eq 1 ] || fail "the two processes never connected"

            profile=$(curl -sf "http://127.0.0.1:${client_port}/players/p1/profile")
            echo "${profile}" | grep -q '"playerId":"p1"' || fail "profile: ${profile}"
            status=$(curl -sf "http://127.0.0.1:${client_port}/ops/nodes/game-server-1/status")
            echo "${status}" | grep -q '"meshName":"game"' || fail "node status: ${status}"
            unauthorized=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "http://127.0.0.1:${admin_port}/admin/channels/profile/weight?value=2")
            [ "${unauthorized}" = "401" ] || fail "admin without auth: ${unauthorized}"
            authorized=$(curl -s -o /dev/null -w '%{http_code}' -u ops:tutorial-admin -X POST \
              "http://127.0.0.1:${admin_port}/admin/channels/profile/weight?value=2")
            [ "${authorized}" = "200" ] || fail "admin with auth: ${authorized}"

            curl -sf -X POST "http://127.0.0.1:${client_port}/players/p1" \
              -H 'Content-Type: application/json' -d '{"nickname":"rookie"}' > /dev/null

            stream_output=$("${stream_bin}") || fail "StreamClient failed"
            echo "${stream_output}" | grep -q 'round trip:' || fail "stream request/reply"
            echo "${stream_output}" | grep -q 'bound player: p1' || fail "stream binding"
            echo "${stream_output}" | grep -q 'pushed: speedy' || fail "stream push"

            http_output=$("${http_client_bin}") || fail "HttpClient failed"
            echo "${http_output}"
            [ "$(printf '%s\n' "${http_output}" | wc -l)" -eq 10 ] || fail "HttpClient did not print 10 lines"
            echo "${http_output}" | grep -q '^first request: p1 rookie$' || fail "first request"
            echo "${http_output}" | grep -q '^request shaping: status 200 weight 2$' || fail "request shaping"
            echo "${http_output}" | grep -q '^response kinds: typed 200 raw application/json fetch anonymous$' || fail "response kinds"
            echo "${http_output}" | grep -q '^compressed response: 200 encoding-removed true$' || fail "compression"
            echo "${http_output}" | grep -q '^redirect: 200 p1$' || fail "redirect"
            echo "${http_output}" | grep -q '^basic auth: without 401 with 200$' || fail "basic auth"
            echo "${http_output}" | grep -q '^download stream: chunks [1-9][0-9]* bytes [1-9][0-9]*$' || fail "download"
            echo "${http_output}" | grep -q '^upload stream: imported 3$' || fail "upload"
            echo "${http_output}" | grep -q '^error kinds: bad request INTERNAL_FAILURE connection refused UNAVAILABLE$' || fail "error kinds"
            cleanup
            trap - EXIT
          }

          run_language java 5280 5281 \
            ./java/Server/build/install/Server/bin/Server \
            ./java/Client/build/install/Client/bin/Client \
            ./java/StreamClient/build/install/StreamClient/bin/StreamClient \
            ./java/HttpClient/build/install/HttpClient/bin/HttpClient
          run_language kotlin 5380 5381 \
            ./kotlin/Server/build/install/Server/bin/Server \
            ./kotlin/Client/build/install/Client/bin/Client \
            ./kotlin/StreamClient/build/install/StreamClient/bin/StreamClient \
            ./kotlin/HttpClient/build/install/HttpClient/bin/HttpClient

  tutorial-node:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'node'
    name: node
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the quickstart against the published packages
        working-directory: framework/languages/node/quickstart
        run: |
          npm install
          npm run build

      - name: Install the published packages
        working-directory: framework/languages/node/tutorial
        run: |
          npm install
          npm --prefix HttpClient install

      - name: Build the tutorial and HttpClient
        working-directory: framework/languages/node/tutorial
        run: |
          npm run build
          npm run build:http-client

      - name: Check that the documented snippet markers exist
        shell: bash
        run: |
          set -euo pipefail
          root=framework/languages/node/tutorial
          missing=0
          while read -r marker; do
            grep -rq -- "--8<-- \[start:${marker}\]" "${root}" || {
              echo "::error::snippet marker not found in sources: ${marker}"
              missing=1
            }
          done < <(grep -oE '^[|] `[a-z-]+` [|] `[^`]+` [|]$' "${root}/README.md" | cut -d'`' -f2)
          test "${missing}" -eq 0

      - name: Run the documented Node tutorial steps
        shell: bash
        working-directory: framework/languages/node/tutorial
        run: |
          set -euo pipefail

          npm run server > server.log 2>&1 &
          server_pid=$!
          npm run client > client.log 2>&1 &
          client_pid=$!
          cleanup() {
            kill "${client_pid}" "${server_pid}" 2>/dev/null || true
            wait "${client_pid}" "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          fail() {
            echo "::error::$1"
            echo '--- server.log ---'
            cat server.log
            echo '--- client.log ---'
            cat client.log
            exit 1
          }

          warmup="warmup-$$-${RANDOM}"
          streak=0
          for _ in $(seq 1 90); do
            if curl -sf --max-time 10 http://127.0.0.1:5480/players/p1/profile > /dev/null \
               && curl -sf --max-time 10 -X POST "http://127.0.0.1:5480/match-queues/${warmup}" \
                    -H 'Content-Type: application/json' -d '{"playerId":"warmup"}' > /dev/null; then
              streak=$((streak + 1))
              [ "${streak}" -ge 3 ] && break
            else
              streak=0
              sleep 1
            fi
          done
          [ "${streak}" -ge 3 ] || fail "the two Node processes never connected"

          profile=$(curl -sf http://127.0.0.1:5480/players/p1/profile)
          echo "${profile}" | grep -q '"playerId":"p1"' || fail "profile route: ${profile}"
          curl -sf -X POST http://127.0.0.1:5480/players/p1/logins > /dev/null
          grep -q 'login recorded: p1' server.log || fail "one-way channel send"

          status=$(curl -sf http://127.0.0.1:5480/ops/nodes/game-server-1/status)
          echo "${status}" | grep -q '"meshName":"game"' || fail "node direct route: ${status}"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5480/ops/nodes/no-such-node/status)
          [ "${code}" = "404" ] || fail "unknown node id should fail, got ${code}"

          weight=$(curl -sf -u ops:tutorial-admin -X POST \
            "http://127.0.0.1:5481/admin/channels/profile/weight?value=0")
          echo "${weight}" | grep -q '"weight":0' || fail "weight change: ${weight}"
          curl -sf -u ops:tutorial-admin -X POST \
            "http://127.0.0.1:5481/admin/channels/profile/weight?value=100" > /dev/null

          ticket=$(curl -sf -X POST http://127.0.0.1:5480/players/p1/tickets)
          [ "${ticket}" = '"ticket-p1"' ] || fail "ClientServer route: ${ticket}"
          curl -sf -X POST http://127.0.0.1:5480/notices \
            -H 'Content-Type: application/json' -d '{"message":"ci-broadcast"}' > /dev/null
          grep -q 'maintenance notice: ci-broadcast' server.log || fail "fanout route"

          room=$(curl -sf -X POST http://127.0.0.1:5480/rooms \
            -H 'Content-Type: application/json' -d '{"title":"ci-room"}' | tr -d '"')
          curl -sf -X POST "http://127.0.0.1:5480/rooms/${room}/chat" \
            -H 'Content-Type: application/json' -d '{"playerId":"p1","text":"hello"}' > /dev/null
          state=$(curl -sf "http://127.0.0.1:5480/rooms/${room}")
          echo "${state}" | grep -q 'p1: hello' || fail "room state: ${state}"

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "http://127.0.0.1:5481/admin/channels/profile/weight?value=2")
          [ "${code}" = "401" ] || fail "admin authentication: ${code}"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5480/player/p1)
          [ "${code}" = "301" ] || fail "redirect route: ${code}"
          headers=$(curl -sS -D - -o /dev/null -H 'Accept-Encoding: gzip' \
            "http://127.0.0.1:5480/rooms/${room}")
          echo "${headers}" | grep -qi '^content-encoding: gzip' || fail "gzip response"
          export_headers=$(curl -sS -D - -o /dev/null \
            "http://127.0.0.1:5480/rooms/${room}/export")
          echo "${export_headers}" | grep -qi '^transfer-encoding: chunked' || fail "chunked export"
          imported=$(printf '%s\n%s\n%s\n' \
            '{"playerId":"p1","text":"one"}' \
            '{"playerId":"p1","text":"two"}' \
            '{"playerId":"p1","text":"three"}' \
            | curl -sf -X POST "http://127.0.0.1:5480/rooms/${room}/import" \
                -H 'Content-Type: application/x-ndjson' --data-binary @-)
          echo "${imported}" | grep -q '"imported":3' || fail "chunked import: ${imported}"

          http_output=$(npm run http-client)
          echo "${http_output}"
          echo "${http_output}" | grep -q 'first request: p1 rookie' || fail "HttpClient first request"
          echo "${http_output}" | grep -q 'basic auth: without 401 with 200' || fail "HttpClient auth"
          echo "${http_output}" | grep -q 'upload stream: imported 3' || fail "HttpClient upload"
          echo "${http_output}" | grep -q '^error kinds: bad request InternalFailure connection refused Unavailable$' || fail "HttpClient error kinds"

          echo "all Node tutorial steps passed"

  tutorial-cpp:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'cpp'
    name: cpp
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # vcpkg builds the third-party libraries from source on every fresh runner
      # (~20 min of a ~25 min job, #852). Keep its binary cache (one zip per
      # built port) in the Actions cache. The key hashes framework/languages/cpp/tutorial/bootstrap.cmake — it pins
      # the vcpkg baseline and the framework version whose vcpkg.json lists the
      # ports — so a baseline or manifest move starts a new cache; restore-keys
      # still seed it from the previous one. Only the cache location changes:
      # vcpkg decides hits per port, and a miss builds exactly as before.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('framework/languages/cpp/tutorial/bootstrap.cmake') }}
          restore-keys: vcpkg-binary-${{ runner.os }}-

      - name: Point vcpkg at the binary cache
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.vcpkg-binary-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/.vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"

      - name: Build the C++ tutorial against the published archives
        working-directory: framework/languages/cpp/tutorial
        run: |
          cmake -P bootstrap.cmake
          cmake --build build --parallel

      # Saved right after the bootstrap and even when a later step fails: the
      # ports built here are what the next run must not build again.
      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build and run the C++ quickstart (reusing the tutorial's .zlink)
        working-directory: framework/languages/cpp/quickstart
        run: |
          set -euo pipefail
          cmake -DZLINK_ROOT="$PWD/../tutorial/.zlink" -P bootstrap.cmake
          cmake --build build --parallel
          ./build/quickstart_server > server.log 2>&1 &
          ./build/quickstart_client > client.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5083/hello/world > /dev/null && break; sleep 1; done
          answer="$(curl -sf http://127.0.0.1:5083/hello/world)" || { cat server.log client.log; exit 1; }
          echo "${answer}" | grep -q '"hello, world"'
          kill %1 %2 2>/dev/null || true

      - name: Check that the documented snippet markers exist
        shell: bash
        run: |
          set -euo pipefail
          root=framework/languages/cpp/tutorial
          missing=0
          while read -r marker; do
            grep -rq -- "--8<-- \[start:${marker}\]" "${root}" || {
              echo "::error::snippet marker not found in sources: ${marker}"
              missing=1
            }
          done < <(grep -oE '^[|] `[a-z-]+` [|] `[^`]+` [|]$' "${root}/README.md" | cut -d'`' -f2)
          test "${missing}" -eq 0

      - name: Run the HTTP client tutorial
        shell: bash
        working-directory: framework/languages/cpp/tutorial
        run: |
          set -euo pipefail
          ./build/tutorial_server > server.log 2>&1 & server_pid=$!
          ./build/tutorial_client > client.log 2>&1 & client_pid=$!
          cleanup() { kill "${server_pid}" "${client_pid}" 2>/dev/null || true; }
          trap cleanup EXIT

          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5180/players/p1/profile > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf -u ops:tutorial-admin -X POST \
            'http://127.0.0.1:5181/admin/channels/profile/weight?value=100' > /dev/null
          output=$(./build/tutorial_http_client)
          printf '%s\n' "${output}"
          test "$(printf '%s\n' "${output}" | wc -l)" -eq 10
          printf '%s\n' "${output}" | grep -q '^first request: p1 rookie$'
          printf '%s\n' "${output}" | grep -q '^basic auth: without 401 with 200$'
          printf '%s\n' "${output}" | grep -q '^error kinds: bad request internal_failure connection refused unavailable$'
          ./build/tutorial_stream_client > stream.log
