name: Build libzlink Core Libraries

on:
  workflow_dispatch:
    inputs:
      libzlink_version:
        description: 'libzlink version to build (default: from VERSION file)'
        required: false
        type: string

env:
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  read-versions:
    name: Read Version Information
    runs-on: ubuntu-24.04
    outputs:
      libzlink_version: ${{ steps.versions.outputs.libzlink_version }}
      libzlink_lib_suffix: ${{ steps.versions.outputs.libzlink_lib_suffix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read versions from VERSION file
        id: versions
        env:
          INPUT_LIBZLINK_VERSION: ${{ inputs.libzlink_version }}
        run: |
          LIBZLINK_VERSION_MAJOR=$(grep '^LIBZLINK_VERSION_MAJOR=' VERSION | cut -d'=' -f2)
          LIBZLINK_VERSION_MINOR=$(grep '^LIBZLINK_VERSION_MINOR=' VERSION | cut -d'=' -f2)
          LIBZLINK_VERSION_PATCH=$(grep '^LIBZLINK_VERSION_PATCH=' VERSION | cut -d'=' -f2)
          REPOSITORY_LIBZLINK_VERSION=$(grep '^LIBZLINK_VERSION=' VERSION | cut -d'=' -f2)

          if ! [[ "${REPOSITORY_LIBZLINK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid LIBZLINK_VERSION in VERSION: ${REPOSITORY_LIBZLINK_VERSION}" >&2
            exit 1
          fi
          COMPONENT_VERSION="${LIBZLINK_VERSION_MAJOR}.${LIBZLINK_VERSION_MINOR}.${LIBZLINK_VERSION_PATCH}"
          if [[ "${COMPONENT_VERSION}" != "${REPOSITORY_LIBZLINK_VERSION}" ]]; then
            echo "VERSION components ${COMPONENT_VERSION} do not match LIBZLINK_VERSION ${REPOSITORY_LIBZLINK_VERSION}" >&2
            exit 1
          fi

          # An omitted manual input uses VERSION. A supplied input may only
          # confirm that exact repository runtime version.
          LIBZLINK_VERSION="${REPOSITORY_LIBZLINK_VERSION}"
          if [[ -n "${INPUT_LIBZLINK_VERSION}" ]]; then
            if ! [[ "${INPUT_LIBZLINK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid libzlink_version input: ${INPUT_LIBZLINK_VERSION}" >&2
              exit 1
            fi
            if [[ "${INPUT_LIBZLINK_VERSION}" != "${REPOSITORY_LIBZLINK_VERSION}" ]]; then
              echo "manual version ${INPUT_LIBZLINK_VERSION} does not match VERSION ${REPOSITORY_LIBZLINK_VERSION}" >&2
              exit 1
            fi
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^core/v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[1-9][0-9]*)?$ ]]; then
              echo "invalid Core release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            TAG_RUNTIME_VERSION="${BASH_REMATCH[1]}"
            if [[ "${TAG_RUNTIME_VERSION}" != "${REPOSITORY_LIBZLINK_VERSION}" ]]; then
              echo "tag runtime ${TAG_RUNTIME_VERSION} does not match VERSION ${REPOSITORY_LIBZLINK_VERSION}" >&2
              exit 1
            fi
          fi

          LIBZLINK_LIB_SUFFIX="${LIBZLINK_VERSION_MAJOR}_${LIBZLINK_VERSION_MINOR}_${LIBZLINK_VERSION_PATCH}"

          echo "libzlink_version=${LIBZLINK_VERSION}" >> $GITHUB_OUTPUT
          echo "libzlink_lib_suffix=${LIBZLINK_LIB_SUFFIX}" >> $GITHUB_OUTPUT

          echo "Using libzlink version: ${LIBZLINK_VERSION}"
          echo "Using windows lib suffix: ${LIBZLINK_LIB_SUFFIX}"

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    needs: read-versions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSVC environment
        uses: ./.github/actions/msvc-env
        with:
          arch: x64

      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl --no-progress
          $opensslRoot = "C:\Program Files\OpenSSL"
          if (Test-Path $opensslRoot) {
            echo "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
            Write-Host "OpenSSL installed at $opensslRoot"
          } else {
            # Try fallback path
            $opensslRoot = "C:\Program Files\OpenSSL-Win64"
            if (Test-Path $opensslRoot) {
              echo "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
            } else {
              Write-Error "OpenSSL installation failed or path incorrect"
            }
          }

      - name: Verify Windows test configuration
        shell: pwsh
        run: |
          cmake -S core -B build-win-x64-test-config `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DBUILD_SHARED=ON `
            -DBUILD_STATIC=ON `
            -DBUILD_TESTS=ON `
            -DBUILD_BENCHMARKS=OFF `
            -DZLINK_CXX_STANDARD=17 `
            -DWITH_TLS=ON `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"
          cmake --build build-win-x64-test-config --config Release `
            --target test_zmp_metadata test_asio_ws
          $testBin = (Resolve-Path "build-win-x64-test-config\bin\Release").Path
          $opensslBin = Join-Path $env:OPENSSL_ROOT_DIR "bin"
          Get-ChildItem $opensslBin -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $testBin -Force
          }
          $env:PATH = "$testBin;$opensslBin;$env:PATH"
          ctest --test-dir build-win-x64-test-config -C Release `
            --output-on-failure `
            -R '^(test_zmp_metadata|test_asio_ws)$'

      - name: Build libzlink
        shell: pwsh
        run: |
          $buildDir = "build-win-x64"
          $distDir = "core\dist\windows-x64"
          New-Item -ItemType Directory -Force -Path $buildDir
          cd $buildDir
          # core/CMakeLists.txt defaults WIN32 to installing the CMake
          # package under <prefix>/CMake (no lib/cmake/zlink). Override it
          # so every platform's archive has the same lib/cmake/zlink/*.cmake
          # layout, matching vcpkg/ports/zlink/portfile.cmake:38 — the
          # archive's own layout must not depend on which platform built it.
          cmake ..\core `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED=ON `
            -DBUILD_STATIC=ON `
            -DBUILD_TESTS=OFF `
            -DZLINK_CXX_STANDARD=17 `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DZLINK_CMAKECONFIG_INSTALL_DIR=lib/cmake/zlink
          cmake --build . --config Release --parallel

          New-Item -ItemType Directory -Force -Path "..\$distDir\bin", "..\$distDir\lib", "..\$distDir\include", "..\$distDir\lib\pkgconfig" | Out-Null
          Copy-Item ".\bin\Release\zlink.dll" "..\$distDir\bin\zlink.dll" -Force
          Copy-Item ".\lib\Release\zlink.lib" "..\$distDir\lib\zlink.lib" -Force
          if (Test-Path ".\bin\Release\zlink.pdb") {
            Copy-Item ".\bin\Release\zlink.pdb" "..\$distDir\bin\zlink.pdb" -Force
          }
          if (Test-Path ".\libzlink.pc") {
            Copy-Item ".\libzlink.pc" "..\$distDir\lib\pkgconfig\libzlink.pc" -Force
          }
          Copy-Item "..\core\include\*.h" "..\$distDir\include\" -Force

          # Merge the full `cmake --install` prefix (lib\cmake\zlink\*.cmake,
          # the static archive, the complete include\ tree) into the
          # archive. This is additive: robocopy merges directory contents
          # without nesting, so it sits alongside the flat bin\zlink.dll /
          # lib\zlink.lib / include\*.h files copied above, which existing
          # consumers (fetch-release.sh, fetch-release.ps1, node/java
          # prebuild downloads, framework CI) still read from those paths.
          cmake --install . --config Release --prefix "$PWD\install"
          robocopy ".\install" "..\$distDir" /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy failed merging the install prefix into $distDir (exit $LASTEXITCODE)"
          }
          # robocopy returns 1 ("files copied") on ordinary success, not 0.
          # GitHub Actions appends `exit $LASTEXITCODE` to every pwsh step,
          # so left alone this fails the step even though nothing is wrong.
          # Reset it now that the guard above has judged the real outcome.
          $global:LASTEXITCODE = 0

      # libzlink-static compiles its own sources directly on MSVC (see
      # core/CMakeLists.txt's MSVC branch), not through the shared OBJECT
      # library Linux/macOS use, and already has
      # INTERPROCEDURAL_OPTIMIZATION OFF -- so MSVC /GL whole-program IL
      # objects should never reach this .lib. This is a regression guard,
      # not a fix for a known Windows break, matching the equivalent
      # Linux/macOS checks added for issue #397.
      #
      # An earlier version of this check used a `dumpbin /disasm` line
      # count, which is the wrong signal: Microsoft documents that dumpbin
      # cannot disassemble a /GL object at all regardless of its content
      # ("Only the /HEADERS DUMPBIN option is available for use on files
      # produced with the /GL compiler option"), so that check would have
      # been unreliable on a small archive even if it worked. What
      # dumpbin does reliably report is the file's format: a /GL object
      # is emitted in the special "anonymous object" COFF variant (an
      # ANON_OBJ_HEADER, distinguished from a normal object by its
      # version word), and `dumpbin /headers` prints exactly
      # "File Type: ANONYMOUS OBJECT" for one. A resolved, ordinary COFF
      # object (what INTERPROCEDURAL_OPTIMIZATION OFF should always
      # produce here) never reports that. (No Windows toolchain available
      # to run this locally; confirmed the anonymous-object format and
      # this exact dumpbin string against Microsoft's own documentation
      # and reference material instead of assuming.)
      - name: Verify static archive is portable object code, not LTO/GL-only IL
        shell: pwsh
        run: |
          $distDir = "core\dist\windows-x64"
          $staticLib = Get-ChildItem "$distDir\lib\libzlink*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $staticLib) {
            throw "static archive not found under $distDir\lib\libzlink*.lib"
          }
          $headers = & dumpbin /headers $staticLib.FullName 2>&1 | Out-String
          if ($headers -match "ANONYMOUS OBJECT") {
            throw "$($staticLib.Name) has an ANONYMOUS OBJECT member -- MSVC /GL whole-program IL not resolved into real code (issue #397)"
          }
          Write-Host "OK: dumpbin /headers reports no ANONYMOUS OBJECT members in $($staticLib.Name)"

      - name: Install Visual C++ Redistributable
        shell: pwsh
        run: |
          # Check if UCRT is available
          Write-Host "Checking for UCRT DLLs in System32..."
          $ucrtDlls = Get-ChildItem "C:\Windows\System32\ucrtbase.dll" -ErrorAction SilentlyContinue
          if ($ucrtDlls) {
            Write-Host "ucrtbase.dll found in System32"
          } else {
            Write-Host "ucrtbase.dll NOT found - installing VC++ Redistributable"
            # Download and install VC++ Redistributable
            $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
            $installer = "$env:TEMP\vc_redist.x64.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/install", "/quiet", "/norestart" -Wait
          }

          # Also copy ucrtbase.dll to dist if available
          $distDir = "core\dist\windows-x64"
          $ucrtPath = "C:\Windows\System32\ucrtbase.dll"
          if (Test-Path $ucrtPath) {
            Copy-Item $ucrtPath "$distDir\bin\ucrtbase.dll" -Force
            Write-Host "Copied ucrtbase.dll to $distDir"
          }

          $opensslBin = Join-Path $env:OPENSSL_ROOT_DIR "bin"
          foreach ($dllPattern in @("libssl-*.dll", "libcrypto-*.dll")) {
            Get-ChildItem $opensslBin -Filter $dllPattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "$distDir\bin\" -Force
              Write-Host "Copied $($_.Name) to $distDir\bin"
            }
          }

      - name: Check DLL dependencies
        shell: cmd
        run: |
          echo === zlink.dll dependencies ===
          dumpbin /DEPENDENTS core\dist\windows-x64\bin\zlink.dll
          echo.
          echo === Files in dist ===
          dir /s core\dist\windows-x64\
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: libzlink-windows-x64
          path: core/dist/windows-x64/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-linux:
    name: Build Linux x64
    # Deliberately a different GCC major version than the `verify` job
    # below (ubuntu-24.04). libzlink.a is an LTO archive; linking it is
    # only a real test of "does the distributed static archive link on a
    # downstream toolchain" if that toolchain differs from the one that
    # built it. Aligning these runners would make the find_package(CONFIG)
    # static-link smoke in `verify` pass regardless of a real cross-
    # toolchain break (issue #397 caught exactly this: libzlink.a built
    # here under GCC 11.3 failed to link under GCC 13.1 in `verify`,
    # because BUILD_STATIC still inherited global LTO). Do not "fix" this
    # by matching the runners.
    runs-on: ubuntu-22.04
    needs: read-versions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libssl-dev

      - name: Build and test libzlink
        run: |
          chmod +x ./core/builds/linux/build.sh
          ./core/builds/linux/build.sh x64 "ON"

      # Functional smoke of the multi-socket C perf runners under the 0.16.0
      # pull-completion contract (8 clients, 2 s, tcp, 4 KiB and 64 KiB). It
      # judges completion and RESULT presence only, never throughput, so it is
      # deterministic on a small runner; a stalled pattern fails within the
      # timeout instead of hanging. Uses a no-LTO library build: the smoke is
      # about behaviour, not instruction counts.
      - name: Multi perf smoke (pull-completion contract)
        run: |
          cmake -S core -B core/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=OFF \
            -DZLINK_BUILD_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DWITH_DOCS=OFF
          cmake --build core/build --parallel 2 --target libzlink
          ZLINK_CORE_SOURCE=local CCU=8 DUR=2 TIMEOUT=600 \
            bash bindings/c/perf/ci_multi_smoke.sh

      - name: Verify WebSocket build without TLS
        run: |
          cmake -S core -B build-linux-x64-no-tls \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DWITH_DOCS=OFF \
            -DWITH_TLS=OFF
          cmake --build build-linux-x64-no-tls --parallel 2 \
            --target libzlink test_capabilities test_asio_ws
          if ldd build-linux-x64-no-tls/lib/libzlink.so | grep -E 'lib(ssl|crypto)'; then
            echo "TLS-disabled libzlink unexpectedly links OpenSSL" >&2
            exit 1
          fi
          ctest --test-dir build-linux-x64-no-tls --output-on-failure \
            -R '^(test_capabilities|test_asio_ws)$'
          cmake -S core -B build-linux-x64-static-only-no-tls \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED=OFF \
            -DBUILD_STATIC=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DWITH_DOCS=OFF \
            -DWITH_TLS=OFF
          cmake --build build-linux-x64-static-only-no-tls --parallel 2 \
            --target libzlink-static

      - name: Verify build output
        run: test -f core/dist/linux-x64/libzlink.so

      # `nm`/`file`/`ar t` all read a GCC LTO-bytecode-only object as an
      # ordinary one -- it keeps a real ELF symbol table for archiver
      # bookkeeping, the actual code living only in .gnu.lto_* sections
      # readable by the exact GCC major version that produced them (issue
      # #397; CI run 34948757858 shipped a bytecode-only libzlink.a that
      # nm/file both read as fine). An earlier version of this check
      # looked for an empty .text section instead, which is the wrong
      # signal in the other direction: a translation unit with no
      # function bodies (e.g. src/runtime/utils/precompiled.cpp, which is
      # just one #include) legitimately has an empty .text with or
      # without LTO, so that check flagged linux-arm64's
      # precompiled.cpp.o as a false positive (CI run 34962128541).
      #
      # The correct, GCC-documented signal is presence, not absence: GCC
      # marks every slim/thin (bytecode-only) LTO object with a global
      # COMMON symbol named `__gnu_lto_slim` (so the linker can complain
      # if such an object is ever linked without going through the LTO
      # plugin); a fat LTO object (real code + bytecode, what
      # -ffat-lto-objects above produces) and a normal non-LTO object
      # never define it. `nm` does not print this symbol at all (tested);
      # `readelf -s` does. Verified directly against a real bad archive
      # (a worktree at the commit CI reproduced 34948757858 against, i.e.
      # before -ffat-lto-objects existed): every one of 154 members had
      # __gnu_lto_slim, including precompiled.cpp.o; after this fix, 0 of
      # 154 do, precompiled.cpp.o included -- see this change's commit
      # message for the exact commands and counts.
      - name: Verify static archive is portable object code, not LTO bytecode
        run: |
          set -euo pipefail
          lib="$(pwd)/core/dist/linux-x64/lib/libzlink.a"
          work="$(mktemp -d)"
          (cd "$work" && ar x "$lib")
          fail=0
          for obj in "$work"/*.o; do
            if readelf -s "$obj" | grep -q '__gnu_lto_slim'; then
              echo "LTO-bytecode-only member (defines __gnu_lto_slim): $(basename "$obj")" >&2
              fail=1
            fi
          done
          rm -rf "$work"
          if [ "$fail" -ne 0 ]; then
            echo "libzlink.a has members with no real object code -- it would only link on the exact toolchain that built it (issue #397)." >&2
            exit 1
          fi
          echo "OK: no libzlink.a member defines __gnu_lto_slim (no LTO-bytecode-only members)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: libzlink-linux-x64
          path: core/dist/linux-x64/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-22.04-arm
    needs: read-versions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libssl-dev

      - name: Build and test libzlink
        run: |
          chmod +x ./core/builds/linux/build.sh
          ./core/builds/linux/build.sh arm64 "ON"

      - name: Verify build output
        run: test -f core/dist/linux-arm64/libzlink.so

      # Same check as build-linux, same reason: nm/file/ar t cannot tell a
      # GCC LTO-bytecode-only object from a real one, and checking for an
      # empty .text section (an earlier version of this check) false-
      # positives on translation units with no function bodies, such as
      # src/runtime/utils/precompiled.cpp -- this job's own CI run
      # (34962128541) hit exactly that false positive. See the identical
      # comment in build-linux for the __gnu_lto_slim marker this uses
      # instead, and how it was verified (issue #397).
      - name: Verify static archive is portable object code, not LTO bytecode
        run: |
          set -euo pipefail
          lib="$(pwd)/core/dist/linux-arm64/lib/libzlink.a"
          work="$(mktemp -d)"
          (cd "$work" && ar x "$lib")
          fail=0
          for obj in "$work"/*.o; do
            if readelf -s "$obj" | grep -q '__gnu_lto_slim'; then
              echo "LTO-bytecode-only member (defines __gnu_lto_slim): $(basename "$obj")" >&2
              fail=1
            fi
          done
          rm -rf "$work"
          if [ "$fail" -ne 0 ]; then
            echo "libzlink.a has members with no real object code -- it would only link on the exact toolchain that built it (issue #397)." >&2
            exit 1
          fi
          echo "OK: no libzlink.a member defines __gnu_lto_slim (no LTO-bytecode-only members)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: libzlink-linux-arm64
          path: core/dist/linux-arm64/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-macos-arm64:
    name: Build macOS ARM64 (Apple Silicon)
    runs-on: macos-15
    needs: read-versions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          brew install \
            cmake \
            pkg-config \
            openssl@3

      - name: Build libzlink
        run: |
          # Use ARM64 Homebrew for Apple Silicon
          export OPENSSL_ROOT_DIR=$(/opt/homebrew/bin/brew --prefix openssl@3)
          echo "Using OpenSSL from $OPENSSL_ROOT_DIR"
          export CMAKE_PREFIX_PATH=$OPENSSL_ROOT_DIR
          export LDFLAGS="-L$OPENSSL_ROOT_DIR/lib"
          export CPPFLAGS="-I$OPENSSL_ROOT_DIR/include"
          export PKG_CONFIG_PATH="$OPENSSL_ROOT_DIR/lib/pkgconfig"
          export ZLINK_CTEST_EXCLUDE_REGEX='^(test_multi_dealer_dealer_benchmark_process|test_multi_pubsub_benchmark_process|test_multi_spot_benchmark_process|test_multi_stream_benchmark_process|test_single_pair_benchmark_process|test_single_spot_benchmark_process|test_reconnect_options|test_zmp_request_reply|test_stream_send_blocking_wakeup|test_stream_socket_recv_multiclient_ready_regression|test_stream_threadsafe_callback_queue_load|test_stream_threadsafe_recv_queue_load|test_stream_threadsafe_recv_queue_timed_window)$'
          chmod +x ./core/builds/macos/build.sh
          ./core/builds/macos/build.sh \
            arm64 \
            "ON"

      # Same class of problem as build-linux's check, different shape: with
      # plain -flto (no -ffat-lto-objects), clang's ".o" output is not a
      # Mach-O object at all -- it is a raw LLVM bitcode file (only
      # -ffat-lto-objects wraps real object code plus a __LLVM,__bitcode
      # section in an actual Mach-O container; see
      # https://llvm.org/docs/BitCodeFormat.html and the FatLTO design,
      # https://discourse.llvm.org/t/rfc-ffat-lto-objects-support/63977).
      # An earlier version of this check used otool -l's __text section
      # size, which has the same false-positive shape build-linux's
      # original .text check did (empty is not unique to LTO -- and would
      # not even apply here, since a bitcode-only file has no Mach-O
      # section table for otool to read in the first place). `file`
      # recognizes the bitcode magic directly, so check that instead: a
      # real Mach-O object (fat-LTO or plain non-LTO, whichever this
      # toolchain produced -- see core/CMakeLists.txt for which) is never
      # reported as bitcode. (No local macOS access to verify this
      # against actual clang output; based on documented LLVM bitcode/
      # FatLTO behavior rather than a guess about file's exact wording,
      # matched case-insensitively against "bitcode" to tolerate small
      # phrasing differences across libmagic versions.)
      - name: Verify static archive is portable object code, not LTO bytecode
        run: |
          set -euo pipefail
          lib="$(pwd)/core/dist/macos-arm64/lib/libzlink.a"
          work="$(mktemp -d)"
          (cd "$work" && ar x "$lib")
          fail=0
          for obj in "$work"/*.o; do
            if file "$obj" | grep -qi 'bitcode'; then
              echo "LLVM-bitcode-only member (not a native object file): $(basename "$obj") -- $(file "$obj")" >&2
              fail=1
            fi
          done
          rm -rf "$work"
          if [ "$fail" -ne 0 ]; then
            echo "libzlink.a has members with no real object code -- it would only link on the exact toolchain that built it (issue #397)." >&2
            exit 1
          fi
          echo "OK: no libzlink.a member is raw LLVM bitcode."

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: libzlink-macos-arm64
          path: core/dist/macos-arm64/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  verify:
    name: Verify Build Artifacts
    # Deliberately a different GCC major version than `build-linux` above
    # (ubuntu-22.04) — see the comment there. The find_package(CONFIG)
    # static-link smoke below only proves the shipped libzlink.a links on
    # a toolchain other than the one that built it if this runner actually
    # differs. Do not align these to "fix" a CI flake.
    runs-on: ubuntu-24.04
    needs:
      - read-versions
      - build-windows
      - build-linux
      - build-linux-arm64
      - build-macos-arm64
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Display artifact structure
        run: |
          echo "=== Artifact Structure ==="
          find artifacts -type f -ls

      - name: Generate SHA256 checksums
        run: |
          echo "=== SHA256 Checksums ==="
          cd artifacts
          find . -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" -o -name "*.a" -o -name "*.lib" -o -name "*.h" -o -name "*.cmake" \) -exec sha256sum {} \; | tee checksums.txt

      - name: Verify public headers
        run: |
          for platform in windows-x64 linux-x64 linux-arm64 macos-arm64; do
            for header in zlink.h zlink_enum.h zlink_errno.h; do
              test -f "artifacts/libzlink-${platform}/include/${header}" || {
                echo "missing public header: ${platform}/include/${header}" >&2
                exit 1
              }
            done
          done

      # Every archive must carry a complete `make install` prefix, not just
      # the flat runtime + headers: bindings/cpp/CMakeLists.txt requires
      # find_package(zlink CONFIG), and vcpkg's default static triplet
      # requires the static archive (issue #397).
      - name: Verify install prefix (CMake package + static archive)
        run: |
          set -euo pipefail
          for platform in windows-x64 linux-x64 linux-arm64 macos-arm64; do
            root="artifacts/libzlink-${platform}"
            for cmake_file in zlinkConfig.cmake zlinkConfigVersion.cmake; do
              test -f "${root}/lib/cmake/zlink/${cmake_file}" || {
                echo "missing CMake package file: ${platform}/lib/cmake/zlink/${cmake_file}" >&2
                exit 1
              }
            done
            if [ "$platform" = "windows-x64" ]; then
              # The shared import library (lib/zlink.lib) is not the static
              # archive: the static target keeps the "lib" OUTPUT_NAME
              # prefix plus an MSVC toolset/runtime postfix, e.g.
              # lib/libzlink-mt-s-1_2_0.lib.
              find "${root}/lib" -maxdepth 1 -name 'libzlink*.lib' | grep -q . || {
                echo "missing static archive: ${platform}/lib/libzlink*.lib" >&2
                exit 1
              }
            else
              test -f "${root}/lib/libzlink.a" || {
                echo "missing static archive: ${platform}/lib/libzlink.a" >&2
                exit 1
              }
            fi
          done

      # zlinkConfig.cmake calls find_dependency(OpenSSL) when the archive was
      # built WITH_TLS (the default); the runner needs the dev headers to
      # satisfy that, same as the build-linux job.
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      # The other three platforms only prove the files exist above; this
      # proves the linux-x64 archive is *usable* as a find_package(CONFIG)
      # prefix the way bindings/cpp/CMakeLists.txt and vcpkg's zlink port
      # consume it — configure, build and link a C program against both
      # the libzlink and libzlink-static imported targets.
      - name: Verify find_package(zlink CONFIG) against the packaged archive (linux-x64)
        env:
          LIBZLINK_VERSION: ${{ needs.read-versions.outputs.libzlink_version }}
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          cp -a artifacts/libzlink-linux-x64/. "$prefix/"

          project="$(mktemp -d)"
          cat > "$project/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.16)
          project(zlink_package_smoke C)
          # zlinkTargets-release.cmake already declares
          # IMPORTED_LINK_INTERFACE_LANGUAGES_RELEASE "CXX" on
          # libzlink-static (Core is implemented in C++), but CMake can only
          # act on that and route the final link through the C++ driver
          # once a CXX compiler is available to the project. A plain
          # project(... C) never enables one, so linking libzlink-static
          # fails with undefined libstdc++ references until this is added.
          # Every real consumer (bindings/cpp, vcpkg's zlink-cpp) is already
          # a C++ project and enables CXX itself, so it never hits this.
          enable_language(CXX)
          find_package(zlink ${LIBZLINK_VERSION} EXACT CONFIG REQUIRED)
          if(NOT TARGET libzlink)
            message(FATAL_ERROR "libzlink (shared) target is missing")
          endif()
          if(NOT TARGET libzlink-static)
            message(FATAL_ERROR "libzlink-static target is missing")
          endif()
          add_executable(consumer_shared main.c)
          target_link_libraries(consumer_shared PRIVATE libzlink)
          add_executable(consumer_static main.c)
          target_link_libraries(consumer_static PRIVATE libzlink-static)
          EOF
          cat > "$project/main.c" <<'EOF'
          #include <zlink.h>
          int main(void) {
            void *ctx = zlink_ctx_new();
            return ctx ? 0 : 1;
          }
          EOF

          cmake -S "$project" -B "$project/build" -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "$project/build" --target consumer_shared consumer_static
          LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$project/build/consumer_shared"
          "$project/build/consumer_static"
          echo "find_package(zlink CONFIG) smoke passed: shared + static both link and run"

      - name: Build summary
        run: |
          echo "## Build Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**libzlink Version:** ${{ needs.read-versions.outputs.libzlink_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Built Platforms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for platform in windows-x64 linux-x64 linux-arm64 macos-arm64; do
            if [ -d "artifacts/libzlink-${platform}" ]; then
              echo "- ✅ ${platform}" >> $GITHUB_STEP_SUMMARY
              file_count=$(find "artifacts/libzlink-${platform}" -type f | wc -l)
              echo "  - Files: ${file_count}" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ ${platform}" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat artifacts/checksums.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: checksums
          path: artifacts/checksums.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs:
      - read-versions
      - verify
    if: startsWith(github.ref, 'refs/tags/core/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          cd artifacts
          # Use recursive zip to handle subdirectories and avoid 'Nothing to do' error
          zip -r libzlink-windows-x64.zip libzlink-windows-x64/
          zip -r libzlink-linux-x64.zip libzlink-linux-x64/
          zip -r libzlink-linux-arm64.zip libzlink-linux-arm64/
          zip -r libzlink-macos-arm64.zip libzlink-macos-arm64/
          tar -czf libzlink-windows-x64.tar.gz libzlink-windows-x64/
          tar -czf libzlink-linux-x64.tar.gz libzlink-linux-x64/
          tar -czf libzlink-linux-arm64.tar.gz libzlink-linux-arm64/
          tar -czf libzlink-macos-arm64.tar.gz libzlink-macos-arm64/
          ls -lh *.zip

      - name: Create source tarball
        run: |
          VERSION="${{ needs.read-versions.outputs.libzlink_version }}"
          TAG_NAME="${GITHUB_REF_NAME}"
          TAR_NAME="zlink-${VERSION}-source.tar.gz"
          git archive --format=tar.gz --output "${TAR_NAME}" "${TAG_NAME}"
          ls -lh "${TAR_NAME}"

      - name: Create release provenance
        run: |
          VERSION="${{ needs.read-versions.outputs.libzlink_version }}"
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_ENCODED="${TAG_NAME//\//%2F}"
          SOURCE_ARCHIVE="zlink-${VERSION}-source.tar.gz"
          SOURCE_SHA="$(git rev-parse "${TAG_NAME}^{commit}")"
          CHECKSUMS_SHA="$(sha256sum artifacts/checksums/checksums.txt | awk '{print $1}')"
          SOURCE_ARCHIVE_SHA="$(sha256sum "${SOURCE_ARCHIVE}" | awk '{print $1}')"
          # Highest glibc symbol version the shipped Linux libraries require.
          # readelf parses any architecture, so one runner can read both.
          glibc_min() {
            local lib="$1"
            [ -f "$lib" ] || { echo "unknown"; return; }
            readelf --dyn-syms --wide "$lib" \
              | grep -o 'GLIBC_[0-9][0-9.]*' \
              | sort -t. -k2,2n -k3,3n -u \
              | tail -1 \
              | sed 's/^GLIBC_//'
          }
          LINUX_X64_GLIBC="$(glibc_min artifacts/libzlink-linux-x64/libzlink.so)"
          LINUX_ARM64_GLIBC="$(glibc_min artifacts/libzlink-linux-arm64/libzlink.so)"
          {
            echo "schema=1"
            echo "tag=${TAG_NAME}"
            echo "runtime_version=${VERSION}"
            echo "source_sha=${SOURCE_SHA}"
            echo "checksums_sha256=${CHECKSUMS_SHA}"
            echo "source_archive=${SOURCE_ARCHIVE}"
            echo "source_archive_sha256=${SOURCE_ARCHIVE_SHA}"
            echo "asset_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_ENCODED}/${SOURCE_ARCHIVE}"
            echo "linux_x64_glibc_min=${LINUX_X64_GLIBC}"
            echo "linux_arm64_glibc_min=${LINUX_ARM64_GLIBC}"
          } > release-provenance.txt
          cat release-provenance.txt

      - name: Detect release channel
        id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-rc."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose release notes from core/CHANGELOG.md
        env:
          LIBZLINK_VERSION: ${{ needs.read-versions.outputs.libzlink_version }}
        run: |
          set -euo pipefail
          {
            echo "## Changes in ${LIBZLINK_VERSION}"
            echo
            if [ -f core/CHANGELOG.md ]; then
              # Body of the "## [X.Y.Z]" section, up to the next "## " heading.
              awk -v ver="${LIBZLINK_VERSION}" '
                /^## / { in_section = (index($0, "## [" ver "]") == 1); next }
                in_section { print }
              ' core/CHANGELOG.md > changelog-section.txt
              if grep -q "[^[:space:]]" changelog-section.txt; then
                cat changelog-section.txt
              else
                echo "_No core/CHANGELOG.md section for ${LIBZLINK_VERSION}._"
              fi
              echo
              echo "Full history: [core/CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/core/CHANGELOG.md)"
              echo
            fi
            cat <<'STATIC'
          ## libzlink Native Libraries (zlink)

          **Version**: ${{ needs.read-versions.outputs.libzlink_version }}

          ### Features
          - **I/O Backend**: ASIO (Boost.Asio) for high-performance async I/O
          - **TLS Support**: Native TLS transport (`tls://`) and WebSocket TLS (`wss://`)
          - **WebSocket**: Full WebSocket support (`ws://`, `wss://`)
          - **Optimizations**: Link-Time Optimization (LTO) enabled for production builds
          - **Protocols**: tcp, ipc, inproc, ws, wss, tls
          - **Socket Types**: PAIR, PUB/SUB, XPUB/XSUB, DEALER/ROUTER

          ### Removed Features
          - CURVE encryption (use TLS instead)
          - REQ/REP, PUSH/PULL socket types
          - TIPC, VMCI, PGM, NORM, UDP protocols
          - Draft API socket types

          ### Downloads
          | Platform | File |
          |----------|------|
          | Windows x64 | `libzlink-windows-x64.zip` |
          | Linux x64 | `libzlink-linux-x64.zip` |
          | Linux ARM64 | `libzlink-linux-arm64.zip` |
          | macOS ARM64 (Apple Silicon) | `libzlink-macos-arm64.zip` |

          ### Package Contents
          Each archive contains:
          - Native library (`.dll`/`.so`/`.dylib`)
          - Public headers (`include/zlink.h`, `include/zlink_enum.h`, `include/zlink_errno.h`)
          - OpenSSL dependency required for TLS features

          ### Verification
          All builds have been tested with:
          - Core automated unit and integration test suite
          - Transport matrix tests (all socket patterns × all transports)
          - TLS/WebSocket functionality
          STATIC
          } > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.channel.outputs.prerelease }}
          name: libzlink ${{ needs.read-versions.outputs.libzlink_version }}
          body_path: release-notes.md
          files: |
            artifacts/libzlink-windows-x64.zip
            artifacts/libzlink-linux-x64.zip
            artifacts/libzlink-linux-arm64.zip
            artifacts/libzlink-macos-arm64.zip
            artifacts/libzlink-windows-x64.tar.gz
            artifacts/libzlink-linux-x64.tar.gz
            artifacts/libzlink-linux-arm64.tar.gz
            artifacts/libzlink-macos-arm64.tar.gz
            artifacts/checksums/checksums.txt
            zlink-${{ needs.read-versions.outputs.libzlink_version }}-source.tar.gz
            release-provenance.txt
          draft: false

  sync-recipes:
    name: Sync vcpkg/Conan recipes
    runs-on: ubuntu-24.04
    needs:
      - read-versions
      - release
    if: startsWith(github.ref, 'refs/tags/core/v')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # release-check.sh --write reuses validate_cpp()'s own target table
      # (scripts/dev/release-check.sh), so this can never drift from what
      # `release-check.sh core <version>` checks.
      - name: Write vcpkg port and Conan recipe metadata
        run: |
          bash scripts/dev/release-check.sh --write core "${{ needs.read-versions.outputs.libzlink_version }}"

      - name: Open a PR to main if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.read-versions.outputs.libzlink_version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- vcpkg/ports/zlink core/packaging/conan; then
            echo "No recipe changes for core ${VERSION}; nothing to open a PR for."
            exit 0
          fi
          branch="release-recipes/core-v${VERSION}"
          title="release: core ${VERSION} 레시피 갱신"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add vcpkg/ports/zlink core/packaging/conan
          git commit -m "${title}"
          git push --force origin "HEAD:${branch}"
          if gh pr view "${branch}" --json state -q .state >/dev/null 2>&1; then
            echo "A PR for ${branch} already exists; the branch was updated instead."
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${title}" \
              --body "core/v${VERSION} 릴리스 태그·자산에 맞춰 vcpkg port와 Conan recipe(버전·SHA512·sha256)를 scripts/dev/release-check.sh --write로 갱신했다."
          fi
