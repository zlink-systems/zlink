name: Bindings PR Check

on:
  # Every PR gets the named checks, so they can be required.
  # The changes job selects which checks run; the others succeed in one line.
  # No `labeled`: a queue label added later must not create a skipped run of
  # these required checks. For a trial run, add `ci-trial`, then push or reopen.
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - 'mergify/merge-queue/**'

permissions:
  contents: read

concurrency:
  group: bindings-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select binding checks
    # Mergify batch branches run on push even if Mergify also opens a draft PR.
    if: >-
      !startsWith(github.head_ref, 'mergify/merge-queue/') &&
      (vars.ZLINK_BINDINGS_PR_CHECK_ENABLED == 'true' ||
        (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-trial')))
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      go: ${{ steps.select.outputs.go }}
      python: ${{ steps.select.outputs.python }}
      dotnet: ${{ steps.select.outputs.dotnet }}
      cpp: ${{ steps.select.outputs.cpp }}
      c: ${{ steps.select.outputs.c }}
      java: ${{ steps.select.outputs.java }}
      node: ${{ steps.select.outputs.node }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks from changed paths
        id: select
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$GROUP_BASE..$GROUP_HEAD" ;;
            push) range="origin/main...$GITHUB_SHA" ;;
            *) exit 1 ;;
          esac

          changed="$RUNNER_TEMP/bindings-changed-files"
          git diff --no-renames --name-only -z "$range" -- > "$changed"

          rust=false go=false python=false dotnet=false cpp=false c=false java=false node=false docs=false
          while IFS= read -r -d '' path; do
            case "$path" in
              # Test binding compatibility with the released Core from fetch-release.sh.
              # Core CI tests changes to Core itself.
              core/include/*)
                rust=true go=true python=true dotnet=true cpp=true c=true java=true node=true
                ;;
              bindings/rust/*) rust=true ;;
              bindings/go/*) go=true ;;
              bindings/python/*) python=true ;;
              bindings/dotnet/*) dotnet=true ;;
              bindings/cpp/*) cpp=true ;;
              bindings/c/*) c=true ;;
              bindings/java/*) java=true ;;
              bindings/node/*) node=true ;;
              bindings/doc/*) docs=true ;;
              # A change to this workflow runs every check, enabled or in trial.
              .github/workflows/bindings-pr-check.yml)
                rust=true go=true python=true dotnet=true cpp=true c=true java=true node=true docs=true
                ;;
            esac
          done < "$changed"
          printf 'rust=%s\ngo=%s\npython=%s\ndotnet=%s\ncpp=%s\nc=%s\njava=%s\nnode=%s\ndocs=%s\n' \
            "$rust" "$go" "$python" "$dotnet" "$cpp" "$c" "$java" "$node" "$docs" >> "$GITHUB_OUTPUT"

  check:
    # A Mergify batch also gets a draft PR whose pull_request run skips these
    # jobs; the push run on the batch branch is the real check. A distinct name
    # keeps that skipped run from shadowing a required check on the same SHA.
    name: >-
      Bindings ${{ matrix.name }}${{ startsWith(github.head_ref, 'mergify/merge-queue/')
      && ' (queue draft PR)' || '' }}
    # If the changes job fails, these checks are skipped and Mergify's check-success keeps the queue blocked (fail-closed).
    needs: changes
    # Fork PRs run on GitHub-hosted runners.
    runs-on: >-
      ${{ matrix.cmake && needs.changes.outputs[matrix.scope] == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          vars.ZLINK_CPP_LINUX_RUNNER && fromJSON(vars.ZLINK_CPP_LINUX_RUNNER) || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: rust
            name: Rust
          - scope: go
            name: Go
          - scope: python
            name: Python
          - scope: dotnet
            name: .NET
          - scope: cpp
            name: C++
            cmake: true
          - scope: c
            name: C
            cmake: true
          - scope: java
            name: Java
          - scope: node
            name: Node
          - scope: docs
            name: document links
    env:
      ZLINK_CORE_SOURCE: release
    steps:
      # Keep each named queue check successful when its paths did not change.
      - name: No matching changes
        if: needs.changes.outputs[matrix.scope] == 'false'
        run: echo 'No matching binding changes.'

      - uses: actions/checkout@v5
        if: needs.changes.outputs[matrix.scope] == 'true'
        with:
          # The Java private-access check compares against origin/main.
          fetch-depth: ${{ matrix.scope == 'java' && 0 || 1 }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.scope == 'rust' && needs.changes.outputs.rust == 'true'

      - uses: actions/setup-go@v6
        if: matrix.scope == 'go' && needs.changes.outputs.go == 'true'
        with:
          go-version-file: bindings/go/go.mod
          cache: false

      - uses: actions/setup-python@v6
        if: >-
          (matrix.scope == 'python' || matrix.scope == 'java' || matrix.scope == 'docs') &&
          needs.changes.outputs[matrix.scope] == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        if: matrix.scope == 'java' && needs.changes.outputs.java == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v5
        if: matrix.scope == 'node' && needs.changes.outputs.node == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v5
        if: matrix.scope == 'dotnet' && needs.changes.outputs.dotnet == 'true'
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install C and C++ build dependencies on GitHub-hosted runners
        if: >-
          matrix.cmake && needs.changes.outputs[matrix.scope] == 'true' &&
          runner.environment == 'github-hosted'
        shell: bash
        env:
          BINDING_SCOPE: ${{ matrix.scope }}
        run: |
          packages=(build-essential cmake pkg-config libssl-dev)
          # C comparison benches use the repository's bundled Boost.
          if [[ "$BINDING_SCOPE" == cpp ]]; then
            packages+=(libboost-dev)
          fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"

      - name: Verify C and C++ build tools on self-hosted runners
        if: >-
          matrix.cmake && needs.changes.outputs[matrix.scope] == 'true' &&
          runner.environment == 'self-hosted'
        shell: bash
        run: |
          for tool in cmake ctest gcc g++ make pkg-config curl; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::Required tool '$tool' is missing from PATH on the self-hosted runner."
              exit 1
            fi
          done
          if ! pkg-config --exists openssl; then
            echo "::error::OpenSSL development files (openssl.pc) are missing on the self-hosted runner."
            exit 1
          fi

      - name: Prepare verified Linux x64 Core release
        if: matrix.scope != 'docs' && needs.changes.outputs[matrix.scope] == 'true'
        shell: bash
        run: |
          core_prefix="$(bash scripts/local-package/core/fetch-release.sh \
            --platform linux-x64 --cache-dir "$RUNNER_TEMP/zlink-core")"
          printf 'ZLINK_CORE_PACKAGE_PREFIX=%s\n' "$core_prefix" >> "$GITHUB_ENV"

      - name: Test Rust binding and build perf crates
        if: matrix.scope == 'rust' && needs.changes.outputs.rust == 'true'
        env:
          CARGO_BUILD_JOBS: '8'
        run: nice -n 10 bash bindings/rust/tests/run_tests.sh

      - name: Test Go binding and perf module
        if: matrix.scope == 'go' && needs.changes.outputs.go == 'true'
        env:
          GOFLAGS: '-p=8'
        run: |
          export CGO_CFLAGS="-I$ZLINK_CORE_PACKAGE_PREFIX/include"
          export CGO_LDFLAGS="-L$ZLINK_CORE_PACKAGE_PREFIX/lib -Wl,-rpath,$ZLINK_CORE_PACKAGE_PREFIX/lib"
          nice -n 10 bash bindings/go/tests/run_tests.sh

      - name: Build Python native extension and test binding
        if: matrix.scope == 'python' && needs.changes.outputs.python == 'true'
        run: |
          bash scripts/local-package/native/sync-local-core-libs.sh python
          python -m pip install pytest
          nice -n 10 python -m pip install -e ./bindings/python
          python -c 'from zlink._native import _zlink_native'
          nice -n 10 bash bindings/python/tests/run_tests.sh

      - name: Test .NET binding and perf projects
        if: matrix.scope == 'dotnet' && needs.changes.outputs.dotnet == 'true'
        run: nice -n 10 bash bindings/dotnet/tests/run_tests.sh

      - name: Test C++ binding, perf regressions, and samples
        if: matrix.scope == 'cpp' && needs.changes.outputs.cpp == 'true'
        env:
          ZLINK_BUILD_JOBS: '4'
        run: nice -n 10 bash bindings/cpp/tests/run_tests.sh

      - name: Test C binding and build native comparison benches
        if: matrix.scope == 'c' && needs.changes.outputs.c == 'true'
        env:
          ZLINK_BUILD_JOBS: '4'
        run: nice -n 10 bash bindings/c/tests/run_tests.sh

      - name: Check Java test private access
        if: matrix.scope == 'java' && needs.changes.outputs.java == 'true'
        run: python scripts/ci/check-java-test-private-access.py --base-ref origin/main

      - name: Test Java binding, perf runner options, and samples
        if: matrix.scope == 'java' && needs.changes.outputs.java == 'true'
        run: nice -n 10 bash bindings/java/tests/run_tests.sh

      - name: Build and test Node binding, perf runner options, and samples
        if: matrix.scope == 'node' && needs.changes.outputs.node == 'true'
        working-directory: bindings/node
        run: |
          npm ci
          nice -n 10 npm test

      - name: Check document links and anchors
        if: matrix.scope == 'docs' && needs.changes.outputs.docs == 'true'
        run: |
          python -m pip install 'pymdown-extensions>=10.0'
          python3 doc/site/scripts/check_doc_links.py
