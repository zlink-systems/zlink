name: Framework Node

on:
  push:
    branches:
      - main
    # Production code only: workspace packages, runtime tests and the cross-language hosts.
    # Docs, plans, bench, samples and scenario e2e never start this workflow (user decision 2026-09-09).
    paths:
      - ".github/workflows/framework-node.yml"
      - ".github/actions/msvc-env/**"
      - "scripts/local-package/core/fetch-release.sh"
      - "scripts/local-package/http-client/**"
      - "framework/languages/node/VERSION"
      - "bindings/node/VERSION"
      - "framework/runtime/**"
      - "framework/languages/node/package.json"
      - "framework/languages/node/package-lock.json"
      - "framework/languages/node/tsconfig*.json"
      - "framework/languages/node/packages/**"
      - "framework/languages/node/scripts/**"
      - "framework/languages/node/test/**"
      - "framework/languages/node/cross-language/**"
      - "framework/languages/dotnet/cross-language/**"
  pull_request:
    branches:
      - main
    # Production code only: workspace packages, runtime tests and the cross-language hosts.
    # Docs, plans, bench, samples and scenario e2e never start this workflow (user decision 2026-09-09).
    paths:
      - ".github/workflows/framework-node.yml"
      - ".github/actions/msvc-env/**"
      - "scripts/local-package/core/fetch-release.sh"
      - "scripts/local-package/http-client/**"
      - "framework/languages/node/VERSION"
      - "bindings/node/VERSION"
      - "framework/runtime/**"
      - "framework/languages/node/package.json"
      - "framework/languages/node/package-lock.json"
      - "framework/languages/node/tsconfig*.json"
      - "framework/languages/node/packages/**"
      - "framework/languages/node/scripts/**"
      - "framework/languages/node/test/**"
      - "framework/languages/node/cross-language/**"
      - "framework/languages/dotnet/cross-language/**"
  workflow_dispatch:

# The framework consumes the released @zlink-systems/zlink package. Platforms
# without a prebuilt addon in that package build it from source against the
# verified Core release archive (scripts/local-package/core/fetch-release.sh),
# which is also the runtime the tests load.

# One run per ref: a newer push to the same branch/PR cancels the run still in
# progress, so consecutive pushes do not pile up matrix jobs and starve the
# release workflows of runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-node:
    name: ${{ matrix.target.name }} / node${{ matrix.node-version }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
        target:
          - name: win-x64
            runner: windows-latest
            msvc_arch: x64
            core_platform: windows-x64
          - name: win-arm64
            runner: windows-11-arm
            msvc_arch: arm64
            core_platform: windows-arm64
          - name: linux-x64
            runner: ubuntu-24.04
            core_platform: linux-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            core_platform: linux-arm64
          - name: darwin-arm64
            runner: macos-15
            core_platform: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup MSVC environment
        if: startsWith(matrix.target.name, 'win-')
        uses: ./.github/actions/msvc-env
        with:
          arch: ${{ matrix.target.msvc_arch }}

      - name: Normalize Visual Studio version for node-gyp
        if: startsWith(matrix.target.name, 'win-')
        shell: pwsh
        run: |
          # GitHub Windows runners expose the VS 2026 toolchain through a VS 18
          # developer prompt. node-gyp maps MSVC toolsets by the Visual Studio
          # major version and only accepts VS 2022 for v143, so keep the actual
          # toolchain paths but present the prompt version as VS 2022.
          echo "VSCMD_VER=17.0" >> $env:GITHUB_ENV
          echo "VisualStudioVersion=17.0" >> $env:GITHUB_ENV

      - name: Use a node-gyp that recognizes the runner's Visual Studio
        if: startsWith(matrix.target.name, 'win-')
        shell: bash
        run: |
          # Node 20 bundles node-gyp 10, which cannot find the Visual Studio
          # installed on current Windows runners ("Could not find any Visual
          # Studio installation to use"); Node 22's node-gyp 11 can. Point npm
          # at a current node-gyp for every Node version.
          # node-gyp 11 supports Node 20 and 22 (13 requires Node 22+). npm needs a
          # Windows-style path here: `npm root -g` prints a POSIX path in Git Bash.
          # The npm bundled with Node 20 ignores the node-gyp setting and forces its
          # own node-gyp 10, so use npm 11 first (npm 12 requires Node 22+).
          npm install -g npm@11
          npm install -g node-gyp@11
          echo "npm_config_node_gyp=$(cygpath -w "$(npm root -g)/node-gyp/bin/node-gyp.js")" >> "${GITHUB_ENV}"

      - name: Install Linux build dependencies
        if: startsWith(matrix.target.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Prepare the Core release runtime for this platform
        id: core
        shell: bash
        run: |
          binding_version=$(node -p "require('./framework/languages/node/packages/framework/package.json').dependencies['@zlink-systems/zlink']")
          # The binding package version and the Core release it embeds differ
          # (binding 0.17.6 ships Core 0.17.5); the Core version is owned by VERSION.
          core_version=$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)
          core_prefix=$(bash scripts/local-package/core/fetch-release.sh \
            --version "${core_version}" \
            --platform "${{ matrix.target.core_platform }}" \
            --cache-dir .artifacts/core-release)
          if [ "${RUNNER_OS}" = "Windows" ]; then
            core_prefix=$(cygpath -w "${core_prefix}")
            # The binding's Windows loader searches ZLINK_CORE_PREFIX\bin.
            echo "ZLINK_CORE_PREFIX=${core_prefix}" >> "${GITHUB_ENV}"
            echo "${core_prefix}\\bin" >> "${GITHUB_PATH}"
          fi
          echo "ZLINK_CORE_SOURCE=release" >> "${GITHUB_ENV}"
          echo "ZLINK_CORE_PACKAGE_PREFIX=${core_prefix}" >> "${GITHUB_ENV}"
          echo "prefix=${core_prefix}" >> "${GITHUB_OUTPUT}"
          echo "binding_version=${binding_version}" >> "${GITHUB_OUTPUT}"

      - name: Build the checkout Node binding package
        shell: bash
        run: |
          version="${{ steps.core.outputs.binding_version }}"
          mkdir -p .artifacts/wsl/npm
          (cd bindings/node && npm ci --ignore-scripts && npm run build)
          npm pack --silent ./bindings/node --pack-destination .artifacts/wsl/npm
          test -f ".artifacts/wsl/npm/zlink-systems-zlink-${version}.tgz"

      - name: Build the local-package pin of @zlink-systems/http-client used by the workspace manifest
        shell: bash
        env:
          # Git Bash: make ln -s create a real symlink for the compiler bootstrap.
          MSYS: winsymlinks:nativestrict
        run: |
          # The workspace manifest pins http-client to a local tarball; build its
          # dist with the same bootstrap the local-package flow uses, fed by the
          # checkout-built local binding tarball.
          version="${{ steps.core.outputs.binding_version }}"
          mkdir -p .artifacts/wsl/npm
          bash scripts/local-package/http-client/build-wsl.sh node
          tar tzf .artifacts/wsl/npm/zlink-systems-http-client-*.tgz > "${RUNNER_TEMP}/http-client-files.txt"
          grep -q 'package/dist/index.js' "${RUNNER_TEMP}/http-client-files.txt"

      - name: Pin framework install to the checkout Node binding package
        working-directory: framework/languages/node
        shell: bash
        run: |
          version="${{ steps.core.outputs.binding_version }}"
          export BINDING_VERSION="${version}"
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
          packageJson.dependencies['@zlink-systems/zlink'] = `file:../../../.artifacts/wsl/npm/zlink-systems-zlink-${process.env.BINDING_VERSION}.tgz`;
          fs.writeFileSync(file, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          BINDING_VERSION="${version}" npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install framework dependencies
        working-directory: framework/languages/node
        run: npm ci

      - name: Place the Core runtime beside a source-built addon
        shell: bash
        run: |
          # Platforms without a prebuilt addon in the published package build
          # it from source; the addon links libzlink through @loader_path /
          # the addon directory, so copy the runtime next to it.
          addon_dir=framework/languages/node/node_modules/@zlink-systems/zlink/build/Release
          if [ ! -f "${addon_dir}/zlink.node" ]; then
            echo "prebuilt addon in use; nothing to place"
            exit 0
          fi
          prefix="${{ steps.core.outputs.prefix }}"
          case "${{ matrix.target.core_platform }}" in
            windows-*) cp "$(cygpath -u "${prefix}")"/bin/*.dll "${addon_dir}/" ;;
            macos-*) cp "${prefix}"/lib/libzlink*.dylib "${addon_dir}/" ;;
            *) cp -P "${prefix}"/lib/libzlink.so* "${addon_dir}/" ;;
          esac
          ls -la "${addon_dir}"

      - name: Cache Chromium for browser connector E2E
        if: matrix.node-version == 22 && (matrix.target.name == 'linux-x64' || matrix.target.name == 'win-x64')
        uses: actions/cache@v5
        with:
          path: framework/languages/node/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('framework/languages/node/package-lock.json') }}

      - name: Install Chromium and Linux dependencies
        if: matrix.node-version == 22 && matrix.target.name == 'linux-x64'
        working-directory: framework/languages/node
        run: npm run browser:install:ci

      - name: Install Chromium on Windows
        if: matrix.node-version == 22 && matrix.target.name == 'win-x64'
        working-directory: framework/languages/node
        run: npm run browser:install

      - name: Run Node framework release gate
        working-directory: framework/languages/node
        run: npm run verify:ci

      - name: Run actual Chromium Stream Connector E2E
        if: matrix.node-version == 22 && (matrix.target.name == 'linux-x64' || matrix.target.name == 'win-x64')
        working-directory: framework/languages/node
        run: npm run test:browser

  framework-node-cross-language:
    name: cross-language smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - framework-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Prepare the Core release runtime
        id: core
        shell: bash
        run: |
          binding_version=$(node -p "require('./framework/languages/node/packages/framework/package.json').dependencies['@zlink-systems/zlink']")
          core_version=$(sed -n 's/^LIBZLINK_VERSION=//p' VERSION)
          core_prefix=$(bash scripts/local-package/core/fetch-release.sh \
            --version "${core_version}" \
            --platform linux-x64 \
            --cache-dir .artifacts/core-release)
          echo "ZLINK_CORE_SOURCE=release" >> "${GITHUB_ENV}"
          echo "ZLINK_CORE_PACKAGE_PREFIX=${core_prefix}" >> "${GITHUB_ENV}"
          echo "ZLINK_LIBRARY_PATH=${core_prefix}/lib/libzlink.so.${core_version}" >> "${GITHUB_ENV}"
          echo "binding_version=${binding_version}" >> "${GITHUB_OUTPUT}"
          echo "prefix=${core_prefix}" >> "${GITHUB_OUTPUT}"
          echo "core_version=${core_version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare the .NET local packages for the cross-language test host
        shell: bash
        run: |
          package_root="${GITHUB_WORKSPACE}/.artifacts/wsl"
          nuget_source="${package_root}/nuget"
          mkdir -p "${nuget_source}"
          binding_version=$(sed -n 's/^ZLINK_BINDING_VERSION=//p' bindings/dotnet/VERSION)
          core_version="${{ steps.core.outputs.core_version }}"
          core_prefix="${{ steps.core.outputs.prefix }}"
          dotnet pack bindings/dotnet/src/Zlink/Zlink.csproj \
            -c Release \
            -o "${nuget_source}" \
            "-p:ZLinkCoreVersion=${core_version}" \
            "-p:ZLinkCoreSource=local" \
            "-p:ZLinkLinuxX64NativeRoot=${core_prefix}/lib" \
            "-p:ZLinkCoreProvenancePath=${core_prefix}/share/zlink/core-package-provenance.json"
          test -s "${nuget_source}/Zlink.${binding_version}.nupkg" \
            || { echo "::error::Local Zlink ${binding_version} package was not created" >&2; exit 1; }
          dotnet pack framework/languages/dotnet/src/Zlink.HttpClient/Zlink.HttpClient.csproj -c Release -o "${nuget_source}"
          echo "ZLINK_LOCAL_PACKAGE_ROOT=${package_root}" >> "${GITHUB_ENV}"
          echo "ZLinkLocalPackageRoot=${package_root}" >> "${GITHUB_ENV}"

      - name: Build the checkout Node binding package
        shell: bash
        run: |
          version="${{ steps.core.outputs.binding_version }}"
          mkdir -p .artifacts/wsl/npm
          (cd bindings/node && npm ci --ignore-scripts && npm run build)
          npm pack --silent ./bindings/node --pack-destination .artifacts/wsl/npm
          test -f ".artifacts/wsl/npm/zlink-systems-zlink-${version}.tgz"

      - name: Build the local-package pin of @zlink-systems/http-client used by the workspace manifest
        shell: bash
        env:
          # Git Bash: make ln -s create a real symlink for the compiler bootstrap.
          MSYS: winsymlinks:nativestrict
        run: |
          # The workspace manifest pins http-client to a local tarball; build its
          # dist with the same bootstrap the local-package flow uses, fed by the
          # checkout-built local binding tarball.
          version="${{ steps.core.outputs.binding_version }}"
          package_root="${ZLINK_LOCAL_PACKAGE_ROOT}"
          npm_root="${package_root}/npm"
          mkdir -p "${npm_root}"
          ZLINK_LOCAL_PACKAGE_ROOT="${package_root}" bash scripts/local-package/http-client/build-wsl.sh node
          tar tzf "${npm_root}"/zlink-systems-http-client-*.tgz > "${RUNNER_TEMP}/http-client-files.txt"
          grep -q 'package/dist/index.js' "${RUNNER_TEMP}/http-client-files.txt"

      - name: Install and build the Node framework workspace
        working-directory: framework/languages/node
        run: |
          version="${{ steps.core.outputs.binding_version }}"
          export BINDING_VERSION="${version}"
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
          packageJson.dependencies['@zlink-systems/zlink'] = `file:../../../.artifacts/wsl/npm/zlink-systems-zlink-${process.env.BINDING_VERSION}.tgz`;
          fs.writeFileSync(file, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          BINDING_VERSION="${version}" npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run build

      - name: Cache Chromium for browser connector E2E
        uses: actions/cache@v5
        with:
          path: framework/languages/node/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('framework/languages/node/package-lock.json') }}

      - name: Install Chromium and Linux dependencies
        working-directory: framework/languages/node
        run: npm run browser:install:ci

      - name: Run Node framework cross-language smoke
        working-directory: framework/languages/node
        run: npm run verify:cross-language

  framework-node-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    needs:
      - framework-node
      - framework-node-cross-language
    steps:
      - name: Confirm matrix completed
        run: |
          echo "Framework Node release gate passed."
          echo "ABI matrix: win-x64, win-arm64, linux-x64, linux-arm64, darwin-arm64 (Core ships no macOS Intel release)"
          echo "Node runtime matrix: node20, node22"
          echo "Cross-language smoke: Node <-> dotnet channel and stream paths"
