name: Attach tutorial/samples zip assets

# Owns one rule (#639): every GitHub Release this repository creates — Core,
# any binding, any framework language — carries the same eight tutorial and
# samples zips, packed at that release's own tag tree
# (scripts/tutorial/pack_tutorials.py). `releases/latest/download/...` is
# repo-wide across every tag, so whichever release happens to be newest must
# already have them; attaching only from the framework workflow left a gap
# from the moment a Core or binding release went out until the next framework
# release did (#639, reopened). Callers pass the tag of a release that
# already exists; this workflow only attaches to it, it never creates one.
#
# `workflow_call` lets framework-release.yml, build.yml, and
# bindings-release.yml invoke this right after their own release step.
# `workflow_dispatch` keeps a standalone back-fill path for any tag
# (`gh workflow run release-assets.yml -f tag=core/v1.2.0`), independent of
# re-running the publish workflow that made that release.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing GitHub Release tag to attach the 8 zips to'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub Release tag to attach the 8 zips to'
        required: true
        type: string

jobs:
  attach:
    name: Attach tutorial/samples zip assets (${{ inputs.tag }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # This job only attaches assets to a release that already exists. If the
      # tag has no release yet, softprops/action-gh-release would create one —
      # and a newly created release becomes GitHub's "latest" by default even
      # if it is older than another release, which would point
      # releases/latest/download at the wrong tree. Fail instead.
      - name: Verify the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # HEAD here is the checked-out tag (not the ref that triggered this
      # run), so the zips carry that release's own pins. Framework VERSION
      # files only move in a framework release PR, so packing at a Core or
      # binding tag's tree still yields whatever framework pins main carried
      # last — exactly the state a reader downloading "latest" should get.
      - name: Pack tutorial and samples zips at the release tag
        run: python3 scripts/tutorial/pack_tutorials.py dist/tutorials HEAD

      - name: Verify all eight zips, and that Linux scripts are 755/LF
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import zipfile

          sys.path.insert(0, "scripts/tutorial")
          from pack_tutorials import executable  # same table pack() itself uses

          zips = sorted(pathlib.Path("dist/tutorials").glob("*.zip"))
          if len(zips) != 8:
              print(f"::error::expected 8 zips, found {len(zips)}: {[z.name for z in zips]}")
              sys.exit(1)

          bad = []
          for zpath in zips:
              with zipfile.ZipFile(zpath) as zf:
                  for info in zf.infolist():
                      if not executable(info.filename):
                          continue
                      mode = (info.external_attr >> 16) & 0o777
                      if mode != 0o755:
                          bad.append(f"{zpath.name}:{info.filename} mode={oct(mode)}")
                      # `unzip` only honors `external_attr` as a POSIX mode when
                      # the zip's "made by" host is Unix (create_system == 3);
                      # this is the bit that stayed DOS when this ran on
                      # Windows and made every gradlew/*.sh extract as 644.
                      if info.create_system != 3:
                          bad.append(f"{zpath.name}:{info.filename} create_system={info.create_system} (not Unix)")
                      if b"\r\n" in zf.read(info):
                          bad.append(f"{zpath.name}:{info.filename} has CRLF")

          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          print(f"verified {len(zips)} zips: 755/LF/create_system=Unix on every executable entry")
          PY

      - name: Verify the executable bit survives an actual unzip
        run: |
          set -euo pipefail
          extract="${RUNNER_TEMP}/tutorial-java"
          mkdir -p "${extract}"
          unzip -q dist/tutorials/zlink-tutorial-java.zip -d "${extract}"
          gradlew="${extract}/zlink-tutorial-java/gradlew"
          test -x "${gradlew}"
          ! grep -q $'\r' "${gradlew}"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/tutorials/*.zip
          fail_on_unmatched_files: true

  verify:
    name: Verify the attached zips build and run standalone (#655)
    needs: attach
    # This job runs even though `attach` publishes with `GITHUB_TOKEN`, which
    # means the `release: published` event this repository's own releases
    # produce never fires (GitHub does not trigger workflows from
    # GITHUB_TOKEN-authored events). Calling standalone-zips.yml here, right
    # after the zips land on the release, is the trigger that actually runs
    # for every release this workflow attaches to.
    uses: ./.github/workflows/standalone-zips.yml
    with:
      tag: ${{ inputs.tag }}
