name: Ready for queue

on:
  pull_request:
    types:
      - labeled
      - synchronize

permissions:
  contents: read

# Only a ready-for-queue label or a push to a labelled PR starts the gate. Any other
# label event (for example merge-queue added together with ready-for-queue) gets its
# own group, so its skipped run cannot cancel the gate run in progress.
concurrency:
  group: ready-for-queue-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ready-for-queue') && github.run_id || 'gate' }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'ready-for-queue') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ready-for-queue'))
      )
    outputs:
      cpp: ${{ steps.paths.outputs.cpp }}
      dotnet: ${{ steps.paths.outputs.dotnet }}
      java: ${{ steps.paths.outputs.java }}
      node: ${{ steps.paths.outputs.node }}
      core_version_changed: ${{ steps.paths.outputs.core_version_changed }}
    runs-on: ${{ vars.ZLINK_LINUX_RUNNER && fromJSON(vars.ZLINK_LINUX_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select changed framework languages
        id: paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cpp=false
          dotnet=false
          java=false
          node=false
          core_version_changed=false
          paths_file="${RUNNER_TEMP}/ready-for-queue-paths"
          git diff --name-only --no-renames -z "${PR_BASE_SHA}...${PR_HEAD_SHA}" > "$paths_file"
          while IFS= read -r -d '' path; do
            case "$path" in
              VERSION)
                core_version_changed=true
                cpp=true
                dotnet=true
                java=true
                node=true
                ;;
              framework/runtime/*|framework/doc/framework/common/spec/*|framework/doc/framework/common/e2e/*|bindings/*|core/*|scripts/ci/*|.github/workflows/*)
                cpp=true
                dotnet=true
                java=true
                node=true
                ;;
              framework/languages/cpp/*) cpp=true ;;
              framework/languages/dotnet/*) dotnet=true ;;
              framework/languages/java/*) java=true ;;
              framework/languages/node/*) node=true ;;
            esac
          done < "$paths_file"
          {
            echo "cpp=$cpp"
            echo "dotnet=$dotnet"
            echo "java=$java"
            echo "node=$node"
            echo "core_version_changed=$core_version_changed"
          } >> "$GITHUB_OUTPUT"
          echo "Selected languages: cpp=$cpp dotnet=$dotnet java=$java node=$node core_version_changed=$core_version_changed"

  core-release-exists:
    name: core-release
    needs: gate
    if: needs.gate.result == 'success'
    uses: ./.github/workflows/core-release-check.yml
    with:
      core_version_changed: ${{ needs.gate.outputs.core_version_changed }}

  framework-cpp:
    name: framework-cpp
    needs: gate
    uses: ./.github/workflows/framework-cpp.yml
    with:
      skip_tests: ${{ needs.gate.outputs.cpp != 'true' }}
      queue_checks_only: true
      concurrency_key: framework-cpp

  framework-dotnet:
    name: framework-dotnet
    needs: gate
    uses: ./.github/workflows/framework-dotnet.yml
    with:
      skip_tests: ${{ needs.gate.outputs.dotnet != 'true' }}
      queue_checks_only: true
      concurrency_key: framework-dotnet

  framework-java:
    name: framework-java
    needs: gate
    uses: ./.github/workflows/framework-java.yml
    with:
      skip_tests: ${{ needs.gate.outputs.java != 'true' }}
      queue_checks_only: true
      concurrency_key: framework-java

  framework-node:
    name: framework-node
    needs: gate
    uses: ./.github/workflows/framework-node.yml
    with:
      skip_tests: ${{ needs.gate.outputs.node != 'true' }}
      queue_checks_only: true
      concurrency_key: framework-node

  framework-format:
    name: framework-format
    needs: gate
    uses: ./.github/workflows/framework-format.yml
    with:
      concurrency_key: framework-format
