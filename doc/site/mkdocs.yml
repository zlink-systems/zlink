markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      # 줄마다 span을 두면 CSS가 줄 단위로 스타일을 줄 수 있다. 긴 줄을 접을 때
      # 이어지는 줄을 안쪽으로 들여 원래 한 줄이었음을 보이게 하는 데 쓴다.
      line_spans: __span
      # `<div class="highlight language-cpp">`. 접기는 코드에만 걸고 ASCII
      # 다이어그램(```text)은 가로 스크롤로 남기려면 언어를 구분해야 한다.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      dedent_subsections: true
      # base_path는 mkdocs 실행 cwd(framework/doc/site) 기준.
      # repo 루트를 포함시켜 가이드가 framework/languages/<lang>/samples/의
      # 실제 샘플 파일을 그대로 임베드한다.
      base_path:
        - .
        - ../..
  - tables
  - toc:
      permalink: true
      # 왼쪽 목차에는 `##`까지만 싣는다. 장이 길어 `###`까지 펼치면 목차가
      # 본문만큼 길어진다. anchor와 permalink는 모든 제목에 그대로 붙으므로
      # 문서끼리의 `#소제목` 링크는 영향받지 않는다.
      toc_depth: 2
      # 한글 제목이 anchor로 살아남으려면 unicode slug가 필요하다.
      # 기본 slugify는 non-ASCII를 버려서 문서 안의 anchor 링크가 전부 깨진다.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          unicode: true
