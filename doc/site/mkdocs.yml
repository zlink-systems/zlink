site_name: ZLink
site_url: https://zlink.systems/
# 기본 로케일(en)과 같은 값을 적는다. 로케일별 값은 아래 i18n languages의
# site_description으로 덮어쓴다 — theme.language와 같은 규칙이다.
site_description: ZLink Framework — a real-time TCP messaging layer for ASP.NET Core, Spring Boot, NestJS, and C++

repo_url: https://github.com/zlink-systems/zlink
repo_name: zlink-systems/zlink

# docs/는 정본 트리를 심링크로 모은 자리다(복사본이 아니다).
# framework · core · bindings 문서가 한 사이트에 함께 실린다.
docs_dir: docs

theme:
  name: material
  # i18n 플러그인이 로케일마다 이 값을 덮어쓴다. 여기 적은 값은 기본 로케일과
  # 같아야 한다.
  language: en
  # header/nav.html 두 partial만 포크한다 — 사이트 이름 텍스트("ZLink")도 로고
  # 아이콘처럼 홈으로 링크되게 하려고. 그 외 나머지는 Material 원본 그대로다.
  custom_dir: overrides
  # Material 기본 Roboto에는 한글 글리프가 없다. 한글이 글자마다 OS 대체 폰트로
  # 떨어지면서 자간과 굵기가 흔들리므로 시스템 한글 폰트를 쓴다.
  font: false
  # 첫 항목이 기본값이다. `media`를 걸면 OS 설정을 따라가므로, 다크로 시작하게
  # 하려면 빼야 한다. 토글은 그대로 남고 고른 값은 브라우저에 저장된다.
  # primary는 헤더 바 색, accent는 호버·포커스 색이다. slate에서 teal은 링크가
  # 청록(#00ccb8)으로 잡히므로 어두운 바탕에서 대비가 넉넉하다.
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.tabs.link
    # navigation.tabs는 켜지 않는다. 최상위 nav를 헤더 탭으로 빼면 Spec·Bindings·Core가
    # 사이드바에서 사라진다. 대신 최상위를 사이드바 1차 메뉴로 두고, 언어는 헤더의
    # 드롭다운으로 고른다(overrides/partials/zlink-lang.html).
    #
    # instant가 없으면 사이드바를 누를 때마다 페이지 전체를 다시 받는다. 목록이 깜박이고
    # 스크롤이 맨 위로 돌아간다. 켜면 본문만 바뀌고 사이드바는 그대로 남는다.
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    # 본문 맨 아래에 앞·뒤 장 링크. 순서는 이 파일의 nav가 정한다.
    - navigation.footer
    - search.highlight

extra_css:
  - assets/korean.css
  - assets/stylesheets/extra.css

extra_javascript:
  #  사이드바에서 지금 고른 언어의 묶음만 1차 메뉴로 편다. 헤더 드롭다운과 짝이다.
  - assets/javascripts/zlink-lang.js
  - assets/javascripts/zlink-diagram.js

# 다이어그램 안 글씨를 키운다. 폰트만 올리면 자연폭이 함께 늘어 축소율이 나빠지므로
# 폰트와 간격 상수를 같이 조정한다. 자세한 이유는 hook 파일 머리말에.
hooks:
  #  파일 심링크를 만들 수 없는 환경에서 정본을 docs/로 복사한다. 반드시 먼저 돈다.
  - hooks/mirror_files.py
  #  로케일 전환기를 JS가 고쳐 주므로, 그 한 건의 경고만 내린다.
  - hooks/quiet_i18n_instant.py
  - hooks/mermaid_size.py
  - hooks/repo_links.py

# `mkdocs serve`는 docs_dir 안만 감시한다. 페이지가 `--8<--`로 끌어다 쓰는 파일은
# docs_dir 밖의 실제 프로젝트이므로, 여기 적지 않으면 그 파일을 고쳐도 미리보기가
# 옛 내용을 계속 낸다. 정식 build는 매번 새로 읽으므로 배포본에는 영향이 없다.
#
# 소스 디렉터리만 적는다. quickstart 최상위를 통째로 적으면 `build/`·`obj/`·
# `node_modules/`까지 감시 대상이 되어, 그 프로젝트를 빌드하는 동안 재빌드가 끝없이 걸린다.
watch:
  - ../../framework/languages/dotnet/tutorial/Shared
  - ../../framework/languages/dotnet/tutorial/Server
  - ../../framework/languages/dotnet/tutorial/Client
  - ../../framework/languages/dotnet/tutorial/StreamClient
  - ../../framework/languages/dotnet/quickstart/Shared
  - ../../framework/languages/dotnet/quickstart/Server
  - ../../framework/languages/dotnet/quickstart/Client
  - ../../framework/languages/node/quickstart/Shared
  - ../../framework/languages/node/quickstart/Server
  - ../../framework/languages/node/quickstart/Client
  - ../../framework/languages/java/quickstart/gradle
  - ../../framework/languages/cpp/quickstart/Shared
  - ../../framework/languages/cpp/quickstart/Server
  - ../../framework/languages/cpp/quickstart/Client

plugins:
  - search
  # 영어가 기본이고 한국어는 고르는 쪽이다. 영어는 `/`, 한국어는 `/ko/`에 실린다.
  #
  # 모든 장이 `.ko.md`/`.en.md` 쌍으로 있고 접미사 없는 자리는 비어 있다. nav
  # 경로도 접미사 없이 적어야 한다 — 그래야 로케일마다 제 짝을 찾는다. `.ko.md`로
  # 못박으면 영어 빌드가 자기 파일 집합에 없는 파일을 찾아 경고를 쏟고, 기본
  # 로케일을 바꾸는 것 자체가 막힌다.
  #
  # nav 라벨은 영어로 적고 번역표가 한국어를 준다. 반대로 적으면 영어 화면에
  # 한국어가 남는다.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ko
          name: 한국어
          build: true
          # 영어 홈의 <meta name="description">에 한국어가 나가지 않도록 로케일별로
          # 덮어쓴다. site_description을 따로 적지 않으면 위 최상위 값(en 기준)을
          # 그대로 물려받는다.
          site_description: ZLink Framework — 실시간 메시징 서버 프레임워크
          # 번역표는 nav 라벨 문자열 전체를 키로 잡는 평면 map이다. 키는 nav에
          # 적힌 영어 그대로여야 하고, 여기 없는 라벨은 한국어 화면에서도 영어로
          # 남는다. 반대로 nav를 한국어로 적으면 영어 화면에서 한국어가 남는다 —
          # 실제로 그렇게 갈라져서 영어 전환이 반쪽만 되고 있었다.
          nav_translations:
            # **1차 메뉴만 한글로 낸다.** 하위 항목까지 번역하면 한글과 영어가
            # 섞여 어느 쪽이 원래 이름인지 알기 어렵다. 문서 제목은 영어 그대로
            # 두는 편이 찾기 쉽다.
            #
            # **영문 발음을 한글로 옮긴 것은 영문을 쓴다.** `레퍼런스`·`스펙`·
            # `테스트`·`샘플`은 한국어 낱말이 아니라 영어를 소리대로 적은 것이다.
            #
            # 여기 없는 라벨은 한국어 화면에서도 영어로 남는다.

            # 최상위
            Install: 설치

            # 언어 안 구획
            Getting started: 시작
            Feature guide: 기능별 가이드
            How it works: 동작 원리
            Operations: 운영

            # 공통 스펙
            Common spec: 공통 스펙
            Sample scenario contract: 샘플 시나리오 계약

# 문서 트리는 정본을 심링크로 직접 건다(`docs/guide` → `core/doc/guide` 등).
# 복사본을 두면 양쪽이 갈라진다 — 실제로 갈라져서 사이트가 byte HWM 이전의 낡은
# 내용을 내고 있었고, v11이 지운 서비스 계층 장까지 남아 있었다.
#
# 사이트에 올리지 않을 자리. mkdocs는 nav에 없어도 docs_dir 아래를 전부 빌드한다.
exclude_docs: |
  perf/
  */internals/
  # 언어별 bindings/framework internals는 공개용이 아니므로 제외한다.
  # Framework 공통 내부 설계는 common/spec의 40~52 문서로 nav에 올린다.
  common/e2e/
  # 공통 가이드는 언어 탭을 담은 소스다. 읽는 자리는 언어별 생성판이다.
  common/guide/
  # 문서 작성 규약이다. 독자용이 아니다.
  guide/EXAMPLES.ko.md
  guide/EXAMPLES.en.md
  guide/STYLE.ko.md
  guide/STYLE.en.md
  # 측정이 끝나지 않은 messaging bench다. 결과는 별도 보고서로 낸다.
  common/bench/
  # 독자용 시나리오가 아니라 언어별 문서를 새로 쓸지 판단하는 작성 규약이다.
  common/sample/languages/

