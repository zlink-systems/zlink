site_name: ZLink
site_url: https://kairos-code-dev.github.io/zlink/
site_description: ZLink Framework — 실시간 메시징 서버 프레임워크

repo_url: https://github.com/kairos-code-dev/zlink
repo_name: kairos-code-dev/zlink

# docs/는 정본 트리를 심링크로 모은 자리다(복사본이 아니다).
# framework · core · bindings 문서가 한 사이트에 함께 실린다.
docs_dir: docs

theme:
  name: material
  language: ko
  # header/nav.html 두 partial만 포크한다 — 사이트 이름 텍스트("ZLink")도 로고
  # 아이콘처럼 홈으로 링크되게 하려고. 그 외 나머지는 Material 원본 그대로다.
  custom_dir: overrides
  # Material 기본 Roboto에는 한글 글리프가 없다. 한글이 글자마다 OS 대체 폰트로
  # 떨어지면서 자간과 굵기가 흔들리므로 시스템 한글 폰트를 쓴다.
  font: false
  # 첫 항목이 기본값이다. `media`를 걸면 OS 설정을 따라가므로, 다크로 시작하게
  # 하려면 빼야 한다. 토글은 그대로 남고 고른 값은 브라우저에 저장된다.
  # primary는 헤더 바 색, accent는 호버·포커스 색이다. slate에서 teal은 링크가
  # 청록(#00ccb8)으로 잡히므로 어두운 바탕에서 대비가 넉넉하다.
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.tabs.link
    # navigation.sections를 켜면 언어 묶음이 접히지 않는 제목 덩어리가 된다.
    # 빼면 각 묶음이 여닫히므로 지금 보는 언어만 펼쳐 둘 수 있다.
    - navigation.top
    # 본문 맨 아래에 앞·뒤 장 링크. 순서는 이 파일의 nav가 정한다.
    - navigation.footer
    - search.highlight

extra_css:
  - assets/korean.css
  - assets/stylesheets/extra.css

# 다이어그램 안 글씨를 키운다. 폰트만 올리면 자연폭이 함께 늘어 축소율이 나빠지므로
# 폰트와 간격 상수를 같이 조정한다. 자세한 이유는 hook 파일 머리말에.
hooks:
  - hooks/mermaid_size.py

plugins:
  - search
  # 한국어가 기본이다. framework 402장은 전부 `.ko.md`이고, core·bindings의 영어
  # 문서는 `.en.md`로 옮겼다 — 접미사 없는 자리가 비어야 이 배치가 성립한다.
  # nav 라벨은 영어로 적고 번역표가 한국어를 준다.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ko
          name: 한국어
          default: true
          build: true
          nav_translations:
            Guide: 가이드
            Overview: 개요
            Core API: 핵심 API
            Socket Patterns: 소켓 패턴
            Transports: 트랜스포트
            TLS Security: TLS 보안
            Monitoring: 모니터링
            Services: 서비스
            Routing ID: 라우팅 ID
            Message API: 메시지 API
            Performance: 성능
            Thread Safety: 스레드 안전성
            Socket Options: 소켓 옵션
            API Reference: API 레퍼런스
            Context: 컨텍스트
            Message: 메시지
            Events: 이벤트
            Polling: 폴링
            Errors: 에러
            Getting Started: 시작하기
            Messaging: 메시징
            Operations: 운영
            Reference: 레퍼런스
            Utilities: 유틸리티
            Internals: 내부 구조
            Architecture: 아키텍처
            Threading Model: 스레딩 모델
            Design Decisions: 설계 결정
            POSD Module Structure: POSD 모듈 구조
            Services Internals: 서비스 내부
            Stream Socket: 스트림 소켓
            Protocol ZMP: ZMP 프로토콜
            Protocol Raw: Raw 프로토콜
            SPOT Internals: SPOT 내부 구조
            I/O Thread: I/O 스레드
            Result Enums: 결과 Enum
            Actor: Actor
        - locale: en
          name: English
          build: true

# 문서 트리는 정본을 심링크로 직접 건다(`docs/guide` → `core/doc/guide` 등).
# 복사본을 두면 양쪽이 갈라진다 — 실제로 갈라져서 사이트가 byte HWM 이전의 낡은
# 내용을 내고 있었고, v11이 지운 서비스 계층 장까지 남아 있었다.
#
# 사이트에 올리지 않을 자리. mkdocs는 nav에 없어도 docs_dir 아래를 전부 빌드한다.
exclude_docs: |
  perf/
  */internals/
  # framework 내부 구조는 nav에 올린다 — 위 */internals/는 각 언어의
  # bindings/framework internals(공개용이 아닌 것)를 빼는 규칙이라, 여기서만 되살린다.
  !common/internals/
  common/e2e/
  # 공통 가이드는 언어 탭을 담은 소스다. 읽는 자리는 언어별 생성판이다.
  common/guide/
  # 문서 작성 규약이다. 독자용이 아니다.
  guide/EXAMPLES.ko.md
  guide/EXAMPLES.en.md
  guide/STYLE.ko.md
  guide/STYLE.en.md
  # 확정 전 초안.
  spec/draft/
  # 작업이 끝나면 사라지는 임시 문서다. nav에도 없다.
  bindings/plan/

