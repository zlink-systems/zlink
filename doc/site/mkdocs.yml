site_name: ZLink
site_url: https://zlink-systems.github.io/zlink/
site_description: ZLink Framework — 실시간 메시징 서버 프레임워크

repo_url: https://github.com/zlink-systems/zlink
repo_name: zlink-systems/zlink

# docs/는 정본 트리를 심링크로 모은 자리다(복사본이 아니다).
# framework · core · bindings 문서가 한 사이트에 함께 실린다.
docs_dir: docs

theme:
  name: material
  # i18n 플러그인이 로케일마다 이 값을 덮어쓴다. 여기 적은 값은 기본 로케일과
  # 같아야 한다.
  language: en
  # header/nav.html 두 partial만 포크한다 — 사이트 이름 텍스트("ZLink")도 로고
  # 아이콘처럼 홈으로 링크되게 하려고. 그 외 나머지는 Material 원본 그대로다.
  custom_dir: overrides
  # Material 기본 Roboto에는 한글 글리프가 없다. 한글이 글자마다 OS 대체 폰트로
  # 떨어지면서 자간과 굵기가 흔들리므로 시스템 한글 폰트를 쓴다.
  font: false
  # 첫 항목이 기본값이다. `media`를 걸면 OS 설정을 따라가므로, 다크로 시작하게
  # 하려면 빼야 한다. 토글은 그대로 남고 고른 값은 브라우저에 저장된다.
  # primary는 헤더 바 색, accent는 호버·포커스 색이다. slate에서 teal은 링크가
  # 청록(#00ccb8)으로 잡히므로 어두운 바탕에서 대비가 넉넉하다.
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.tabs.link
    # navigation.sections를 켜면 언어 묶음이 접히지 않는 제목 덩어리가 된다.
    # 빼면 각 묶음이 여닫히므로 지금 보는 언어만 펼쳐 둘 수 있다.
    - navigation.top
    # 본문 맨 아래에 앞·뒤 장 링크. 순서는 이 파일의 nav가 정한다.
    - navigation.footer
    - search.highlight

extra_css:
  - assets/korean.css
  - assets/stylesheets/extra.css

# 다이어그램 안 글씨를 키운다. 폰트만 올리면 자연폭이 함께 늘어 축소율이 나빠지므로
# 폰트와 간격 상수를 같이 조정한다. 자세한 이유는 hook 파일 머리말에.
hooks:
  - hooks/mermaid_size.py

plugins:
  - search
  # 영어가 기본이고 한국어는 고르는 쪽이다. 영어는 `/`, 한국어는 `/ko/`에 실린다.
  #
  # 모든 장이 `.ko.md`/`.en.md` 쌍으로 있고 접미사 없는 자리는 비어 있다. nav
  # 경로도 접미사 없이 적어야 한다 — 그래야 로케일마다 제 짝을 찾는다. `.ko.md`로
  # 못박으면 영어 빌드가 자기 파일 집합에 없는 파일을 찾아 경고를 쏟고, 기본
  # 로케일을 바꾸는 것 자체가 막힌다.
  #
  # nav 라벨은 영어로 적고 번역표가 한국어를 준다. 반대로 적으면 영어 화면에
  # 한국어가 남는다.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ko
          name: 한국어
          build: true
          # 번역표는 nav 라벨 문자열 전체를 키로 잡는 평면 map이다. 키는 nav에
          # 적힌 영어 그대로여야 하고, 여기 없는 라벨은 한국어 화면에서도 영어로
          # 남는다. 반대로 nav를 한국어로 적으면 영어 화면에서 한국어가 남는다 —
          # 실제로 그렇게 갈라져서 영어 전환이 반쪽만 되고 있었다.
          nav_translations:
            # 최상위 구획. Framework · Bindings · Core가 같은 이름을 공유한다.
            Guide: 가이드
            Reference: 레퍼런스
            Spec: 스펙
            Internals: 내부 구조
            Overview: 개요
            API Reference: API 레퍼런스

            # Framework 언어별 서버 가이드. 5개 언어가 같은 라벨을 공유한다.
            Guide home: 가이드 홈
            "1. Overview": "1. 개요"
            "2. Getting started": "2. 시작하기"
            "3. Core concepts": "3. 핵심 개념"
            "7. Actor and Spot": "7. Actor와 Spot"
            "8. Session and Actor binding": "8. Session과 Actor binding"
            "12. Operations": "12. 운영"
            "13. Key type index": "13. 주요 타입 사용 색인"
            "14. Picking a sample": "14. 샘플 고르기"
            "15. E2E testing": "15. E2E 테스트"
            "17. Where ZLink fits": "17. ZLink를 어디에 쓰나"
            "18. DI container": "18. DI 컨테이너"
            "21. Execution and configuration model": "21. 실행·구성 모델"

            # Framework 공통 스펙.
            Common spec: 공통 스펙
            Conventions and glossary: 작성 기준과 공통 용어
            Public contract governance: 공개 계약 관리
            Messaging glossary: 메시징 용어집
            Foundation contracts: 기반 계약
            Framework overview: Framework 개요
            Interaction model: 상호작용 모델
            Message model: 메시지 모델
            Async execution policy: 비동기 실행 정책
            Channel and network: Channel과 network
            Channel messaging: Channel 메시징
            Object messaging: Object 메시징
            Spot model: Spot 모델
            Spot messaging: Spot 메시징
            Actor model: Actor 모델
            Spot and Actor membership: Spot과 Actor membership
            Spot address messaging: Spot 주소 메시징
            STREAM and session: STREAM과 session
            STREAM server session: STREAM 서버 session
            Location Store and relocation: Location Store와 relocation
            Observability and shutdown: 관측과 종료
            Runtime status and diagnostics: Runtime 상태와 운영 진단
            Host relocate and shutdown: Host Relocate와 Shutdown
            Failure handling and failover: 장애 대응과 failover
            Framework error model: Framework 오류 모델
            Implementation gap record: Framework 구현 차이 기록

            # Framework 내부 구조. 숫자 접두사가 키를 유일하게 만든다 — 가이드의
            # "8. Session and Actor binding"과 아래 "9."는 다른 항목이다.
            Internals overview: 내부 구조 개요
            "1. Layer boundary and identifier": "1. 계층 경계와 식별자"
            "2. Spot and Actor execution serialization": "2. Spot·Actor 실행 직렬화"
            "3. Application and infrastructure isolation": "3. application과 infrastructure 실행 분리"
            "4. Operation completion": "4. operation 완료 확정"
            "5. Message continuity during a move": "5. 이동 중 message 연속성"
            "6. Target selection and route cache": "6. target 선택과 route cache"
            "7. Receive and dispatch loop": "7. 수신과 dispatch 루프"
            "8. Object kind and activation": "8. 객체 종류와 활성화"
            "9. Session and Actor connection": "9. Session과 Actor 연결"
            "10. Liveness and status publication": "10. Liveness와 상태 공개"
            "11. Payload ownership and copy": "11. Payload 소유권과 복사"

            # Core 가이드 · 스펙 · 내부 구조.
            Transports: 트랜스포트
            TLS Security: TLS 보안
            Monitoring: 모니터링
            Routing ID: 라우팅 ID
            Performance: 성능
            Thread Safety: 스레드 안전성
            Socket Options: 소켓 옵션
            Context: 컨텍스트
            Message: 메시지
            Events: 이벤트
            Polling: 폴링
            Errors: 에러
            Operations: 운영
            Utilities: 유틸리티
            Architecture: 아키텍처
            Threading Model: 스레딩 모델
            Design Decisions: 설계 결정
            POSD Module Structure: POSD 모듈 구조
            Stream Socket: 스트림 소켓
            Protocol ZMP: ZMP 프로토콜
            Protocol Raw: Raw 프로토콜
            I/O Thread: I/O 스레드
            Result Enums: 결과 Enum

# 문서 트리는 정본을 심링크로 직접 건다(`docs/guide` → `core/doc/guide` 등).
# 복사본을 두면 양쪽이 갈라진다 — 실제로 갈라져서 사이트가 byte HWM 이전의 낡은
# 내용을 내고 있었고, v11이 지운 서비스 계층 장까지 남아 있었다.
#
# 사이트에 올리지 않을 자리. mkdocs는 nav에 없어도 docs_dir 아래를 전부 빌드한다.
exclude_docs: |
  perf/
  */internals/
  # framework 내부 구조는 nav에 올린다 — 위 */internals/는 각 언어의
  # bindings/framework internals(공개용이 아닌 것)를 빼는 규칙이라, 여기서만 되살린다.
  !common/internals/
  common/e2e/
  # 공통 가이드는 언어 탭을 담은 소스다. 읽는 자리는 언어별 생성판이다.
  common/guide/
  # 문서 작성 규약이다. 독자용이 아니다.
  guide/EXAMPLES.ko.md
  guide/EXAMPLES.en.md
  guide/STYLE.ko.md
  guide/STYLE.en.md
  # 확정 전 초안.
  spec/draft/
  # 작업이 끝나면 사라지는 임시 문서다. nav에도 없다.
  bindings/plan/

