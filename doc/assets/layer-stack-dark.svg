<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384"
     role="img" aria-label="zlink layer structure. At the top is the business logic you write - Spot, Actor, handler. Below it sits zlink, which is itself a thin three-layer stack: ZLink Framework for .NET, C++, Java, Kotlin and Node; the per-language bindings backend adapter; and the native zlink Core C API with its socket patterns and transports. The bindings and Core layers are internal implementation and are not exposed to application code. At the bottom is the application host you register zlink into - ASP.NET Core, Spring Boot, NestJS, or the C++ host." font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif">
  <title>zlink layer structure and registration point</title>

  <rect x="0" y="0" width="900" height="384" fill="#10151A"/>

  <text x="450" y="22" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B4BFC9">ZLink on the host, business logic on top — and ZLink itself is a thin 3-layer stack</text>
  <text x="450" y="41" text-anchor="middle" font-size="10.5" fill="#8493A0">Register zlink into the host you already use · one native Core, wrapped in per-language layers</text>

  <rect x="40" y="56" width="820" height="38" rx="6" fill="none" stroke="#B4BFC9" stroke-width="1.8"/>
  <text x="450" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#B4BFC9">Business logic — Spot · Actor · handler</text>

  <path d="M450,94 L450,106" stroke="#5FBFCE" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- the ZLink Framework slot of 01-layers, expanded into the overview-stack 3 layers -->
  <rect x="40" y="106" width="820" height="190" rx="7" fill="#191F27" stroke="#B4BFC9" stroke-width="1.6"/>
  <text x="56" y="122" font-size="10" font-weight="600" fill="#8493A0">zlink — below the public API is internal implementation</text>

  <rect x="56" y="130" width="672" height="50" rx="6" fill="#17242A" stroke="#5FBFCE" stroke-width="2.2"/>
  <text x="392" y="151" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5FBFCE">ZLink Framework (.NET · C++ · Java · Kotlin · Node)</text>
  <text x="392" y="168" text-anchor="middle" font-size="10" fill="#5FBFCE">RouteMesh · SPOT · actor · STREAM · location · monitoring</text>
  <text x="742" y="152" font-size="9.5" fill="#5FBFCE">public</text>
  <text x="742" y="165" font-size="9.5" fill="#5FBFCE">API</text>

  <rect x="56" y="188" width="672" height="42" rx="5" fill="#1D242C" stroke="#8493A0" stroke-width="1.2"/>
  <text x="392" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#8493A0">bindings — backend adapter (c · cpp · dotnet · node · java · go · python · rust)</text>
  <text x="392" y="221" text-anchor="middle" font-size="9.5" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" fill="#8493A0">language-native API over the Core C API</text>

  <rect x="56" y="238" width="672" height="42" rx="5" fill="#1D242C" stroke="#8493A0" stroke-width="1.2"/>
  <text x="392" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#8493A0">zlink Core (C API, native)</text>
  <text x="392" y="271" text-anchor="middle" font-size="9.5" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" fill="#8493A0">PAIR · PUB/SUB · XPUB/XSUB · DEALER/ROUTER · STREAM  ·  tcp · ipc · inproc · tls · ws · wss</text>

  <path d="M740,188 h7 v92 h-7" fill="none" stroke="#8493A0" stroke-width="1.4"/>
  <text x="754" y="230" font-size="9.5" font-weight="600" fill="#8493A0">internal</text>
  <text x="754" y="243" font-size="9.5" font-weight="600" fill="#8493A0">impl.</text>

  <!-- registered into the host -->
  <path d="M136,296 L136,318" stroke="#5FBFCE" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M345,296 L345,318" stroke="#5FBFCE" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M555,296 L555,318" stroke="#5FBFCE" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M764,296 L764,318" stroke="#5FBFCE" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="40"  y="318" width="193" height="54" rx="5" fill="#191F27" stroke="#B4BFC9" stroke-width="1.4"/>
  <text x="136" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#B4BFC9">ASP.NET Core</text>
  <text x="136" y="359" text-anchor="middle" font-size="9" fill="#8493A0">.NET</text>
  <rect x="249" y="318" width="193" height="54" rx="5" fill="#191F27" stroke="#B4BFC9" stroke-width="1.4"/>
  <text x="345" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#B4BFC9">Spring Boot</text>
  <text x="345" y="359" text-anchor="middle" font-size="9" fill="#8493A0">JVM · Java · Kotlin</text>
  <rect x="458" y="318" width="193" height="54" rx="5" fill="#191F27" stroke="#B4BFC9" stroke-width="1.4"/>
  <text x="555" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#B4BFC9">NestJS</text>
  <text x="555" y="359" text-anchor="middle" font-size="9" fill="#8493A0">Node</text>
  <rect x="667" y="318" width="193" height="54" rx="5" fill="#191F27" stroke="#B4BFC9" stroke-width="1.4"/>
  <text x="763" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#B4BFC9">C++ host</text>
  <text x="763" y="359" text-anchor="middle" font-size="8.5" fill="#8493A0">zlink is the host (no external framework)</text>
</svg>
