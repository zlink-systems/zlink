syntax = "proto3";
package zlink.framework.channel.v1;

enum ChannelKind { CHANNEL_KIND_UNSPECIFIED = 0; REQUEST = 1; RESPONSE = 2; COMMAND = 3; PUBLISH = 4; ERROR = 5; }
enum FlowOrigin  { FLOW_ORIGIN_UNSPECIFIED = 0; INBOUND = 1; TIMER = 2; APPLICATION = 3; LIFECYCLE = 4; }

message MetadataEntry { string key = 1; string value = 2; }

message ChannelHeader {
  ChannelKind kind = 1;
  string channel_name = 2;
  string message_name = 3;
  string content_type = 4;
  optional string correlation_id = 5;
  optional string deadline = 6;
  optional string error_code = 7;
  optional string error_message = 8;
  optional string flow_id = 9;
  optional FlowOrigin flow_origin = 10;
  optional string source = 11;
  optional string topic = 12;
  repeated MetadataEntry metadata = 13;
}
