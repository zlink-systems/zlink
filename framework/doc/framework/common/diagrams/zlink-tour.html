<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZLink 둘러보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* 사이트(Material) 안의 iframe으로 열리면 사이트의 밝은/어두운 테마를 따른다. 단독으로 열면 OS 설정을 따른다. */
(function () {
  try {
    if (window.parent === window) return;
    var pd = window.parent.document;
    var apply = function () {
      var scheme = pd.body && pd.body.getAttribute('data-md-color-scheme');
      if (scheme) document.documentElement.setAttribute('data-theme', scheme === 'slate' ? 'dark' : 'light');
    };
    apply();
    new MutationObserver(apply).observe(pd.body, {attributes: true, attributeFilter: ['data-md-color-scheme']});
  } catch (e) { /* 다른 출처에서 열리면 OS 설정을 따른다 */ }
})();
</script>
<style>
:root{
  --bg:#F2F5F4; --panel:#FFFFFF; --ink:#14211F; --ink-2:#34423F; --muted:#5B6B68; --line:#C9D4D1;
  --accent:#0E8175; --accent-ink:#0A5F56; --accent-soft:#D6EDE9; --on-accent:#FFFFFF;
  --hold:#C4761A; --hold-soft:#F6E5CB; --look:#6C7C95;
  --node-fill:#FAFCFB; --spot-fill:#E8F3F1; --store-fill:#EEF0F5;
  --select:#ECEAF3; --select-line:#C6C0D8; --village:#E7EFDF; --village-line:#B9CCA8; --dungeon:#2A2530; --dungeon-line:#4A4052; --dungeon-ink:#EDE6F2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1413; --panel:#121D1C; --ink:#E3ECEA; --ink-2:#C2CFCC; --muted:#92A5A1; --line:#2B3B39;
    --accent:#35C2AF; --accent-ink:#7FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
    --hold:#E9A23F; --hold-soft:#3A2A12; --look:#9AA8C2;
    --node-fill:#101A19; --spot-fill:#14302C; --store-fill:#161C27;
    --select:#1E1C27; --select-line:#3B3650; --village:#1B2A1E; --village-line:#34503A; --dungeon:#1D1822; --dungeon-line:#3E3448; --dungeon-ink:#E4DCEB;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1413; --panel:#121D1C; --ink:#E3ECEA; --ink-2:#C2CFCC; --muted:#92A5A1; --line:#2B3B39;
  --accent:#35C2AF; --accent-ink:#7FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
  --hold:#E9A23F; --hold-soft:#3A2A12; --look:#9AA8C2;
  --node-fill:#101A19; --spot-fill:#14302C; --store-fill:#161C27;
  --select:#1E1C27; --select-line:#3B3650; --village:#1B2A1E; --village-line:#34503A; --dungeon:#1D1822; --dungeon-line:#3E3448; --dungeon-ink:#E4DCEB;
}
*{box-sizing:border-box}
body{zoom:.9;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:22px 44px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
header h1{margin:0;font-size:clamp(21px,2.8vw,28px);letter-spacing:-.01em}
header .eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block}
nav.groups{display:flex;flex-wrap:wrap;gap:6px}
nav.groups button{font:500 13.5px var(--sans);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer}
nav.groups button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav.groups button:disabled{cursor:default;opacity:.5}
nav.groups button small{font-size:11px;margin-left:4px}
.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
@media (max-width:900px){.side{position:static}}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
@media (max-width:900px){ol.steps{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
ol.steps li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--muted);font-size:14px;white-space:nowrap}
ol.steps .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);border:1.5px solid var(--line);background:var(--panel)}
ol.steps li.done{color:var(--ink-2)}
ol.steps li.done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
ol.steps li.cur{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--accent)}
ol.steps li.cur .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.speed{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px}
.speed b{font:600 12.5px var(--mono);color:var(--ink)}
#speedRange{width:100%;accent-color:var(--accent)}
@media (max-width:900px){#speedRange{max-width:320px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:500 12.5px var(--sans);color:var(--ink-2);background:transparent;border:0;padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.view{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.view svg{display:block;width:100%;min-width:680px;height:auto}
.vlabel{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 -4px 2px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bar .t{font:600 12px var(--mono);color:var(--accent);letter-spacing:.06em}
.bar .line{margin:0;font-size:16.5px;font-weight:500;line-height:1.5;text-wrap:pretty}
.bar .res{margin:0;font-size:14px;color:var(--accent-ink);min-height:21px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.act{font:600 14.5px var(--sans);border-radius:9px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.next{margin-left:auto}
.act:disabled{opacity:.4;cursor:default}
.act:focus-visible,nav.groups button:focus-visible,summary:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{font-size:13.5px;color:var(--ink-2)}
summary{cursor:pointer;color:var(--muted);font-size:13px}
details ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
details code{font:12.5px var(--mono);color:var(--accent-ink)}
.foot,.src{font-size:12.5px;color:var(--muted)}
.bar .src{margin:0}
.foot a,.src a{color:var(--accent-ink);text-underline-offset:2px}
.foot a:focus-visible,.src a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* svg */
svg text{font-family:var(--sans)}
.zone-sel{fill:var(--select);stroke:var(--select-line)}
.village{fill:var(--village);stroke:var(--village-line)}
.house{fill:var(--panel);stroke:var(--village-line)}
.dungeon{fill:var(--dungeon);stroke:var(--dungeon-line)}
.dng{transition:opacity .6s}
.dng.locked{opacity:.28}
.g-title{font-weight:700;font-size:14px;fill:var(--ink)}
.g-title.d{fill:var(--dungeon-ink)}
.g-sub{font-size:11.5px;fill:var(--muted)}
.g-sub.d{fill:#A99BB6}
.boss>circle{fill:#6B2E3A;stroke:#C7667A;stroke-width:3}
.boss.hit>circle{animation:hit .25s ease}
@keyframes hit{50%{fill:#A8404F}}
.hp-bg{fill:#3B3342}
.hp{fill:#E0576B}
.hp.party{fill:#4FB985}
.hp-t{font:600 11.5px var(--mono);fill:var(--dungeon-ink)}
.ch>circle.body{stroke:#fff;stroke-width:2}
.ch>text{font:700 11px var(--mono);fill:#fff;text-anchor:middle;dominant-baseline:central}
.ch.off{opacity:.3}
.ch.act>circle.body{stroke:#F7D774;stroke-width:3.5}
.ch .seen{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.ch.seen .seen{animation:seen .9s ease}
@keyframes seen{0%{opacity:1;r:16}100%{opacity:0;r:30}}
.dmg{font:700 15px var(--mono);fill:#FFD66B;text-anchor:middle}
.dmg.boss{fill:#FF8A7A}
.beam{stroke:#FF8A7A;stroke-width:2.5}
.box>rect{fill:var(--node-fill);stroke:var(--line);stroke-width:1.2}
.box.store>rect{fill:var(--store-fill);stroke:var(--look)}
.grp-field{fill:var(--village);stroke:var(--village-line);stroke-dasharray:5 4}
.grp-dng{fill:var(--hold-soft);fill-opacity:.45;stroke:var(--dungeon-line);stroke-dasharray:5 4}
.box.gw>rect{fill:var(--panel);stroke:var(--ink-2)}
.box.pulse>rect{animation:pulse .7s ease}
@keyframes pulse{0%{stroke:var(--accent);stroke-width:3.5}100%{stroke-width:1.2}}
.t-title{font-weight:600;font-size:13.5px;fill:var(--ink)}
.t-sub{font-size:11.5px;fill:var(--muted)}
.t-mono{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.t-store{font-family:var(--mono);font-size:12px;fill:var(--ink-2)}
.spot>rect.bg{fill:var(--spot-fill);stroke:var(--accent);stroke-width:1.5}
.spot.holding>rect.bg{stroke:var(--hold);stroke-dasharray:6 4;fill:var(--hold-soft)}
.spot.gone{opacity:0;transition:opacity .6s}
.spot.pulse>rect.bg{animation:pulse .7s ease}
.t-spot{font-family:var(--mono);font-weight:600;font-size:12px;fill:var(--accent-ink)}
.gate>rect{fill:var(--hold-soft);stroke:var(--hold)}
.gate>text{font-family:var(--mono);font-size:10.5px;fill:var(--hold)}
.gate.on>rect{fill:var(--hold)}
.gate.on>text{fill:var(--on-accent)}
.lane{fill:var(--bg);stroke:var(--line)}
.lane-l{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chip>rect{fill:var(--accent)}
.chip>text{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--on-accent);text-anchor:middle}
.chip.tick>rect{fill:var(--hold)}
.exec>rect{fill:var(--panel);stroke:var(--hold);stroke-dasharray:4 3}
.exec.on>rect{fill:var(--hold-soft);stroke:var(--hold);stroke-width:2;stroke-dasharray:none}
.exec-g{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--hold)}
.exec-t{font-family:var(--mono);font-size:11.5px;font-weight:600;fill:var(--ink)}
.actor>circle{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.5}
.actor>text{font:600 10.5px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.actor.run>circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.actor.disc>circle{stroke:var(--hold);stroke-dasharray:3 3}
.actor.hidden{opacity:0}
.sess>rect{fill:var(--accent-soft);stroke:var(--accent)}
.sess.dead>rect{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.sess>text{font-family:var(--mono);font-size:11px;fill:var(--accent-ink)}
.sess.dead>text{fill:var(--muted)}
.sess.hidden{opacity:0}
.cl>rect{fill:var(--panel);stroke:var(--ink-2)}
.cl>text{font-family:var(--mono);font-size:11px;fill:var(--ink-2);text-anchor:middle}
.cl>text.tag{font-weight:700;font-size:12px;fill:var(--ink)}
.cl.off>rect{stroke:var(--hold);stroke-dasharray:3 3}
.cl.hidden{opacity:.3}
.link{stroke:var(--line);stroke-width:1.3;fill:none}
.link.conn{stroke:var(--ink-2);stroke-width:1.8}
.link.bind{stroke:var(--accent);stroke-dasharray:6 5;stroke-width:1.5}
.lbl{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.pkt{fill:var(--accent)}
.pkt-push{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.pkt-look{fill:var(--look)}
.badge{font:600 10.5px var(--mono);fill:var(--hold)}
@media (prefers-reduced-motion: reduce){.box.pulse>rect,.spot.pulse>rect.bg,.boss.hit>circle,.ch.seen .seen{animation:none}}
</style>
<style>
.panelz{fill:var(--panel);stroke:var(--line)}
.note-t{font-size:12.5px;fill:var(--ink)}
.note-t.hi{font-weight:700;fill:var(--accent-ink)}
.note-t.warn{fill:var(--hold);font-weight:600}
.banner>rect{fill:var(--hold);opacity:.92}
.banner>text{font-weight:700;font-size:13px;fill:#fff;text-anchor:middle}
.box.drained>rect{stroke:var(--hold);stroke-dasharray:6 4}
.box.ghost>rect{fill:none;stroke-dasharray:5 5}
.box.faded{opacity:.35;transition:opacity .6s}
.box.hot>rect{stroke:var(--accent);stroke-width:2}
.box.bad>rect{animation:badp .9s ease}
@keyframes badp{0%{stroke:#C0392B;stroke-width:3.5}100%{stroke-width:1.2}}
.chipc>rect{fill:var(--accent-soft)}
.chipc>text{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--accent-ink)}
.chipc.pub>rect{fill:none;stroke:#2F6DB5}
.chipc.pub>text{fill:#2F6DB5}
.t-count{font-family:var(--mono);font-weight:600;font-size:11.5px;fill:var(--accent-ink)}
.link.broken{stroke:var(--hold);stroke-dasharray:3 5;stroke-width:1.6}
.link.reply{stroke:#2F6DB5;stroke-dasharray:2 4;stroke-width:1.8}
.link.reply.hi{stroke-width:3.5}
.pkt-pub{fill:#2F6DB5}
.pkt-state{fill:var(--hold);stroke:var(--ink);stroke-width:1}
.pkt-reply{fill:#2F6DB5}
.spot.holding .chip>rect{fill:var(--hold)}
.gauge-bg{fill:var(--bg);stroke:var(--line)}
.gauge-fill{fill:var(--accent)}
.gauge-fill.hi{fill:var(--hold)}
.slot{fill:var(--bg);stroke:var(--line)}
.slot.on{fill:var(--hold)}
.slot.run{fill:var(--accent)}
.xp-bg{fill:var(--bg);stroke:var(--line)}
.xp{fill:var(--accent)}
.party-p{fill:var(--dungeon);stroke:var(--dungeon-line)}
.player-dot{stroke:#fff;stroke-width:1.5}
.atk{stroke:#FFD66B;stroke-width:1.5}
.chan-frame{fill:none;stroke-width:2.2;stroke-dasharray:10 6}
.chan-frame.cs{stroke:#0E8175;fill:#0E8175;fill-opacity:.05}
.chan-frame.fanout{stroke:#2F6DB5;fill:#2F6DB5;fill-opacity:.04}
.chan-frame.mesh{stroke:#7A4FC0;fill:#7A4FC0;fill-opacity:.03}
.chan-tag>rect{fill:#0E8175}
.chan-tag.fanout>rect{fill:#2F6DB5}
.chan-tag.mesh>rect{fill:#7A4FC0}
.chan-tag>text{font-family:var(--mono);font-size:12px;font-weight:700;fill:#fff}
.box.legend>rect{fill:var(--panel);stroke:var(--line)}
.legend-t{font-size:12.5px;fill:var(--ink-2)}
.box.dim{opacity:.3;transition:opacity .3s}
.grp-cs{fill:var(--accent-soft);fill-opacity:.35;stroke:var(--accent);stroke-dasharray:6 4}
.grp-cs-t{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--accent-ink)}
.w-badge{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink-2)}
.w-badge.heavy{fill:var(--accent);font-size:13px;font-weight:800}
.w-badge.zero{fill:var(--hold);font-weight:800}
.got{fill:var(--accent)}
.got.heavy{fill:#0A5F56}
.link.mesh{stroke:var(--line);stroke-width:3}
.link.mesh.on{stroke:var(--accent);stroke-width:4}
.mesh-t{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--accent-ink)}
.bp-cell{fill:var(--bg);stroke:var(--line)}
.bp-cell.on{fill:var(--accent)}
.bp-cell.hi{fill:var(--hold)}
.bp-mark{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:4 3}
.bp-mark.bad{stroke:#C0392B}
.bp-mark-t{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink-2)}
.bp-mark-t.bad{fill:#C0392B}
.bp-pill>rect{fill:var(--accent)}
.bp-pill>text{font-weight:700;font-size:13px;fill:var(--on-accent);text-anchor:middle}
.bp-pill.stop>rect{fill:#C0392B}
.bp-pill.stop>text{fill:#fff}
.bp-pill.dead>rect{fill:var(--line)}
.bp-pill.dead>text{fill:var(--muted)}
.bp-world{font-size:13px;font-weight:600;fill:#CFE9E3}
.bp-world.warn{fill:#F4B764}
.bp-world.bad{fill:#FF8A7A}
.t-count.bad{fill:#C0392B}
.box.dead>rect{fill:#3A1F1F;stroke:#C0392B;stroke-width:2}
.boom{fill:none;stroke:#FF7A3D;stroke-width:6}
.boom.b1{stroke:#FFD66B;stroke-width:4}
.boom.b2{stroke:#C0392B;stroke-width:8}
.spark{fill:#FFB347}
.boom-t{font-weight:800;font-size:30px;fill:#FF5A3D;paint-order:stroke;stroke:#fff;stroke-width:3px}
.boom-t.big{font-size:34px}
.boom-s{font-weight:700;font-size:13px;fill:#FF8A7A}
svg.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-1px)}}

.link.relay{stroke:var(--hold);stroke-width:3;stroke-dasharray:9 5}
.relay-t{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--hold)}
.flylabel{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.band{fill:#7A4FC0;fill-opacity:.16}
.zr.hot{stroke:var(--accent);stroke-width:3}
.ch.gh{opacity:.5}
.ch.gh>circle.body{stroke:var(--ink-2);stroke-dasharray:3 2}
.spot.dim{opacity:.35;transition:opacity .3s}
.link.wire{stroke:var(--look);stroke-width:3}
.link.wire.on{stroke:var(--accent);stroke-width:4}
.link.wire.broken,.link.mesh.broken{stroke:var(--hold);stroke-dasharray:3 5;stroke-width:3}
.chan-frame.rank{stroke:#B5527F;fill:#B5527F;fill-opacity:.04}
.chan-tag.rank>rect{fill:#B5527F}
.chipc.hot>rect{fill:var(--accent)}
.chipc.hot>text{fill:var(--on-accent)}
.chipc.pub.hot>rect{fill:#2F6DB5}
.chipc.pub.hot>text{fill:#fff}
.spot .chipc.pub>rect{stroke:#2F6DB5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .spot .chipc.pub>text{fill:#8DB9F2}:root:not([data-theme="light"]) .spot .chipc.pub>rect{stroke:#8DB9F2}}
:root[data-theme="dark"] .spot .chipc.pub>text{fill:#8DB9F2}
:root[data-theme="dark"] .spot .chipc.pub>rect{stroke:#8DB9F2}
.spot .chipc.pub.hot>text{fill:#fff}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div><span class="eyebrow">ZLink Framework · MORPG로 보기</span><h1 id="gtitle"></h1></div>
    <nav class="groups" id="groups" aria-label="기능 그룹"></nav>
  </header>

  <div class="main">
    <div class="side">
      <ol class="steps" id="steps" aria-label="단계"></ol>
      <label class="speed" for="speedRange">메시지 속도 <b id="speedVal">1.5×</b></label>
      <input type="range" id="speedRange" min="0.25" max="3" step="0.25" value="1.5" aria-label="메시지 속도">
    </div>
    <div class="col">
      <div class="bar">
        <span class="t" id="stepNo"></span>
        <p class="line" id="line"></p>
        <div class="acts" id="acts"></div>
        <p class="res" id="res" aria-live="polite"></p>
        <p class="src" id="src"></p>
        <details><summary>자세히</summary><ul id="more"></ul></details>
      </div>

  store.set('ClientServer inventory → 아이템 서버 1, 2', 'ClientServer payment → 결제 서버 1, 2');

  async function call(i, list, label){
    await fly(CL[i], {x: 116, y: CL[i].y}, {dur: 280, bend: 0, label: 'HTTP'});
    const b = pick(list); if (!b) { note('대상 없음 오류', 'warn'); return; }
    /* down the corridor right of the API server, then straight into the chosen server */
    const cy = CL[i].y, by = b.y + 30, r = Math.sign(by - cy) * Math.min(6, Math.abs(by - cy) / 2);
    const route = `M266,${cy} L270,${cy} Q276,${cy} 276,${cy + r} L276,${by - r} Q276,${by} 282,${by} L296,${by}`;
    await flyPath(route, {dur: 300, label}); pulse(b.g);
    b.n++; b.batch++; upd(b); await sleep(240 * K);
    await flyPath(route, {cls: 'pkt-push', dur: 300, back: true});
    await fly({x: 116, y: CL[i].y}, CL[i], {cls: 'pkt-push', dur: 280, bend: 0});
    return b;
  }
  async function burst(n, list, label, what){
    list.forEach(b => { b.batch = 0; upd(b); });
    await Promise.all(Array.from({length: n}, async (_, k) => { await sleep(k * 260 * K / 3.5); const b = await call(k % 4, list, label); if (b) note(`P${k % 4 + 1} ${what} ← ${b.title || ''}`); }));
    return list.filter(b => b.ready).map(b => `${b.name}: ${b.batch}건`).join(' · ');
  }
  I.forEach((b, k) => { b.name = `아이템 서버 ${k + 1}`; b.title = b.name; }); P.forEach((b, k) => { b.name = `결제 서버 ${k + 1}`; b.title = b.name; });
  const STEPS = [
    {title: '이름으로 부르기', ref: [['20장 §4.1 동작', '20-channel-messaging#41-동작']], line: '플레이어가 앱에서 인벤토리를 연다. HTTP 요청은 API 서버로 가고, API 서버는 inventory라는 channel 이름으로 아이템 서버를 부른다.',
     act: '아이템 서버로 4번 요청', repeat: true, more: ['ClientServer channel: 기능 서버가 포트를 열고, API 서버가 client로 연결한다. 호출은 client → server 한 방향이다.', 'API 서버는 아이템 서버의 주소를 모른다. inventory라는 이름만 안다.', 'server가 여럿이면 API 서버가 그중 하나를 고른다. weight가 같으면 돌아가며 하나씩(round-robin)이다.', '호출 코드에는 <code>request_to_channel("inventory", …)</code>만 남는다.'],
     async run(){ const r = await burst(4, I, 'inventory', '인벤토리'); res(`${r}. weight가 같으니 고르게 나뉜다.`); }},
    {title: '서버 늘리기', ref: [['20장 §4.2 받는 쪽', '20-channel-messaging#42-받는-쪽--포트를-여는-서버'], ['20장 §4.3 호출하는 쪽', '20-channel-messaging#43-호출하는-쪽--그-주소로-연결하는-client']], line: '아이템 서버 3을 띄운다. Location Store에 등록되면 API 서버가 알아서 연결해 후보에 넣는다. 설정을 고치지 않는다.',
     act: '아이템 서버 3 시작', extra: ['아이템 서버로 6번 요청', async () => { const r = await burst(6, I, 'inventory', '인벤토리'); res(`${r}. 새 서버도 똑같이 받는다.`); }],
     more: ['서버는 시작할 때 자기 주소와 맡은 channel 이름을 Store에 적는다.', 'API 서버는 Store 기록을 보고 연결한 뒤, 실제 연결에서 신원을 확인하고 나서 보낸다.', '서버를 몇 대 띄우든 호출 코드는 같다.'],
     async run(){ const s3 = I[2]; s3.g.classList.remove('ghost', 'faded');
       await fly(s3.T(), store.pt, {cls: 'pkt-look', dur: 500}); store.set('ClientServer inventory → 아이템 서버 1, 2, 3', null);
       await fly(store.pt, {x: 266, y: 120}, {cls: 'pkt-look', dur: 500}); s3.ln = link({x: 266, y: 250}, s3.L(), 'wire'); chipc(580, s3.y + 6, ':7101'); s3.ready = true; upd(s3); pulse(s3.g);
       res('아이템 서버 3이 후보가 됐다. "아이템 서버로 6번 요청"로 확인해 보라.'); }},
    {title: '가중치로 나누기', ref: [['30장 §4.2 후보 사이의 분배', '30-channel-patterns#42-후보-사이의-분배--기본값은-round-robin-값을-바꾸면-가중치-분배']], line: '아이템 서버 3에 weight 300을 준다. 새 요청은 100 : 100 : 300 비율로 나뉘어, 서버 3의 칸이 다른 서버의 세 배로 쌓인다.',
     act: '서버 3 weight 300', extra: ['아이템 서버로 10번 요청', async () => { const r = await burst(10, I, 'inventory', '인벤토리'); res(`${r}. 서버 3이 다른 서버의 약 3배를 받았다.`); }],

    {title: '가중치 0', ref: [['30장 §4.3 실행 중에 새 요청만 멈추기', '30-channel-patterns#43-실행-중에-새-요청만-멈추기']], line: '아이템 서버 1의 weight를 0으로 바꾼다. 서버 1로는 새 요청이 가지 않는다.',

    {title: '다른 channel 부르기', ref: [['30장 §2.2 ClientServer', '30-channel-patterns#22-clientserver--channel마다-자기-listener를-연다'], ['30장 §4.4 같은 ChannelName을 여러 node로 늘리기', '30-channel-patterns#44-같은-channelname을-여러-node로-늘리기']], line: '상점에서 아이템을 사면 API 서버가 payment channel로 결제 서버를 부른다. 이름만 다를 뿐 부르는 방법은 같다.',

function gFanout(){
  resetViews('0 0 900 236', '0 0 900 462');
  /* game view: where each kind of server shows the notice */
  const panels = {
    field: {x: 14, w: 286, title: '마을 (필드 서버)', cls: 'village'},

  async function show(kind, text){ const p = panels[kind]; p.bg.replaceChildren(); const b = mk(p.bg, 'g', {class: 'banner'}); mk(b, 'rect', {x: p.x + 10, y: 186, width: p.w - 20, height: 26, rx: 6}); mk(b, 'text', {x: p.cx, y: 204, text}); await sleep(900 * K); b.remove(); }

  const store = storeBox(280, 4, 610);

  mk(sB, 'text', {x: 34, y: 236, class: 'legend-t', text: '받을 서버 목록을'}); mk(sB, 'text', {x: 34, y: 256, class: 'legend-t', text: '알지 않는다'});
  const topicT = mk(sB, 'text', {x: 34, y: 296, class: 'w-badge heavy', text: ''});
  chipc(34, 262, ':7301'); mk(sB, 'text', {x: 34, y: 352, class: 'legend-t', text: '실선 = 네트워크 연결'}); mk(sB, 'text', {x: 34, y: 374, class: 'legend-t', text: '점선 = 논리 구분(topic)'});
  const SUBS = [];
  function sub(kind, label, k, ghost){
    const y = 76 + SUBS.length * 52;
    const b = box(400, y, 480, 46, ghost ? 'ghost faded' : '', label);
    Object.assign(b, {kind, topics: [kind, 'all'], n: 0, ready: !ghost, label});
    b.chips = mk(sB, 'g');
    if (!ghost) { let x = 560; ['SUB', ...b.topics].forEach(t => { x += chipcIn(b.chips, x, y + 14, t === 'SUB' ? 'SUB' : `topic ${t}`, t === 'SUB' ? 'pub' : '') + 6; }); }
    b.cT = mk(sB, 'text', {x: 840, y: y + 28, class: 't-count', 'text-anchor': 'end', text: ghost ? '아직 없다' : ''});
    b.ln = ghost ? null : link({x: 224, y: 245}, {x: 400, y: y + 23}, 'wire', 0);
    SUBS.push(b); return b;
  }
  sub('field', '필드 서버 1'); sub('field', '필드 서버 2'); sub('dungeon', '던전 서버 1'); sub('dungeon', '던전 서버 2'); sub('item', '아이템 서버 1'); sub('item', '아이템 서버 2');
  const F3 = sub('field', '필드 서버 3', null, true);
  store.set('fanout notice publisher → 운영 툴', '');
  const MSG = {all: '점검 안내: 오늘 새벽 4시', field: '마을 축제가 시작됐다', dungeon: '던전 보상 2배 이벤트', item: '상점 할인 시작'};
  async function publish(topic){

    const targets = SUBS.filter(b => b.ready && b.topics.includes(topic));
    SUBS.filter(b => b.ready && !b.topics.includes(topic)).forEach(b => b.g.classList.add('dim'));

     async run(){ const r = await publish('all'); res(`${r.length}대가 모두 받았다: ${r.join(', ')}.`); }},

     async run(){ const r = await publish('field'); res(`받은 서버: ${r.join(', ')}. 나머지는 흐리게 표시했다.`); }},
    {title: '던전 서버에만', ref: [['30장 §5.3 Topic', '30-channel-patterns#53-topic--두-형태-모두-수신-대상을-고른다']], line: 'topic dungeon으로 발행하면 던전 서버만 받는다.',
     act: 'topic dungeon 발행', repeat: true, more: ['같은 channel 안에서 topic만 바꿔 받는 대상을 고른다.'],
     async run(){ const r = await publish('dungeon'); res(`받은 서버: ${r.join(', ')}.`); }},
    {title: '아이템 서버에만', ref: [['30장 §5.3 Topic', '30-channel-patterns#53-topic--두-형태-모두-수신-대상을-고른다']], line: 'topic item으로 발행하면 아이템 서버만 받는다. 게임 밖 서버에도 같은 방법으로 알린다.',
     act: 'topic item 발행', repeat: true, more: ['게임 서버든 기능 서버든 notice channel을 구독하면 받을 수 있다.'],
     async run(){ const r = await publish('item'); res(`받은 서버: ${r.join(', ')}. 상점 가격표가 바뀌었다.`); }},
    {title: '구독 서버 늘리기', ref: [['20장 §5.2 받는 쪽', '20-channel-messaging#52-받는-쪽--구독하는-node'], ['30장 §2.3 Fanout', '30-channel-patterns#23-fanout--pubsub-소켓-쌍을-따로-연다']], line: '필드 서버 3을 띄운다. Location Store에서 운영 툴의 주소를 찾아 스스로 연결하고 구독한다. 운영 툴은 바꿀 것이 없다.',

  const store = storeBox(320, 4, 570);
  mk(sB, 'path', {d: 'M142,8 L310,8 L310,58 L896,58 L896,382 L142,382 Z', class: 'chan-frame mesh'}); chanTag(150, 382, 'RouteMesh channel · game', 'mesh');
  const ss = sessionKit(4);

  const meshL = path('M226,332 L226,354 L820,354 L820,334 M420,334 L420,354 M635,334 L635,354', 'mesh'); mk(sB, 'text', {x: 350, y: 368, class: 'mesh-t', text: 'RouteMesh · 세션·필드·던전 서버가 연결 하나로 서로 부른다'});

  startProc(town); startProc(dsp);
  const SLOT_E = [[350, 174], [390, 174], [430, 174], [470, 174]], SLOT_T = [[352, 248], [392, 248], [432, 248], [472, 248]], SLOT_D = [[567, 182], [607, 182], [647, 182], [687, 182]];
  const AC = SLOT_E.map(([x, y], i) => { const a = actorDot('P' + (i + 1), x, y); a.g.classList.add('hidden'); return a; });

  async function join(sp, i){ const bd = mk(sB, 'text', {x: AC[i].x + 10, y: AC[i].y - 15, class: 'badge', text: '예약'}); await fly({x: AC[i].x + 13, y: AC[i].y}, sp.abs(4, 50), {dur: 400}); pulse(sp.g); await sleep(200); bd.remove(); }
  let finish = false, left = 0, timer = false;
  async function attackAll(){
    const before = boss.hp; let sum = 0, n = 0;
    await Promise.all([0, 1, 2, 3].map(async i => {
      if (!ss.SE[i].conn || boss.hp <= 0) return;
      ch[i].g.classList.add('act'); await ss.up(i, AC[i]); ch[i].g.classList.remove('act');
      await enqueue(dsp, {label: 'P' + (i + 1), what: `P${i + 1} 공격 실행 중`, actor: AC[i], from: {x: AC[i].x, y: AC[i].y + 13}, fn: () => { let d = 55 + Math.floor(Math.random() * 40); if (finish) { d = Math.max(d, Math.ceil(boss.hp / Math.max(1, left))); left--; } boss.hit(d); sum += d; n++; }});
      [0, 1, 2, 3].forEach(k => ss.SE[k].conn && spawn(() => ss.push(k, AC[k])));
    }));
    return {before, sum, n};
  }
  function startTimer(){ if (timer) return; timer = true;
    spawn(async () => { while (timer) { await sleep(1100 * K); if (!timer) break;
      await enqueue(dsp, {tick: true, label: 'T', what: '보스 tick 실행 중', fn: () => { const i = Math.floor(Math.random() * 4), d = 20 + Math.floor(Math.random() * 30); ch[i].hurt(d);
        const l = mk(gF, 'line', {x1: 770, y1: 132, x2: ch[i].x, y2: ch[i].y, class: 'beam'}); sleep(240).then(() => l.remove(), () => l.remove()); popup(ch[i].x, ch[i].y - 20, '-' + d, 'dmg boss'); }});
      [0, 1, 2, 3].forEach(k => ss.SE[k].conn && spawn(() => ss.push(k, AC[k]))); } }); }
  const STEPS = [
    {title: '서버끼리 연결', ref: [['20장 §3.1 동작', '20-channel-messaging#31-동작'], ['30장 §2.1 RouteMesh', '30-channel-patterns#21-routemesh--연결-하나를-여러-channel이-공유한다']], line: '세션 서버, 필드 서버와 던전 서버들은 RouteMesh 하나로 이어져 있다. 서로를 channel 이름, Spot id, Actor id로 부르고, 연결은 Location Store 기록으로 자동으로 맺는다.',
     act: '서버 시작', more: ['RouteMesh: 같은 mesh에 참여한 서버끼리 연결 하나로 양쪽 모두 서로를 부른다.', '세션 서버도 mesh에 참여한다. session이 받은 packet은 이 연결로 Actor에 전달된다.', 'Spot·Actor 앞 메시지, Actor의 서버 이동, 방끼리의 소식(Logical Multicast)이 모두 이 연결로 오간다.', '서버를 늘리면 Store에 등록되고, 다른 서버가 기록을 보고 연결한다. 설정을 고치지 않는다.', '같은 이름을 맡은 서버가 여럿이면 Framework가 하나를 고른다. 자기 자신은 후보가 아니다.'],
     async run(){ for (const x of [420, 635, 820]) { await fly({x, y: 90}, store.pt, {cls: 'pkt-look', dur: 300}); }
       store.set('mesh game → node A, B, C', '');
       await Promise.all([flyPath(meshD(420, 635), {dur: 400, r: 5}), flyPath(meshD(635, 820), {dur: 400, r: 5}), flyPath(meshD(820, 420), {dur: 400, r: 5}), flyPath(meshD(226, 420), {dur: 400, r: 5})]);
       meshL.classList.add('on'); res('세션·필드·던전 서버가 RouteMesh로 이어졌다. 아래 굵은 선이 서버끼리의 연결이다.'); }},
    {title: '접속', ref: [['24장 §1 Actor와 session을 묶는 역할', '24-actor-session#1-actor와-session을-묶는-역할'], ['24장 §3.1 묶기', '24-actor-session#31-묶기']], line: '플레이어 4명이 접속한다. 연결마다 session이 생기고, 각자의 Actor가 Entry Spot에 만들어져 session에 묶인다.',
     act: '4명 접속', more: ['client 연결 하나에 session 하나가 생긴다(STREAM).', 'Actor 생성은 Entry Spot의 <code>on_create_actor</code>가 승인한다.', 'session을 Actor에 묶으면, session이 처리하지 않는 packet은 그 Actor로 간다.', 'Entry Spot은 아직 마을이나 방에 들어가지 않은 Actor가 있는 곳이다. Actor끼리 공유하는 상태를 두지 않는다.'],
     async run(){
       await Promise.all([0, 1, 2, 3].map(async i => { await sleep(i * 300);

    {title: '각자 준비', ref: [['22장 §2.2 Entry Spot 작성', '22-actor#22-entry-spot-작성']], line: '4명이 동시에 장비를 바꾼다. Entry Spot에서는 Actor마다 따로 실행되므로 네 요청이 동시에 처리된다.',
     act: '4명 동시에 장비 변경', repeat: true, more: ['Entry Spot은 Actor마다 따로 순서를 지킨다. 서로 다른 Actor는 동시에 실행된다.', '각자 자기 상태만 바꾸는 일이라 서로 기다릴 이유가 없다.'],
     async run(){ await Promise.all([0, 1, 2, 3].map(async i => { await ss.up(i, AC[i]); AC[i].g.classList.add('run'); await sleep(200 * K); AC[i].g.classList.remove('run'); })); res('네 Actor가 <b>동시에</b> 실행됐다(초록 테두리가 한꺼번에 켜졌다).'); }},
    {title: '마을 입장', ref: [['21장 §1 Spot의 역할', '21-spot#1-spot의-역할']], line: '4명이 마을 town-1에 들어간다. 마을은 여럿이 함께 쓰는 자리라 User Spot이고, 들어가면 서로가 보인다.',
     act: '마을 입장', more: ['입장은 <code>join</code>으로 한다. 지금 handler가 끝난 뒤 실행되도록 예약한다(<code>defer</code>).', '마을의 <code>on_actor_join</code>이 승인하면 위치 기록과 소속이 한 번에 바뀐다.', '같은 node 안의 이동이라 Actor가 서버를 옮기지 않는다.'],
     async run(){ [0, 1, 2, 3].forEach(i => spawn(() => join(town, i))); await sleep(200 * K); await moveActors(SLOT_T, TOWN); store.set('P1 ~ P4 → node A · town-1', null); res('4명이 town-1에 들어갔다. 이제 마을에서 일어난 일은 마을의 모든 사람에게 전달된다.'); }},
    {title: '마을에서 이동', ref: [['21장 §1 Spot의 역할', '21-spot#1-spot의-역할'], ['24장 §3.3 Actor가 그 연결로 보내기', '24-actor-session#33-actor가-그-연결로-보내기']], line: '한 명이 움직이면 마을이 그 위치를 모든 사람에게 보낸다. 그래서 다른 유저가 화면에 보인다.',
     act: '4명 이동', repeat: true, more: ['마을(SpotWide)은 gate 하나로 이동 요청을 차례로 처리한다.', '처리한 결과를 마을의 모든 사람에게 push한다. 각 client는 그 push로 다른 유저를 그린다.', '마을 사람이 수백 명이면 여러 마을(채널)로 나눈다. 마을마다 Spot 하나다.'],
     async run(){ await Promise.all([0, 1, 2, 3].map(async i => { await sleep(i * 150); await ss.up(i, AC[i]);
       await enqueue(town, {label: 'P' + (i + 1), what: `P${i + 1} 이동 실행 중`, actor: AC[i], from: {x: AC[i].x, y: AC[i].y + 13}});
       ch[i].walk(165 + Math.random() * 215, 80 + Math.random() * 110, 700);
       await Promise.all([0, 1, 2, 3].map(k => ss.SE[k].conn ? ss.push(k, AC[k]).then(() => { if (k !== i) seen(ch[k]); }) : null)); }));
       res('이동 4건이 마을에서 차례로 처리되고, 매번 <b>모든 client</b>에 전달됐다(초록 고리 = 다른 사람의 화면에 보임).'); }},
    {title: '던전 만들기', ref: [['20장 §3.7 Spot·Actor 호출하기', '20-channel-messaging#37-spotactor-호출하기'], ['21장 §4.1 만들기', '21-spot#41-만들기']], line: 'P1이 던전을 만든다. 어느 서버에 만들지는 Framework가 고르고, 돌려받은 id dungeon-7이 이후의 주소가 된다.',
     act: 'P1: 던전 만들기', more: ['같은 id가 두 곳에 생기지 않도록 Location Store가 생성 권한을 조정한다.', '던전의 <code>on_create</code>가 거절하면 호출은 실패하고 던전은 남지 않는다.'],
     async run(){ await ss.up(0, AC[0]); AC[0].g.classList.add('run');
       await fly({x: AC[0].x, y: AC[0].y - 13}, store.pt, {cls: 'pkt-look'}); store.set(null, 'dungeon-7 → 생성 예약');

       dsp.g.classList.remove('gone'); dsp.g.classList.add('holding'); res('node B: <code>on_create</code>로 받아들일지 묻는 중'); await sleep(260 * K);
       dsp.g.classList.remove('holding'); pulse(dsp.g); AC[0].g.classList.remove('run');
       store.set(null, 'dungeon-7 → node B'); dngG.classList.remove('locked'); dngSub.textContent = 'dungeon-7 · 파티원만 들어간다';
       res('dungeon-7이 node B에 생겼다. 만들 서버는 Framework가 골랐다.'); }},
    {title: '파티 입장', ref: [['22장 §1 Actor는 언제나 어떤 Spot에 속한다', '22-actor#1-actor는-언제나-어떤-spot에-속한다'], ['20장 §3.7 Spot·Actor 호출하기', '20-channel-messaging#37-spotactor-호출하기']], line: '4명이 dungeon-7에 들어간다. 던전이 다른 서버에 있으므로, 각 Actor가 상태를 가진 채 그 서버로 옮겨 간다.',
     act: '파티 입장', more: ['받는 던전의 <code>on_actor_join</code>이 승인하면, Actor가 상태와 대기 중인 작업을 가지고 node B로 옮겨 간다.', '옮겨 가는 동안 온 message는 기다렸다가 순서대로 실행된다.', 'session 경로는 Framework가 새 위치로 바꾼다. client는 다시 접속하지 않는다.'],
     async run(){ await flyPath(meshD(420, 635), {dur: 500, r: 7, label: 'join 요청 · RouteMesh'}); pulse(dsp.g); await flyPath(meshD(635, 420), {cls: 'pkt-push', dur: 500, r: 6, label: '승인'});
       await flyPath(meshD(420, 635), {cls: 'pkt-state', dur: 600, r: 9, label: 'Actor 4명의 상태'});
       await moveActors(SLOT_D, DNG, 260); store.set('P1 ~ P4 → node B · dungeon-7', null); res('Actor 상태가 RouteMesh 연결로 node B에 갔다. client 연결은 그대로이고, 점선(묶음)만 새 위치를 가리킨다.'); }},
    {title: '보스 동시 공격', ref: [['32장 §3 SpotWide', '32-execution-model#3-spotwide--gate-하나를-지나는-실행']], line: '4명이 동시에 보스를 공격한다. 요청은 dungeon-7에서 한 줄로 처리되므로, lock 없이 보스 HP가 정확히 공격 합계만큼 준다.',
     act: '4명 동시 공격', repeat: true, more: ['던전(SpotWide)은 gate 하나로 방 전체를 한 번에 하나씩 실행한다.', '그래서 보스 HP와 파티 상태를 lock 없이 평범한 코드로 고친다.', 'Actor 앞 message는 Actor마다 queue에 들어가지만, 실행 권한(gate)은 하나다.'],
     async run(){ const r = await attackAll(); res(`${r.n}건이 한 줄로 처리됐다. 공격 합계 ${r.sum} → 보스 HP ${r.before} → <b>${boss.hp}</b>. 사용한 lock 0.`); }},
    {title: '보스 반격 (timer)', ref: [['32장 §3 SpotWide', '32-execution-model#3-spotwide--gate-하나를-지나는-실행']], line: '보스가 주기적으로 반격한다. timer tick도 같은 줄에 들어가서, 플레이어 공격과 섞이지 않고 차례로 실행된다.',
     act: '보스 timer 시작', more: ['timer는 던전(Spot)에 등록한다. tick은 그 Spot의 queue에서 실행된다(주황 T).', 'tick이 밀리면 버릴지·따라잡을지를 overrun 정책으로 고른다.', '무거운 계산은 worker로 넘겨 줄을 막지 않는다.'],
     extra: ['공격하며 지켜보기', async () => { const r = await attackAll(); res(`공격 ${r.n}건과 보스 tick이 한 줄에 섞여 차례로 실행된다. 보스 HP ${boss.hp}.`); }],
     async run(){ startTimer(); res('보스 timer가 돌기 시작했다. queue의 주황 T가 tick이다. "공격하며 지켜보기"를 눌러 보라.'); }},
    {title: '연결 끊김·재접속', ref: [['24장 §6 연결이 끊긴 뒤', '24-actor-session#6-연결이-끊긴-뒤--session은-끝나고-actor는-남는다']], line: 'P3의 연결이 끊긴다. P3의 Actor는 던전에 남아 전투가 계속되고, 다시 접속하면 같은 P3에 묶인다.',
     act: 'P3 연결 끊기', toggle: true, more: ['연결이 끊기면 묶여 있던 Actor에 끊김이 통지된다(<code>on_disconnect_actor</code>).', '끊김은 Actor를 지우거나 던전에서 빼지 않는다.', 'Actor는 session 하나에만 묶인다. 다른 기기로 접속하면 이전 묶음은 무효가 된다.'],
     async run(btn){ const i = 2;
       if (ss.SE[i].conn) { ss.close(i); redraw(); AC[i].g.classList.add('disc'); ch[i].g.classList.add('off');
         await flyPath(ss.routeTo(i, AC[i]), {cls: 'pkt-look', dur: 460}); pulse(dsp.g); btn.textContent = 'P3 다시 접속';
         res('P3의 session이 끝났다. Actor P3는 던전에 남아 있고, 보스전은 계속된다(게임 화면의 P3는 흐리게 표시).'); return false; }
       ss.open(i); await fly(ss.SE[i].R, store.pt, {cls: 'pkt-look', dur: 400}); await fly(store.pt, ss.SE[i].R, {cls: 'pkt-look', dur: 400});
       redraw(); AC[i].g.classList.remove('disc'); ch[i].g.classList.remove('off'); pulse(dsp.g); btn.textContent = 'P3 연결 끊기';
       res(`새 session #${ss.SE[i].id}이 node B의 P3에 묶였다. 체력과 위치가 그대로다.`); return true; }},
    {title: '방끼리 소식 (Logical Multicast)', ref: [['30장 §5.1 Logical Multicast', '30-channel-patterns#51-logical-multicast--mesh-위의-spot-사이-이벤트']], line: '보스를 쓰러뜨리면 dungeon-7이 raid-news로 소식을 보낸다. 서버마다 RouteMesh로 한 번만 보내고, 받은 서버가 그 topic을 구독한 Spot(town-1)에 나눠 준다.',

  let guild = null, gen7 = 0, where = null; const cache = [false, false, false];
  function makeGuild(node){ const x = node === 'G1' ? 510 : 710; const sp = qspot(x, 112, 170, node === 'G1' ? 210 : 120, 'guild-7', 'Instance Spot', node === 'G1' ? {lane: 80, exec: 116, order: 164} : {lane: 40, exec: 76}); startProc(sp); return sp; }
  function from(k){ return {x: 226, y: 110 + k * 90}; }
  async function contribute(k, amount, opts = {}){
    if (!cache[k] || !guild) {
      await fly(DS[k].T(), store.pt, {cls: 'pkt-look', dur: 380});
      if (!guild) { res('Store에 guild-7이 없다. 생성 권한을 예약하고, 만들 서버를 고른다(cold activation).'); store.set('guild-7 → 준비 중', null);
        where = gen7 === 0 ? 'G1' : 'G2'; await fly(store.pt, (where === 'G1' ? G1 : G2).T(), {cls: 'pkt-look', dur: 380});

      await fly(store.pt, DS[k].T(), {cls: 'pkt-look', dur: 380}); cache[k] = true;
    }

    return enqueue(guild, {label: 'D' + 'BCD'[k], what: opts.what || `던전 서버 ${'BCD'[k]} 기여 +${amount}`, from: from(k), dur: opts.dur, fn: () => { addXp(amount); glogAdd(`파티 ${k + 1} 기여 +${amount}`); if (opts.fn) opts.fn(); }});
  }
  const STEPS = [
    {title: '첫 요청으로 깨우기', ref: [['21장 §6 Spot의 다른 종류', '21-spot#6-spot의-다른-종류']], line: '파티 1이 보스를 잡고 길드에 기여한다. guild-7은 아직 없지만, 첫 요청이 오면 Framework가 만들고 그 요청을 바로 처리한다.',
     act: '파티 1 기여', more: ['Instance Spot에는 만드는 호출이 따로 없다. 첫 메시지에 instance type을 적으면 된다.', '만들 서버는 Framework가 고르고, Store가 같은 id를 두 곳에 만들지 않게 막는다.', '호출하는 쪽은 "만들기"와 "보내기"를 나누지 않는다.'],
     async run(){ await contribute(0, 120); res('guild-7이 만들어지고 <b>그 같은 요청</b>을 처리했다. 길드 경험치 +120.'); }},
    {title: '여러 서버가 동시에', ref: [['32장 §3 SpotWide', '32-execution-model#3-spotwide--gate-하나를-지나는-실행']], line: '세 던전 서버가 동시에 같은 길드에 기여한다. guild-7이 한 줄로 처리하므로 분산 락 없이 합계가 정확하다.',

    {title: '기다리는 동안 양보', ref: [['32장 §2 직렬화 범위를 정하는 것', '32-execution-model#2-직렬화-범위를-정하는-것']], line: '길드가 랭킹을 외부 DB에 저장한다. Yield로 기다리면 그동안 다른 기여가 먼저 실행되고, 저장이 끝나면 새 차례로 이어서 실행된다.',
     act: '랭킹 저장 + 동시 기여', more: ['<code>Yield</code>는 기다리는 동안 실행 권한을 반납한다. 결과가 오면 queue 끝에 새 차례로 들어간다.', '<code>Async</code>로 기다리면 실행 권한을 쥔 채 기다려서 다른 요청이 모두 멈춘다.', '재개한 뒤에는 그사이 바뀐 상태를 다시 확인한다.'],
     async run(){

         await fly(guild.abs(guild.w, 130), DB.L(), {cls: 'pkt-look', dur: 500}); pulse(DB.g); await sleep(400 * K); await fly(DB.L(), guild.abs(guild.w, 130), {cls: 'pkt-push', dur: 500});
         await enqueue(guild, {label: 'R', what: '저장 결과로 재개 · 새 차례', fn: () => glogAdd('랭킹 저장 완료 (재개한 차례)')}); res('저장 결과가 와서 <b>queue 끝의 새 차례(R)</b>로 이어서 실행됐다. 그사이 다른 기여가 먼저 끝났다.'); resumed(); }); }});
       await sleep(500 * K); await Promise.all([contribute(1, 90), contribute(2, 110)]); await p; await resumeDone; }},
    {title: '쉬면 닫고 다시 깨우기', ref: [['21장 §6 Spot의 다른 종류', '21-spot#6-spot의-다른-종류']], line: '한동안 요청이 없으면 길드가 스스로 닫는다. 다음 요청이 오면 새로 깨어나고, 이번에는 다른 서버에서 깨어날 수도 있다.',
     act: '길드 닫기', extra: ['파티 2 기여', async () => { await contribute(1, 150); res(`guild-7이 다시 깨어나 요청을 처리했다(gen ${gen7}). 호출하는 쪽은 아무것도 바꾸지 않았다.`); }],

     async run(){ guild.g.classList.add('holding'); res('guild-7: <code>on_closing</code>'); await sleep(260 * K); guild.g.remove(); guild = null; cache.fill(false); store.set('guild-7 → 없음', null); gSub.textContent = '닫힘 · 다음 요청에 다시 깨어난다'; res('guild-7이 닫혔다. "파티 2 기여"를 눌러 다시 깨워 보라.'); }},
  ];

  [0, 1, 2, 3].forEach(i => ss.open(i)); sync();
  store.set('dungeon-7 → node B', 'P1 ~ P4 → node B · dungeon-7');
  let fighting = false, sent = 0, done = 0;

  const relayLine = mk(sB, 'path', {d: relayD(), class: 'link relay', opacity: 0});

  let relayN = 0;
  const upd = () => { const lost = sent - done - dsp.q.length - (dsp.running ? 1 : 0) - inflight; cnt.textContent = `보냄 ${sent} · 처리 ${done} · 유실 ${Math.max(0, lost)}`; };
  let inflight = 0;

    await enqueue(dsp, {label: 'P' + (i + 1), what: `P${i + 1} 공격 실행 중`, actor: AC[i], from: {x: AC[i].x, y: AC[i].y + 13}, onQueued: () => { inflight--; upd(); }, fn: () => { boss.hit(40 + Math.floor(Math.random() * 30)); done++; upd(); }});
    [0, 1, 2, 3].forEach(k => spawn(() => ss.push(k, AC[k]))); }
  function fight(){ if (fighting) return; fighting = true; spawn(async () => { let i = 0; while (fighting) { spawn(() => attack(i % 4)); i++; await sleep(620 * K); } }); }
  let target = 'C';
  const STEPS = [
    {title: '전투 중', ref: [['37장 §1 옮겨도 그대로 남는 것', '37-relocation#1-옮겨도-그대로-남는-것']], line: '던전 서버 B에서 파티가 보스와 싸우고 있다. 공격 요청이 계속 dungeon-7로 들어온다.',

     async run(){ C.g.classList.add('hot'); cFree.textContent = '받을 준비'; banner('점검: dungeon-7을 옮기는 중 · 전투는 계속'); res('옮길 곳: node C.'); }},
    {title: '멈추고 보류', ref: [['37장 §5 절차와 되돌릴 수 있는 지점', '37-relocation#5-절차와-되돌릴-수-있는-지점']], line: 'B는 지금 실행 중인 것만 끝내고 새 실행을 멈춘다. 메시지는 계속 받아 queue에 보류한다(주황).',

    const snd = box(16, y0 + 26, 150, 112, '', '필드 서버들', '보내는 쪽');
    const pill = mk(sB, 'g', {class: 'bp-pill go'}); mk(pill, 'rect', {x: 26, y: y0 + 78, width: 130, height: 30, rx: 15}); const pillT = mk(pill, 'text', {x: 91, y: y0 + 98, text: '▶ 전송 중'});
    const sentT = mk(sB, 'text', {x: 26, y: y0 + 128, class: 't-mono', text: '보냄 0'});

    const cells = []; for (let k = 0; k < cap; k++) cells.push(mk(sB, 'rect', {x: qx + k * cw + 1, y: qy, width: cw - 2, height: qh, rx: 2, class: 'bp-cell'}));

      mk(sB, 'line', {x1: qx + qw, x2: qx + qw, y1: qy - 6, y2: qy + qh + 6, class: 'bp-mark'}); mk(sB, 'text', {x: qx + qw, y: qy + qh + 20, class: 'bp-mark-t', 'text-anchor': 'end', text: '가득 → 멈춘다'});
    } else { mk(sB, 'line', {x1: qx + qw, x2: qx + qw, y1: qy - 6, y2: qy + qh + 6, class: 'bp-mark bad'}); mk(sB, 'text', {x: qx + qw, y: qy + qh + 20, class: 'bp-mark-t bad', 'text-anchor': 'end', text: '메모리 한계'}); }
    const L = {doneT, lostT, bounded, cap, q: 0, inflight: 0, sent: 0, done: 0, lost: 0, paused: false, dead: false, stops: 0, y0, snd, rcv, pill, pillT, qx, cw, qy, qh,
      render(){ cells.forEach((c, k) => c.setAttribute('class', 'bp-cell' + (k < L.q ? (L.q >= cap * .9 ? ' hi' : ' on') : ''))); sentT.textContent = `보냄 ${L.sent}`; doneT.textContent = L.downed ? '서버 다운' : `처리 ${L.done}`; if (L.onRender) L.onRender(); lostT.textContent = `유실 ${L.lost}`; lostT.setAttribute('class', 't-count' + (L.lost ? ' bad' : '')); },

  }
  const L1 = lane(6, false), L2 = lane(186, true);

    for (let k = 0; k < 14; k++) { const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90; const p = mk(sF, 'circle', {cx, cy, r: 4, class: 'spark'}); tween(800, e => { p.setAttribute('cx', cx + Math.cos(a) * d * e); p.setAttribute('cy', cy + Math.sin(a) * d * e); p.setAttribute('opacity', 1 - e); }).catch(() => {}).finally(() => p.remove()); }
    mk(sB, 'text', {x: L.rcv.x - 34, y: L.y0 + 64, class: 'boom-t', 'text-anchor': 'middle', text: '펑!'});
    L.doneT.setAttribute('class', 'boom-s'); L.downed = true;
    srv.classList.remove('shake'); void srv.getBBox(); srv.classList.add('shake');
    const gx = W.cx, gy = W.cy; const ov = mk(gG, 'rect', {x: W.x, y: 14, width: 428, height: 208, rx: 14, fill: '#000', opacity: 0}); tween(500, e => ov.setAttribute('opacity', .55 * e)).catch(() => {});
    for (let k = 0; k < 3; k++) { const c = mk(gF, 'circle', {cx: gx, cy: gy, r: 4, class: 'boom' + (k ? ' b' + k : '')}); tween(800 + k * 250, e => { c.setAttribute('r', 6 + e * (110 + k * 30)); c.setAttribute('opacity', 1 - e); }).catch(() => {}).finally(() => c.remove()); }
    mk(gG, 'text', {x: gx, y: gy + 8, class: 'boom-t big', 'text-anchor': 'middle', text: '서버 다운'});
    L.onRender = () => { W.st.textContent = `메모리 초과로 서버가 죽었다 · 유실 ${L.lost}`; }; L.render(); W.st.setAttribute('class', 'bp-world bad');
    game.classList.remove('shake'); void game.getBBox(); game.classList.add('shake');
  }
  function run(L, W){

    spawn(async () => { for (;;) {

     act: '버스트 시작', more: [
       '받는 쪽 queue에는 상한(HWM)이 있다. 가득 차면 Core가 그 상대로 보내기를 멈춘다. 그동안 <code>send</code>는 자리가 날 때까지 기다린다.',

     act: '구독 보기', more: ['zone은 2×2이고 각 zone은 id를 가진 User Spot이다(zone-nw, zone-ne, zone-sw, zone-se). Zone 서버 두 대가 둘씩 맡는다.', 'Spot이 시작할 때 구독을 등록한다. 칩의 <code>border.ne→nw</code>는 topic <code>zone.border.zone-ne.zone-nw</code>를 줄여 쓴 것이다.', '발행하는 쪽은 구독자 목록을 모른다. 같은 topic을 구독한 Spot이 받는다.', 'topic은 mesh 위의 논리 구분이다. border topic 패킷은 Zone 서버 사이의 mesh 연결 하나 위로 지나가고, topic이 늘어도 연결은 늘지 않는다.'],
     async run(){ for (const z of ZN) { zr[z].classList.add('hot'); pulse(SP[z].g); Object.values(SP[z].chip).forEach(c => c.classList.add('hot')); await sleep(450 * K); zr[z].classList.remove('hot'); clearHot(); }
       note('zone마다 나머지 세 zone의 topic을 구독'); res('각 zone이 구독한 topic은 3개이고, 모두 다른 zone에서 온다. 구독은 새 연결을 만들지 않는다.'); }},
    {title: '경계 가까이', ref: [['30장 §5.3 Topic', '30-channel-patterns#53-topic--두-형태-모두-수신-대상을-고른다'], ['56장 §7 zone tick', '56-zoneworld#7-zone-tick--push와-경계-snapshot']], line: 'P1이 zone-nw 안에서 동쪽 경계 band로 들어서면 zone-nw가 위치를 topic으로 발행한다. 동쪽 경계에서는 zone-ne만 받는다.',
     act: 'P1 동쪽 경계로 이동', repeat: true, more: ['발행하는 쪽은 받을 Spot이나 node를 지정하지 않는다. topic <code>zone.border.zone-nw.zone-ne</code>로 발행할 뿐이다.', 'Logical Multicast는 별도 PUB/SUB 소켓 없이 이미 연결된 mesh를 쓴다. Fanout(classic)과 달리 받는 대상이 그 topic을 구독한 Spot이다.', 'band는 경계에서 10칸 폭이다. band 안에서 player가 움직이면 zone Spot이 그 위치를 발행한다.'],
     async run(){ await to(240, 64); await publish(['ne']); note('zone-ne 화면에 P1 ghost가 나타남'); res('zone-nw가 한 topic으로 발행했고 zone-ne만 받았다. zone-sw와 zone-se는 받지 않았다. zone-ne 유저 화면에 P1 ghost가 나타났다.'); }},
    {title: '모서리', ref: [['30장 §5.3 Topic', '30-channel-patterns#53-topic--두-형태-모두-수신-대상을-고른다']], line: 'P1이 네 zone이 만나는 중앙 모서리로 간다. ne, sw, se 세 topic으로 위치를 발행하고, 세 zone이 모두 받는다.',
     act: 'P1 모서리로 이동', extra: ['모서리에서 움직이기', async () => { for (const [x, y] of [[238, 104], [254, 114], [246, 106]]) { await p1.walk(x, y, 250 * K); await publish(['ne', 'sw', 'se']); } note('P1이 움직일 때마다 세 zone의 ghost가 따라감'); res('P1이 band 안에서 움직일 때마다 세 topic으로 위치를 발행했다. 세 zone의 ghost가 따라 움직였다.'); }],
     more: ['모서리는 네 zone의 band가 겹친 곳이라 나머지 세 zone이 모두 이 위치를 받는다.', 'zone-sw는 같은 Zone 서버 안이라 node 안에서 전달되고, zone-ne와 zone-se는 서버 사이의 mesh를 건너간다. 발행하는 코드는 같다.'],

/* ---------- groups and steps ---------- */
const GROUPS = [['clientserver', 'ClientServer', gClientServer], ['fanout', 'Fanout', gFanout], ['meshchannel', 'RouteMesh channel', gMeshChannel], ['lobby', '로비와 던전 · RouteMesh', gLobby], ['meshpubsub', 'RouteMesh pub/sub', gMeshPubSub], ['instance', 'Instance Spot', gInstance], ['relocate', 'Host Relocation', gRelocate], ['backpressure', 'Backpressure', gBack]];
let STEPS = [], cur = 0, done = new Set(), curKey = 'clientserver';
function renderSteps(){
  $('steps').replaceChildren();
  STEPS.forEach((s, k) => { const li = document.createElement('li'); li.className = (k === cur ? 'cur' : '') + (done.has(k) && k !== cur ? ' done' : ''); if (k === cur) li.setAttribute('aria-current', 'step');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = done.has(k) && k !== cur ? '✓' : k + 1; li.append(n, document.createTextNode(s.title)); $('steps').append(li); });
}
/* guide links: the base follows the guide page that embeds the tour, else the site's language selector, else dotnet */
const GUIDE_LOCALE = '/ko', SRC_LABEL = '근거';
function guideBase(){
  try { const m = window.parent.location.pathname.match(/^((?:\/ko)?\/(?:cpp|dotnet|java|kotlin|node)\/guide\/server\/)/); if (m) return m[1]; } catch (_) {}
  let lang = 'dotnet'; try { const v = localStorage.getItem('zlink-lang'); if (['cpp', 'dotnet', 'java', 'kotlin', 'node'].includes(v)) lang = v; } catch (_) {}
  return `${GUIDE_LOCALE}/${lang}/guide/server/`;
}
function guideLinks(refs){
  const base = guideBase();
  return refs.map(([text, ref]) => { if (!ref) return text; const [slug, anchor] = ref.split('#'); return `<a href="${base}${slug}/${anchor ? '#' + anchor : ''}" target="_top">${text}</a>`; }).join(' · ');
}
function show(k){
  cur = k; const s = STEPS[k]; renderSteps();
  $('stepNo').textContent = `단계 ${k + 1} / ${STEPS.length}`; $('line').textContent = s.line; res('');
  $('src').innerHTML = s.ref ? `${SRC_LABEL}: ${guideLinks(s.ref)}` : '';
  $('more').innerHTML = s.more.map(m => `<li>${m}</li>`).join('');
  const acts = $('acts'); acts.replaceChildren();
  const b = document.createElement('button'); b.type = 'button'; b.className = 'act primary'; b.textContent = s.act; acts.append(b);
  /* "next" opens once the main action ran (toggle steps: ended in the restored state) and, when there is an extra action, after it ran once */
  let mainOk = false, extraOk = !s.extra;
  const nx = document.createElement('button'); nx.type = 'button'; nx.className = 'act next'; nx.textContent = k === STEPS.length - 1 ? '처음부터 ↺' : '다음 단계 →'; nx.disabled = true;
  const syncNext = () => { nx.disabled = !(mainOk && extraOk); };
  let ex = null; if (s.extra) { ex = document.createElement('button'); ex.type = 'button'; ex.className = 'act'; ex.textContent = s.extra[0]; ex.disabled = true; acts.append(ex); ex.addEventListener('click', () => { ex.disabled = true; nx.disabled = true; spawn(async () => { await s.extra[1](); ex.disabled = false; extraOk = true; syncNext(); }); }); }
  acts.append(nx);
  nx.addEventListener('click', () => { if (k === STEPS.length - 1) openGroup(curKey); else show(k + 1); });
  b.addEventListener('click', () => { b.disabled = true; nx.disabled = true; spawn(async () => { const r = await s.run(b); done.add(k); if (s.repeat || s.toggle) b.disabled = false; if (ex) ex.disabled = false; mainOk = s.toggle ? r === true : true; syncNext(); renderSteps(); }); });
}
function openGroup(key){
  gen++; curKey = key; const g = GROUPS.find(x => x[0] === key) || GROUPS[1];
  const r = g[2](); STEPS = r.steps; done = new Set();
  $('gtitle').textContent = r.title; $('foot').innerHTML = `브라우저 안의 시뮬레이션이다. 시간과 수치는 시연용이다. 동작 설명은 zlink.systems 서버 가이드(${guideLinks(r.foot)})를 따른다.`;
  document.querySelectorAll('#groups button').forEach(b => b.setAttribute('aria-current', String(b.dataset.key === key)));
  try { history.replaceState(null, '', '#' + key); } catch (_) {}
  show(0);
}
GROUPS.forEach(([key, name]) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.key = key; b.textContent = name; b.addEventListener('click', () => openGroup(key)); $('groups').append(b); });
$('speedRange').addEventListener('input', e => { const v = +e.target.value; K = 3.5 / v; $('speedVal').textContent = v.toFixed(2).replace(/0$/, '') + '×'; });
let start = 'clientserver'; try { const h = (location.hash || '').slice(1); if (GROUPS.some(g => g[0] === h)) start = h; } catch (_) {}
openGroup(start);
})();
