<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZLink 둘러보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* 사이트(Material) 안의 iframe으로 열리면 사이트의 밝은/어두운 테마를 따른다. 단독으로 열면 OS 설정을 따른다. */
(function () {
  try {
    if (window.parent === window) return;
    var pd = window.parent.document;
    var apply = function () {
      var scheme = pd.body && pd.body.getAttribute('data-md-color-scheme');
      if (scheme) document.documentElement.setAttribute('data-theme', scheme === 'slate' ? 'dark' : 'light');
    };
    apply();
    new MutationObserver(apply).observe(pd.body, {attributes: true, attributeFilter: ['data-md-color-scheme']});
  } catch (e) { /* 다른 출처에서 열리면 OS 설정을 따른다 */ }
})();
</script>
<style>
:root{
  --bg:#F2F5F4; --panel:#FFFFFF; --ink:#14211F; --ink-2:#34423F; --muted:#5B6B68; --line:#C9D4D1;
  --accent:#0E8175; --accent-ink:#0A5F56; --accent-soft:#D6EDE9; --on-accent:#FFFFFF;
  --hold:#C4761A; --hold-soft:#F6E5CB; --look:#6C7C95;
  --node-fill:#FAFCFB; --spot-fill:#E8F3F1; --store-fill:#EEF0F5;
  --select:#ECEAF3; --select-line:#C6C0D8; --village:#E7EFDF; --village-line:#B9CCA8; --dungeon:#2A2530; --dungeon-line:#4A4052; --dungeon-ink:#EDE6F2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1413; --panel:#121D1C; --ink:#E3ECEA; --ink-2:#C2CFCC; --muted:#92A5A1; --line:#2B3B39;
    --accent:#35C2AF; --accent-ink:#7FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
    --hold:#E9A23F; --hold-soft:#3A2A12; --look:#9AA8C2;
    --node-fill:#101A19; --spot-fill:#14302C; --store-fill:#161C27;
    --select:#1E1C27; --select-line:#3B3650; --village:#1B2A1E; --village-line:#34503A; --dungeon:#1D1822; --dungeon-line:#3E3448; --dungeon-ink:#E4DCEB;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1413; --panel:#121D1C; --ink:#E3ECEA; --ink-2:#C2CFCC; --muted:#92A5A1; --line:#2B3B39;
  --accent:#35C2AF; --accent-ink:#7FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
  --hold:#E9A23F; --hold-soft:#3A2A12; --look:#9AA8C2;
  --node-fill:#101A19; --spot-fill:#14302C; --store-fill:#161C27;
  --select:#1E1C27; --select-line:#3B3650; --village:#1B2A1E; --village-line:#34503A; --dungeon:#1D1822; --dungeon-line:#3E3448; --dungeon-ink:#E4DCEB;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:22px 44px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
header h1{margin:0;font-size:clamp(21px,2.8vw,28px);letter-spacing:-.01em}
header .eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block}
nav.groups{display:flex;flex-wrap:wrap;gap:6px}
nav.groups button{font:500 13.5px var(--sans);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer}
nav.groups button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav.groups button:disabled{cursor:default;opacity:.5}
nav.groups button small{font-size:11px;margin-left:4px}
.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
@media (max-width:900px){.side{position:static}}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
@media (max-width:900px){ol.steps{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
ol.steps li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--muted);font-size:14px;white-space:nowrap}
ol.steps .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);border:1.5px solid var(--line);background:var(--panel)}
ol.steps li.done{color:var(--ink-2)}
ol.steps li.done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
ol.steps li.cur{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--accent)}
ol.steps li.cur .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.speed{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px}
.speed b{font:600 12.5px var(--mono);color:var(--ink)}
#speedRange{width:100%;accent-color:var(--accent)}
@media (max-width:900px){#speedRange{max-width:320px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:500 12.5px var(--sans);color:var(--ink-2);background:transparent;border:0;padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.view{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.view svg{display:block;width:100%;min-width:680px;height:auto}
.vlabel{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 -4px 2px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bar .t{font:600 12px var(--mono);color:var(--accent);letter-spacing:.06em}
.bar .line{margin:0;font-size:16.5px;font-weight:500;line-height:1.5;text-wrap:pretty}
.bar .res{margin:0;font-size:14px;color:var(--accent-ink);min-height:21px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.act{font:600 14.5px var(--sans);border-radius:9px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.next{margin-left:auto}
.act:disabled{opacity:.4;cursor:default}
.act:focus-visible,nav.groups button:focus-visible,summary:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{font-size:13.5px;color:var(--ink-2)}
summary{cursor:pointer;color:var(--muted);font-size:13px}
details ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
details code{font:12.5px var(--mono);color:var(--accent-ink)}
.foot{font-size:12.5px;color:var(--muted)}
/* svg */
svg text{font-family:var(--sans)}
.zone-sel{fill:var(--select);stroke:var(--select-line)}
.village{fill:var(--village);stroke:var(--village-line)}
.house{fill:var(--panel);stroke:var(--village-line)}
.dungeon{fill:var(--dungeon);stroke:var(--dungeon-line)}
.dng{transition:opacity .6s}
.dng.locked{opacity:.28}
.g-title{font-weight:700;font-size:14px;fill:var(--ink)}
.g-title.d{fill:var(--dungeon-ink)}
.g-sub{font-size:11.5px;fill:var(--muted)}
.g-sub.d{fill:#A99BB6}
.boss>circle{fill:#6B2E3A;stroke:#C7667A;stroke-width:3}
.boss.hit>circle{animation:hit .25s ease}
@keyframes hit{50%{fill:#A8404F}}
.hp-bg{fill:#3B3342}
.hp{fill:#E0576B}
.hp.party{fill:#4FB985}
.hp-t{font:600 11.5px var(--mono);fill:var(--dungeon-ink)}
.ch>circle.body{stroke:#fff;stroke-width:2}
.ch>text{font:700 11px var(--mono);fill:#fff;text-anchor:middle;dominant-baseline:central}
.ch.off{opacity:.3}
.ch.act>circle.body{stroke:#F7D774;stroke-width:3.5}
.ch .seen{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.ch.seen .seen{animation:seen .9s ease}
@keyframes seen{0%{opacity:1;r:16}100%{opacity:0;r:30}}
.dmg{font:700 15px var(--mono);fill:#FFD66B;text-anchor:middle}
.dmg.boss{fill:#FF8A7A}
.beam{stroke:#FF8A7A;stroke-width:2.5}
.box>rect{fill:var(--node-fill);stroke:var(--line);stroke-width:1.2}
.box.store>rect{fill:var(--store-fill);stroke:var(--look)}
.grp-field{fill:var(--village);stroke:var(--village-line);stroke-dasharray:5 4}
.grp-dng{fill:var(--hold-soft);fill-opacity:.45;stroke:var(--dungeon-line);stroke-dasharray:5 4}
.box.gw>rect{fill:var(--panel);stroke:var(--ink-2)}
.box.pulse>rect{animation:pulse .7s ease}
@keyframes pulse{0%{stroke:var(--accent);stroke-width:3.5}100%{stroke-width:1.2}}
.t-title{font-weight:600;font-size:13.5px;fill:var(--ink)}
.t-sub{font-size:11.5px;fill:var(--muted)}
.t-mono{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.t-store{font-family:var(--mono);font-size:12px;fill:var(--ink-2)}
.spot>rect.bg{fill:var(--spot-fill);stroke:var(--accent);stroke-width:1.5}
.spot.holding>rect.bg{stroke:var(--hold);stroke-dasharray:6 4;fill:var(--hold-soft)}
.spot.gone{opacity:0;transition:opacity .6s}
.spot.pulse>rect.bg{animation:pulse .7s ease}
.t-spot{font-family:var(--mono);font-weight:600;font-size:12px;fill:var(--accent-ink)}
.gate>rect{fill:var(--hold-soft);stroke:var(--hold)}
.gate>text{font-family:var(--mono);font-size:10.5px;fill:var(--hold)}
.gate.on>rect{fill:var(--hold)}
.gate.on>text{fill:var(--on-accent)}
.lane{fill:var(--bg);stroke:var(--line)}
.lane-l{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chip>rect{fill:var(--accent)}
.chip>text{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--on-accent);text-anchor:middle}
.chip.tick>rect{fill:var(--hold)}
.exec>rect{fill:var(--panel);stroke:var(--hold);stroke-dasharray:4 3}
.exec.on>rect{fill:var(--hold-soft);stroke:var(--hold);stroke-width:2;stroke-dasharray:none}
.exec-g{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--hold)}
.exec-t{font-family:var(--mono);font-size:11.5px;font-weight:600;fill:var(--ink)}
.actor>circle{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.5}
.actor>text{font:600 10.5px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.actor.run>circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.actor.disc>circle{stroke:var(--hold);stroke-dasharray:3 3}
.actor.hidden{opacity:0}
.sess>rect{fill:var(--accent-soft);stroke:var(--accent)}
.sess.dead>rect{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.sess>text{font-family:var(--mono);font-size:11px;fill:var(--accent-ink)}
.sess.dead>text{fill:var(--muted)}
.sess.hidden{opacity:0}
.cl>rect{fill:var(--panel);stroke:var(--ink-2)}
.cl>text{font-family:var(--mono);font-size:11px;fill:var(--ink-2);text-anchor:middle}
.cl>text.tag{font-weight:700;font-size:12px;fill:var(--ink)}
.cl.off>rect{stroke:var(--hold);stroke-dasharray:3 3}
.cl.hidden{opacity:.3}
.link{stroke:var(--line);stroke-width:1.3;fill:none}
.link.conn{stroke:var(--ink-2);stroke-width:1.8}
.link.bind{stroke:var(--accent);stroke-dasharray:6 5;stroke-width:1.5}
.lbl{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.pkt{fill:var(--accent)}
.pkt-push{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.pkt-look{fill:var(--look)}
.badge{font:600 10.5px var(--mono);fill:var(--hold)}
@media (prefers-reduced-motion: reduce){.box.pulse>rect,.spot.pulse>rect.bg,.boss.hit>circle,.ch.seen .seen{animation:none}}
</style>
<style>
.panelz{fill:var(--panel);stroke:var(--line)}
.note-t{font-size:12.5px;fill:var(--ink)}
.note-t.hi{font-weight:700;fill:var(--accent-ink)}
.note-t.warn{fill:var(--hold);font-weight:600}
.banner>rect{fill:var(--hold);opacity:.92}
.banner>text{font-weight:700;font-size:13px;fill:#fff;text-anchor:middle}
.box.drained>rect{stroke:var(--hold);stroke-dasharray:6 4}
.box.ghost>rect{fill:none;stroke-dasharray:5 5}
.box.faded{opacity:.35;transition:opacity .6s}
.box.hot>rect{stroke:var(--accent);stroke-width:2}
.box.bad>rect{animation:badp .9s ease}
@keyframes badp{0%{stroke:#C0392B;stroke-width:3.5}100%{stroke-width:1.2}}
.chipc>rect{fill:var(--accent-soft)}
.chipc>text{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--accent-ink)}
.chipc.pub>rect{fill:none;stroke:#2F6DB5}
.chipc.pub>text{fill:#2F6DB5}
.t-count{font-family:var(--mono);font-weight:600;font-size:11.5px;fill:var(--accent-ink)}
.link.broken{stroke:var(--hold);stroke-dasharray:3 5;stroke-width:1.6}
.link.reply{stroke:#2F6DB5;stroke-dasharray:2 4;stroke-width:1.8}
.link.reply.hi{stroke-width:3.5}
.pkt-pub{fill:#2F6DB5}
.pkt-state{fill:var(--hold);stroke:var(--ink);stroke-width:1}
.pkt-reply{fill:#2F6DB5}
.spot.holding .chip>rect{fill:var(--hold)}
.gauge-bg{fill:var(--bg);stroke:var(--line)}
.gauge-fill{fill:var(--accent)}
.gauge-fill.hi{fill:var(--hold)}
.slot{fill:var(--bg);stroke:var(--line)}
.slot.on{fill:var(--hold)}
.slot.run{fill:var(--accent)}
.xp-bg{fill:var(--bg);stroke:var(--line)}
.xp{fill:var(--accent)}
.party-p{fill:var(--dungeon);stroke:var(--dungeon-line)}
.player-dot{stroke:#fff;stroke-width:1.5}
.atk{stroke:#FFD66B;stroke-width:1.5}
.chan-frame{fill:none;stroke-width:2.2;stroke-dasharray:10 6}
.chan-frame.cs{stroke:#0E8175;fill:#0E8175;fill-opacity:.05}
.chan-frame.fanout{stroke:#2F6DB5;fill:#2F6DB5;fill-opacity:.04}
.chan-frame.mesh{stroke:#7A4FC0;fill:#7A4FC0;fill-opacity:.03}
.chan-tag>rect{fill:#0E8175}
.chan-tag.fanout>rect{fill:#2F6DB5}
.chan-tag.mesh>rect{fill:#7A4FC0}
.chan-tag>text{font-family:var(--mono);font-size:12px;font-weight:700;fill:#fff}
.box.legend>rect{fill:var(--panel);stroke:var(--line)}
.legend-t{font-size:12.5px;fill:var(--ink-2)}
.box.dim{opacity:.3;transition:opacity .3s}
.grp-cs{fill:var(--accent-soft);fill-opacity:.35;stroke:var(--accent);stroke-dasharray:6 4}
.grp-cs-t{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--accent-ink)}
.w-badge{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink-2)}
.w-badge.heavy{fill:var(--accent);font-size:13px;font-weight:800}
.w-badge.zero{fill:var(--hold);font-weight:800}
.got{fill:var(--accent)}
.got.heavy{fill:#0A5F56}
.link.mesh{stroke:var(--line);stroke-width:3}
.link.mesh.on{stroke:var(--accent);stroke-width:4}
.mesh-t{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--accent-ink)}
.bp-cell{fill:var(--bg);stroke:var(--line)}
.bp-cell.on{fill:var(--accent)}
.bp-cell.hi{fill:var(--hold)}
.bp-mark{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:4 3}
.bp-mark.bad{stroke:#C0392B}
.bp-mark-t{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink-2)}
.bp-mark-t.bad{fill:#C0392B}
.bp-pill>rect{fill:var(--accent)}
.bp-pill>text{font-weight:700;font-size:13px;fill:var(--on-accent);text-anchor:middle}
.bp-pill.stop>rect{fill:#C0392B}
.bp-pill.stop>text{fill:#fff}
.bp-pill.dead>rect{fill:var(--line)}
.bp-pill.dead>text{fill:var(--muted)}
.bp-world{font-size:13px;font-weight:600;fill:#CFE9E3}
.bp-world.warn{fill:#F4B764}
.bp-world.bad{fill:#FF8A7A}
.t-count.bad{fill:#C0392B}
.box.dead>rect{fill:#3A1F1F;stroke:#C0392B;stroke-width:2}
.boom{fill:none;stroke:#FF7A3D;stroke-width:6}
.boom.b1{stroke:#FFD66B;stroke-width:4}
.boom.b2{stroke:#C0392B;stroke-width:8}
.spark{fill:#FFB347}
.boom-t{font-weight:800;font-size:30px;fill:#FF5A3D;paint-order:stroke;stroke:#fff;stroke-width:3px}
.boom-t.big{font-size:34px}
.boom-s{font-weight:700;font-size:13px;fill:#FF8A7A}
svg.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-1px)}}

.link.relay{stroke:var(--hold);stroke-width:3;stroke-dasharray:9 5}
.relay-t{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--hold)}
.flylabel{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div><span class="eyebrow">ZLink Framework · MORPG로 보기</span><h1 id="gtitle"></h1></div>
    <nav class="groups" id="groups" aria-label="기능 그룹"></nav>
  </header>

  <div class="main">
    <div class="side">
      <ol class="steps" id="steps" aria-label="단계"></ol>
      <label class="speed" for="speedRange">메시지 속도 <b id="speedVal">1.0×</b></label>
      <input type="range" id="speedRange" min="0.25" max="3" step="0.25" value="1" aria-label="메시지 속도">
    </div>
    <div class="col">
      <div class="bar">
        <span class="t" id="stepNo"></span>
        <p class="line" id="line"></p>
        <div class="acts" id="acts"></div>
        <p class="res" id="res" aria-live="polite"></p>
        <details><summary>자세히</summary><ul id="more"></ul></details>
      </div>
      <p class="vlabel">게임 화면</p>
      <div class="view"><svg id="game" viewBox="0 0 900 236" role="img" aria-label="게임 화면"></svg></div>
      <p class="vlabel">서버 안에서</p>
      <div class="view"><svg id="srv" viewBox="0 0 900 342" role="img" aria-label="서버 구성"></svg></div>
      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>

<script>
(function(){
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
let K = 3.5;                       /* message speed: larger is slower */
let gen = 0;                       /* bumps when the group changes; stale loops stop */
class Cancel extends Error {}
const sleep = ms => { const g = gen; return new Promise((res, rej) => setTimeout(() => g === gen ? res() : rej(new Cancel()), ms)); };
function ease(t){ return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
function tween(d, fn){ const g = gen; return new Promise((res, rej) => { const t0 = performance.now(); (function s(n){ if (g !== gen) { rej(new Cancel()); return; } const t = Math.min(1, Math.max(0, (n - t0) / d)); fn(ease(t)); t < 1 ? requestAnimationFrame(s) : res(); })(t0); }); }

function mk(p, tag, a = {}){ const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) { if (k === 'text') e.textContent = v; else e.setAttribute(k, v); } p.append(e); return e; }

  let xp = 0; const XPMAX = 3000; function addXp(d){ xp += d; xpBar.setAttribute('width', 494 * Math.min(1, xp / XPMAX)); xpT.textContent = `길드 경험치 ${xp}`; }

      render(){ cells.forEach((c, k) => c.setAttribute('class', 'bp-cell' + (k < L.q ? (L.q >= cap * .9 ? ' hi' : ' on') : ''))); sentT.textContent = `보냄 ${L.sent}`; doneT.textContent = L.downed ? '서버 다운' : `처리 ${L.done}`; if (L.onRender) L.onRender(); lostT.textContent = `유실 ${L.lost}`; lostT.setAttribute('class', 't-count' + (L.lost ? ' bad' : '')); },
      setPill(kind, text){ pill.setAttribute('class', 'bp-pill ' + kind); pillT.textContent = text; }};
    return L;
  }
  const L1 = lane(6, false), L2 = lane(186, true);
  let SEND = 70, PROC = 160;   /* ms × K: sending is about 2.3× faster than processing */
  function boom(L, W){
    L.dead = true; L.lost += L.q + L.inflight; L.q = 0; L.render();
    L.rcv.g.classList.add('dead'); L.setPill('dead', '보낼 곳 없음');
    const cx = L.rcv.x + 72, cy = L.y0 + 82;
    for (let k = 0; k < 3; k++) { const c = mk(sF, 'circle', {cx, cy, r: 4, class: 'boom' + (k ? ' b' + k : '')}); tween(700 + k * 250, e => { c.setAttribute('r', 6 + e * (120 + k * 40)); c.setAttribute('opacity', 1 - e); }).catch(() => {}).finally(() => c.remove()); }
    for (let k = 0; k < 14; k++) { const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90; const p = mk(sF, 'circle', {cx, cy, r: 4, class: 'spark'}); tween(800, e => { p.setAttribute('cx', cx + Math.cos(a) * d * e); p.setAttribute('cy', cy + Math.sin(a) * d * e); p.setAttribute('opacity', 1 - e); }).catch(() => {}).finally(() => p.remove()); }
    mk(sB, 'text', {x: L.rcv.x - 34, y: L.y0 + 64, class: 'boom-t', 'text-anchor': 'middle', text: '펑!'});
    L.doneT.setAttribute('class', 'boom-s'); L.downed = true;
    srv.classList.remove('shake'); void srv.getBBox(); srv.classList.add('shake');
    const gx = W.cx, gy = W.cy; const ov = mk(gG, 'rect', {x: W.x, y: 14, width: 428, height: 208, rx: 14, fill: '#000', opacity: 0}); tween(500, e => ov.setAttribute('opacity', .55 * e)).catch(() => {});
    for (let k = 0; k < 3; k++) { const c = mk(gF, 'circle', {cx: gx, cy: gy, r: 4, class: 'boom' + (k ? ' b' + k : '')}); tween(800 + k * 250, e => { c.setAttribute('r', 6 + e * (110 + k * 30)); c.setAttribute('opacity', 1 - e); }).catch(() => {}).finally(() => c.remove()); }
    mk(gG, 'text', {x: gx, y: gy + 8, class: 'boom-t big', 'text-anchor': 'middle', text: '서버 다운'});
    L.onRender = () => { W.st.textContent = `메모리 초과로 서버가 죽었다 · 유실 ${L.lost}`; }; L.render(); W.st.setAttribute('class', 'bp-world bad');
    game.classList.remove('shake'); void game.getBBox(); game.classList.add('shake');
  }
  function run(L, W){
    /* sender */
    spawn(async () => { for (;;) {
      await sleep(SEND * K);
      if (L.dead) return;
      if (L.bounded && L.paused) continue;
      if (L.bounded && L.q + L.inflight >= L.cap) {
        L.paused = true; L.stops++; L.setPill('stop', '⏸ 전송 멈춤'); pulse(L.snd.g, 'bad');
        W.st.textContent = `queue가 가득 찼다 → 보내는 쪽이 멈췄다 (멈춤 ${L.stops}회)`; W.st.setAttribute('class', 'bp-world warn'); continue;
      }
      L.sent++; L.inflight++; L.render();
      const k = Math.min(L.cap - 1, L.q + L.inflight - 1);
      spawn(async () => { await fly({x: 166, y: L.y0 + 93}, {x: L.qx + k * L.cw + L.cw / 2, y: L.qy + L.qh / 2}, {r: 5, dur: 140, bend: 0});
        L.inflight--; if (L.dead) { L.lost++; L.render(); return; } L.q++; L.render();
        if (!L.bounded && L.q >= L.cap) boom(L, W);
        else if (!L.bounded) { W.st.textContent = `받는 대로 쌓는 중 · 메모리 ${Math.round(L.q / L.cap * 100)}%`; W.st.setAttribute('class', 'bp-world' + (L.q > L.cap * .6 ? ' warn' : '')); } });
    } });
    /* receiver */
    spawn(async () => { for (;;) {
      await sleep(PROC * K);
      if (L.dead) return;
      if (L.q > 0) { L.q--; L.done++; L.render(); spawn(() => fly({x: L.qx + L.cw / 2, y: L.qy + L.qh / 2}, {x: L.rcv.x + 4, y: L.qy + L.qh / 2}, {r: 4, cls: 'pkt-push', dur: 80, bend: 0}));
        if (L.bounded && L.paused && L.q <= L.cap / 2) { L.paused = false; L.setPill('go', '▶ 전송 재개'); W.st.textContent = 'queue가 절반 아래로 비었다 → 다시 보낸다'; W.st.setAttribute('class', 'bp-world'); } }
    } });
  }
  const STEPS = [
    {title: '같은 버스트 보내기', line: '위아래에 똑같은 공격 버스트를 보낸다. 보내는 속도가 처리 속도의 두 배가 넘는다. 위는 받는 대로 쌓고, 아래는 queue가 가득 차면 보내는 쪽을 멈추게 한다.',
     act: '버스트 시작', more: [
       '받는 쪽 queue에는 상한(HWM)이 있다. 가득 차면 Core가 그 상대로 보내기를 멈춘다. 그동안 <code>send</code>는 자리가 날 때까지 기다린다.',
       'queue가 절반 아래로 비면 다시 보낸다. 하나 빌 때마다 다시 보내면 멈춤과 재개가 쉴 새 없이 반복되기 때문이다(Core의 low watermark = HWM의 절반).',
       '보내는 쪽 <code>send</code>가 기다리다 timeout(기본 1초)을 넘기면 <code>DeadlineExceeded</code>로 끝난다. 보낸 쪽이 실패를 알 수 있다.',
       'Framework는 받아들인 message를 버리지 않는다. 다시 보낼지는 application이 업무 규칙으로 정한다.',
       '백프레셔가 없으면 받는 쪽 메모리가 끝없이 늘어나다 서버가 죽고, 쌓아 둔 message를 모두 잃는다.'],
     async run(){ run(L1, W1); run(L2, W2); W1.st.textContent = '받는 대로 쌓는 중'; W2.st.textContent = '전송 중'; res('위는 쌓이다가 터지고, 아래는 "멈춤 ↔ 재개"를 반복한다. 아래 queue는 상한을 넘지 않는다.'); }},
  ];
  return {title: 'Backpressure', steps: STEPS, foot: '가이드 33장(Backpressure) · Core pipe의 HWM/low watermark'};
}

/* ---------- groups and steps ---------- */
const GROUPS = [['clientserver', 'ClientServer', gClientServer], ['fanout', 'Fanout', gFanout], ['lobby', '로비와 던전 · RouteMesh', gLobby], ['instance', 'Instance Spot', gInstance], ['relocate', 'Host Relocation', gRelocate], ['backpressure', 'Backpressure', gBack]];
let STEPS = [], cur = 0, done = new Set(), curKey = 'clientserver';
function renderSteps(){
  $('steps').replaceChildren();
  STEPS.forEach((s, k) => { const li = document.createElement('li'); li.className = (k === cur ? 'cur' : '') + (done.has(k) && k !== cur ? ' done' : ''); if (k === cur) li.setAttribute('aria-current', 'step');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = done.has(k) && k !== cur ? '✓' : k + 1; li.append(n, document.createTextNode(s.title)); $('steps').append(li); });
}
function show(k){
  cur = k; const s = STEPS[k]; renderSteps();
  $('stepNo').textContent = `단계 ${k + 1} / ${STEPS.length}`; $('line').textContent = s.line; res('');
  $('more').innerHTML = s.more.map(m => `<li>${m}</li>`).join('');
  const acts = $('acts'); acts.replaceChildren();
  const b = document.createElement('button'); b.type = 'button'; b.className = 'act primary'; b.textContent = s.act; acts.append(b);
  /* "next" opens once the main action ran (toggle steps: ended in the restored state) and, when there is an extra action, after it ran once */
  let mainOk = false, extraOk = !s.extra;
  const nx = document.createElement('button'); nx.type = 'button'; nx.className = 'act next'; nx.textContent = k === STEPS.length - 1 ? '처음부터 ↺' : '다음 단계 →'; nx.disabled = true;
  const syncNext = () => { nx.disabled = !(mainOk && extraOk); };
  let ex = null; if (s.extra) { ex = document.createElement('button'); ex.type = 'button'; ex.className = 'act'; ex.textContent = s.extra[0]; ex.disabled = true; acts.append(ex); ex.addEventListener('click', () => { ex.disabled = true; nx.disabled = true; spawn(async () => { await s.extra[1](); ex.disabled = false; extraOk = true; syncNext(); }); }); }
  acts.append(nx);
  nx.addEventListener('click', () => { if (k === STEPS.length - 1) openGroup(curKey); else show(k + 1); });
  b.addEventListener('click', () => { b.disabled = true; nx.disabled = true; spawn(async () => { const r = await s.run(b); done.add(k); if (s.repeat || s.toggle) b.disabled = false; if (ex) ex.disabled = false; mainOk = s.toggle ? r === true : true; syncNext(); renderSteps(); }); });
}
function openGroup(key){
  gen++; curKey = key; const g = GROUPS.find(x => x[0] === key) || GROUPS[1];
  const r = g[2](); STEPS = r.steps; done = new Set();
  $('gtitle').textContent = r.title; $('foot').textContent = `브라우저 안의 시뮬레이션이다. 시간과 수치는 시연용이다. 동작 설명은 zlink.systems C++ 서버 가이드(${r.foot})를 따른다.`;
  document.querySelectorAll('#groups button').forEach(b => b.setAttribute('aria-current', String(b.dataset.key === key)));
  try { history.replaceState(null, '', '#' + key); } catch (_) {}
  show(0);
}
GROUPS.forEach(([key, name]) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.key = key; b.textContent = name; b.addEventListener('click', () => openGroup(key)); $('groups').append(b); });
$('speedRange').addEventListener('input', e => { const v = +e.target.value; K = 3.5 / v; $('speedVal').textContent = v.toFixed(2).replace(/0$/, '') + '×'; });
let start = 'clientserver'; try { const h = (location.hash || '').slice(1); if (GROUPS.some(g => g[0] === h)) start = h; } catch (_) {}
openGroup(start);
})();
</script>
