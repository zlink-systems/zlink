<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZLink Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* When opened as an iframe inside the site (Material), the page follows the light or dark theme of the site. When opened standalone, it follows the OS setting. */
(function () {
  try {
    if (window.parent === window) return;
    var pd = window.parent.document;
    var apply = function () {
      var scheme = pd.body && pd.body.getAttribute('data-md-color-scheme');
      if (scheme) document.documentElement.setAttribute('data-theme', scheme === 'slate' ? 'dark' : 'light');
    };
    apply();
    new MutationObserver(apply).observe(pd.body, {attributes: true, attributeFilter: ['data-md-color-scheme']});
  } catch (e) { /* when opened from another origin, follow the OS setting */ }
})();
</script>
<style>
:root{
  --bg:#F2F5F4; --panel:#FFFFFF; --ink:#14211F; --ink-2:#34423F; --muted:#5B6B68; --line:#C9D4D1;
  --accent:#0E8175; --accent-ink:#0A5F56; --accent-soft:#D6EDE9; --on-accent:#FFFFFF;
  --hold:#C4761A; --hold-soft:#F6E5CB; --look:#6C7C95;
  --node-fill:#FAFCFB; --spot-fill:#E8F3F1; --store-fill:#EEF0F5;
  --select:#ECEAF3; --select-line:#C6C0D8; --village:#E7EFDF; --village-line:#B9CCA8; --dungeon:#2A2530; --dungeon-line:#4A4052; --dungeon-ink:#EDE6F2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1413; --panel:#121D1C; --ink:#E3ECEA; --ink-2:#C2CFCC; --muted:#92A5A1; --line:#2B3B39;
    --accent:#35C2AF; --accent-ink:#7FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
    --hold:#E9A23F; --hold-soft:#3A2A12; --look:#9AA8C2;
    --node-fill:#101A19; --spot-fill:#14302C; --store-fill:#161C27;
    --select:#1E1C27; --select-line:#3B3650; --village:#1B2A1E; --village-line:#34503A; --dungeon:#1D1822; --dungeon-line:#3E3448; --dungeon-ink:#E4DCEB;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1413; --panel:#121D1C; --ink:#E3ECEA; --ink-2:#C2CFCC; --muted:#92A5A1; --line:#2B3B39;
  --accent:#35C2AF; --accent-ink:#7FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
  --hold:#E9A23F; --hold-soft:#3A2A12; --look:#9AA8C2;
  --node-fill:#101A19; --spot-fill:#14302C; --store-fill:#161C27;
  --select:#1E1C27; --select-line:#3B3650; --village:#1B2A1E; --village-line:#34503A; --dungeon:#1D1822; --dungeon-line:#3E3448; --dungeon-ink:#E4DCEB;
}
*{box-sizing:border-box}
body{zoom:.9;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:22px 44px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
header h1{margin:0;font-size:clamp(21px,2.8vw,28px);letter-spacing:-.01em}
header .eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block}
nav.groups{display:flex;flex-wrap:wrap;gap:6px}
nav.groups button{font:500 13.5px var(--sans);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer}
nav.groups button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav.groups button:disabled{cursor:default;opacity:.5}
nav.groups button small{font-size:11px;margin-left:4px}
.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
@media (max-width:900px){.side{position:static}}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
@media (max-width:900px){ol.steps{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
ol.steps li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--muted);font-size:14px;white-space:nowrap}
ol.steps .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);border:1.5px solid var(--line);background:var(--panel)}
ol.steps li.done{color:var(--ink-2)}
ol.steps li.done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
ol.steps li.cur{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--accent)}
ol.steps li.cur .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.speed{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px}
.speed b{font:600 12.5px var(--mono);color:var(--ink)}
#speedRange{width:100%;accent-color:var(--accent)}
@media (max-width:900px){#speedRange{max-width:320px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:500 12.5px var(--sans);color:var(--ink-2);background:transparent;border:0;padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.view{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.view svg{display:block;width:100%;min-width:680px;height:auto}
.vlabel{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 -4px 2px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bar .t{font:600 12px var(--mono);color:var(--accent);letter-spacing:.06em}
.bar .line{margin:0;font-size:16.5px;font-weight:500;line-height:1.5;text-wrap:pretty}
.bar .res{margin:0;font-size:14px;color:var(--accent-ink);min-height:21px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.act{font:600 14.5px var(--sans);border-radius:9px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.next{margin-left:auto}
.act:disabled{opacity:.4;cursor:default}
.act:focus-visible,nav.groups button:focus-visible,summary:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{font-size:13.5px;color:var(--ink-2)}
summary{cursor:pointer;color:var(--muted);font-size:13px}
details ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
details code{font:12.5px var(--mono);color:var(--accent-ink)}
.foot,.src{font-size:12.5px;color:var(--muted)}
.bar .src{margin:0}
.foot a,.src a{color:var(--accent-ink);text-underline-offset:2px}
.foot a:focus-visible,.src a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* svg */
svg text{font-family:var(--sans)}
.zone-sel{fill:var(--select);stroke:var(--select-line)}
.village{fill:var(--village);stroke:var(--village-line)}
.house{fill:var(--panel);stroke:var(--village-line)}
.dungeon{fill:var(--dungeon);stroke:var(--dungeon-line)}
.dng{transition:opacity .6s}
.dng.locked{opacity:.28}
.g-title{font-weight:700;font-size:14px;fill:var(--ink)}
.g-title.d{fill:var(--dungeon-ink)}
.g-sub{font-size:11.5px;fill:var(--muted)}
.g-sub.d{fill:#A99BB6}
.boss>circle{fill:#6B2E3A;stroke:#C7667A;stroke-width:3}
.boss.hit>circle{animation:hit .25s ease}
@keyframes hit{50%{fill:#A8404F}}
.hp-bg{fill:#3B3342}
.hp{fill:#E0576B}
.hp.party{fill:#4FB985}
.hp-t{font:600 11.5px var(--mono);fill:var(--dungeon-ink)}
.ch>circle.body{stroke:#fff;stroke-width:2}
.ch>text{font:700 11px var(--mono);fill:#fff;text-anchor:middle;dominant-baseline:central}
.ch.off{opacity:.3}
.ch.act>circle.body{stroke:#F7D774;stroke-width:3.5}
.ch .seen{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.ch.seen .seen{animation:seen .9s ease}
@keyframes seen{0%{opacity:1;r:16}100%{opacity:0;r:30}}
.dmg{font:700 15px var(--mono);fill:#FFD66B;text-anchor:middle}
.dmg.boss{fill:#FF8A7A}
.beam{stroke:#FF8A7A;stroke-width:2.5}
.box>rect{fill:var(--node-fill);stroke:var(--line);stroke-width:1.2}
.box.store>rect{fill:var(--store-fill);stroke:var(--look)}
.grp-field{fill:var(--village);stroke:var(--village-line);stroke-dasharray:5 4}
.grp-dng{fill:var(--hold-soft);fill-opacity:.45;stroke:var(--dungeon-line);stroke-dasharray:5 4}
.box.gw>rect{fill:var(--panel);stroke:var(--ink-2)}
.box.pulse>rect{animation:pulse .7s ease}
@keyframes pulse{0%{stroke:var(--accent);stroke-width:3.5}100%{stroke-width:1.2}}
.t-title{font-weight:600;font-size:13.5px;fill:var(--ink)}
.t-sub{font-size:11.5px;fill:var(--muted)}
.t-mono{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.t-store{font-family:var(--mono);font-size:12px;fill:var(--ink-2)}
.spot>rect.bg{fill:var(--spot-fill);stroke:var(--accent);stroke-width:1.5}
.spot.holding>rect.bg{stroke:var(--hold);stroke-dasharray:6 4;fill:var(--hold-soft)}
.spot.gone{opacity:0;transition:opacity .6s}
.spot.pulse>rect.bg{animation:pulse .7s ease}
.t-spot{font-family:var(--mono);font-weight:600;font-size:12px;fill:var(--accent-ink)}
.gate>rect{fill:var(--hold-soft);stroke:var(--hold)}
.gate>text{font-family:var(--mono);font-size:10.5px;fill:var(--hold)}
.gate.on>rect{fill:var(--hold)}
.gate.on>text{fill:var(--on-accent)}
.lane{fill:var(--bg);stroke:var(--line)}
.lane-l{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chip>rect{fill:var(--accent)}
.chip>text{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--on-accent);text-anchor:middle}
.chip.tick>rect{fill:var(--hold)}
.exec>rect{fill:var(--panel);stroke:var(--hold);stroke-dasharray:4 3}
.exec.on>rect{fill:var(--hold-soft);stroke:var(--hold);stroke-width:2;stroke-dasharray:none}
.exec-g{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--hold)}
.exec-t{font-family:var(--mono);font-size:11.5px;font-weight:600;fill:var(--ink)}
.actor>circle{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.5}
.actor>text{font:600 10.5px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.actor.run>circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.actor.disc>circle{stroke:var(--hold);stroke-dasharray:3 3}
.actor.hidden{opacity:0}
.sess>rect{fill:var(--accent-soft);stroke:var(--accent)}
.sess.dead>rect{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.sess>text{font-family:var(--mono);font-size:11px;fill:var(--accent-ink)}
.sess.dead>text{fill:var(--muted)}
.sess.hidden{opacity:0}
.cl>rect{fill:var(--panel);stroke:var(--ink-2)}
.cl>text{font-family:var(--mono);font-size:11px;fill:var(--ink-2);text-anchor:middle}
.cl>text.tag{font-weight:700;font-size:12px;fill:var(--ink)}
.cl.off>rect{stroke:var(--hold);stroke-dasharray:3 3}
.cl.hidden{opacity:.3}
.link{stroke:var(--line);stroke-width:1.3;fill:none}
.link.conn{stroke:var(--ink-2);stroke-width:1.8}
.link.bind{stroke:var(--accent);stroke-dasharray:6 5;stroke-width:1.5}
.lbl{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.pkt{fill:var(--accent)}
.pkt-push{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.pkt-look{fill:var(--look)}
.badge{font:600 10.5px var(--mono);fill:var(--hold)}
@media (prefers-reduced-motion: reduce){.box.pulse>rect,.spot.pulse>rect.bg,.boss.hit>circle,.ch.seen .seen{animation:none}}
</style>
<style>
.panelz{fill:var(--panel);stroke:var(--line)}
.note-t{font-size:12.5px;fill:var(--ink)}
.note-t.hi{font-weight:700;fill:var(--accent-ink)}
.note-t.warn{fill:var(--hold);font-weight:600}
.banner>rect{fill:var(--hold);opacity:.92}
.banner>text{font-weight:700;font-size:13px;fill:#fff;text-anchor:middle}
.box.drained>rect{stroke:var(--hold);stroke-dasharray:6 4}
.box.ghost>rect{fill:none;stroke-dasharray:5 5}
.box.faded{opacity:.35;transition:opacity .6s}
.box.hot>rect{stroke:var(--accent);stroke-width:2}
.box.bad>rect{animation:badp .9s ease}
@keyframes badp{0%{stroke:#C0392B;stroke-width:3.5}100%{stroke-width:1.2}}
.chipc>rect{fill:var(--accent-soft)}
.chipc>text{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--accent-ink)}
.chipc.pub>rect{fill:none;stroke:#2F6DB5}
.chipc.pub>text{fill:#2F6DB5}
.t-count{font-family:var(--mono);font-weight:600;font-size:11.5px;fill:var(--accent-ink)}
.link.broken{stroke:var(--hold);stroke-dasharray:3 5;stroke-width:1.6}
.link.reply{stroke:#2F6DB5;stroke-dasharray:2 4;stroke-width:1.8}
.link.reply.hi{stroke-width:3.5}
.pkt-pub{fill:#2F6DB5}
.pkt-state{fill:var(--hold);stroke:var(--ink);stroke-width:1}
.pkt-reply{fill:#2F6DB5}
.spot.holding .chip>rect{fill:var(--hold)}
.gauge-bg{fill:var(--bg);stroke:var(--line)}
.gauge-fill{fill:var(--accent)}
.gauge-fill.hi{fill:var(--hold)}
.slot{fill:var(--bg);stroke:var(--line)}
.slot.on{fill:var(--hold)}
.slot.run{fill:var(--accent)}
.xp-bg{fill:var(--bg);stroke:var(--line)}
.xp{fill:var(--accent)}
.party-p{fill:var(--dungeon);stroke:var(--dungeon-line)}
.player-dot{stroke:#fff;stroke-width:1.5}
.atk{stroke:#FFD66B;stroke-width:1.5}
.chan-frame{fill:none;stroke-width:2.2;stroke-dasharray:10 6}
.chan-frame.cs{stroke:#0E8175;fill:#0E8175;fill-opacity:.05}
.chan-frame.fanout{stroke:#2F6DB5;fill:#2F6DB5;fill-opacity:.04}
.chan-frame.mesh{stroke:#7A4FC0;fill:#7A4FC0;fill-opacity:.03}
.chan-tag>rect{fill:#0E8175}
.chan-tag.fanout>rect{fill:#2F6DB5}
.chan-tag.mesh>rect{fill:#7A4FC0}
.chan-tag>text{font-family:var(--mono);font-size:12px;font-weight:700;fill:#fff}
.box.legend>rect{fill:var(--panel);stroke:var(--line)}
.legend-t{font-size:12.5px;fill:var(--ink-2)}
.box.dim{opacity:.3;transition:opacity .3s}
.grp-cs{fill:var(--accent-soft);fill-opacity:.35;stroke:var(--accent);stroke-dasharray:6 4}
.grp-cs-t{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--accent-ink)}
.w-badge{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink-2)}
.w-badge.heavy{fill:var(--accent);font-size:13px;font-weight:800}
.w-badge.zero{fill:var(--hold);font-weight:800}
.got{fill:var(--accent)}
.got.heavy{fill:#0A5F56}
.link.mesh{stroke:var(--line);stroke-width:3}
.link.mesh.on{stroke:var(--accent);stroke-width:4}
.mesh-t{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--accent-ink)}
.bp-cell{fill:var(--bg);stroke:var(--line)}
.bp-cell.on{fill:var(--accent)}
.bp-cell.hi{fill:var(--hold)}
.bp-mark{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:4 3}
.bp-mark.bad{stroke:#C0392B}
.bp-mark-t{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink-2)}
.bp-mark-t.bad{fill:#C0392B}
.bp-pill>rect{fill:var(--accent)}
.bp-pill>text{font-weight:700;font-size:13px;fill:var(--on-accent);text-anchor:middle}
.bp-pill.stop>rect{fill:#C0392B}
.bp-pill.stop>text{fill:#fff}
.bp-pill.dead>rect{fill:var(--line)}
.bp-pill.dead>text{fill:var(--muted)}
.bp-world{font-size:13px;font-weight:600;fill:#CFE9E3}
.bp-world.warn{fill:#F4B764}
.bp-world.bad{fill:#FF8A7A}
.t-count.bad{fill:#C0392B}
.box.dead>rect{fill:#3A1F1F;stroke:#C0392B;stroke-width:2}
.boom{fill:none;stroke:#FF7A3D;stroke-width:6}
.boom.b1{stroke:#FFD66B;stroke-width:4}
.boom.b2{stroke:#C0392B;stroke-width:8}
.spark{fill:#FFB347}
.boom-t{font-weight:800;font-size:30px;fill:#FF5A3D;paint-order:stroke;stroke:#fff;stroke-width:3px}
.boom-t.big{font-size:34px}
.boom-s{font-weight:700;font-size:13px;fill:#FF8A7A}
svg.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-1px)}}

.link.relay{stroke:var(--hold);stroke-width:3;stroke-dasharray:9 5}
.relay-t{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--hold)}
.flylabel{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.band{fill:#7A4FC0;fill-opacity:.16}
.zr.hot{stroke:var(--accent);stroke-width:3}
.ch.gh{opacity:.5}
.ch.gh>circle.body{stroke:var(--ink-2);stroke-dasharray:3 2}
.spot.dim{opacity:.35;transition:opacity .3s}
.link.wire{stroke:var(--look);stroke-width:3}
.link.wire.on{stroke:var(--accent);stroke-width:4}
.link.wire.broken,.link.mesh.broken{stroke:var(--hold);stroke-dasharray:3 5;stroke-width:3}
.chan-frame.rank{stroke:#B5527F;fill:#B5527F;fill-opacity:.04}
.chan-tag.rank>rect{fill:#B5527F}
.chipc.hot>rect{fill:var(--accent)}
.chipc.hot>text{fill:var(--on-accent)}
.chipc.pub.hot>rect{fill:#2F6DB5}
.chipc.pub.hot>text{fill:#fff}
.spot .chipc.pub>rect{stroke:#2F6DB5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .spot .chipc.pub>text{fill:#8DB9F2}:root:not([data-theme="light"]) .spot .chipc.pub>rect{stroke:#8DB9F2}}
:root[data-theme="dark"] .spot .chipc.pub>text{fill:#8DB9F2}
:root[data-theme="dark"] .spot .chipc.pub>rect{stroke:#8DB9F2}
.spot .chipc.pub.hot>text{fill:#fff}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div><span class="eyebrow">ZLink Framework · Viewed as an MORPG</span><h1 id="gtitle"></h1></div>
    <nav class="groups" id="groups" aria-label="Feature groups"></nav>
  </header>

  <div class="main">
    <div class="side">
      <ol class="steps" id="steps" aria-label="Steps"></ol>
      <label class="speed" for="speedRange">Message speed <b id="speedVal">1.5×</b></label>
      <input type="range" id="speedRange" min="0.25" max="3" step="0.25" value="1.5" aria-label="Message speed">
    </div>
    <div class="col">
      <div class="bar">
        <span class="t" id="stepNo"></span>
        <p class="line" id="line"></p>
        <div class="acts" id="acts"></div>
        <p class="res" id="res" aria-live="polite"></p>
        <p class="src" id="src"></p>
        <details><summary>Details</summary><ul id="more"></ul></details>
      </div>
      <p class="vlabel">Game view</p>
      <div class="view"><svg id="game" viewBox="0 0 900 236" role="img" aria-label="Game view"></svg></div>
      <p class="vlabel">Inside the servers</p>
      <div class="view"><svg id="srv" viewBox="0 0 900 342" role="img" aria-label="Server layout"></svg></div>

     async run(){ await Promise.all([0, 1, 2, 3].map(async i => { await ss.up(i, AC[i]); AC[i].g.classList.add('run'); await sleep(200 * K); AC[i].g.classList.remove('run'); })); res('The four Actors ran <b>at the same time</b> (the green outlines lit up together).'); }},

     async run(){ [0, 1, 2, 3].forEach(i => spawn(() => join(town, i))); await sleep(200 * K); await moveActors(SLOT_T, TOWN); store.set('P1 ~ P4 → node A · town-1', null); res('The four players entered town-1. Now whatever happens in the town is delivered to everyone in the town.'); }},

     act: 'All 4 move', repeat: true, more: ['The town (SpotWide) processes move requests one after another through a single gate.', 'It pushes the result to everyone in the town. Each client draws the other users from that push.', 'If hundreds of players are in a town, split it into several towns (channels). Each town is one Spot.'],
     async run(){ await Promise.all([0, 1, 2, 3].map(async i => { await sleep(i * 150); await ss.up(i, AC[i]);

    {title: 'Creating a dungeon', ref: [['Ch. 20 §3.7 Calling a Spot or an Actor', '20-channel-messaging#37-calling-a-spot-or-an-actor'], ['Ch. 21 §4.1 Creating', '21-spot#41-creating']], line: 'P1 creates a dungeon. The Framework picks the server on which to create it, and the returned id dungeon-7 becomes the address from then on.',

     async run(){ await ss.up(0, AC[0]); AC[0].g.classList.add('run');

    {title: 'Party enters', ref: [['Ch. 22 §1 An Actor Always Belongs to a Spot', '22-actor#1-an-actor-always-belongs-to-a-spot'], ['Ch. 20 §3.7 Calling a Spot or an Actor', '20-channel-messaging#37-calling-a-spot-or-an-actor']], line: 'The four players enter dungeon-7. The dungeon is on another server, so each Actor moves to that server together with its state.',
     act: 'Party enters', more: ['When <code>on_actor_join</code> of the receiving dungeon approves, the Actor moves to node B with its state and its pending work.', 'Messages that arrive during the move wait and are executed in order.', 'The Framework changes the session route to the new location. The client does not reconnect.'],
     async run(){ await flyPath(meshD(420, 635), {dur: 500, r: 7, label: 'join request · RouteMesh'}); pulse(dsp.g); await flyPath(meshD(635, 420), {cls: 'pkt-push', dur: 500, r: 6, label: 'approved'});
       await flyPath(meshD(420, 635), {cls: 'pkt-state', dur: 600, r: 9, label: 'state of 4 Actors'});
       await moveActors(SLOT_D, DNG, 260); store.set('P1 ~ P4 → node B · dungeon-7', null); res('The Actor state went to node B over the RouteMesh connection. The client connections stay as they are, and only the dashed lines (bindings) point to the new location.'); }},
    {title: 'Simultaneous boss attack', ref: [['Ch. 32 §3 SpotWide', '32-execution-model#3-spotwide--execution-through-one-gate']], line: 'The four players attack the boss at the same time. The requests are processed in one line in dungeon-7, so the boss HP drops by exactly the sum of the attacks without any lock.',

     async run(){ const r = await attackAll(); res(`${r.n} requests were processed in one line. Attack total${r.sum} → boss HP ${r.before} → <b>${boss.hp}</b>. Locks used: 0.`); }},

     async run(btn){ const i = 2;

       ss.open(i); await fly(ss.SE[i].R, store.pt, {cls: 'pkt-look', dur: 400}); await fly(store.pt, ss.SE[i].R, {cls: 'pkt-look', dur: 400});

     async run(){ if (boss.hp > 0) { finish = true; left = ss.SE.filter(s => s.conn).length; await attackAll(); finish = false; }

       await Promise.all(others.map(o => { seen(o); return null; })); spawn(() => banner('News: dungeon-7 boss defeated'));

/* =========================================================
   Group 3. Instance Spot (guild)
   ========================================================= */
function gInstance(){
  resetViews('0 0 900 236', '0 0 900 372');
  const parties = [0, 1, 2].map(k => { const y = 14 + k * 70; mk(gG, 'rect', {x: 14, y, width: 330, height: 62, rx: 12, class: 'party-p'}); mk(gG, 'text', {x: 28, y: y + 24, class: 'g-title d', text: `dungeon-${7 + k} · Party ${k + 1}`});
    const st = mk(gG, 'text', {x: 28, y: y + 44, class: 'g-sub d', text: 'In battle'}); [0, 1, 2, 3].forEach(i => mk(gG, 'circle', {cx: 220 + i * 28, cy: y + 31, r: 10, fill: COLORS[i], class: 'player-dot'})); return {y, st}; });
  mk(gG, 'rect', {x: 360, y: 14, width: 526, height: 208, rx: 14, class: 'village'});
  mk(gG, 'text', {x: 376, y: 38, class: 'g-title', text: 'Guild hall · guild-7'}); const gSub = mk(gG, 'text', {x: 376, y: 56, class: 'g-sub', text: 'Nobody has called it yet'});
  mk(gG, 'rect', {x: 376, y: 70, width: 494, height: 16, rx: 8, class: 'xp-bg'}); const xpBar = mk(gG, 'rect', {x: 376, y: 70, width: 0, height: 16, rx: 8, class: 'xp'});
  const xpT = mk(gG, 'text', {x: 870, y: 64, class: 't-count', 'text-anchor': 'end', text: 'Guild experience 0'});
  const gl = mk(gG, 'g'); const glog = []; function glogAdd(t){ glog.unshift(t); glog.length = Math.min(glog.length, 5); gl.replaceChildren(); glog.forEach((s, k) => mk(gl, 'text', {x: 376, y: 112 + k * 22, class: 'note-t' + (k === 0 ? ' hi' : ''), text: s})); }
  let xp = 0; const XPMAX = 3000; function addXp(d){ xp += d; xpBar.setAttribute('width', 494 * Math.min(1, xp / XPMAX)); xpT.textContent = `Guild experience ${xp}`; }

  const store = storeBox(240, 4, 650);
  mk(sB, 'path', {d: 'M8,60 L896,60 L896,244 L694,244 L694,362 L8,362 Z', class: 'chan-frame mesh'}); chanTag(16, 362, 'RouteMesh channel · game', 'mesh');
  const DS = [0, 1, 2].map(k => box(16, 70 + k * 90, 210, 80, '', `Dungeon server ${'BCD'[k]}`, `dungeon-${7 + k} · Party ${k + 1}`));
  const G1 = box(500, 70, 190, 262, '', 'Guild server', 'node G1'); const G2 = box(700, 70, 190, 170, '', 'Guild server', 'node G2');
  const DB = box(700, 250, 190, 82, '', 'Ranking DB', 'External storage');
  let guild = null, gen7 = 0, where = null; const cache = [false, false, false];
  function makeGuild(node){ const x = node === 'G1' ? 510 : 710; const sp = qspot(x, 112, 170, node === 'G1' ? 210 : 120, 'guild-7', 'Instance Spot', node === 'G1' ? {lane: 80, exec: 116, order: 164} : {lane: 40, exec: 76}); startProc(sp); return sp; }
  function from(k){ return {x: 226, y: 110 + k * 90}; }
  async function contribute(k, amount, opts = {}){
    if (!cache[k] || !guild) {
      await fly(DS[k].T(), store.pt, {cls: 'pkt-look', dur: 380});
      if (!guild) { res('guild-7 is not in the Store. The right to create is reserved, and a server is picked to create it (cold activation).'); store.set('guild-7 → preparing', null);
        where = gen7 === 0 ? 'G1' : 'G2'; await fly(store.pt, (where === 'G1' ? G1 : G2).T(), {cls: 'pkt-look', dur: 380});
        guild = makeGuild(where); guild.g.classList.add('holding'); res(`${where === 'G1' ? 'node G1' : 'node G2'}: <code>configure</code> → <code>on_initialize</code>. An Instance Spot does not receive <code>on_create</code>.`); await sleep(260 * K);
        guild.g.classList.remove('holding'); gen7++; store.set(`guild-7 → node ${where} · gen ${gen7}`, null); gSub.textContent = `Running on node ${where}`; }
      await fly(store.pt, DS[k].T(), {cls: 'pkt-look', dur: 380}); cache[k] = true;
    }
    parties[k].st.textContent = 'Boss defeated, guild contribution'; pulse(DS[k].g);
    return enqueue(guild, {label: 'D' + 'BCD'[k], what: opts.what || `Server ${'BCD'[k]} +${amount}`, from: from(k), dur: opts.dur, fn: () => { addXp(amount); glogAdd(`Party ${k + 1} contribution +${amount}`); if (opts.fn) opts.fn(); }});
  }
  const STEPS = [
    {title: 'Waking on the first request', ref: [['Ch. 21 §6 The Other Kinds of Spot', '21-spot#6-the-other-kinds-of-spot']], line: 'Party 1 defeats a boss and contributes to the guild. guild-7 does not exist yet, but when the first request arrives, the Framework creates it and processes that request right away.',
     act: 'Party 1 contributes', more: ['An Instance Spot has no separate call to create it. It is enough to write the instance type in the first message.', 'The Framework picks the server to create it on, and the Store prevents the same id from being created in two places.', 'The caller does not separate "create" from "send".'],
     async run(){ await contribute(0, 120); res('guild-7 was created and processed <b>that same request</b>. Guild experience +120.'); }},
    {title: 'Several servers at once', ref: [['Ch. 32 §3 SpotWide', '32-execution-model#3-spotwide--execution-through-one-gate']], line: 'Three dungeon servers contribute to the same guild at the same time. guild-7 processes them in one line, so the total is exact without a distributed lock.',
     act: '3 servers contribute at once', repeat: true, more: ['Requests that arrive with the same guild id always go to that one guild.', 'The location is looked up in the Store only the first time. After that, requests go straight to the remembered location.', 'With the conventional approach, every server must take a Redis lock, read, write, and release it.'],
     async run(){ const before = xp; const am = [0, 1, 2].map(() => 80 + Math.floor(Math.random() * 80)); await Promise.all(am.map((a, k) => contribute(k, a))); res(`3 requests were processed in one line. ${am.join(' + ')} = ${am.reduce((s, v) => s + v, 0)} → experience ${before} → <b>${xp}</b>. Locks: 0.`); }},
    {title: 'Yielding while waiting', ref: [['Ch. 32 §2 What Decides the Serialization Boundary', '32-execution-model#2-what-decides-the-serialization-boundary']], line: 'The guild saves the ranking to an external DB. When it waits with Yield, other contributions run in the meantime, and when the save finishes, execution continues as a new turn.',
     act: 'Save ranking + concurrent contributions', more: ['<code>Yield</code> gives up the execution right while waiting. When the result arrives, it enters the end of the queue as a new turn.', 'Waiting with <code>Async</code> keeps the execution right while waiting, so all other requests stop.', 'After resuming, check again the state that changed in the meantime.'],
     async run(){
       let resumed; const resumeDone = new Promise(r => { resumed = r; });
       const p = contribute(0, 60, {what: 'Save · Yield', dur: 150, fn: () => { spawn(async () => {
         await fly(guild.abs(guild.w, 130), DB.L(), {cls: 'pkt-look', dur: 500}); pulse(DB.g); await sleep(400 * K); await fly(DB.L(), guild.abs(guild.w, 130), {cls: 'pkt-push', dur: 500});
         await enqueue(guild, {label: 'R', what: 'Resumed turn', fn: () => glogAdd('Ranking saved (resumed turn)')}); res('The save result arrived and execution continued as a <b>new turn (R) at the end of the queue</b>. Other contributions finished first in the meantime.'); resumed(); }); }});
       await sleep(500 * K); await Promise.all([contribute(1, 90), contribute(2, 110)]); await p; await resumeDone; }},
    {title: 'Closing when idle, waking again', ref: [['Ch. 21 §6 The Other Kinds of Spot', '21-spot#6-the-other-kinds-of-spot']], line: 'When there are no requests for a while, the guild closes by itself. When the next request arrives, it wakes up again, possibly on a different server this time.',
     act: 'Close the guild', extra: ['Party 2 contributes', async () => { await contribute(1, 150); res(`guild-7 woke up again and processed the request (gen${gen7}). The caller changed nothing.`); }],
     more: ['An Instance Spot closes itself from its own handler or timer (<code>on_closing</code>).', 'When it closes, the Store record disappears. If the next request arrives with the same id, a new incarnation is created.', 'Durable state belongs to the storage. The Spot holds only the in-memory state and the processing order.'],
     async run(){ guild.g.classList.add('holding'); res('guild-7: <code>on_closing</code>'); await sleep(260 * K); guild.g.remove(); guild = null; cache.fill(false); store.set('guild-7 → none', null); gSub.textContent = 'Closed · wakes up again on the next request'; res('guild-7 was closed. Press "Party 2 contributes" to wake it up again.'); }},
  ];
  return {title: 'Instance Spot', steps: STEPS, foot: [['chapter 21 (Spot)', '21-spot'], ['chapter 32 (execution model)', '32-execution-model'], ['chapter 34 (activation and lifetime)', '34-activation-lifetime']]};
}

function gRelocate(){
  resetViews('0 0 900 236', '0 0 900 372');

  mk(gG, 'rect', {x: 186, y: 14, width: 700, height: 208, rx: 14, class: 'dungeon'});
  mk(gG, 'text', {x: 202, y: 38, class: 'g-title d', text: 'Dungeon dungeon-7'}); const where = mk(gG, 'text', {x: 202, y: 55, class: 'g-sub d', text: 'Running on dungeon server B'});
  const boss = makeBoss(760, 132, 44, 676, 62, 190, 1200);
  const DNG = [[320, 92], [320, 172], [420, 80], [420, 180]];
  const ch = DNG.map(([x, y], i) => gchar(i, x, y));
  const bannerG = mk(gF, 'g');
  function banner(text){ bannerG.replaceChildren(); if (!text) return; const b = mk(bannerG, 'g', {class: 'banner'}); mk(b, 'rect', {x: 360, y: 196, width: 360, height: 22, rx: 6}); mk(b, 'text', {x: 540, y: 211, text}); }

  const store = storeBox(320, 4, 570);
  mk(sB, 'path', {d: 'M142,8 L310,8 L310,58 L896,58 L896,362 L142,362 Z', class: 'chan-frame mesh'}); chanTag(150, 362, 'RouteMesh channel · game', 'mesh');
  const ss = sessionKit(4);
  path('M226,332 L226,345 L795,345 L795,334 M402,334 L402,345 M595,334 L595,345', 'mesh on');
  mk(sB, 'rect', {x: 316, y: 86, width: 173, height: 252, rx: 12, class: 'grp-field'}); mk(sB, 'rect', {x: 496, y: 86, width: 398, height: 252, rx: 12, class: 'grp-dng'});
  const A = box(320, 90, 165, 244, '', 'Field server', 'node A'); const B = box(500, 90, 190, 244, '', 'Dungeon server', 'node B'); const C = box(700, 90, 190, 244, '', 'Dungeon server', 'node C');
  mk(sB, 'text', {x: 330, y: 150, class: 't-mono', text: 'town-1'}); const cFree = mk(sB, 'text', {x: 710, y: 150, class: 't-mono', text: 'Has capacity'});
  const dsp = qspot(505, 132, 180, 198, 'dungeon-7', 'User Spot · Dungeon', {lane: 76, exec: 112, order: 160});
  startProc(dsp);
  const LS = [[22, 50], [62, 50], [102, 50], [142, 50]];
  const AC = LS.map(([x, y], i) => actorDot('P' + (i + 1), dsp.x + x, dsp.y + y));
  const sync = () => { AC.forEach((a, i) => a.set(dsp.x + LS[i][0], dsp.y + LS[i][1])); ss.draw(AC); };
  [0, 1, 2, 3].forEach(i => ss.open(i)); sync();
  store.set('dungeon-7 → node B', 'P1 ~ P4 → node B · dungeon-7');
  let fighting = false, sent = 0, done = 0;
  const cnt = mk(sB, 'text', {x: 330, y: 318, class: 't-count', text: ''});
  const relayD = () => curve({x: 595, y: 250}, {x: AC[1].x, y: AC[1].y + 13}, -.2);
  const relayLine = mk(sB, 'path', {d: relayD(), class: 'link relay', opacity: 0});
  const oldT = mk(sB, 'g', {opacity: 0}); mk(oldT, 'text', {x: 510, y: 212, class: 'relay-t', text: 'Old location → relay to C'}); const relayT = mk(oldT, 'text', {x: 510, y: 300, class: 'relay-t', text: ''});
  let relayN = 0;
  const upd = () => { const lost = sent - done - dsp.q.length - (dsp.running ? 1 : 0) - inflight; cnt.textContent = `Sent ${sent} · Processed ${done} · Lost ${Math.max(0, lost)}`; };
  let inflight = 0;
  async function attack(i){ sent++; inflight++; upd(); ch[i].g.classList.add('act'); await ss.up(i, AC[i]); ch[i].g.classList.remove('act');
    await enqueue(dsp, {label: 'P' + (i + 1), what: `P${i + 1} attacking`, actor: AC[i], from: {x: AC[i].x, y: AC[i].y + 13}, onQueued: () => { inflight--; upd(); }, fn: () => { boss.hit(40 + Math.floor(Math.random() * 30)); done++; upd(); }});
    [0, 1, 2, 3].forEach(k => spawn(() => ss.push(k, AC[k]))); }
  function fight(){ if (fighting) return; fighting = true; spawn(async () => { let i = 0; while (fighting) { spawn(() => attack(i % 4)); i++; await sleep(620 * K); } }); }
  let target = 'C';

function gBack(){

  }
  /* a player around the boss fires one attack per message sent; the boss takes the hit when the message is processed */
  function shot(W){ const [px, py] = W.P[Math.floor(Math.random() * W.P.length)], b = mk(gF, 'circle', {r: 5, class: 'spark'});
    tween(90 * K, e => { b.setAttribute('cx', px + (W.cx - px) * e); b.setAttribute('cy', py + (W.cy - py) * e); }).catch(() => {}).finally(() => b.remove()); }
  function hitBoss(W){ W.g.classList.remove('hit'); void W.g.getBBox(); W.g.classList.add('hit'); popup(W.cx + Math.random() * 60 - 30, W.cy - 40, '-' + (40 + Math.floor(Math.random() * 30))); }
  const holdPlayers = (W, on) => { W.pg.style.transition = 'opacity .3s'; W.pg.style.opacity = on ? .4 : 1; };
  const W1 = world(14, 'No backpressure'), W2 = world(458, 'ZLink backpressure');

  /* server view: two lanes */
  function lane(y0, bounded){
    mk(sB, 'text', {x: 16, y: y0 + 14, class: 't-title', text: bounded ? 'ZLink: stops sending when full, resumes when half empty' : 'No backpressure: the receiver keeps accepting and piling up'});
    const snd = box(16, y0 + 26, 150, 112, '', 'Field servers', 'Sender');
    const pill = mk(sB, 'g', {class: 'bp-pill go'}); mk(pill, 'rect', {x: 26, y: y0 + 78, width: 130, height: 30, rx: 15}); const pillT = mk(pill, 'text', {x: 91, y: y0 + 98, text: '▶ Sending'});
    const sentT = mk(sB, 'text', {x: 26, y: y0 + 128, class: 't-mono', text: 'Sent 0'});
    const rcv = box(746, y0 + 26, 144, 112, '', 'World boss server', 'Receiver · processing');
    const doneT = mk(sB, 'text', {x: 756, y: y0 + 96, class: 't-count', text: 'Processed 0'});
    const lostT = mk(sB, 'text', {x: 756, y: y0 + 120, class: 't-count', text: 'Lost 0'});
    /* the receiver's queue as a row of cells */
    const cap = bounded ? 20 : 30, qx = 196, qw = 530, cw = qw / cap, qy = y0 + 66, qh = 36;
    mk(sB, 'text', {x: qx, y: qy - 8, class: 't-mono', text: bounded ? 'Receiver queue (limit: HWM)' : 'Receiver memory'});
    mk(sB, 'rect', {x: qx - 2, y: qy - 2, width: qw + 4, height: qh + 4, rx: 6, class: 'gauge-bg'});
    const cells = []; for (let k = 0; k < cap; k++) cells.push(mk(sB, 'rect', {x: qx + k * cw + 1, y: qy, width: cw - 2, height: qh, rx: 2, class: 'bp-cell'}));
    if (bounded) {
      mk(sB, 'line', {x1: qx + qw / 2, x2: qx + qw / 2, y1: qy - 6, y2: qy + qh + 6, class: 'bp-mark'}); mk(sB, 'text', {x: qx + qw / 2, y: qy + qh + 20, class: 'bp-mark-t', 'text-anchor': 'middle', text: 'half → resume'});
      mk(sB, 'line', {x1: qx + qw, x2: qx + qw, y1: qy - 6, y2: qy + qh + 6, class: 'bp-mark'}); mk(sB, 'text', {x: qx + qw, y: qy + qh + 20, class: 'bp-mark-t', 'text-anchor': 'end', text: 'full → stop'});
    } else { mk(sB, 'line', {x1: qx + qw, x2: qx + qw, y1: qy - 6, y2: qy + qh + 6, class: 'bp-mark bad'}); mk(sB, 'text', {x: qx + qw, y: qy + qh + 20, class: 'bp-mark-t bad', 'text-anchor': 'end', text: 'memory limit'}); }
    const L = {doneT, lostT, bounded, cap, q: 0, inflight: 0, sent: 0, done: 0, lost: 0, paused: false, dead: false, stops: 0, y0, snd, rcv, pill, pillT, qx, cw, qy, qh,
      render(){ cells.forEach((c, k) => c.setAttribute('class', 'bp-cell' + (k < L.q ? (L.q >= cap * .9 ? ' hi' : ' on') : ''))); sentT.textContent = `Sent ${L.sent}`; doneT.textContent = L.downed ? 'Server down' : `Processed ${L.done}`; if (L.onRender) L.onRender(); lostT.textContent = `Lost ${L.lost}`; lostT.setAttribute('class', 't-count' + (L.lost ? ' bad' : '')); },
      setPill(kind, text){ pill.setAttribute('class', 'bp-pill ' + kind); pillT.textContent = text; }};
    return L;
  }
  const L1 = lane(6, false), L2 = lane(186, true);
  let SEND = 70, PROC = 160;   /* ms × K: sending is about 2.3× faster than processing */
  function boom(L, W){
    L.dead = true; L.lost += L.q + L.inflight; L.q = 0; L.render();
    L.rcv.g.classList.add('dead'); L.setPill('dead', 'No receiver');
    const cx = L.rcv.x + 72, cy = L.y0 + 82;
    for (let k = 0; k < 3; k++) { const c = mk(sF, 'circle', {cx, cy, r: 4, class: 'boom' + (k ? ' b' + k : '')}); tween(700 + k * 250, e => { c.setAttribute('r', 6 + e * (120 + k * 40)); c.setAttribute('opacity', 1 - e); }).catch(() => {}).finally(() => c.remove()); }
    for (let k = 0; k < 14; k++) { const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90; const p = mk(sF, 'circle', {cx, cy, r: 4, class: 'spark'}); tween(800, e => { p.setAttribute('cx', cx + Math.cos(a) * d * e); p.setAttribute('cy', cy + Math.sin(a) * d * e); p.setAttribute('opacity', 1 - e); }).catch(() => {}).finally(() => p.remove()); }
    mk(sB, 'text', {x: L.rcv.x - 34, y: L.y0 + 64, class: 'boom-t', 'text-anchor': 'middle', text: 'Boom!'});
    L.doneT.setAttribute('class', 'boom-s'); L.downed = true;
    srv.classList.remove('shake'); void srv.getBBox(); srv.classList.add('shake');
    const gx = W.cx, gy = W.cy; const ov = mk(gG, 'rect', {x: W.x, y: 14, width: 428, height: 208, rx: 14, fill: '#000', opacity: 0}); tween(500, e => ov.setAttribute('opacity', .55 * e)).catch(() => {});
    for (let k = 0; k < 3; k++) { const c = mk(gF, 'circle', {cx: gx, cy: gy, r: 4, class: 'boom' + (k ? ' b' + k : '')}); tween(800 + k * 250, e => { c.setAttribute('r', 6 + e * (110 + k * 30)); c.setAttribute('opacity', 1 - e); }).catch(() => {}).finally(() => c.remove()); }
    mk(gG, 'text', {x: gx, y: gy + 8, class: 'boom-t big', 'text-anchor': 'middle', text: 'Server down'});
    L.onRender = () => { W.st.textContent = `Out of memory: the server died · lost${L.lost}`; }; L.render(); W.st.setAttribute('class', 'bp-world bad');
    game.classList.remove('shake'); void game.getBBox(); game.classList.add('shake');
  }
  function run(L, W){
    /* sender */
    spawn(async () => { for (;;) {
      await sleep(SEND * K);
      if (L.dead) return;
      if (L.bounded && L.paused) continue;
      if (L.bounded && L.q + L.inflight >= L.cap) {
        L.paused = true; L.stops++; L.setPill('stop', '⏸ Paused'); pulse(L.snd.g, 'bad'); holdPlayers(W, true);
        W.st.textContent = `queue is full → sender stopped (stops: ${L.stops})`; W.st.setAttribute('class', 'bp-world warn'); continue;
      }
      L.sent++; L.inflight++; L.render(); shot(W);
      const k = Math.min(L.cap - 1, L.q + L.inflight - 1);
      spawn(async () => { await fly({x: 166, y: L.y0 + 93}, {x: L.qx + k * L.cw + L.cw / 2, y: L.qy + L.qh / 2}, {r: 5, dur: 140, bend: 0});
        L.inflight--; if (L.dead) { L.lost++; L.render(); return; } L.q++; L.render();
        if (!L.bounded && L.q >= L.cap) boom(L, W);
        else if (!L.bounded) { W.st.textContent = `Piling up as received · memory${Math.round(L.q / L.cap * 100)}%`; W.st.setAttribute('class', 'bp-world' + (L.q > L.cap * .6 ? ' warn' : '')); } });

    spawn(async () => { for (;;) {
      await sleep(PROC * K);

      if (L.q > 0) { L.q--; L.done++; L.render(); hitBoss(W); spawn(() => fly({x: L.qx + L.cw / 2, y: L.qy + L.qh / 2}, {x: L.rcv.x + 4, y: L.qy + L.qh / 2}, {r: 4, cls: 'pkt-push', dur: 80, bend: 0}));
        if (L.bounded && L.paused && L.q <= L.cap / 2) { L.paused = false; L.setPill('go', '▶ Resumed'); holdPlayers(W, false); W.st.textContent = 'queue is below half → sending again'; W.st.setAttribute('class', 'bp-world'); } }
    } });
  }
  const STEPS = [
    {title: 'Sending the same burst', ref: [['Ch. 33 §2 Core HWM and the Application Job Queue', '33-backpressure#2-core-hwm-and-the-application-job-queue'], ['Ch. 33 §3.1 The Basis for Locking Sends', '33-backpressure#31-the-basis-for-locking-sends']], line: 'The same attack burst is sent to the top and bottom lanes. The sending rate is more than twice the processing rate. The top lane piles up whatever it receives. The bottom lane stops the sender when the queue is full.',
     act: 'Start the burst', more: [
       'The receiver queue has a limit (HWM). When it is full, the Core stops sending to that peer. In the meantime, <code>send</code> waits until space is available.',
       'Sending resumes when the queue drains below half. Resuming each time a single slot frees would make the sender stop and resume continuously (Core low watermark = half of the HWM).',
       'If the sender <code>send</code> waits past the timeout (default 1 second), it ends with <code>DeadlineExceeded</code>. The sender can learn of the failure.',
       'The Framework does not drop a message it has accepted. Whether to send again is decided by the application with its business rules.',
       'Without backpressure, the receiver memory grows without limit until the server dies, and all the queued messages are lost.'],
     async run(){ run(L1, W1); run(L2, W2); W1.st.textContent = 'Piling up as received'; W2.st.textContent = 'Sending'; res('The top lane piles up until the server dies. The bottom lane repeats "stop ↔ resume". The bottom queue never exceeds the limit.'); }},
  ];
  return {title: 'Backpressure', steps: STEPS, foot: [['chapter 33 (Backpressure)', '33-backpressure'], ['HWM and low watermark of the Core pipe', null]]};
}

    {title: 'Near the border', ref: [['Ch. 30 §5.3 Topic', '30-channel-patterns#53-topic--both-forms-select-receivers-by-it'], ['Ch. 56 §7 The Zone Tick', '56-zoneworld#7-the-zone-tick--pushes-and-border-snapshots']], line: 'When P1 steps into the east border band inside zone-nw, zone-nw publishes the position as a topic. At the east border, only zone-ne receives it.',

/* ---------- groups and steps ---------- */

let STEPS = [], cur = 0, done = new Set(), curKey = 'clientserver';
function renderSteps(){

/* guide links: the base follows the guide page that embeds the tour, else the site's language selector, else dotnet */
const GUIDE_LOCALE = '', SRC_LABEL = 'Source';
function guideBase(){
  try { const m = window.parent.location.pathname.match(/^((?:\/ko)?\/(?:cpp|dotnet|java|kotlin|node)\/guide\/server\/)/); if (m) return m[1]; } catch (_) {}
  let lang = 'dotnet'; try { const v = localStorage.getItem('zlink-lang'); if (['cpp', 'dotnet', 'java', 'kotlin', 'node'].includes(v)) lang = v; } catch (_) {}
  return `${GUIDE_LOCALE}/${lang}/guide/server/`;
}
function guideLinks(refs){
  const base = guideBase();
  return refs.map(([text, ref]) => { if (!ref) return text; const [slug, anchor] = ref.split('#'); return `<a href="${base}${slug}/${anchor ? '#' + anchor : ''}" target="_top">${text}</a>`; }).join(' · ');
}
function show(k){
  cur = k; const s = STEPS[k]; renderSteps();
  $('stepNo').textContent = `Step ${k + 1} / ${STEPS.length}`; $('line').textContent = s.line; res('');
  $('src').innerHTML = s.ref ? `${SRC_LABEL}: ${guideLinks(s.ref)}` : '';
  $('more').innerHTML = s.more.map(m => `<li>${m}</li>`).join('');
  const acts = $('acts'); acts.replaceChildren();
  const b = document.createElement('button'); b.type = 'button'; b.className = 'act primary'; b.textContent = s.act; acts.append(b);
  /* "next" opens once the main action ran (toggle steps: ended in the restored state) and, when there is an extra action, after it ran once */
  let mainOk = false, extraOk = !s.extra;
  const nx = document.createElement('button'); nx.type = 'button'; nx.className = 'act next'; nx.textContent = k === STEPS.length - 1 ? 'Start over ↺' : 'Next step →'; nx.disabled = true;
  const syncNext = () => { nx.disabled = !(mainOk && extraOk); };
  let ex = null; if (s.extra) { ex = document.createElement('button'); ex.type = 'button'; ex.className = 'act'; ex.textContent = s.extra[0]; ex.disabled = true; acts.append(ex); ex.addEventListener('click', () => { ex.disabled = true; nx.disabled = true; spawn(async () => { await s.extra[1](); ex.disabled = false; extraOk = true; syncNext(); }); }); }
  acts.append(nx);
  nx.addEventListener('click', () => { if (k === STEPS.length - 1) openGroup(curKey); else show(k + 1); });
  b.addEventListener('click', () => { b.disabled = true; nx.disabled = true; spawn(async () => { const r = await s.run(b); done.add(k); if (s.repeat || s.toggle) b.disabled = false; if (ex) ex.disabled = false; mainOk = s.toggle ? r === true : true; syncNext(); renderSteps(); }); });
}
function openGroup(key){
  gen++; curKey = key; const g = GROUPS.find(x => x[0] === key) || GROUPS[1];
  const r = g[2](); STEPS = r.steps; done = new Set();
  $('gtitle').textContent = r.title; $('foot').innerHTML = `This is a simulation that runs in the browser. Timings and numbers are for demonstration only. The behavior follows the ZLink server guide at zlink.systems (${guideLinks(r.foot)}).`;
  document.querySelectorAll('#groups button').forEach(b => b.setAttribute('aria-current', String(b.dataset.key === key)));
  try { history.replaceState(null, '', '#' + key); } catch (_) {}
  show(0);
}
GROUPS.forEach(([key, name]) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.key = key; b.textContent = name; b.addEventListener('click', () => openGroup(key)); $('groups').append(b); });

})();
