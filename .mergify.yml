# Merge queue: PRs labelled `merge-queue` are tested together in batches; a failing
# batch is split to find the failing PR. Failed checks are never retried: one failure
# is a defect to fix (AGENTS.md section 4.1).
#
# PRs to main are squash-merged so a merged fix is one commit that Mergify can
# backport. A PR labelled `backport-0.30.3` then gets a backport PR to the release
# branch, which enters the release queue by itself and merges after the same checks.
# One batch already needs about 20 GitHub-hosted jobs (the hosted concurrency
# limit), so more parallel batches only wait for runners and get reset by
# requeues. Fewer, larger batches merge more PRs per hour.
merge_queue:
  max_parallel_checks: 2

queue_rules:
  - name: default
    batch_size: 8
    merge_method: squash
    queue_conditions:
      - base=main
      - label=merge-queue
      - -draft
      - check-success=framework-dotnet / dotnet-release-gate
      - check-success=framework-node / node-release-gate
      - check-success=framework-java / linux-x64 / Java 25
      - check-success=framework-cpp / Framework C++ unit and contract tests
    merge_conditions:
      - check-success=dotnet-release-gate
      - check-success=node-release-gate
      - check-success=linux-x64 / Java 25
      - check-success=Framework C++ unit and contract tests
      - check-success=Framework source format
  - name: release
    batch_size: 8
    merge_method: merge
    queue_conditions:
      - base~=^release/
      - head~=^mergify/bp/
      - -draft
    # Release branches keep the Windows checks; main batches verify Linux only and
    # Windows runs daily on main and in the release gate.
    merge_conditions:
      - check-success=dotnet-release-gate
      - check-success=node-release-gate
      - check-success=Compare Linux and Windows Java results
      - check-success=Framework C++ unit and contract tests
      - check-success=win-x64 / Framework C++ unit and contract tests
      - check-success=Framework source format

# A PR labelled `merge-queue`, and every Mergify backport PR to a release branch,
# enters the queue by itself. Commenting `@mergifyio queue` also queues a PR.
merge_protections_settings:
  auto_merge_conditions:
    - or:
        - and:
            - base=main
            - label=merge-queue
        - and:
            - base~=^release/
            - head~=^mergify/bp/

pull_request_rules:
  - name: backport merged fixes to the 0.30.3 release branch
    conditions:
      - merged
      - label=backport-0.30.3
    actions:
      backport:
        branches:
          - release/framework-0.30.3
